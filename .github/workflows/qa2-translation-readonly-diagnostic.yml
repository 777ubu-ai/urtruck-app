name: QA2 Translation Read-only Diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact deployed QA2 source SHA under investigation
        required: true
        type: string
      cargo_id:
        description: Controlled QA2 cargo UUID containing the two cases
        required: true
        type: string
      utc_day:
        description: UTC day containing the controlled cases, YYYY-MM-DD
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Read two controlled translations and probe local AI
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: qa2
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASS: ${{ secrets.SERVER_PASS }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      CONTROLLED_CARGO_ID: ${{ inputs.cargo_id }}
      CONTROLLED_DAY_UTC: ${{ inputs.utc_day }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require QA2 integration source and controlled scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "qa2/integration-candidate"
          [[ "$QA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROLLED_CARGO_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$CONTROLLED_DAY_UTC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          git fetch --no-tags origin qa2/integration-candidate:refs/remotes/origin/qa2/integration-candidate "$QA_SOURCE_SHA"
          git merge-base --is-ancestor "$QA_SOURCE_SHA" origin/qa2/integration-candidate

      - name: Verify read-only translation contract
        run: node --test tests/frontend/test_qa2_translation_readonly_diagnostic_workflow.mjs

      - name: Install pinned SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Collect safe evidence without changing QA2
        shell: bash
        run: |
          set -euo pipefail
          # The streamed remote script requires SQLite mode=ro and executes
          # PRAGMA query_only=ON before every scoped SELECT.
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SERVER_PASS" && test -n "$SERVER_SSH_KNOWN_HOSTS"
          known_hosts_file="$RUNNER_TEMP/qa2-known-hosts"
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"
          export SSHPASS="$SERVER_PASS"
          sshpass -e ssh -o UserKnownHostsFile="$known_hosts_file" -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "QA_SOURCE_SHA='$QA_SOURCE_SHA' CONTROLLED_CARGO_ID='$CONTROLLED_CARGO_ID' CONTROLLED_DAY_UTC='$CONTROLLED_DAY_UTC' python3 -" \
            < scripts/qa2_translation_readonly_diagnostic.py > "$RUNNER_TEMP/qa2-translation-readonly.jsonl"

      - name: Validate the safe artifact schema
        run: python3 scripts/validate_qa2_translation_readonly_diagnostic.py "$RUNNER_TEMP/qa2-translation-readonly.jsonl"

      - uses: actions/upload-artifact@v4
        with:
          name: qa2-translation-readonly-${{ env.QA_SOURCE_SHA }}
          path: ${{ runner.temp }}/qa2-translation-readonly.jsonl
          retention-days: 7
