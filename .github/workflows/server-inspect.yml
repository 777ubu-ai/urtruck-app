name: Server Inspect (read-only)

# v3: выгрузка исходников bizchat с сервера в артефакт CI.
# Секреты НЕ пакуются: infra/secrets, .env*, keystore исключены.
on:
  workflow_dispatch:
  push:
    branches: [claude/biz-chat-inquiry-6v7qi2]
    paths: ['.github/workflows/server-inspect.yml']

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pack bizchat sources on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOS'
          set -e
          cd /home/ubuntu
          tar czf /tmp/bizchat-src.tar.gz \
            --exclude='bizchat/mobile/build' \
            --exclude='bizchat/mobile/.dart_tool' \
            --exclude='bizchat/mobile/.gradle' \
            --exclude='bizchat/mobile/android/.gradle' \
            --exclude='bizchat/mobile/android/.cxx' \
            --exclude='bizchat/mobile/android/app/.cxx' \
            --exclude='bizchat/mobile/ios/Pods' \
            --exclude='bizchat/mobile/ios/.symlinks' \
            --exclude='bizchat/backend/node_modules' \
            --exclude='bizchat/backend/dist' \
            --exclude='bizchat/infra/secrets' \
            --exclude='*.env' \
            --exclude='*.env.*' \
            --exclude='.env*' \
            --exclude='*.jks' \
            --exclude='*.keystore' \
            --exclude='key.properties' \
            --exclude='*.apk' \
            --exclude='*.aab' \
            bizchat
          ls -lh /tmp/bizchat-src.tar.gz
          echo "== имена env-переменных backend (только ключи, без значений) =="
          docker exec bizchat-backend-prod printenv 2>/dev/null | cut -d= -f1 | sort | head -40 || true
          echo "== файлы в infra/secrets (только имена) =="
          ls /home/ubuntu/bizchat/infra/secrets/ 2>/dev/null || true
          EOS

      - name: Download archive from server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sshpass -p "$SERVER_PASS" scp -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST:/tmp/bizchat-src.tar.gz" ./bizchat-src.tar.gz
          ls -lh bizchat-src.tar.gz
          # Контрольная проверка: в архиве не должно быть секретов
          tar tzf bizchat-src.tar.gz | grep -i -E "\.env|secret|\.jks|\.keystore|key\.properties" || echo "OK: секретов в архиве нет"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bizchat-src
          path: bizchat-src.tar.gz
          retention-days: 3
