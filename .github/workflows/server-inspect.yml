name: Server Inspect (read-only)

# v6: диагностика ошибки 500 на /factories — читает свежие логи backend.
on:
  workflow_dispatch:
  push:
    branches: [claude/biz-chat-inquiry-6v7qi2]
    paths: ['.github/workflows/server-inspect.yml']

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger error and read backend logs
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          echo "== вызываем /factories чтобы ошибка попала в свежие логи =="
          curl -sS -m 20 "https://biz-chat.net/api/v1/factories?limit=2" | head -c 200 || true
          echo
          sleep 3
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOS'
          set +e
          echo "===== последние ошибки backend ====="
          docker logs --tail 120 bizchat-backend-prod 2>&1 | grep -iE "error|exception|query failed|syntax|column|relation" | tail -25
          echo
          echo "===== последние 25 строк лога (как есть) ====="
          docker logs --tail 25 bizchat-backend-prod 2>&1
          EOS
