name: Probe Yandex JS runtime

on:
  push:
    branches: [fix/map-clean-route-yandex-runtime-20260817]

permissions:
  contents: write

jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[yandex-js-probed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-clean-route-yandex-runtime-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser runtime
        run: |
          npm ci
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Verify Yandex JS API can actually initialize on urtruck.kz
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const problems=[];
            page.on('console', m => { if (m.type()==='error') problems.push('console:'+m.text().slice(0,220)); });
            page.on('pageerror', e => problems.push('pageerror:'+String(e.message||e).slice(0,220)));
            await page.goto('https://urtruck.kz/?yandex-runtime-probe=1', {waitUntil:'domcontentloaded', timeout:60000});
            const result = await page.evaluate(async () => {
              const started=Date.now();
              while (!window.ymaps3 && Date.now()-started < 20000) await new Promise(r=>setTimeout(r,100));
              if (!window.ymaps3) return {ok:false, stage:'global-missing'};
              try { await Promise.race([window.ymaps3.ready, new Promise((_,rej)=>setTimeout(()=>rej(new Error('ready-timeout')),20000))]); }
              catch(e) { return {ok:false, stage:'ready', error:String(e?.message||e)}; }
              const el=document.createElement('div');
              Object.assign(el.style,{position:'fixed',left:'0',top:'0',width:'360px',height:'360px',zIndex:'999999'});
              document.body.appendChild(el);
              try {
                const {YMap,YMapDefaultSchemeLayer,YMapDefaultFeaturesLayer}=window.ymaps3;
                const map=new YMap(el,{location:{center:[76.8512,43.2220],zoom:8},mode:'vector'},[
                  new YMapDefaultSchemeLayer({theme:'light'}),
                  new YMapDefaultFeaturesLayer({})
                ]);
                await new Promise(r=>setTimeout(r,5000));
                const text=el.textContent||'';
                map.destroy?.();
                el.remove();
                return {ok:true, stage:'map-created', text:text.slice(0,120)};
              } catch(e) { return {ok:false, stage:'map-create', error:String(e?.message||e)}; }
            });
            console.log('YANDEX_JS_RUNTIME='+JSON.stringify(result));
            console.log('YANDEX_JS_PROBLEMS='+JSON.stringify(problems.slice(0,10)));
            await browser.close();
            if (!result.ok) process.exit(2);
          })();
          NODE
      - name: Remove probe workflow
        if: always()
        run: |
          git config user.name "UrTruck Release Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/probe-yandex-js-runtime.yml
          git add .github/workflows/probe-yandex-js-runtime.yml
          git commit -m "chore(map): Yandex JS runtime probed [yandex-js-probed]" || true
          git push origin HEAD:fix/map-clean-route-yandex-runtime-20260817
