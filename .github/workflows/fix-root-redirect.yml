name: Fix biz-chat.net root redirect

# Делает так, чтобы корень biz-chat.net (сейчас отдаёт 404 от backend)
# редиректил на /app/ — где живёт Flutter Web приложение.
# Правка nginx: добавляет `location = / { return 302 /app/; }`.
# Безопасно: бэкап конфига + nginx -t + откат при ошибке.
#
# Запуск: автоматически по push этого файла (контролируемо).

on:
  workflow_dispatch:
  push:
    branches: [claude/biz-chat-inquiry-6v7qi2]
    paths: ['.github/workflows/fix-root-redirect.yml']

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Add root redirect to /app/
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOS'
          set -e
          CONF=/etc/nginx/sites-available/bizchat

          echo "== Текущий location для корня =="
          grep -n "location = / " "$CONF" || echo "(редиректа корня пока нет)"

          if grep -q "location = / {" "$CONF"; then
            echo "Редирект корня уже настроен — ничего не делаю."
            exit 0
          fi

          echo "== Бэкап конфига =="
          sudo cp "$CONF" "$CONF.bak.$(date +%Y%m%d-%H%M%S)"

          echo "== Вставляем 'location = / { return 302 /app/; }' в 443-server =="
          # Вставляем сразу после первой директивы client_max_body_size (она в 443 server).
          sudo sed -i '0,/client_max_body_size 50M;/s//client_max_body_size 50M;\n\n    # Корень открывает Flutter Web приложение\n    location = \/ { return 302 \/app\/; }/' "$CONF"

          echo "== Проверка синтаксиса nginx =="
          if sudo nginx -t; then
            sudo systemctl reload nginx
            echo "✅ nginx перезагружен, редирект активен"
          else
            echo "::error::nginx -t не прошёл — откатываю"
            LATEST_BAK=$(ls -t "$CONF".bak.* | head -1)
            sudo cp "$LATEST_BAK" "$CONF"
            sudo nginx -t && sudo systemctl reload nginx
            exit 1
          fi
          EOS

      - name: Verify redirect
        run: |
          set -e
          echo "== Проверяем, что корень теперь редиректит на /app/ =="
          code=$(curl -sS -m 15 -o /dev/null -w "%{http_code}" https://biz-chat.net/ || true)
          loc=$(curl -sS -m 15 -o /dev/null -w "%{redirect_url}" https://biz-chat.net/ || true)
          echo "Корень: HTTP $code → $loc"
          case "$loc" in
            *"/app/"*) echo "✅ Редирект на /app/ работает";;
            *) echo "::warning::Редирект не подтвердился (код $code). Проверьте вручную.";;
          esac
          echo "== /app/ отдаёт приложение? =="
          curl -sS -m 15 -o /dev/null -w "/app/: %{http_code}\n" https://biz-chat.net/app/
