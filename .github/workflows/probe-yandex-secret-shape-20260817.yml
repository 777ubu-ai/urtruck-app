name: Probe Yandex secret shape 20260817
on:
  push:
    branches: [probe/yandex-live-error-20260817]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RAW_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
    steps:
      - name: Validate secret variants without printing key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/variants.json
          import os, json
          raw=os.environ.get('RAW_KEY','')
          vals=[]
          def add(name,v):
              v=(v or '').strip()
              if v and v not in [x[1] for x in vals]: vals.append((name,v))
          add('raw_trim', raw)
          add('strip_quotes', raw.strip().strip('"').strip("'"))
          if '=' in raw:
              add('rhs_after_equals', raw.split('=',1)[1].strip().strip('"').strip("'"))
          if 'apikey=' in raw:
              part=raw.split('apikey=',1)[1].split('&',1)[0]
              add('from_apikey_param', part)
          print(json.dumps(vals))
          print('SECRET_PRESENT='+str(bool(raw)).lower(), file=os.sys.stderr)
          print('HAS_EQUALS='+str('=' in raw).lower(), file=os.sys.stderr)
          print('HAS_APIKEY_PARAM='+str('apikey=' in raw).lower(), file=os.sys.stderr)
          print('RAW_LENGTH='+str(len(raw)), file=os.sys.stderr)
          PY
          python3 - <<'PY'
          import json, subprocess, urllib.parse
          vals=json.load(open('/tmp/variants.json'))
          for name,key in vals:
              url='https://api-maps.yandex.ru/v3/?apikey='+urllib.parse.quote(key,safe='')+'&lang=ru_RU'
              p=subprocess.run(['curl','-sS','-L','--max-time','20','-H','Referer: https://urtruck.kz/','-o','/tmp/b','-w','%{http_code}',url],capture_output=True,text=True)
              code=p.stdout.strip()
              body=open('/tmp/b','rb').read(300).decode('utf-8','replace')
              msg=''
              if body.startswith('{'):
                  try:
                      import json as j
                      d=j.loads(body); msg=str(d.get('message',''))
                  except Exception: pass
              print(f'VARIANT={name} HTTP={code} MESSAGE={msg}')
          PY
