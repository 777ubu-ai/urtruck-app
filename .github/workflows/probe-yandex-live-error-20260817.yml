name: Probe Yandex live error 20260817
on:
  push:
    branches: [probe/yandex-live-error-20260817]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production Yandex loader with referer
        run: |
          set -euo pipefail
          curl -fsS 'https://urtruck.kz/?probe=yandex-live-error' -o /tmp/index.html
          python3 - <<'PY' > /tmp/yandex-url
          import re
          s=open('/tmp/index.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'https://api-maps\.yandex\.ru/v3/\?[^"\']+',s)
          if not m:
              raise SystemExit('YANDEX_SCRIPT=missing')
          print(m.group(0))
          PY
          code=$(curl -sS -L --max-time 30 -H 'Referer: https://urtruck.kz/' -D /tmp/headers -o /tmp/body -w '%{http_code}' "$(cat /tmp/yandex-url)" || true)
          echo "YANDEX_HTTP=$code"
          echo '--- HEADERS ---'
          sed -n '1,80p' /tmp/headers | sed -E 's/(set-cookie:).*/\1 [redacted]/I'
          echo '--- BODY SAFE ---'
          python3 - <<'PY'
          p='/tmp/body'
          b=open(p,'rb').read(2000)
          try:
              print(b.decode('utf-8','replace'))
          except Exception:
              print(repr(b))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser-level probe
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            page.on('console', m => console.log('CONSOLE', m.type(), m.text()));
            page.on('pageerror', e => console.log('PAGEERROR', e.message));
            page.on('requestfailed', r => { if (r.url().includes('yandex')) console.log('REQFAIL', r.url().replace(/apikey=[^&]+/,'apikey=[redacted]'), r.failure()?.errorText); });
            page.on('response', async r => {
              if (r.url().includes('api-maps.yandex.ru/v3/')) {
                console.log('YANDEX_RESPONSE', r.status(), r.url().replace(/apikey=[^&]+/,'apikey=[redacted]'));
                try { console.log('YANDEX_BODY', (await r.text()).slice(0,1000)); } catch {}
              }
            });
            await page.goto('https://urtruck.kz/?probe=yandex-browser-live-error', {waitUntil:'domcontentloaded', timeout:30000});
            for (let i=0;i<8;i++) {
              await page.waitForTimeout(3000);
              const state = await page.evaluate(() => ({ymaps3:!!globalThis.ymaps3, configured:globalThis.__URTRUCK_YANDEX_MAPS_CONFIGURED__===true}));
              console.log('STATE', i+1, JSON.stringify(state));
              if (state.ymaps3) break;
            }
            await browser.close();
          })().catch(e=>{console.error(e); process.exit(1)});
          NODE
