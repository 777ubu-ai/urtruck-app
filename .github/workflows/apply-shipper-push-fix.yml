name: Apply shipper cards and push repair

on:
  push:
    branches: [fix/shipper-cards-driver-push-20260816]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[auto-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shipper-cards-driver-push-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/apply_shipper_cards_push_fix.py
      - name: Commit patched product files
        run: |
          git config user.name "urtruck-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/utils/places.js src/components/ui/v1/FeedCard.js src/screens/MyTripsScreen.js backend/services/push_sender.py tests/frontend/shipper_cards_unified.test.mjs backend/tests/test_push_delivery_regressions.py .version sw-template.js
          git commit -m "fix(ui,push): unify shipper cards and preserve driver push tokens [auto-applied]"
          git push origin HEAD:fix/shipper-cards-driver-push-20260816
