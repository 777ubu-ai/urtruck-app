name: Strict Locale Materializer

on:
  push:
    branches: [fix/strict-locale-no-russian-20260820]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: strict-locale-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-locale-no-russian-20260820
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded locale fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path('scripts/strict_locale_materialize.py')
          s = script.read_text(encoding='utf-8')
          old = '    "src/screens/QueueScreenLazy.js": ["\'Нажать\'"],'
          new = '    "src/screens/QueueScreenLazy.js": ["? L.selected : \'Нажать\'"],'
          if old not in s:
              raise SystemExit('strict screenshot guard anchor missing')
          script.write_text(s.replace(old, new, 1), encoding='utf-8')

          i18n = Path('src/utils/i18n.js')
          text = i18n.read_text(encoding='utf-8')
          old_zh = "vdocs_techpass: '行驶证（СРТС）'"
          if text.count(old_zh) != 1:
              raise SystemExit(f'ZH vehicle-doc anchor mismatch: {text.count(old_zh)}')
          i18n.write_text(text.replace(old_zh, "vdocs_techpass: '车辆行驶证'", 1), encoding='utf-8')
          PY
          python3 scripts/strict_locale_materialize.py

      - name: Install dependencies
        run: npm ci

      - name: Strict locale regression
        run: node --experimental-loader ./tests/frontend/loader.mjs --test tests/frontend/test_strict_locale_owned_content.mjs

      - name: Existing i18n gate
        run: node qa/utils/i18nSmoke.js

      - name: Production web build
        run: npm run build:web

      - name: Commit clean implementation only
        env:
          BRANCH: fix/strict-locale-no-russian-20260820
        run: |
          set -euo pipefail
          rm -f scripts/strict_locale_materialize.py .github/workflows/strict-locale-materialize.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(i18n): enforce selected locale across dynamic UI'
          git push origin "HEAD:${BRANCH}"
