name: Build Android Dev Client (debug)

# Разовая debug-сборка с expo-dev-client для локального тестирования.
# После установки на телефон (adb install) дальнейшие правки JS/UI
# подхватываются через `npx expo start --dev-client` МГНОВЕННО, без
# пересборки APK и без Play Console — пересобирать нужно только когда
# меняется нативная часть (permissions/нативные модули).
#
# Debug-сборка подписывается стандартным debug-keystore (android/app/
# debug.keystore, уже в репо) — релизный ключ здесь не участвует.

on:
  workflow_dispatch:
    inputs:
      application_id:
        description: Android applicationId for the debug QA build
        required: false
        default: com.urtruck.app

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36 / build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          df -h

      - name: Install npm dependencies (skip postinstall scripts)
        run: |
          npm ci --legacy-peer-deps --ignore-scripts \
            || npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Apply patches (if patches/ exists)
        run: |
          if [ -d patches ] && [ "$(ls -A patches 2>/dev/null)" ]; then
            npx patch-package
          fi

      - name: Materialize Android Firebase config (best-effort — не блокирует dev-сборку)
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          URTRUCK_APPLICATION_ID: ${{ github.event.inputs.application_id || 'com.urtruck.app' }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}"
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          python3 scripts/verify_android_firebase_config.py --check-source android/app/google-services.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = os.environ.get("URTRUCK_APPLICATION_ID", "com.urtruck.app")
          config = json.loads(Path("android/app/google-services.json").read_text())
          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          ]
          if expected not in packages:
              raise SystemExit(f"Firebase Android client missing for {expected}; found {packages}")
          print(f"Firebase client present for {expected}")
          PY
      - name: Target API 36 (Google Play требование с 31.08.2026)
        run: |
          printf '\nandroid.compileSdkVersion=36\nandroid.targetSdkVersion=36\nandroid.buildToolsVersion=36.0.0\n' >> android/gradle.properties

      - name: Build Debug APK with Gradle (debug-keystore, dev-client)
        env:
          ORG_GRADLE_PROJECT_URTRUCK_APPLICATION_ID: ${{ github.event.inputs.application_id || 'com.urtruck.app' }}
          ORG_GRADLE_PROJECT_URTRUCK_VERSION_CODE: 210793100
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode=summary

      - name: Rename APK to UrTruck-dev.apk
        run: |
          cd android/app/build/outputs/apk/debug
          ls -la
          mv app-debug.apk UrTruck-dev.apk
          ls -la UrTruck-dev.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-dev-apk
          path: android/app/build/outputs/apk/debug/UrTruck-dev.apk
          retention-days: 14
          if-no-files-found: error
