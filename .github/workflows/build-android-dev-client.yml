name: Build Android Dev Client (debug)

# Разовая debug-сборка с expo-dev-client для локального тестирования.
# После установки на телефон (adb install) дальнейшие правки JS/UI
# подхватываются через `npx expo start --dev-client` МГНОВЕННО, без
# пересборки APK и без Play Console — пересобирать нужно только когда
# меняется нативная часть (permissions/нативные модули).
#
# Debug-сборка подписывается стандартным debug-keystore (android/app/
# debug.keystore, уже в репо) — релизный ключ здесь не участвует.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36 / build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          df -h

      - name: Install npm dependencies (skip postinstall scripts)
        run: |
          npm ci --legacy-peer-deps --ignore-scripts \
            || npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Apply patches (if patches/ exists)
        run: |
          if [ -d patches ] && [ "$(ls -A patches 2>/dev/null)" ]; then
            npx patch-package
          fi

      - name: Materialize Android Firebase config (best-effort — не блокирует dev-сборку)
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          else
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON_BASE64 не задан — push (FCM) не будет работать в dev-сборке, остальное тестируется нормально."
          fi

      - name: Expo prebuild (Android, non-interactive)
        run: npx expo prebuild --platform android --clean --no-install --non-interactive
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Target API 36 (Google Play требование с 31.08.2026)
        run: |
          printf '\nandroid.compileSdkVersion=36\nandroid.targetSdkVersion=36\nandroid.buildToolsVersion=36.0.0\n' >> android/gradle.properties

      - name: Build Debug APK with Gradle (debug-keystore, dev-client)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode=summary

      - name: Rename APK to UrTruck-dev.apk
        run: |
          cd android/app/build/outputs/apk/debug
          ls -la
          mv app-debug.apk UrTruck-dev.apk
          ls -la UrTruck-dev.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-dev-apk
          path: android/app/build/outputs/apk/debug/UrTruck-dev.apk
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release with dev APK (public direct link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-dev-build-${{ github.run_number }}
          name: UrTruck Android Dev Client · build #${{ github.run_number }}
          prerelease: true
          body: |
            Debug dev-client сборка из ветки `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            Для локального тестирования — не для Play Console.

            Скачать: `UrTruck-dev.apk` ниже в Assets.
            После установки: `npx expo start --dev-client` для hot-reload.
          files: android/app/build/outputs/apk/debug/UrTruck-dev.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
