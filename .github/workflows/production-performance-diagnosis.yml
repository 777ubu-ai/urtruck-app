name: Production Performance Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urtruck-production-maintenance
  cancel-in-progress: false

jobs:
  diagnose:
    name: Measure proxy, web and API latency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Collect safe server performance evidence
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PASS"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== UTC / uptime ==='
          date -u +%Y-%m-%dT%H:%M:%SZ
          uptime
          echo
          echo '=== CPU / memory ==='
          free -h || true
          nproc || true
          echo
          echo '=== disk ==='
          df -hT || true
          command -v iostat >/dev/null && iostat -xz 1 3 || true
          echo
          echo '=== expensive processes (no environment variables) ==='
          ps -eo pid,ppid,pcpu,pmem,stat,etime,args --sort=-pcpu | head -25 || true
          echo
          echo '=== PM2 process list ==='
          pm2 list || true
          echo
          echo '=== listeners ==='
          ss -ltnp | grep -E ':(80|443|8001|8080)\b' || true
          echo
          echo '=== local time-to-first-byte ==='
          for target in \
            'http://127.0.0.1:8080/' \
            'http://127.0.0.1:8001/health' \
            'http://127.0.0.1:8001/api/version'; do
            curl -sS -o /dev/null --max-time 15 \
              -w "$target code=%{http_code} connect=%{time_connect}s ttfb=%{time_starttransfer}s total=%{time_total}s\\n" \
              "$target" || true
          done
          REMOTE

      - name: Diagnose production voice transcription provider safely
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          BACKEND_DIR: ${{ secrets.BACKEND_DIR || '/home/ubuntu/urtruck-security' }}
        run: |
          set -euo pipefail
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' -- "$BACKEND_DIR" <<'REMOTE'
          set -euo pipefail
          BACKEND_DIR="${1:?BACKEND_DIR required}"
          ENV_FILE="$BACKEND_DIR/.env"
          get_env() { sed -n "s/^${1}=//p" "$ENV_FILE" | tail -1; }
          key="$(get_env OPENAI_API_KEY)"
          provider="$(get_env TRANSCRIBE_PROVIDER)"
          model="$(get_env TRANSCRIBE_MODEL)"
          [ -n "$provider" ] || provider=openai
          [ -n "$model" ] || model=gpt-4o-mini-transcribe
          echo "STT_PROVIDER=$provider"
          echo "STT_MODEL=$model"
          if [ -z "$key" ]; then
            echo 'STT_KEY_PRESENT=no'
            exit 2
          fi
          echo 'STT_KEY_PRESENT=yes'
          tmp_wav="$(mktemp --suffix=.wav)"
          tmp_json="$(mktemp)"
          trap 'rm -f "$tmp_wav" "$tmp_json"' EXIT
          python3 - "$tmp_wav" <<'PY'
          import sys, wave
          with wave.open(sys.argv[1], 'wb') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(16000)
              f.writeframes(b'\0\0' * 16000)
          PY
          code="$(curl -sS --connect-timeout 10 --max-time 75 -o "$tmp_json" -w '%{http_code}' \
            https://api.openai.com/v1/audio/transcriptions \
            -H "Authorization: Bearer $key" \
            -F "model=$model" -F "response_format=json" -F "file=@$tmp_wav;type=audio/wav" || true)"
          echo "STT_HTTP_STATUS=$code"
          python3 - "$tmp_json" <<'PY'
          import json, sys
          try:
              data=json.load(open(sys.argv[1]))
          except Exception:
              print('STT_RESPONSE=non_json')
              raise SystemExit
          err=data.get('error') if isinstance(data, dict) else None
          if isinstance(err, dict):
              print('STT_ERROR_TYPE=' + str(err.get('type') or 'unknown'))
              print('STT_ERROR_CODE=' + str(err.get('code') or 'unknown'))
          else:
              print('STT_RESPONSE=success')
          PY
          pm2 logs urtruck-security-api --nostream --lines 300 2>/dev/null \
            | grep -E '\[stt\] OpenAI HTTP [0-9]+' \
            | sed -E 's/.*OpenAI HTTP ([0-9]+).*/STT_RECENT_APP_STATUS=\1/' \
            | tail -5 || true
          REMOTE
