name: Probe Yandex secret aliases

on:
  push:
    branches: [fix/map-clean-route-yandex-runtime-20260817]

permissions:
  contents: write

jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[secret-aliases-probed]')"
    runs-on: ubuntu-latest
    env:
      JS_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
      MAPS_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
      MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
      PUBLIC_KEY: ${{ secrets.EXPO_PUBLIC_YANDEX_MAPS_API_KEY }}
      MOBILE_KEY: ${{ secrets.YANDEX_MAPS_MOBILE_API_KEY }}
      GENERIC_KEY: ${{ secrets.YANDEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-clean-route-yandex-runtime-20260817
          fetch-depth: 0
      - name: Probe known secret names without printing values
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          names=['JS_KEY','MAPS_KEY','MAPKIT_KEY','PUBLIC_KEY','MOBILE_KEY','GENERIC_KEY']
          for n in names:
              k=os.getenv(n,'').strip()
              if not k:
                  print(f'{n}=missing')
                  continue
              cmd=['curl','-L','-sS','--max-time','15','-H','Referer: https://urtruck.kz/','-o','/tmp/out','-w','%{http_code}',f'https://api-maps.yandex.ru/v3/?apikey={k}&lang=ru_RU']
              p=subprocess.run(cmd,capture_output=True,text=True)
              print(f'{n}=present HTTP={p.stdout.strip() or "curl-error"}')
          PY
      - name: Remove probe workflow
        if: always()
        run: |
          git config user.name "UrTruck Release Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/probe-yandex-secret-aliases.yml
          git add .github/workflows/probe-yandex-secret-aliases.yml
          git commit -m "chore(map): secret aliases probed [secret-aliases-probed]" || true
          git push origin HEAD:fix/map-clean-route-yandex-runtime-20260817
