name: Probe Yandex candidate secrets 20260817
on:
  push:
    branches: [probe/yandex-live-error-20260817]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      JS: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
      MAPKIT_STD: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
      MAPKIT_USER: ${{ secrets.MapKit_SDK }}
      MAPS_GENERIC: ${{ secrets.YANDEX_MAPS_API_KEY }}
      YANDEX_GENERIC: ${{ secrets.YANDEX_API_KEY }}
    steps:
      - name: Test candidate keys without exposing values
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, urllib.parse, json
          for name in ['JS','MAPKIT_STD','MAPKIT_USER','MAPS_GENERIC','YANDEX_GENERIC']:
              key=(os.environ.get(name) or '').strip()
              if not key:
                  print(f'{name}: ABSENT')
                  continue
              url='https://api-maps.yandex.ru/v3/?apikey='+urllib.parse.quote(key,safe='')+'&lang=ru_RU'
              p=subprocess.run(['curl','-sS','-L','--max-time','20','-H','Referer: https://urtruck.kz/','-o','/tmp/body','-w','%{http_code}',url],capture_output=True,text=True)
              code=p.stdout.strip()
              msg=''
              try:
                  d=json.loads(open('/tmp/body',encoding='utf-8').read()); msg=d.get('message','')
              except Exception: pass
              print(f'{name}: PRESENT len={len(key)} HTTP={code} MESSAGE={msg}')
          PY
