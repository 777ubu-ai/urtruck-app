name: One-shot branch autofix

on:
  push:
    branches:
      - audit/release-blockers-2026-08-06

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/release-blockers-2026-08-06
          fetch-depth: 0
      - name: Apply targeted source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          bid = Path('backend/tests/test_bid_actions.py')
          text = bid.read_text(encoding='utf-8')
          old = '''    as_user("dash-driver")
              bid_a = client.post("/api/v1/market/bids", json={"cargo_id": cargo_id, "amount": 100}).json()["id"]
              bid_b = client.post("/api/v1/market/bids", json={"cargo_id": cargo_id, "amount": 200}).json()["id"]
              client.post(f"/api/v1/market/bids/{bid_a}/cancel")
          '''.replace('              ', '')
          new = '''    as_user("dash-driver-a")
              bid_a = client.post("/api/v1/market/bids", json={"cargo_id": cargo_id, "amount": 100}).json()["id"]
              as_user("dash-driver-b")
              bid_b = client.post("/api/v1/market/bids", json={"cargo_id": cargo_id, "amount": 200}).json()["id"]
              as_user("dash-driver-a")
              client.post(f"/api/v1/market/bids/{bid_a}/cancel")
          '''.replace('              ', '')
          if old not in text:
              raise SystemExit('expected bid test block not found')
          bid.write_text(text.replace(old, new, 1), encoding='utf-8')

          ux = Path('qa/utils/uxSmoke.js')
          text = ux.read_text(encoding='utf-8')
          old = """  if (!/import RoutePointPicker/.test(editTrip)) {
              failures.push('EditTripScreen does not import RoutePointPicker');
            }
          """.replace('          ', '')
          new = """  if (!/import (RoutePointPicker|LocationPickerModal)/.test(editTrip)) {
              failures.push('EditTripScreen does not import the structured route picker');
            }
          """.replace('          ', '')
          if old not in text:
              raise SystemExit('expected UX picker assertion not found')
          ux.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/test_bid_actions.py qa/utils/uxSmoke.js
          git diff --cached --quiet && exit 0
          git commit -m 'test: fix multi-bid fixture and current route picker assertion'
          git push origin HEAD:audit/release-blockers-2026-08-06
