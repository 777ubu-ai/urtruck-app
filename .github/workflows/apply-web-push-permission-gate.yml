name: Apply web push permission gate

on:
  push:
    branches: [fix/web-push-permission-gate-20260816]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[auto-applied-web-push]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-push-permission-gate-20260816
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 scripts/apply_web_push_permission_gate.py
      - name: Commit patched product files
        run: |
          git config user.name "urtruck-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/utils/push.js src/components/PushPermissionBanner.js App.js tests/frontend/web_push_permission_gate.test.mjs .version sw-template.js
          git commit -m "fix(push): require explicit web notification permission [auto-applied-web-push]"
          git push origin HEAD:fix/web-push-permission-gate-20260816
