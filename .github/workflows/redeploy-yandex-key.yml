name: Redeploy refreshed Yandex key
on:
  push:
    branches: [main]
    paths: ['.github/workflows/redeploy-yandex-key.yml']
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate refreshed Yandex secret is present
        env:
          KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
        run: |
          test -n "$KEY"
          echo "Yandex JS API secret is configured; main production pipeline will rebuild from this commit."
      - name: Remove one-shot trigger
        run: |
          git config user.name "UrTruck Release Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/redeploy-yandex-key.yml
          git add .github/workflows/redeploy-yandex-key.yml
          git commit -m "chore(deploy): remove Yandex redeploy trigger [skip ci]" || true
          git push origin HEAD:main
