name: UrTruck Production TestFlight Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urtruck-ios-production-push-inbox
  cancel-in-progress: false

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate-reusable.yml

  build-and-upload:
    needs: quality-gate
    runs-on: macos-15
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: https://urtruck.kz
      URTRUCK_BUILD_FLAVOR: production
      URTRUCK_SOURCE_SHA: d41c51c39583641e95df9bc914663ca090c1ea48
      EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
      EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
      YANDEX_ROUTER_API_KEY: ${{ secrets.YANDEX_ROUTER_API_KEY }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: d41c51c39583641e95df9bc914663ca090c1ea48
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact branch and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/route-publication-no-repeat-vehicle-20261009
          test "$(git rev-parse HEAD)" = "$URTRUCK_SOURCE_SHA"
          test -n "${EXPO_TOKEN:-}"
          test -n "${EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY:-}"
          test -n "${EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY:-}"
          echo "SHA=$(git rev-parse HEAD)"
          npx eas-cli@latest whoami
          # Cloud-build diagnostic contract: npx eas-cli@latest build:view "$BUILD_ID" --json

      - name: Inject release runtime configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build.production.env = {
            ...(eas.build.production.env || {}),
            EXPO_PUBLIC_API_URL: process.env.EXPO_PUBLIC_API_URL,
            EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: process.env.EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY,
            EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: process.env.EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY
          };
          if (process.env.YANDEX_ROUTER_API_KEY) {
            eas.build.production.env.YANDEX_ROUTER_API_KEY = process.env.YANDEX_ROUTER_API_KEY;
          }
          if (process.env.OPENROUTESERVICE_API_KEY) {
            eas.build.production.env.OPENROUTESERVICE_API_KEY = process.env.OPENROUTESERVICE_API_KEY;
          }
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          NODE

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build signed IPA locally
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/UrTruck.ipa"
          test -s "$RUNNER_TEMP/UrTruck.ipa"
          shasum -a 256 "$RUNNER_TEMP/UrTruck.ipa" | tee "$RUNNER_TEMP/UrTruck.ipa.sha256"

      - name: Verify signed production IPA before submission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-verified"
          unzip -q "$RUNNER_TEMP/UrTruck.ipa" -d "$RUNNER_TEMP/ios-verified"
          APP_DIR="$(find "$RUNNER_TEMP/ios-verified/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_DIR"
          codesign --verify --deep --strict "$APP_DIR"
          python3 - "$APP_DIR" "$RUNNER_TEMP/UrTruck-manifest.json" <<'PYVERIFY'
          import json, pathlib, plistlib, sys, os, subprocess
          app = pathlib.Path(sys.argv[1])
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          config = json.loads((app / 'EXConstants.bundle/app.config').read_text())
          assert info['CFBundleIdentifier'] == 'com.urtruck.app'
          assert info['CFBundleShortVersionString'] == '1.0.9'
          number = str(info['CFBundleVersion'])
          assert number.isdigit() and int(number) > 95
          assert config['extra']['urtruckApiUrl'].rstrip('/') == 'https://urtruck.kz'
          assert config['extra']['urtruckBuildFlavor'] == 'production'
          signed = subprocess.check_output(['codesign', '-d', '--entitlements', ':-', str(app)], stderr=subprocess.DEVNULL)
          entitlements = plistlib.loads(signed)
          assert entitlements['aps-environment'] == 'production'
          assert entitlements['application-identifier'].endswith('.com.urtruck.app')
          manifest = dict(sourceSHA=os.environ['URTRUCK_SOURCE_SHA'], bundleIdentifier=info['CFBundleIdentifier'], versionName='1.0.9', buildNumber=number, apiHost='urtruck.kz', flavor='production', apsEnvironment='production')
          pathlib.Path(sys.argv[2]).write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest))
          PYVERIFY

      - name: Upload private IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-TestFlight-IPA
          path: |
            ${{ runner.temp }}/UrTruck.ipa
            ${{ runner.temp }}/UrTruck.ipa.sha256
            ${{ runner.temp }}/UrTruck-manifest.json
          retention-days: 14

      - name: Submit IPA to TestFlight
        shell: bash
        run: npx eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/UrTruck.ipa" --non-interactive --wait
