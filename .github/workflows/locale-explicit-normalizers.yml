name: Locale Explicit Normalizers Patch
on:
  push:
    branches: [fix/zh-localization-10of10-20260816]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[locale-normalizers]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zh-localization-10of10-20260816
          fetch-depth: 0
      - name: Wire explicit locale
        run: |
          python3 <<'PY'
          from pathlib import Path
          def rep(path, old, new, n=1):
            p=Path(path); s=p.read_text(); c=s.count(old)
            if c != n: raise SystemExit(f'{path}: expected {n}, got {c}: {old[:100]}')
            p.write_text(s.replace(old,new))

          p='src/screens/CargoDetail.js'
          rep(p,
              """  // Canonical cargo: never reach into raw fields directly. The pre-pilot\n  // mixed shapes (server snake_case, FeedScreen camelCase, store.js demo)\n  // all flow through normalizeCargo so renders never blow up on null.\n  const cargo = normalizeCargo(paramCargo) || {};\n  const { t, lang } = useI18n();""",
              """  // Canonical cargo: locale is explicit so normalizers stay pure and Node-testable.\n  const { t, lang } = useI18n();\n  const cargo = normalizeCargo(paramCargo, lang) || {};""")
          rep(p, "const normalized = normalizeCargo(fullCargo);", "const normalized = normalizeCargo(fullCargo, lang);")
          rep(p, "const view = cargoDisplay(c, t);", "const view = cargoDisplay(c, t, lang);")

          p='src/screens/TripDetail.js'
          rep(p, "const view = tripDisplay(trip, t);", "const view = tripDisplay(trip, t, lang);")
          PY
      - name: Commit
        run: |
          git config user.name "UrTruck QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/CargoDetail.js src/screens/TripDetail.js
          git commit -m "fix(i18n): pass locale explicitly to normalizers [locale-normalizers]"
          git push origin HEAD:fix/zh-localization-10of10-20260816
