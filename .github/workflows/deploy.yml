name: UrTruck Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# IMPORTANT: this workflow is now the production RELEASE GATE only.
# The actual production writer is UrTruck Secure Production Deploy, which
# starts via workflow_run after this gate succeeds. Keeping one writer removes
# the race where two workflows copied different index.html/build-info files to
# the same server and production intermittently served an older commit.
concurrency:
  group: urtruck-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required Yandex Maps secret exists and is accepted
        env:
          YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${YANDEX_MAPS_JS_API_KEY:-}" || {
            echo "::error::YANDEX_MAPS_JS_API_KEY is required for the UrTruck production map"
            exit 1
          }

          # The active UrTruck key is a valid JavaScript API 2.1 key. Validate
          # the exact endpoint production loads instead of rejecting it against v3.
          python3 - <<'PY' > /tmp/yandex-url
          import os, urllib.parse
          key=os.environ['YANDEX_MAPS_JS_API_KEY'].strip()
          print('https://api-maps.yandex.ru/2.1/?apikey='+urllib.parse.quote(key,safe='')+'&lang=ru_RU')
          PY
          code=$(curl -sS -L --max-time 20 -H 'Referer: https://urtruck.kz/' -o /tmp/yandex-body -w '%{http_code}' "$(cat /tmp/yandex-url)" || true)
          body=$(head -c 300 /tmp/yandex-body 2>/dev/null || true)
          if [ "$code" = "403" ] && printf '%s' "$body" | grep -qi 'Invalid api key'; then
            echo "::error::YANDEX_MAPS_JS_API_KEY is rejected by Yandex JavaScript API 2.1"
            exit 1
          fi
          if [ "$code" = "200" ]; then
            echo "YANDEX_MAPS_SECRET=accepted-v2.1"
          elif [ "$code" = "429" ]; then
            echo "::warning::Yandex validation endpoint is rate-limited from the CI runner; key was not rejected as invalid in this check"
          else
            echo "::warning::Yandex key validation returned HTTP $code; production browser smoke remains authoritative"
          fi

      - name: Build production web with Yandex Maps
        env:
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
        run: |
          set -euo pipefail
          npm run build:web
          node scripts/injectYandexMaps.mjs
          test -s dist/index.html
          grep -q 'api-maps.yandex.ru/2.1/' dist/index.html
          grep -q 'lang=ru_RU' dist/index.html
          echo "YANDEX_WEB_BUILD=ok"

      - name: Map regression contracts
        run: |
          set -euo pipefail
          node tests/frontend/test_yandex_map_primary.mjs
          node tests/frontend/test_yandex_road_route.mjs
          node tests/frontend/test_deal_room_auto_map.mjs
          node tests/frontend/test_shipper_inprogress_auto_map.mjs

      - name: Release gate passed
        run: echo "URTRUCK_RELEASE_GATE=success"
