name: UrTruck Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Stage 10: bumped from 15 → 30. The two earlier 25379847358
    # runs were cancelled by the workflow timer at the 15-minute mark
    # while scp was still uploading. Health-check window itself can
    # consume up to ~150s on a cold uvicorn restart, which only
    # leaves ~12 minutes for the two scp uploads — too tight on slow
    # GitHub-runner ↔ server links.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npx expo export --platform web

      - name: Bundle size guard
        # Страж размера JS-бандла: для КЗ/Китая с медленным интернетом важно,
        # чтобы приложение не разбухало незаметно (кто-то залил тяжёлую
        # картинку/шрифт). Порог 12 МБ на самый большой JS-чанк — сейчас
        # ~2.7 МБ, запас большой; предупреждаем, а не валим деплой.
        run: |
          MAXKB=12000
          BIG=$(find dist/_expo/static/js -name '*.js' -printf '%s %p\n' 2>/dev/null | sort -rn | head -1)
          SZ=$(echo "$BIG" | awk '{print int($1/1024)}')
          echo "Крупнейший JS-чанк: ${SZ} КБ ($(echo "$BIG" | awk '{print $2}'))"
          if [ "${SZ:-0}" -gt "$MAXKB" ]; then
            echo "::warning::JS-бандл ${SZ} КБ превысил порог ${MAXKB} КБ — проверьте, не залили ли тяжёлый ассет."
          fi

      - name: Post-process (SW + manifest)
        run: |
          cp sw-template.js dist/sw.js
          # Legal pages (privacy/terms/support) — статические HTML вне SPA.
          # Нужны для App Store / Google Play (рабочий URL политики).
          mkdir -p dist/legal
          cp web/legal/*.html dist/legal/
          python3 <<'PY'
          import re, json
          with open('dist/index.html', 'r') as f:
              html = f.read()
          # Inject manifest + PWA meta
          if '<link rel="manifest"' not in html:
              html = html.replace('</head>', '<link rel="manifest" href="/manifest.json" />\n</head>')
          with open('dist/index.html', 'w') as f:
              f.write(html)
          # Manifest
          manifest = {
              "name": "UrTruck · FTL Market",
              "short_name": "UrTruck",
              "start_url": "/",
              "display": "standalone",
              "background_color": "#0B0F1A",
              "theme_color": "#0B0F1A",
          }
          with open('dist/manifest.json', 'w') as f:
              json.dump(manifest, f)
          PY

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR || '/home/ubuntu/urtruck-app' }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$SERVER_PASS" scp -C -o StrictHostKeyChecking=no -r dist/* "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "chmod -R 755 $REMOTE_DIR"

      - name: Deploy backend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          BACKEND_DIR: ${{ secrets.BACKEND_DIR || '/home/ubuntu/urtruck-security' }}
        run: |
          sshpass -p "$SERVER_PASS" scp -C -o StrictHostKeyChecking=no -r backend/* "$SERVER_USER@$SERVER_HOST:$BACKEND_DIR/"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "source ~/.nvm/nvm.sh && pm2 restart urtruck-security-api"

      # Email SMTP настраивается НАПРЯМУЮ в $BACKEND_DIR/.env на сервере
      # (провайдер выбирается там: Gmail SMTP / Resend / SES и т.д.). CI больше
      # НЕ перезаписывает email-креды автоматически — раньше этот шаг вписывал
      # Resend-ключ и затирал ручную Gmail-настройку при каждом деплое. Теперь
      # email-конфиг — единственный источник истины в серверном .env.
      - name: Email SMTP note (managed on server .env)
        run: echo "Email SMTP управляется в BACKEND_DIR/.env на сервере; CI его не трогает (см. комментарий в workflow)."

      - name: Health check
        env:
          # Public domain served by nginx, which proxies / → :8080 (web)
          # and /security/* → :8001 (backend). The runner can't reach the
          # private :8001 port directly (firewall), so we go through the
          # public domain. Override with secret PUBLIC_BASE_URL if needed.
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://urtruck.kz' }}
        run: |
          set -e
          # PM2 restart on a 0.7s shell + uvicorn warmup with face_recognition
          # / dlib / opencv imports takes a while on the pilot box. Give the
          # backend an unconditional warm-up window before probing, then up
          # to ~2 minutes of retries (24 × 5s) for the JSON to come up.
          echo "Waiting 25s for PM2 + nginx + python imports to settle…"
          sleep 25

          # --- Frontend: public bundle must serve a non-empty HTML ---
          ok=0
          for i in $(seq 1 12); do
            body=$(curl -sS --max-time 10 "$PUBLIC_BASE_URL/" || true)
            case "$body" in
              *"<html"*|*"<!DOCTYPE"*|*"<!doctype"*) ok=1; break;;
            esac
            echo "frontend probe $i — empty/error, retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Frontend did not serve HTML at $PUBLIC_BASE_URL/"
            exit 1
          fi
          echo "✅ Frontend OK"

          # --- Backend: /security/api/v1/system/info must return JSON with otp field ---
          ok=0
          for i in $(seq 1 24); do
            body=$(curl -fsS --max-time 10 "$PUBLIC_BASE_URL/security/api/v1/system/info" || true)
            if echo "$body" | grep -q '"otp"'; then ok=1; break; fi
            echo "backend probe $i — no otp field, retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Backend system/info did not return expected JSON at $PUBLIC_BASE_URL/security/api/v1/system/info"
            exit 1
          fi
          echo "✅ Backend system/info OK"

          # --- Marketplace cargos must return JSON with cargos field ---
          ok=0
          for i in $(seq 1 6); do
            body=$(curl -fsS --max-time 10 "$PUBLIC_BASE_URL/security/api/v1/market/cargos?status=active&limit=1" || true)
            if echo "$body" | grep -q '"cargos"'; then ok=1; break; fi
            echo "cargos probe $i — missing 'cargos' field, retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::cargos endpoint missing 'cargos' field"; exit 1
          fi
          echo "✅ Cargos list OK"

          # --- Marketplace trips must return JSON with trips field ---
          ok=0
          for i in $(seq 1 6); do
            body=$(curl -fsS --max-time 10 "$PUBLIC_BASE_URL/security/api/v1/market/trips?status=active&limit=1" || true)
            if echo "$body" | grep -q '"trips"'; then ok=1; break; fi
            echo "trips probe $i — missing 'trips' field, retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::trips endpoint missing 'trips' field"; exit 1
          fi
          echo "✅ Trips list OK"

          # --- Registration endpoints must EXIST after backend deploy ---
          # Известный blind spot: фронт может уехать, а backend остаться
          # старым → нужные роуты регистрации вернут 404. Проверяем, что
          # они присутствуют (401/403/405/422 = роут есть; 404 = старый
          # backend). Запросы пустые, без auth/секретов/PII.
          REG_BASE="$PUBLIC_BASE_URL/security/api/v1"
          reg_check() {
            # $1 = method, $2 = path
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X "$1" "$REG_BASE$2" || true)
            if [ "$code" = "404" ] || [ "$code" = "000" ]; then
              echo "::error::registration route $2 returned $code (missing — backend not deployed?)"
              return 1
            fi
            echo "✅ $2 ($code)"
          }
          reg_ok=1
          reg_check POST  "/register/photo"             || reg_ok=0
          reg_check POST  "/register/license-selfie"    || reg_ok=0
          reg_check POST  "/register/vehicle-photo"     || reg_ok=0
          reg_check POST  "/register/cabin-photo"       || reg_ok=0
          reg_check POST  "/driver/registration/submit" || reg_ok=0
          if [ "$reg_ok" != "1" ]; then
            echo "::error::Registration endpoints missing after deploy — backend deploy incomplete"
            exit 1
          fi
          echo "✅ Registration endpoints OK"
