name: UrTruck Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Stage 10: bumped from 15 → 30. The two earlier 25379847358
    # runs were cancelled by the workflow timer at the 15-minute mark
    # while scp was still uploading. Health-check window itself can
    # consume up to ~150s on a cold uvicorn restart, which only
    # leaves ~12 minutes for the two scp uploads — too tight on slow
    # GitHub-runner ↔ server links.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npx expo export --platform web

      - name: Bundle size guard
        # Страж размера JS-бандла: для КЗ/Китая с медленным интернетом важно,
        # чтобы приложение не разбухало незаметно (кто-то залил тяжёлую
        # картинку/шрифт). Порог 12 МБ на самый большой JS-чанк — сейчас
        # ~2.7 МБ, запас большой; предупреждаем, а не валим деплой.
        run: |
          MAXKB=12000
          BIG=$(find dist/_expo/static/js -name '*.js' -printf '%s %p\n' 2>/dev/null | sort -rn | head -1)
          SZ=$(echo "$BIG" | awk '{print int($1/1024)}')
          echo "Крупнейший JS-чанк: ${SZ} КБ ($(echo "$BIG" | awk '{print $2}'))"
          if [ "${SZ:-0}" -gt "$MAXKB" ]; then
            echo "::warning::JS-бандл ${SZ} КБ превысил порог ${MAXKB} КБ — проверьте, не залили ли тяжёлый ассет."
          fi

      - name: Post-process (SW + manifest)
        run: |
          cp sw-template.js dist/sw.js
          # Версия приложения в корень статики → https://urtruck.kz/.version.
          # expo export не копирует корневой .version, поэтому кладём вручную,
          # иначе номер сборки на сайте не обновляется после деплоя.
          cp .version dist/.version
          # Дубль версии в НЕ-dotfile: nginx на сервере отдаёт /.version → 403
          # (deny на точечные файлы), поэтому проверяемый по HTTP путь — /version.txt.
          cp .version dist/version.txt
          # Legal pages (privacy/terms/support) — статические HTML вне SPA.
          # Нужны для App Store / Google Play (рабочий URL политики).
          mkdir -p dist/legal
          cp web/legal/*.html dist/legal/
          python3 <<'PY'
          import re, json
          with open('dist/index.html', 'r') as f:
              html = f.read()
          # Inject manifest + PWA meta
          if '<link rel="manifest"' not in html:
              html = html.replace('</head>', '<link rel="manifest" href="/manifest.json" />\n</head>')
          # 05.08.2026 (Фаза A выкладка): CI-путь раньше не форсировал сброс
          # старого service-worker кэша (в отличие от deploy.sh) — Safari/PWA
          # мог показывать старый бандл до собственного цикла обновления SW.
          # Тот же приём, что в deploy.sh: localStorage-версия проверяется
          # синхронно при загрузке, при несовпадении — чистим caches API,
          # снимаем регистрацию SW и делаем один принудительный reload.
          # Версия кэша (v10-market) совпадает с CACHE/STATIC_CACHE в
          # sw-template.js — держать в одном шаге при следующем бампе.
          # v8 (05.08.2026): предыдущий баг класса — V бампался один раз
          # (v6→v7 в 158b612), а все ПОСЛЕДУЮЩИЕ деплои того же дня оставляли
          # V неизменным. localStorage у уже посетивших клиентов совпадал →
          # ветка force-clear не срабатывала, sw.js был побайтово тем же
          # файлом → браузер не видел повода переустанавливать воркер →
          # телефоны с уже выставленным ur_sw_v='v7-market' не подхватывали
          # более поздние коммиты того дня. Правило на будущее: КАЖДЫЙ деплой,
          # меняющий фронтенд-код, обязан бампать V здесь синхронно с
          # sw-template.js — иначе force-clear для уже посетивших клиентов не
          # сработает.
          bootstrap = '''<script>
          (async()=>{
            const V='v10-market';
            const cur=localStorage.getItem('ur_sw_v');
            if(cur!==V){
              if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
              if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}
              localStorage.setItem('ur_sw_v',V);
              location.reload();
              return;
            }
            if('serviceWorker' in navigator){
              try{
                const reg=await navigator.serviceWorker.register('/sw.js?v=10');
                if(reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'})}
                reg.addEventListener('updatefound',()=>{
                  const nw=reg.installing;
                  nw&&nw.addEventListener('statechange',()=>{
                    if(nw.state==='installed'&&navigator.serviceWorker.controller){
                      nw.postMessage({type:'SKIP_WAITING'});
                      setTimeout(()=>location.reload(),300)
                    }
                  })
                })
              }catch(e){}
            }
          })();
          </script>'''
          if 'ur_sw_v' not in html:
              html = html.replace('</body>', bootstrap + '\n</body>')
          with open('dist/index.html', 'w') as f:
              f.write(html)
          # Manifest
          manifest = {
              "name": "UrTruck · FTL Market",
              "short_name": "UrTruck",
              "start_url": "/",
              "display": "standalone",
              "background_color": "#0B0F1A",
              "theme_color": "#0B0F1A",
          }
          with open('dist/manifest.json', 'w') as f:
              json.dump(manifest, f)
          PY

      - name: Build-info marker (public commit proof)
        # 05.08.2026: раньше не было способа публично доказать, какой именно
        # коммит реально отдаёт production — только "CI зелёный" (что НЕ
        # доказывает раскатку на клиенты, см. следующий шаг). /build-info.json
        # публично проверяем в Health check и должны проверять руками при
        # любом подозрении на устаревшую версию.
        run: |
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > dist/build-info.json <<JSON
          {"commit":"${GITHUB_SHA}","short":"${GITHUB_SHA::7}","built_at":"${BUILT_AT}","version":$(cat .version)}
          JSON
          cat dist/build-info.json

      - name: Backup current production (rollback safety)
        # 05.08.2026 (Фаза A выкладка): раньше CI-путь ничего не бэкапил перед
        # перезаписью REMOTE_DIR/BACKEND_DIR — откатиться можно было только
        # деплоем предыдущего коммита заново. Кладём таймстемп-копию ВНЕ
        # web-корня (nginx её не отдаёт — не "доступна пользователям"),
        # только для быстрого восстановления руками при необходимости.
        # Не валим деплой, если бэкапить нечего (первый прогон и т.п.).
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR || '/home/ubuntu/urtruck-app' }}
          BACKEND_DIR: ${{ secrets.BACKEND_DIR || '/home/ubuntu/urtruck-security' }}
        run: |
          sudo apt-get install -y sshpass
          STAMP=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
            mkdir -p ~/urtruck-rollback/frontend ~/urtruck-rollback/backend
            [ -d '$REMOTE_DIR' ] && cp -a '$REMOTE_DIR' ~/urtruck-rollback/frontend/$STAMP || echo 'no existing frontend to back up'
            [ -d '$BACKEND_DIR' ] && cp -a '$BACKEND_DIR' ~/urtruck-rollback/backend/$STAMP || echo 'no existing backend to back up'
            cd ~/urtruck-rollback/frontend && ls -dt */ 2>/dev/null | tail -n +11 | xargs -r rm -rf
            cd ~/urtruck-rollback/backend && ls -dt */ 2>/dev/null | tail -n +11 | xargs -r rm -rf
            echo \"Backed up as $STAMP (kept last 10)\"
          "
          echo "ROLLBACK_STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR || '/home/ubuntu/urtruck-app' }}
        run: |
          sudo apt-get install -y sshpass
          # 05.08.2026: expo export хеширует имена JS-чанков по контенту —
          # каждый деплой добавляет НОВЫЙ файл, но scp -r никогда не удаляет
          # старые. Годы простоя копятся orphan-бандлы в _expo/static/js/web/;
          # если у какого-то клиента где-то намертво закэширован старый
          # index.html со старым хешем, он тихо продолжает получать старый
          # JS вместо честного 404. Чистим старые ассеты перед заливкой новых.
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "rm -rf '$REMOTE_DIR/_expo'"
          sshpass -p "$SERVER_PASS" scp -C -o StrictHostKeyChecking=no -r dist/* "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "chmod -R 755 $REMOTE_DIR"

      - name: Verify production filesystem (public-proof diagnostics)
        # 05.08.2026: "CI зелёный" не доказывает, что реальный urtruck.kz
        # отдаёт этот код — nginx мог смотреть в другую директорию, root мог
        # быть не там, куда льёт scp. Печатаем РЕАЛЬНОЕ состояние сервера
        # (какой root у активного server_name, что реально лежит на диске и
        # с какими mtime) в лог этого джоба — читать через get_job_logs, не
        # со слов CI-статуса.
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR || '/home/ubuntu/urtruck-app' }}
        run: |
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
            echo '--- nginx -T | grep -A25 urtruck.kz (active config for this server_name) ---'
            (sudo -n nginx -T 2>/dev/null || nginx -T 2>/dev/null) | grep -B2 -A25 'server_name.*urtruck' || echo 'NOT FOUND in nginx -T (or no read permission — try sudo -n manually)'
            echo
            echo '--- readlink -f \$REMOTE_DIR (real path, resolves symlinks) ---'
            readlink -f '$REMOTE_DIR'
            echo
            echo '--- ls -la \$REMOTE_DIR (top level, mtimes) ---'
            ls -la '$REMOTE_DIR'
            echo
            echo '--- index.html mtime + bundle filenames referenced ---'
            stat -c '%y %n' '$REMOTE_DIR/index.html'
            grep -oE '_expo/static/js/web/index-[a-f0-9]+\.js' '$REMOTE_DIR/index.html'
            echo
            echo '--- build-info.json on disk ---'
            cat '$REMOTE_DIR/build-info.json' 2>/dev/null || echo 'MISSING'
            echo
            echo '--- how many JS bundle files actually on disk (orphan check) ---'
            ls -la '$REMOTE_DIR/_expo/static/js/web/' 2>/dev/null | grep '\.js$'
          "

      - name: Deploy backend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          BACKEND_DIR: ${{ secrets.BACKEND_DIR || '/home/ubuntu/urtruck-security' }}
        run: |
          sshpass -p "$SERVER_PASS" scp -C -o StrictHostKeyChecking=no -r backend/* "$SERVER_USER@$SERVER_HOST:$BACKEND_DIR/"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "source ~/.nvm/nvm.sh && pm2 restart urtruck-security-api"

      # Email SMTP настраивается НАПРЯМУЮ в $BACKEND_DIR/.env на сервере
      # (провайдер выбирается там: Gmail SMTP / Resend / SES и т.д.). CI больше
      # НЕ перезаписывает email-креды автоматически — раньше этот шаг вписывал
      # Resend-ключ и затирал ручную Gmail-настройку при каждом деплое. Теперь
      # email-конфиг — единственный источник истины в серверном .env.
      - name: Email SMTP note (managed on server .env)
        run: echo "Email SMTP управляется в BACKEND_DIR/.env на сервере; CI его не трогает (см. комментарий в workflow)."

      - name: Health check
        env:
          # Public domain served by nginx, which proxies / → :8080 (web)
          # and /security/* → :8001 (backend). The runner can't reach the
          # private :8001 port directly (firewall), so we go through the
          # public domain. Override with secret PUBLIC_BASE_URL if needed.
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://urtruck.kz' }}
        run: |
          set -e
          # PM2 restart on a 0.7s shell + uvicorn warmup with face_recognition
          # / dlib / opencv imports takes a while on the pilot box. Give the
          # backend an unconditional warm-up window before probing, then up
          # to ~2 minutes of retries (24 × 5s) for the JSON to come up.
          echo "Waiting 25s for PM2 + nginx + python imports to settle…"
          sleep 25

          # --- Frontend: public bundle must serve a non-empty HTML ---
          ok=0
          for i in $(seq 1 12); do
            body=$(curl -sS --max-time 10 "$PUBLIC_BASE_URL/" || true)
            case "$body" in
              *"<html"*|*"<!DOCTYPE"*|*"<!doctype"*) ok=1; break;;
            esac
            echo "frontend probe $i — empty/error, retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Frontend did not serve HTML at $PUBLIC_BASE_URL/"
            exit 1
          fi
          echo "✅ Frontend OK"

          # --- build-info.json must be publicly reachable and match this run's commit ---
          # Единственная публичная (не только серверная) проверка "какой
          # коммит реально отдаёт production" — curl с внешней стороны, как
          # видит его пользователь, а не то, что лежит на диске сервера.
          info=$(curl -fsS --max-time 10 "$PUBLIC_BASE_URL/build-info.json" || true)
          echo "build-info.json: $info"
          if ! echo "$info" | grep -q "\"${GITHUB_SHA}\""; then
            echo "::error::/build-info.json does not contain this run's commit ${GITHUB_SHA} — production is NOT serving this build"
            exit 1
          fi
          echo "✅ build-info.json OK — public commit matches ${GITHUB_SHA::7}"

          # --- Backend: /security/api/v1/system/info must return JSON with otp field ---
          ok=0
          for i in $(seq 1 24); do
            body=$(curl -fsS --max-time 10 "$PUBLIC_BASE_URL/security/api/v1/system/info" || true)
            if echo "$body" | grep -q '"otp"'; then ok=1; break; fi
            echo "backend probe $i — no otp field, retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Backend system/info did not return expected JSON at $PUBLIC_BASE_URL/security/api/v1/system/info"
            exit 1
          fi
          echo "✅ Backend system/info OK"

          # --- Marketplace cargos must return JSON with cargos field ---
          ok=0
          for i in $(seq 1 6); do
            body=$(curl -fsS --max-time 10 "$PUBLIC_BASE_URL/security/api/v1/market/cargos?status=active&limit=1" || true)
            if echo "$body" | grep -q '"cargos"'; then ok=1; break; fi
            echo "cargos probe $i — missing 'cargos' field, retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::cargos endpoint missing 'cargos' field"; exit 1
          fi
          echo "✅ Cargos list OK"

          # --- Marketplace trips must return JSON with trips field ---
          ok=0
          for i in $(seq 1 6); do
            body=$(curl -fsS --max-time 10 "$PUBLIC_BASE_URL/security/api/v1/market/trips?status=active&limit=1" || true)
            if echo "$body" | grep -q '"trips"'; then ok=1; break; fi
            echo "trips probe $i — missing 'trips' field, retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::trips endpoint missing 'trips' field"; exit 1
          fi
          echo "✅ Trips list OK"

          # --- Registration endpoints must EXIST after backend deploy ---
          # Известный blind spot: фронт может уехать, а backend остаться
          # старым → нужные роуты регистрации вернут 404. Проверяем, что
          # они присутствуют (401/403/405/422 = роут есть; 404 = старый
          # backend). Запросы пустые, без auth/секретов/PII.
          REG_BASE="$PUBLIC_BASE_URL/security/api/v1"
          reg_check() {
            # $1 = method, $2 = path
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X "$1" "$REG_BASE$2" || true)
            if [ "$code" = "404" ] || [ "$code" = "000" ]; then
              echo "::error::registration route $2 returned $code (missing — backend not deployed?)"
              return 1
            fi
            echo "✅ $2 ($code)"
          }
          reg_ok=1
          reg_check POST  "/register/photo"             || reg_ok=0
          reg_check POST  "/register/license-selfie"    || reg_ok=0
          reg_check POST  "/register/vehicle-photo"     || reg_ok=0
          reg_check POST  "/register/cabin-photo"       || reg_ok=0
          reg_check POST  "/driver/registration/submit" || reg_ok=0
          if [ "$reg_ok" != "1" ]; then
            echo "::error::Registration endpoints missing after deploy — backend deploy incomplete"
            exit 1
          fi
          echo "✅ Registration endpoints OK"
