name: UrTruck TestFlight RC

# Push to this release branch is the canonical trigger for an exact
# TestFlight candidate build and upload.
# RC refresh 2026-08-26: voice optimistic-send + chat UX fixes.
# RC bump 2026-08-26 15:00Z: voice crash hardening (fix branch merged) —
# kill iOS "Only one Recording" native crash on rapid record/unmount,
# fix drop-bubble on rapid double voice send, guard toggleVoice state
# updates behind mounted.current after every await. Product diff is
# exactly the 3 files listed in b9d670c — this workflow-comment bump
# exists only to satisfy the path-filtered push trigger, not to change
# CI logic.
# RC bump 2026-08-26 19:00Z: notifications deeplink release entrypoints
# merged in a8669ac; comment-only trigger for exact TestFlight rebuild.
# RC diagnostic 2026-08-26 19:05Z: persist EAS build/submit logs on failure.
# RC diagnostic 2026-08-26 19:20Z: publish EAS failure text to issue #262.
on:
  push:
    branches:
      - release/appstore-final-audit-20260820
    paths:
      - .github/workflows/testflight-rc.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: urtruck-testflight-rc
  cancel-in-progress: false

jobs:
  build-and-upload-testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release branch and Expo auth
        shell: bash
        run: |
          set -euo pipefail
          echo "SHA=$(git rev-parse HEAD)"
          test "${GITHUB_REF_NAME}" = "release/appstore-final-audit-20260820"
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami

      - name: Show recent iOS EAS builds
        run: npx eas-cli@latest build:list --platform ios --limit 10 --non-interactive

      - name: Build production iOS RC in EAS
        id: build
        shell: bash
        env:
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY:-}" || {
            echo "::error::YANDEX_MAPS_JS_API_KEY is required for iOS/TestFlight route map rendering."
            exit 1
          }
          set +e
          npx eas-cli@latest build --platform ios --profile production --non-interactive --wait --json > eas-build.json 2> eas-build.stderr
          BUILD_EXIT=$?
          set -e
          cat eas-build.stderr >&2 || true
          cat eas-build.json || true
          if [ "$BUILD_EXIT" -ne 0 ]; then
            exit "$BUILD_EXIT"
          fi
          BUILD_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eas-build.json','utf8'))[0].id)")
          BUILD_COMMIT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eas-build.json','utf8'))[0].gitCommitHash)")
          HEAD_SHA=$(git rev-parse HEAD)
          echo "EAS build id:            $BUILD_ID"
          echo "EAS build gitCommitHash: $BUILD_COMMIT"
          echo "Checked-out HEAD:        $HEAD_SHA"
          if [ "$BUILD_COMMIT" != "$HEAD_SHA" ]; then
            echo "::error::EAS build gitCommitHash ($BUILD_COMMIT) does not match the checked-out release-branch HEAD ($HEAD_SHA) — refusing to submit an unverified build to TestFlight."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Upload the exact verified build to TestFlight only
        id: submit
        shell: bash
        run: |
          set -o pipefail
          set +e
          npx eas-cli@latest submit --platform ios --profile production --id "${{ steps.build.outputs.build_id }}" --non-interactive --wait 2>&1 | tee submit.log
          SUBMIT_EXIT=${PIPESTATUS[0]}
          set -e
          SUBMISSION_ID=$(grep -oE 'submissions/[a-f0-9-]+' submit.log | head -1 | cut -d/ -f2 || true)
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          exit "$SUBMIT_EXIT"

      - name: Upload TestFlight RC diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-rc-diagnostics-${{ github.run_id }}
          path: |
            eas-build.json
            eas-build.stderr
            submit.log
          if-no-files-found: ignore

      - name: Publish TestFlight RC diagnostics to issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(0, 12000) : '(missing)';
            const body = [
              '## TestFlight RC failure diagnostics',
              '',
              `run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `sha: ${context.sha}`,
              `branch: ${context.ref}`,
              '',
              '### eas-build.stderr',
              '```text',
              read('eas-build.stderr'),
              '```',
              '',
              '### eas-build.json',
              '```json',
              read('eas-build.json'),
              '```',
              '',
              '### submit.log',
              '```text',
              read('submit.log'),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 262,
              body,
            });

      - name: Show exact Apple/EAS submission error on failure
        if: failure() && steps.submit.outputs.submission_id != ''
        run: npx eas-cli@latest submission:view "${{ steps.submit.outputs.submission_id }}" --json || true
