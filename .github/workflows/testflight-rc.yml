name: UrTruck QA2 TestFlight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD_QA2_TESTFLIGHT
        required: true
        type: string
      source_sha:
        description: Exact 40-character head SHA of PR 602 with all required checks green
        required: true
        type: string
      last_verified_ios_build:
        description: Latest iOS build verified in App Store Connect before this run
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: urtruck-qa2-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 180
    # QA2 deployment-branch protection gates this internal TestFlight candidate.
    environment: qa2
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      QA2_API_URL: ${{ secrets.QA2_API_URL }}
      EXPO_PUBLIC_API_URL: ${{ secrets.QA2_API_URL }}
      URTRUCK_BUILD_FLAVOR: qa2
      URTRUCK_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPO_PUBLIC_EXTERNAL_FREIGHT_FEED_ENABLED: 'true'
      URTRUCK_VERSION_NAME: 1.0.12
      URTRUCK_MIN_IOS_BUILD: ${{ inputs.last_verified_ios_build }}
      EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
      EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
      YANDEX_ROUTER_API_KEY: ${{ secrets.YANDEX_ROUTER_API_KEY }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}

    steps:
      - name: Checkout exact QA2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify protected QA2 TestFlight intent
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = qa2/integration-candidate
          test "$CONFIRMATION" = BUILD_QA2_TESTFLIGHT
          [[ "$QA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test "$GITHUB_SHA" = "$QA_SOURCE_SHA"
          test "$GITHUB_REPOSITORY" = 777ubu-ai/urtruck-app
          [[ "$URTRUCK_MIN_IOS_BUILD" =~ ^[1-9][0-9]{0,8}$ ]]
          test "$URTRUCK_MIN_IOS_BUILD" -ge 111
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/602")"
          test "$(jq -r '.head.repo.full_name' <<<"$PR_JSON")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.base.ref' <<<"$PR_JSON")" = qa2/integration-candidate
          test "$(jq -r '.state' <<<"$PR_JSON")" = closed
          test "$(jq -r '.merged' <<<"$PR_JSON")" = true
          test "$(jq -r '.merge_commit_sha' <<<"$PR_JSON")" = "$QA_SOURCE_SHA"
          PR_HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          PR_AUTHOR="$(jq -r '.user.login' <<<"$PR_JSON")"
          git fetch origin "$PR_HEAD_SHA" --depth=1
          git diff --quiet "$PR_HEAD_SHA" "$QA_SOURCE_SHA" -- || {
            echo '::error::Merged candidate tree differs from the reviewed PR head'
            exit 1
          }
          REVIEWS_JSON="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/602/reviews?per_page=100" | jq -s 'add')"
          APPROVED="$(jq --arg sha "$PR_HEAD_SHA" --arg author "$PR_AUTHOR" \
            '[.[] | select(.commit_id == $sha and .user.login != $author) | {login: .user.login, state: .state, submitted_at: (.submitted_at // "")}]
             | sort_by(.submitted_at) | group_by(.login) | map(last) | any(.state == "APPROVED")' <<<"$REVIEWS_JSON")"
          test "$APPROVED" = true || { echo '::error::Current independent approval of the exact PR head is required'; exit 1; }
          CHECKS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs?per_page=100")"
          for CHECK_NAME in \
            'quality-gate / Backend tests' \
            'quality-gate / Frontend tests, lint, and build' \
            'quality-gate / Mandatory web E2E subset'; do
            CHECK_CONCLUSION="$(printf '%s' "$CHECKS_JSON" | jq -r --arg name "$CHECK_NAME" '[.check_runs[] | select(.name == $name)] | sort_by(.id) | last | .conclusion // "missing"')"
            test "$CHECK_CONCLUSION" = success || {
              echo "::error::Required check '$CHECK_NAME' is '$CHECK_CONCLUSION' for $QA_SOURCE_SHA"
              exit 1
            }
          done
          test -n "${EXPO_TOKEN:-}"
          test -n "${EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY:-}"
          test -n "${EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY:-}"
          test -n "${QA2_API_URL:-}"
          QA_HOST="$(python3 - <<'PY'
          from urllib.parse import urlparse
          import os
          print(urlparse(os.environ['QA2_API_URL']).hostname or '')
          PY
          )"
          test "$QA_HOST" = qa2.urtruck.kz || {
            echo "::error::QA2 TestFlight must target exactly qa2.urtruck.kz"
            exit 1
          }
          test "${QA2_API_URL%/}" != https://urtruck.kz
          curl -fsS --max-time 20 "${QA2_API_URL%/}/health" >/dev/null
          echo "SOURCE_SHA=$QA_SOURCE_SHA"
          echo "QA2_API_HOST=$QA_HOST"
          npx eas-cli@latest whoami

      - name: Install dependencies
        run: npm ci

      - name: Prepare runner-only candidate version without native regeneration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_store_candidate_version.py --platform ios \
            --version "$URTRUCK_VERSION_NAME" --source-sha "$QA_SOURCE_SHA"

      - name: Verify resolved Expo QA2 configuration
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public --json > "$RUNNER_TEMP/expo-public.json"
          node - "$RUNNER_TEMP/expo-public.json" "$QA2_API_URL" <<'NODE'
          const fs = require('fs');
          const [configPath, expectedApi] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          if (config.ios?.bundleIdentifier !== 'com.urtruck.app') {
            throw new Error(`Unexpected iOS bundle: ${config.ios?.bundleIdentifier}`);
          }
          if (config.version !== process.env.URTRUCK_VERSION_NAME) {
            throw new Error(`Unexpected version: ${config.version}`);
          }
          if (config.extra?.urtruckBuildFlavor !== 'qa2') {
            throw new Error(`Unexpected build flavor: ${config.extra?.urtruckBuildFlavor}`);
          }
          if ((config.extra?.urtruckApiUrl || '').replace(/\/+$/, '') !== expectedApi.replace(/\/+$/, '')) {
            throw new Error('Resolved Expo config does not contain the exact QA2 API URL');
          }
          if (config.extra?.urtruckSourceSha !== process.env.QA_SOURCE_SHA || config.extra?.urtruckExternalFreightFeedEnabled !== true) throw new Error('Source/feed identity missing');
          console.log('QA2_EXPO_CONFIG=pass');
          NODE

      - name: Inject QA2 runtime configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build.production.env = {
            ...(eas.build.production.env || {}),
            URTRUCK_BUILD_FLAVOR: process.env.URTRUCK_BUILD_FLAVOR,
            URTRUCK_VERSION_NAME: process.env.URTRUCK_VERSION_NAME,
            URTRUCK_SOURCE_SHA: process.env.QA_SOURCE_SHA,
            EXPO_PUBLIC_EXTERNAL_FREIGHT_FEED_ENABLED: 'true',
            EXPO_PUBLIC_API_URL: process.env.QA2_API_URL,
            EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: process.env.EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY,
            EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: process.env.EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY
          };
          if (process.env.YANDEX_ROUTER_API_KEY) {
            eas.build.production.env.YANDEX_ROUTER_API_KEY = process.env.YANDEX_ROUTER_API_KEY;
          }
          if (process.env.OPENROUTESERVICE_API_KEY) {
            eas.build.production.env.OPENROUTESERVICE_API_KEY = process.env.OPENROUTESERVICE_API_KEY;
          }
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          NODE

      - name: Read remote iOS build counter before incrementing
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build:version:get --platform ios --profile production --json --non-interactive > "$RUNNER_TEMP/eas-ios-version.json"
          remote_build="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).buildNumber || ''" "$RUNNER_TEMP/eas-ios-version.json")"
          [[ "$remote_build" =~ ^[1-9][0-9]{0,8}$ ]]
          test "$remote_build" -ge "$URTRUCK_MIN_IOS_BUILD" || { echo '::error::EAS counter is behind verified ASC maximum; synchronize before building'; exit 1; }
          echo "URTRUCK_EAS_IOS_BUILD_BEFORE=$remote_build" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build signed QA2 IPA locally
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/UrTruck-QA2.ipa"
          test -s "$RUNNER_TEMP/UrTruck-QA2.ipa"
          shasum -a 256 "$RUNNER_TEMP/UrTruck-QA2.ipa" | tee "$RUNNER_TEMP/UrTruck-QA2.ipa.sha256"

      - name: Verify signed QA2 IPA identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-unpacked"
          unzip -q "$RUNNER_TEMP/UrTruck-QA2.ipa" -d "$RUNNER_TEMP/ipa-unpacked"
          APP_DIR="$(find "$RUNNER_TEMP/ipa-unpacked/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_DIR"
          INFO="$APP_DIR/Info.plist"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$INFO")"
          VERSION_NAME="$(plutil -extract CFBundleShortVersionString raw -o - "$INFO")"
          BUILD_NUMBER="$(plutil -extract CFBundleVersion raw -o - "$INFO")"
          test "$BUNDLE_ID" = com.urtruck.app
          test "$VERSION_NAME" = "$URTRUCK_VERSION_NAME"
          case "$BUILD_NUMBER" in (*[!0-9]*|'') echo "::error::Non-numeric iOS build number"; exit 1;; esac
          test "$BUILD_NUMBER" -gt "$URTRUCK_MIN_IOS_BUILD"
          test "$BUILD_NUMBER" -gt "$URTRUCK_EAS_IOS_BUILD_BEFORE"
          codesign --verify --deep --strict "$APP_DIR"
          codesign -d --entitlements :- "$APP_DIR" > "$RUNNER_TEMP/qa2-entitlements.plist" 2>/dev/null
          python3 - "$APP_DIR" "$RUNNER_TEMP/qa2-entitlements.plist" <<'PYVERIFY'
          import json, os, plistlib, sys
          from pathlib import Path
          app = Path(sys.argv[1])
          config = json.loads((app/'EXConstants.bundle/app.config').read_text())
          extra = config['extra']
          assert extra['urtruckApiUrl'].rstrip('/') == 'https://qa2.urtruck.kz'
          assert extra['urtruckBuildFlavor'] == 'qa2'
          assert extra['urtruckSourceSha'] == os.environ['QA_SOURCE_SHA']
          assert extra['urtruckExternalFreightFeedEnabled'] is True
          entitlements = plistlib.loads(Path(sys.argv[2]).read_bytes())
          assert entitlements['aps-environment'] == 'production'
          assert entitlements['application-identifier'].endswith('.com.urtruck.app')
          info = plistlib.loads((app/'Info.plist').read_bytes())
          assert 'NSLocationAlwaysAndWhenInUseUsageDescription' not in info
          assert 'location' not in info.get('UIBackgroundModes', [])
          PYVERIFY
          grep -R -a -F -q "${QA2_API_URL%/}" "$APP_DIR"
          {
            echo "sourceSHA=$QA_SOURCE_SHA"
            echo "bundleIdentifier=$BUNDLE_ID"
            echo "versionName=$VERSION_NAME"
            echo "buildNumber=$BUILD_NUMBER"
            echo "apiHost=qa2.urtruck.kz"
            echo "ipaSHA256=$(shasum -a 256 "$RUNNER_TEMP/UrTruck-QA2.ipa" | awk '{print $1}')"
          } | tee "$RUNNER_TEMP/UrTruck-QA2-manifest.txt"

      - name: Upload private QA2 IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-QA2-TestFlight-IPA
          path: |
            ${{ runner.temp }}/UrTruck-QA2.ipa
            ${{ runner.temp }}/UrTruck-QA2.ipa.sha256
            ${{ runner.temp }}/UrTruck-QA2-manifest.txt
          retention-days: 14

      - name: Submit QA2 IPA to TestFlight
        shell: bash
        run: npx eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/UrTruck-QA2.ipa" --non-interactive --wait
