name: UrTruck TestFlight RC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/testflight-rc.yml

permissions:
  contents: read

concurrency:
  group: urtruck-testflight-rc
  cancel-in-progress: false

jobs:
  build-and-upload-testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release branch and Expo auth
        shell: bash
        run: |
          set -euo pipefail
          echo "SHA=$(git rev-parse HEAD)"
          test "${GITHUB_REF_NAME}" = "main"
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami

      - name: Show recent iOS EAS builds
        run: npx eas-cli@latest build:list --platform ios --limit 10 --non-interactive

      - name: Build production iOS RC in EAS
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform ios --profile production --non-interactive --wait --json > eas-build.json
          cat eas-build.json
          BUILD_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eas-build.json','utf8'))[0].id)")
          BUILD_COMMIT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eas-build.json','utf8'))[0].gitCommitHash)")
          HEAD_SHA=$(git rev-parse HEAD)
          echo "EAS build id:            $BUILD_ID"
          echo "EAS build gitCommitHash: $BUILD_COMMIT"
          echo "Checked-out HEAD:        $HEAD_SHA"
          if [ "$BUILD_COMMIT" != "$HEAD_SHA" ]; then
            echo "::error::EAS build gitCommitHash ($BUILD_COMMIT) does not match the checked-out release-branch HEAD ($HEAD_SHA) — refusing to submit an unverified build to TestFlight."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Upload the exact verified build to TestFlight only
        id: submit
        shell: bash
        run: |
          set -o pipefail
          set +e
          npx eas-cli@latest submit --platform ios --profile production --id "${{ steps.build.outputs.build_id }}" --non-interactive --wait 2>&1 | tee submit.log
          SUBMIT_EXIT=${PIPESTATUS[0]}
          set -e
          SUBMISSION_ID=$(grep -oE 'submissions/[a-f0-9-]+' submit.log | head -1 | cut -d/ -f2 || true)
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          exit "$SUBMIT_EXIT"

      - name: Show exact Apple/EAS submission error on failure
        if: failure() && steps.submit.outputs.submission_id != ''
        run: npx eas-cli@latest submission:view "${{ steps.submit.outputs.submission_id }}" --json || true
