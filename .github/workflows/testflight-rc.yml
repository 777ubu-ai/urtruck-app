name: UrTruck QA2 TestFlight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD_QA2_TESTFLIGHT
        required: true
        type: string
      source_sha:
        description: Exact 40-character head SHA of the selected QA2 candidate
        required: true
        type: string
      candidate_pr:
        description: Reviewed QA2 pull request
        type: choice
        default: '561'
        options: ['561', '728']
      qa2_version:
        description: App Store Connect version for PR 728
        type: string
        required: false
      qa2_build_number:
        description: Unused build number confirmed in App Store Connect for PR 728
        type: string
        required: false

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: urtruck-qa2-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 180
    # Reviewer-gated environment protects credentials and the private TestFlight upload.
    # The built app still targets QA2; this is not a production backend deploy.
    environment: production
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      QA2_API_URL: ${{ secrets.QA2_API_URL }}
      EXPO_PUBLIC_API_URL: ${{ secrets.QA2_API_URL }}
      URTRUCK_BUILD_FLAVOR: qa2
      URTRUCK_VERSION_NAME: 1.0.9
      URTRUCK_MIN_IOS_BUILD: 99

    steps:
      - name: Checkout exact QA2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify protected QA2 TestFlight intent
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          QA_CANDIDATE_PR: ${{ inputs.candidate_pr }}
          QA_RELEASE_VERSION: ${{ inputs.qa2_version }}
          QA_RELEASE_BUILD: ${{ inputs.qa2_build_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = main
          test "$CONFIRMATION" = BUILD_QA2_TESTFLIGHT
          [[ "$QA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Некорректный SHA кандидата'; exit 1; }
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          candidate_pr="${QA_CANDIDATE_PR:-561}"
          case "$candidate_pr" in
            561) ;;
            728)
              test "$QA_SOURCE_SHA" = fa1dcb1d76c55db72e0ec0b7cf93b68e25b524ef
              [[ "$QA_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
              [[ "$QA_RELEASE_BUILD" =~ ^[123456789][0123456789]{0,8}$ ]] || {
                echo '::error::Build number must be a positive integer'
                exit 1
              }
              printf 'URTRUCK_VERSION_NAME=%s\nURTRUCK_LOCAL_IOS_BUILD=%s\n' \
                "$QA_RELEASE_VERSION" "$QA_RELEASE_BUILD" >> "$GITHUB_ENV"
              ;;
            *) exit 1 ;;
          esac
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$candidate_pr" --jq '.state')" = open
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$candidate_pr" --jq '.head.sha')" = "$QA_SOURCE_SHA"
          CHECKS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/commits/$QA_SOURCE_SHA/check-runs?per_page=100")"
          for CHECK_NAME in \
            'quality-gate / Backend tests' \
            'quality-gate / Frontend tests, lint, and build' \
            'quality-gate / Mandatory web E2E subset'; do
            CHECK_CONCLUSION="$(printf '%s' "$CHECKS_JSON" | jq -r --arg name "$CHECK_NAME" '[.check_runs[] | select(.name == $name)] | last | .conclusion // "missing"')"
            test "$CHECK_CONCLUSION" = success || {
              echo "::error::Required check '$CHECK_NAME' is '$CHECK_CONCLUSION' for $QA_SOURCE_SHA"
              exit 1
            }
          done
          test -n "${QA2_API_URL:-}"
          QA_HOST="$(python3 - <<'PY'
          from urllib.parse import urlparse
          import os
          print(urlparse(os.environ['QA2_API_URL']).hostname or '')
          PY
          )"
          test "$QA_HOST" = qa2.urtruck.kz || {
            echo "::error::QA2 TestFlight must target exactly qa2.urtruck.kz"
            exit 1
          }
          test "${QA2_API_URL%/}" != https://urtruck.kz
          curl -fsS --max-time 20 "${QA2_API_URL%/}/health" >/dev/null
          echo "SOURCE_SHA=$QA_SOURCE_SHA"
          echo "QA2_API_HOST=$QA_HOST"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply reviewed native dependency patches
        run: |
          set -euo pipefail
          test -s patches/react-native-yamap+4.8.3.patch
          ./node_modules/.bin/patch-package --error-on-fail

      - name: Verify TestFlight account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
          EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          test -n "${EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY:-}"
          test -n "${EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY:-}"
          npx eas-cli@latest whoami

      - name: Prepare approved version in the runner checkout
        if: inputs.candidate_pr == '728'
        shell: bash
        run: |
          python3 - <<'PYVERSION'
          import json, os, plistlib, re
          from pathlib import Path
          version = os.environ['URTRUCK_VERSION_NAME']
          build = os.environ['URTRUCK_LOCAL_IOS_BUILD']
          app = Path('app.json')
          config = json.loads(app.read_text())
          config['expo']['ios']['buildNumber'] = build
          config['expo'].setdefault('extra', {})['urtruckSourceSha'] = os.environ['QA_SOURCE_SHA']
          app.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')
          plist = Path('ios/UrTruck/Info.plist')
          info = plistlib.loads(plist.read_bytes())
          info.update(CFBundleShortVersionString=version, CFBundleVersion=build)
          plist.write_bytes(plistlib.dumps(info, sort_keys=False))
          project = Path('ios/UrTruck.xcodeproj/project.pbxproj')
          source = project.read_text()
          for key, value in [('MARKETING_VERSION', version), ('CURRENT_PROJECT_VERSION', build)]:
              source, count = re.subn(rf'\b{key} = [0-9.]+;', f'{key} = {value};', source)
              if count != 2:
                  raise SystemExit(f'Unexpected {key} occurrences: {count}')
          project.write_text(source)
          PYVERSION

      - name: Verify resolved Expo QA2 configuration
        env:
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
          EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public --json > "$RUNNER_TEMP/expo-public.json"
          node - "$RUNNER_TEMP/expo-public.json" "$QA2_API_URL" <<'NODE'
          const fs = require('fs');
          const [configPath, expectedApi] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          if (config.ios?.bundleIdentifier !== 'com.urtruck.app') {
            throw new Error(`Unexpected iOS bundle: ${config.ios?.bundleIdentifier}`);
          }
          if (config.version !== process.env.URTRUCK_VERSION_NAME ||
              (process.env.URTRUCK_LOCAL_IOS_BUILD && config.ios?.buildNumber !== process.env.URTRUCK_LOCAL_IOS_BUILD)) {
            throw new Error(`Unexpected version: ${config.version}`);
          }
          if (config.extra?.urtruckBuildFlavor !== 'qa2') {
            throw new Error(`Unexpected build flavor: ${config.extra?.urtruckBuildFlavor}`);
          }
          if ((config.extra?.urtruckApiUrl || '').replace(/\/+$/, '') !== expectedApi.replace(/\/+$/, '')) {
            throw new Error('Resolved Expo config does not contain the exact QA2 API URL');
          }
          if (process.env.URTRUCK_LOCAL_IOS_BUILD && config.extra?.urtruckSourceSha !== process.env.QA_SOURCE_SHA) {
            throw new Error('Missing source SHA in the QA2 app configuration');
          }
          console.log('QA2_EXPO_CONFIG=pass');
          NODE

      - name: Inject QA2 runtime configuration
        env:
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
          EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
          YANDEX_ROUTER_API_KEY: ${{ secrets.YANDEX_ROUTER_API_KEY }}
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          if (process.env.URTRUCK_LOCAL_IOS_BUILD) {
            eas.cli.appVersionSource = 'local';
            eas.build.production.ios.autoIncrement = false;
            eas.build.production.env = { ...(eas.build.production.env || {}), EXPO_PUBLIC_EXTERNAL_FREIGHT_FEED_ENABLED: 'true' };
          }
          eas.build.production.env = {
            ...(eas.build.production.env || {}),
            URTRUCK_BUILD_FLAVOR: process.env.URTRUCK_BUILD_FLAVOR,
            URTRUCK_VERSION_NAME: process.env.URTRUCK_VERSION_NAME,
            EXPO_PUBLIC_API_URL: process.env.QA2_API_URL,
            EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: process.env.EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY,
            EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: process.env.EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY
          };
          if (process.env.YANDEX_ROUTER_API_KEY) {
            eas.build.production.env.YANDEX_ROUTER_API_KEY = process.env.YANDEX_ROUTER_API_KEY;
          }
          if (process.env.OPENROUTESERVICE_API_KEY) {
            eas.build.production.env.OPENROUTESERVICE_API_KEY = process.env.OPENROUTESERVICE_API_KEY;
          }
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          NODE

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build signed QA2 IPA locally
        env:
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
          EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
          YANDEX_ROUTER_API_KEY: ${{ secrets.YANDEX_ROUTER_API_KEY }}
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/UrTruck-QA2.ipa"
          test -s "$RUNNER_TEMP/UrTruck-QA2.ipa"
          shasum -a 256 "$RUNNER_TEMP/UrTruck-QA2.ipa" | tee "$RUNNER_TEMP/UrTruck-QA2.ipa.sha256"

      - name: Verify signed QA2 IPA identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-unpacked"
          unzip -q "$RUNNER_TEMP/UrTruck-QA2.ipa" -d "$RUNNER_TEMP/ipa-unpacked"
          APP_DIR="$(find "$RUNNER_TEMP/ipa-unpacked/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_DIR"
          INFO="$APP_DIR/Info.plist"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$INFO")"
          VERSION_NAME="$(plutil -extract CFBundleShortVersionString raw -o - "$INFO")"
          BUILD_NUMBER="$(plutil -extract CFBundleVersion raw -o - "$INFO")"
          test "$BUNDLE_ID" = com.urtruck.app
          test "$VERSION_NAME" = "$URTRUCK_VERSION_NAME"
          case "$BUILD_NUMBER" in (*[!0-9]*|'') echo "::error::Non-numeric iOS build number"; exit 1;; esac
          if [[ -n "${URTRUCK_LOCAL_IOS_BUILD:-}" ]]; then
            test "$BUILD_NUMBER" = "$URTRUCK_LOCAL_IOS_BUILD"
            grep -a -F -q "$QA_SOURCE_SHA" "$APP_DIR/EXConstants.bundle/app.config"
          else
            test "$BUILD_NUMBER" -gt "$URTRUCK_MIN_IOS_BUILD"
          fi
          grep -R -a -F -q "${QA2_API_URL%/}" "$APP_DIR"
          {
            echo "sourceSHA=$QA_SOURCE_SHA"
            echo "bundleIdentifier=$BUNDLE_ID"
            echo "versionName=$VERSION_NAME"
            echo "buildNumber=$BUILD_NUMBER"
            echo "apiHost=qa2.urtruck.kz"
            echo "ipaSHA256=$(shasum -a 256 "$RUNNER_TEMP/UrTruck-QA2.ipa" | awk '{print $1}')"
          } | tee "$RUNNER_TEMP/UrTruck-QA2-manifest.txt"

      - name: Upload private QA2 IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-QA2-TestFlight-IPA
          path: |
            ${{ runner.temp }}/UrTruck-QA2.ipa
            ${{ runner.temp }}/UrTruck-QA2.ipa.sha256
            ${{ runner.temp }}/UrTruck-QA2-manifest.txt
          retention-days: 14

      - name: Submit QA2 IPA to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: npx eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/UrTruck-QA2.ipa" --non-interactive --wait
