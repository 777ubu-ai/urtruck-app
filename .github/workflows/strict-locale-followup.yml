name: Strict Locale Followup

on:
  push:
    branches: [fix/strict-locale-no-russian-20260820]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: strict-locale-followup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-locale-no-russian-20260820
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded follow-up
        run: python3 scripts/strict_locale_followup.py

      - name: Install dependencies
        run: npm ci

      - name: Strict locale regressions
        run: |
          node --experimental-loader ./tests/frontend/loader.mjs --test tests/frontend/test_strict_locale_owned_content.mjs
          node qa/utils/i18nSmoke.js
          node qa/utils/zhLocalizationSmoke.js

      - name: Production web build
        run: npm run build:web

      - name: Commit clean follow-up only
        env:
          BRANCH: fix/strict-locale-no-russian-20260820
        run: |
          set -euo pipefail
          rm -f scripts/strict_locale_followup.py .github/workflows/strict-locale-followup.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(i18n): close dynamic locale fallback gaps'
          git push origin "HEAD:${BRANCH}"
