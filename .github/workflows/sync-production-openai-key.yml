name: Обновить production OpenAI ключ

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    uses: 777ubu-ai/urtruck-app/.github/workflows/quality-gate-reusable.yml@main
    with:
      source_ref: ${{ github.sha }}
  sync:
    needs: [quality-gate]
    uses: 777ubu-ai/urtruck-app/.github/workflows/production-deploy-execute.yml@main
    with:
      deploy_sha: ${{ github.sha }}
      operation: sync_openai_key
    secrets:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
