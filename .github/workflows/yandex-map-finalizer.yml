name: UrTruck Yandex Map Finalizer

on:
  # Secure Production Deploy is the only production writer. This workflow is
  # verification-only: it must never mutate already deployed HTML.
  workflow_run:
    workflows: ["UrTruck Secure Production Deploy"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: urtruck-yandex-map-finalizer
  cancel-in-progress: false

jobs:
  verify-yandex-map:
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://urtruck.kz' }}

    steps:
      - name: Verify exact production commit and Yandex JS API 2.1
        run: |
          set -euo pipefail
          info="$(curl -fsS --connect-timeout 5 --max-time 15 "$PUBLIC_BASE_URL/build-info.json?yandex-final=${GITHUB_RUN_ID}")"
          printf '%s\n' "$info" | grep -Fq "\"commit\":\"$DEPLOY_SHA\""

          body="$(curl -fsS --connect-timeout 5 --max-time 15 "$PUBLIC_BASE_URL/?yandex-final=${GITHUB_RUN_ID}")"
          printf '%s\n' "$body" | grep -q 'api-maps.yandex.ru/2.1/'
          printf '%s\n' "$body" | grep -q 'lang=ru_RU'
          if printf '%s\n' "$body" | grep -q 'api-maps.yandex.ru/v3/'; then
            echo '::error::Legacy Yandex JS API v3 injection detected in production'
            exit 1
          fi
          echo "YANDEX_FINALIZER=verified-only sha=${DEPLOY_SHA::7} api=2.1"
