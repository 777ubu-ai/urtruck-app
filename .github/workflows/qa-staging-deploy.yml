name: Deploy QA2 Backend Golden Source

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_QA2 to deploy only the isolated QA backend
        required: true
        type: string
      enable_external_freight_feed:
        description: Enable the reviewed external feed only in QA2
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      confirmation:
        description: Explicit QA-only deploy confirmation
        required: true
        type: string
      enable_external_freight_feed:
        description: Enable the reviewed external feed only in QA2
        required: false
        type: boolean
        default: false
    secrets:
      QA2_API_URL:
        required: true
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SERVER_PASS:
        required: true

concurrency:
  group: urtruck-qa2-backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The manually selected workflow ref is the only backend source deployed to QA2.
  # Keeping this dynamic prevents a new QA APK from silently testing an older server.
  QA_SOURCE_SHA: ${{ github.sha }}

jobs:
  environment-contract:
    uses: ./.github/workflows/qa-environment-contract.yml
    secrets:
      API_URL: ${{ secrets.QA2_API_URL }}

  staging-preflight:
    uses: ./.github/workflows/qa-staging-preflight.yml
    secrets:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASS: ${{ secrets.SERVER_PASS }}

  deploy:
    name: Backup and deploy exact source to QA2 only
    needs: [environment-contract, staging-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: qa2
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASS: ${{ secrets.SERVER_PASS }}
      QA_API_URL: ${{ secrets.QA2_API_URL }}
    steps:
      - name: Require explicit QA-only confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY_QA2" || {
            echo "::error::QA-only deploy confirmation mismatch"
            exit 1
          }

      - name: Checkout exact Golden backend source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          path: golden-source

      - name: Verify exact source and QA2P regression file
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git -C golden-source rev-parse HEAD)"
          test "$resolved" = "$QA_SOURCE_SHA"
          test -f golden-source/backend/tests/test_qa_data_isolation.py
          test -f golden-source/backend/database/vehicles_dal.py
          grep -Fq 'QA2P_' golden-source/backend/tests/test_qa_data_isolation.py
          echo "QA_DEPLOY_SOURCE_SHA=$resolved"

      - name: Install SSH and rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Verify existing QA2 secret and local NLLB policy before mutation
        if: ${{ !inputs.enable_external_freight_feed }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          qa_env=/home/ubuntu/urtruck-qa2/.env
          test -f "$qa_env" || { echo '::error::QA2_LOCAL_AI_ENV_MISSING'; exit 1; }
          python3 - "$qa_env" <<'PY'
          from pathlib import Path
          import sys
          values = {}
          for raw in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              if '=' in raw and not raw.lstrip().startswith('#'):
                  key, value = raw.split('=', 1)
                  values[key.strip()] = value.strip().strip('"').strip("'")
          if values.get('TRANSLATE_PROVIDER') != 'local_ai':
              raise SystemExit('QA2_LOCAL_NLLB_POLICY_BLOCKED_BEFORE_MUTATION')
          if values.get('LOCAL_AI_URL') != 'http://127.0.0.1:8003':
              raise SystemExit('QA2_LOCAL_AI_URL_POLICY_BLOCKED_BEFORE_MUTATION')
          if not values.get('OPENAI_API_KEY'):
              raise SystemExit('QA2_OPENAI_STT_SECRET_MISSING')
          print('QA2_OPENAI_STT_SECRET_PRESENT=yes')
          PY
          REMOTE

      - name: Fingerprint production before QA deploy
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://urtruck.kz/api/version)"
          test -n "$body"
          hash="$(printf '%s' "$body" | sha256sum | awk '{print $1}')"
          echo "PROD_VERSION_HASH_BEFORE=$hash" >> "$GITHUB_ENV"
          echo "PRODUCTION_BEFORE=healthy-fingerprinted"

      - name: Record QA state and create code-only rollback backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SERVER_PASS"
          export SSHPASS="$SERVER_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          qa_root=/home/ubuntu/urtruck-qa2
          qa_backend="$qa_root/backend"
          state=/tmp/urtruck-qa2-deploy.state
          test "$(id -u)" -ne 0
          test -d "$qa_backend" && test -f "$qa_root/.env" && test -d "$qa_root/storage"
          command -v rsync >/dev/null
          db_path="$(python3 - "$qa_root" "$qa_root/.env" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1]).resolve()
          values = {}
          for raw in Path(sys.argv[2]).read_text(encoding='utf-8').splitlines():
              if '=' in raw and not raw.lstrip().startswith('#'):
                  key, value = raw.split('=', 1)
                  values[key.strip()] = value.strip().strip('"').strip("'")
          db = values.get('DB_PATH') or values.get('URTRUCK_DB_PATH') or ''
          if db.startswith('sqlite:///'): db = db[len('sqlite:///'):]
          p = Path(db)
          if not p.is_absolute(): p = root / p
          p = p.resolve()
          if root not in p.parents or 'urtruck-security' in str(p) or not p.is_file():
              raise SystemExit(2)
          print(p)
          PY
          )"
          db_path_hash="$(printf '%s' "$db_path" | sha256sum | awk '{print $1}')"
          db_inode="$(stat -c '%d:%i' "$db_path")"
          storage_inode="$(stat -c '%d:%i' "$qa_root/storage")"
          pre_source=unknown
          if test -f "$qa_backend/.qa-source-sha"; then
            pre_source="$(tr -d '\r\n ' < "$qa_backend/.qa-source-sha")"
          elif git -C "$qa_root" rev-parse HEAD >/dev/null 2>&1; then
            pre_source="$(git -C "$qa_root" rev-parse HEAD)"
          elif git -C "$qa_backend" rev-parse HEAD >/dev/null 2>&1; then
            pre_source="$(git -C "$qa_backend" rev-parse HEAD)"
          fi
          case "$pre_source" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) pre_source=unknown ;;
          esac
          pre_hash="$(cd "$qa_backend" && find . -type f ! -path './venv/*' ! -path './storage/*' ! -path './backups/*' ! -path './__pycache__/*' ! -name '.env' ! -name '*.db' ! -name '*.sqlite*' ! -name '*.log' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          # До изменения кода и .env сохраняем реального владельца listener.
          pid="$(ss -ltnpH 'sport = :8002' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)"
          test -n "$pid"
          test "$(ps -o user= -p "$pid" | xargs)" = "$(id -un)"
          test "$(readlink -f "/proc/$pid/cwd")" = "$(readlink -f "$qa_backend")"
          restart_mode=direct
          if grep -q '/urtruck-qa2.service$' "/proc/$pid/cgroup"; then
            if grep -q '/user.slice/' "/proc/$pid/cgroup"; then
              restart_mode=user
              export XDG_RUNTIME_DIR="/run/user/$(id -u)"
              test "$(systemctl --user show urtruck-qa2.service -p MainPID --value)" = "$pid"
            else
              restart_mode=system
              test "$(systemctl show urtruck-qa2.service -p MainPID --value)" = "$pid"
              for action in stop start; do sudo -n -l /usr/bin/systemctl "$action" urtruck-qa2.service >/dev/null; done
            fi
          else
            # PM2/неизвестный supervisor не заменяется процессом nohup.
            test "$(ps -o ppid= -p "$pid" | xargs)" = 1 || { echo '::error::QA2_RESTART_SUPERVISOR_UNSUPPORTED'; exit 1; }
            ! grep -Eq '/[^/]+\.service$' "/proc/$pid/cgroup" || { echo '::error::QA2_RESTART_UNIT_UNSUPPORTED'; exit 1; }
          fi
          echo "QA2_RESTART_MODE=$restart_mode"
          # QA2 snapshots contain user data; restrict the directory and file at creation.
          umask 077
          backup_id="backend-code-$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir="$qa_root/backups/$backup_id"
          mkdir -p "$backup_dir"
          cp -- "$qa_root/.env" "$backup_dir/qa2.env"
          test -f "$qa_backend/.env"
          cp -- "$qa_backend/.env" "$backup_dir/backend-env.snapshot"
          chmod 600 "$backup_dir/backend-env.snapshot"
          chmod 600 "$backup_dir/qa2.env"
          db_backup="$backup_dir/qa2.sqlite3"
          python3 - "$db_path" "$db_backup" "$qa_root/.env" "$qa_backend/.env" "$backup_dir" <<'PY'
          from pathlib import Path
          import hashlib, json, os, sqlite3, sys

          source_path = Path(sys.argv[1]).resolve()
          backup_path = Path(sys.argv[2]).resolve()
          source = sqlite3.connect(source_path.as_uri() + '?mode=ro', uri=True, timeout=15)
          target = sqlite3.connect(backup_path)
          try:
              source.backup(target)
          finally:
              target.close()
              source.close()
          os.chmod(backup_path, 0o600)
          with sqlite3.connect(backup_path) as backup:
              if backup.execute('PRAGMA integrity_check').fetchone() != ('ok',):
                  raise SystemExit('QA_DB_BACKUP_INTEGRITY_FAILED')
          restore_probe = backup_path.with_name('restore-probe.sqlite3')
          origin = sqlite3.connect(backup_path.as_uri() + '?mode=ro', uri=True, timeout=15)
          target = sqlite3.connect(restore_probe)
          try:
              origin.backup(target)
              if target.execute('PRAGMA integrity_check').fetchone() != ('ok',):
                  raise SystemExit('QA_DB_RESTORE_PROBE_FAILED')
          finally:
              target.close()
              origin.close()
          restore_probe.unlink()
          print('QA_DB_BACKUP=online-snapshot-verified')
          print('QA_DB_RESTORE_PROBE=pass')
          # Отдельная БД ленты не включается в snapshot основного продукта.
          qa_root = Path('/home/ubuntu/urtruck-qa2').resolve()
          values = {}
          for env_path in (Path(sys.argv[3]), Path(sys.argv[4])):
              if env_path.is_file():
                  for line in env_path.read_text(encoding='utf-8').splitlines():
                      if '=' in line and not line.lstrip().startswith('#'):
                          key, value = line.split('=', 1)
                          values[key.strip()] = value.strip().strip('"').strip("'")
          def configured_path(name, fallback):
              raw = values.get(name, '').strip()
              if raw.startswith('sqlite:///'):
                  raw = raw[len('sqlite:///'):]
              result = Path(raw).expanduser() if raw else Path(fallback)
              if not result.is_absolute():
                  result = qa_root / result
              return result.resolve()
          feed = configured_path('EXTERNAL_FREIGHT_DB_PATH', source_path.with_name('external-freight.sqlite3'))
          if qa_root not in feed.parents or feed == source_path or (feed.exists() and feed.samefile(source_path)):
              raise SystemExit('QA_EXTERNAL_FEED_DB_ISOLATION_FAILED')
          if feed.exists():
              feed_backup = backup_path.with_name('external-freight.sqlite3')
              source = sqlite3.connect(feed.as_uri() + '?mode=ro', uri=True, timeout=15)
              target = sqlite3.connect(feed_backup)
              try:
                  source.backup(target)
                  if target.execute('PRAGMA integrity_check').fetchone() != ('ok',):
                      raise SystemExit('QA_EXTERNAL_FEED_BACKUP_FAILED')
              finally:
                  source.close()
                  target.close()
              os.chmod(feed_backup, 0o600)
              print('QA_EXTERNAL_FEED_DB_BACKUP=verified')
          else:
              # Не потерять данные, если старый кандидат когда-либо использовал общую БД.
              with sqlite3.connect(source_path.as_uri() + '?mode=ro', uri=True) as primary:
                  legacy = primary.execute("SELECT name FROM sqlite_master WHERE type='table' AND name='external_freight_items'").fetchone()
                  if legacy and primary.execute('SELECT 1 FROM external_freight_items LIMIT 1').fetchone():
                      raise SystemExit('QA_EXTERNAL_FEED_LEGACY_MIGRATION_REQUIRED')
              print('QA_EXTERNAL_FEED_DB_BACKUP=not-yet-created')
          # Каталог контактов перевозчиков хранится в своей SQLite базе.
          # Снимок не печатает контакты: публикуются только counts и digest.
          carrier_db = configured_path('EXTERNAL_CARRIER_DIRECTORY_DB', feed.with_name('carrier-directory.sqlite3'))
          if qa_root not in carrier_db.parents or carrier_db == source_path or carrier_db == feed:
              raise SystemExit('QA_CARRIER_DIRECTORY_DB_ISOLATION_FAILED')
          if carrier_db.exists():
              if carrier_db.is_symlink() or not carrier_db.is_file():
                  raise SystemExit('QA_CARRIER_DIRECTORY_DB_NOT_REGULAR_FILE')
              carrier_backup = Path(sys.argv[5]).resolve() / 'carrier-directory.sqlite3'
              source = sqlite3.connect(carrier_db.as_uri() + '?mode=ro', uri=True, timeout=15)
              try:
                  source.execute('PRAGMA query_only=ON')
                  tables = {row[0] for row in source.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                  if 'carrier_directory' not in tables:
                      raise SystemExit('QA_CARRIER_DIRECTORY_TABLE_MISSING')
                  source_rows = source.execute('SELECT id,status,payload FROM carrier_directory ORDER BY id').fetchall()
                  source_fingerprint = hashlib.sha256(json.dumps(
                      [(row[0], row[1], hashlib.sha256(row[2].encode('utf-8')).hexdigest()) for row in source_rows],
                      ensure_ascii=False, separators=(',', ':')).encode('utf-8')).hexdigest()
                  active_count = source.execute("SELECT count(*) FROM carrier_directory WHERE status='active'").fetchone()[0]
                  integrity = source.execute('PRAGMA integrity_check').fetchone()[0]
                  if integrity != 'ok':
                      raise SystemExit('QA_CARRIER_DIRECTORY_SOURCE_INTEGRITY_FAILED')
                  target = sqlite3.connect(carrier_backup)
                  try:
                      source.backup(target)
                      if target.execute('PRAGMA integrity_check').fetchone() != ('ok',):
                          raise SystemExit('QA_CARRIER_DIRECTORY_BACKUP_INTEGRITY_FAILED')
                  finally:
                      target.close()
              finally:
                  source.close()
              os.chmod(carrier_backup, 0o600)
              restore_probe = carrier_backup.with_name('carrier-directory-restore-probe.sqlite3')
              origin = sqlite3.connect(carrier_backup.as_uri() + '?mode=ro', uri=True, timeout=15)
              target = sqlite3.connect(restore_probe)
              try:
                  origin.backup(target)
                  probe_rows = target.execute('SELECT id,status,payload FROM carrier_directory ORDER BY id').fetchall()
                  probe_fingerprint = hashlib.sha256(json.dumps(
                      [(row[0], row[1], hashlib.sha256(row[2].encode('utf-8')).hexdigest()) for row in probe_rows],
                      ensure_ascii=False, separators=(',', ':')).encode('utf-8')).hexdigest()
                  if target.execute('PRAGMA integrity_check').fetchone() != ('ok',) or probe_fingerprint != source_fingerprint:
                      raise SystemExit('QA_CARRIER_DIRECTORY_RESTORE_PROBE_FAILED')
              finally:
                  target.close()
                  origin.close()
              restore_probe.unlink()
              print('QA_CARRIER_DIRECTORY_BACKUP=online-snapshot-verified')
              print(f'QA_CARRIER_DIRECTORY_TOTAL={len(source_rows)}')
              print(f'QA_CARRIER_DIRECTORY_ACTIVE={active_count}')
              print(f'QA_CARRIER_DIRECTORY_RECORDS_SHA256={source_fingerprint}')
          else:
              print('QA_CARRIER_DIRECTORY_BACKUP=not-yet-created')
          PY
          test -s "$db_backup"
          db_backup_hash="$(sha256sum "$db_backup" | awk '{print $1}')"
          rsync -a \
            --exclude='venv/' --exclude='storage/' --exclude='backups/' \
            --exclude='.env' --exclude='qa2.env' --exclude='backend-env.snapshot' --exclude='*.db' --exclude='*.sqlite*' \
            --exclude='*.db-journal' --exclude='*.db-wal' --exclude='*.db-shm' \
            --exclude='__pycache__/' --exclude='*.pyc' --exclude='*.log' \
            "$qa_backend/" "$backup_dir/"
          test -n "$(find "$backup_dir" -type f -print -quit)"
          umask 077
          cat > "$state" <<STATE
          BACKUP_ID=$backup_id
          DB_PATH_HASH=$db_path_hash
          DB_INODE=$db_inode
          STORAGE_INODE=$storage_inode
          RESTART_MODE=$restart_mode
          PRE_SOURCE=$pre_source
          PRE_CODE_HASH=$pre_hash
          ENV_BACKUP=$backup_dir/qa2.env
          BACKEND_ENV_BACKUP=$backup_dir/backend-env.snapshot
          DB_BACKUP=$db_backup
          DB_BACKUP_HASH=$db_backup_hash
          STATE
          echo "QA_PREDEPLOY_SOURCE_SHA=$pre_source"
          echo "QA_PREDEPLOY_CODE_SHA256=$pre_hash"
          echo "QA_BACKUP_ID=$backup_id"
          echo "QA_BACKUP=code-only-ready"
          echo "QA_DB_BACKUP=online-snapshot-verified"
          echo "QA_DB_BACKUP_SHA256=$db_backup_hash"
          REMOTE

      - name: Enable external freight feed in isolated QA2 environment
        if: ${{ inputs.enable_external_freight_feed }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          qa_root=/home/ubuntu/urtruck-qa2
          qa_env="$qa_root/.env"
          test "$(readlink -f "$(dirname "$qa_env")")" = "$(readlink -f "$qa_root")"
          test -f /tmp/urtruck-qa2-deploy.state
          . /tmp/urtruck-qa2-deploy.state
          test -f "$ENV_BACKUP"
          python3 - "$qa_root" <<'PYFEED'
          from pathlib import Path
          import os, secrets, sys
          root = Path(sys.argv[1]).resolve()
          if root != Path('/home/ubuntu/urtruck-qa2'):
              raise SystemExit('QA2_EXTERNAL_FEED_ENV_PATH_INVALID')
          paths = {p.resolve() for p in (root / '.env', root / 'backend/.env')}
          plans, keys = [], set()
          for path in paths:
              if root not in path.parents or not path.is_file():
                  raise SystemExit('QA2_EXTERNAL_FEED_ENV_PATH_INVALID')
              lines = path.read_text(encoding='utf-8').splitlines()
              for line in lines:
                  if '=' in line and not line.lstrip().startswith('#'):
                      key, value = line.split('=', 1)
                      if key.strip() == 'EXTERNAL_FREIGHT_IMPORTER_KEY' and value.strip():
                          keys.add(value.strip())
              plans.append((path, lines))
          if len(keys) > 1:
              raise SystemExit('QA2_EXTERNAL_FEED_IMPORTER_KEYS_MISMATCH')
          updates = {'EXTERNAL_FREIGHT_FEED_ENABLED': 'true',
                     'EXTERNAL_FREIGHT_IMPORTER_KEY': next(iter(keys), None) or secrets.token_urlsafe(32)}
          for path, lines in plans:
              result, seen = [], set()
              for line in lines:
                  key = line.split('=', 1)[0].strip() if '=' in line and not line.lstrip().startswith('#') else None
                  if key in updates:
                      if key not in seen:
                          result.append(key + '=' + updates[key])
                          seen.add(key)
                  else:
                      result.append(line)
              result.extend(key + '=' + value for key, value in updates.items() if key not in seen)
              tmp = path.with_name(path.name + '.external-feed.tmp')
              fd = os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              try:
                  with os.fdopen(fd, 'w', encoding='utf-8') as stream:
                      stream.write('\n'.join(result) + '\n')
                  os.replace(tmp, path)
              finally:
                  tmp.unlink(missing_ok=True)
          print('QA2_EXTERNAL_FEED_FLAG=enabled')
          print('QA2_EXTERNAL_FEED_ENV=root-and-runtime')
          print('QA2_EXTERNAL_FEED_IMPORTER_KEY=configured-without-disclosure')
          PYFEED
          REMOTE

      - name: Mirror exact backend source into isolated QA2 backend
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASS"
          rsync -az --delete \
            --exclude='venv/' --exclude='storage/' --exclude='backups/' \
            --exclude='.env' --exclude='*.db' --exclude='*.sqlite*' \
            --exclude='*.db-journal' --exclude='*.db-wal' --exclude='*.db-shm' \
            --exclude='__pycache__/' --exclude='*.pyc' --exclude='*.log' \
            -e 'sshpass -e ssh -o StrictHostKeyChecking=no' \
            golden-source/backend/ "$SERVER_USER@$SERVER_HOST:/home/ubuntu/urtruck-qa2/backend/"

      - name: Configure the bounded QA2-only OpenAI STT route
        if: ${{ !inputs.enable_external_freight_feed }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          qa_env=/home/ubuntu/urtruck-qa2/.env
          python3 - "$qa_env" <<'PY'
          from pathlib import Path
          import os, sys
          path = Path(sys.argv[1])
          lines = path.read_text(encoding='utf-8').splitlines()
          values = {}
          for raw in lines:
              if '=' in raw and not raw.lstrip().startswith('#'):
                  key, value = raw.split('=', 1)
                  values[key.strip()] = value
          if not values.get('OPENAI_API_KEY', '').strip():
              raise SystemExit('QA2_OPENAI_STT_SECRET_MISSING')
          updates = {
              'TRANSCRIBE_PROVIDER': 'openai',
              'TRANSCRIBE_MODEL': 'gpt-4o-mini-transcribe',
              'TRANSCRIBE_FALLBACK_PROVIDER': 'local_ai',
              'QA2_OPENAI_STT_TIMEOUT_SECONDS': '8',
          }
          result, seen = [], set()
          for raw in lines:
              if '=' in raw and not raw.lstrip().startswith('#'):
                  key = raw.split('=', 1)[0].strip()
                  if key in updates:
                      result.append(f'{key}={updates[key]}')
                      seen.add(key)
                      continue
              result.append(raw)
          result.extend(f'{key}={value}' for key, value in updates.items() if key not in seen)
          tmp = path.with_suffix('.qa2-stt.tmp')
          tmp.write_text('\n'.join(result) + '\n', encoding='utf-8')
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          print('QA2_OPENAI_STT_CONFIGURATION=written')
          PY
          REMOTE

      - name: Validate deployed source, restart exact QA2 listener and verify protected state
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" bash -s -- "$QA_SOURCE_SHA" '${{ inputs.enable_external_freight_feed }}' <<'REMOTE'
          set -euo pipefail
          qa_root=/home/ubuntu/urtruck-qa2
          qa_backend="$qa_root/backend"
          state=/tmp/urtruck-qa2-deploy.state
          source_sha="$1"
          feed_only="$2"
          test -f "$state"
          . "$state"
          PY="$qa_backend/venv/bin/python"
          test -x "$PY"
          cd "$qa_backend"
          test -f database/vehicles_dal.py || { echo '::error::QA_DEPLOY_DATABASE_CODE_MISSING'; exit 1; }
          "$PY" -m py_compile main.py
          env -i HOME="$HOME" PATH="$PATH" DB_PATH="/tmp/urtruck-qa2-import-smoke.db" URTRUCK_ENV=test ENV=test \
            "$PY" -c 'from database import vehicles_dal'
          rm -f /tmp/urtruck-qa2-import-smoke.db
          "$PY" -m pytest tests/test_qa_data_isolation.py -q
          printf '%s\n' "$source_sha" > .qa-source-sha
          listener_pid() {
            local pid
            pid="$(ss -ltnpH 'sport = :8002' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)"
            if test -z "$pid" && command -v fuser >/dev/null; then pid="$({ fuser -n tcp 8002 2>/dev/null || true; } | awk '{print $1; exit}')"; fi
            if test -z "$pid" && command -v lsof >/dev/null; then pid="$({ lsof -nP -iTCP:8002 -sTCP:LISTEN -t 2>/dev/null || true; } | head -1)"; fi
            printf '%s' "$pid"
          }
          safe_deploy_log() {
            if test -f uvicorn.log; then
              echo 'QA_DEPLOY_UVICORN_LOG=present'
              tail -n 160 uvicorn.log 2>/dev/null \
                | grep -E '^(Traceback|ERROR:|CRITICAL:|[A-Za-z_][A-Za-z0-9_.]*(Error|Exception):|ModuleNotFoundError:|ImportError:|SyntaxError:)' \
                | sed -E 's#https?://[^[:space:]]+#<url>#g; s#(token|key|password|secret)=[^[:space:]]+#\1=<redacted>#Ig' \
                | tail -n 16 || true
            else
              echo 'QA_DEPLOY_UVICORN_LOG=missing'
            fi
          }
          old_pid="$(listener_pid)"
          test -n "$old_pid"
          old_cmd="$(tr '\0' ' ' < "/proc/$old_pid/cmdline")"
          printf '%s' "$old_cmd" | grep -Eq 'uvicorn|gunicorn'
          printf '%s' "$old_cmd" | grep -Fq 'main:app'
          test "$(ps -o user= -p "$old_pid" | xargs)" = "$(id -un)"
          case "$RESTART_MODE" in
            system) sudo -n /usr/bin/systemctl stop urtruck-qa2.service ;;
            user) export XDG_RUNTIME_DIR="/run/user/$(id -u)"; systemctl --user stop urtruck-qa2.service ;;
            direct) kill -TERM "$old_pid"
              for _ in {1..20}; do kill -0 "$old_pid" 2>/dev/null || break; sleep 0.5; done
              if kill -0 "$old_pid" 2>/dev/null; then kill -KILL "$old_pid"; fi ;;
            *) echo '::error::QA2_RESTART_MODE_INVALID'; exit 1 ;;
          esac
          port_free=no
          for _ in {1..20}; do
            if test -z "$(listener_pid)"; then port_free=yes; break; fi
            sleep 0.5
          done
          test "$port_free" = yes || { echo '::error::QA_DEPLOY_PORT_8002_DID_NOT_RELEASE'; exit 1; }
          case "$RESTART_MODE" in
            system) sudo -n /usr/bin/systemctl start urtruck-qa2.service ;;
            user) export XDG_RUNTIME_DIR="/run/user/$(id -u)"; systemctl --user start urtruck-qa2.service ;;
            direct) nohup "$PY" -m uvicorn main:app --host 0.0.0.0 --port 8002 > uvicorn.log 2>&1 </dev/null & wait_pid=$!; test -n "$wait_pid" ;;
            *) echo '::error::QA2_RESTART_MODE_INVALID'; exit 1 ;;
          esac
          healthy=no
          for _ in {1..40}; do
            new_pid="$(listener_pid)"
            if test -n "$new_pid" && curl -fsS http://127.0.0.1:8002/health >/dev/null 2>&1; then
              healthy=yes
              break
            fi
            sleep 1
          done
          if test "$healthy" != yes; then
            echo '::error::QA_DEPLOY_LOCAL_HEALTH_TIMEOUT'
            safe_deploy_log
            exit 1
          fi
          new_pid="$(listener_pid)"
          test -n "$new_pid"
          test "$(ps -o user= -p "$new_pid" | xargs)" = "$(id -un)"
          if test "$RESTART_MODE" = system; then
            test "$(systemctl show urtruck-qa2.service -p MainPID --value)" = "$new_pid"
          elif test "$RESTART_MODE" = user; then
            test "$(systemctl --user show urtruck-qa2.service -p MainPID --value)" = "$new_pid"
          fi
          new_cmd="$(tr '\0' ' ' < "/proc/$new_pid/cmdline")"
          printf '%s' "$new_cmd" | grep -Fq 'main:app'
          test "$(readlink -f "/proc/$new_pid/cwd")" = "$(readlink -f "$qa_backend")"
          curl -fsS http://127.0.0.1:8002/api/version >/dev/null
          curl -fsS http://127.0.0.1:8002/health >/dev/null
          if test "$feed_only" = true; then
            openapi="$(curl -fsS http://127.0.0.1:8002/openapi.json)"
            printf '%s' "$openapi" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "/api/v1/external-freight" in d.get("paths", {}), "QA2_EXTERNAL_FEED_ROUTE_MISSING"'
            code="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8002/api/v1/external-freight/import -H 'Content-Type: application/json' -d '{"records":[]}')"
            test "$code" = 401 || { echo '::error::QA2_EXTERNAL_FEED_FLAG_NOT_ENABLED'; exit 1; }
            echo 'QA2_EXTERNAL_FEED_RUNTIME=enabled-import-auth-required'
          fi
          if test "$feed_only" != true; then
          ai_info="$(curl -fsS http://127.0.0.1:8002/api/v1/chat/translate/info)"
          printf '%s' "$ai_info" | python3 -c '
          import json, sys
          info = json.load(sys.stdin)
          if info.get("provider") != "local_ai":
              raise SystemExit("QA2_LOCAL_NLLB_PROVIDER_NOT_READY")
          '
          stt_info="$(curl -fsS http://127.0.0.1:8002/api/v1/chat/transcribe/info)"
          printf '%s' "$stt_info" | python3 -c '
          import json, sys
          info = json.load(sys.stdin)
          expected = {
              "provider": "openai", "model": "gpt-4o-mini-transcribe",
              "fallback_provider": "local_ai", "timeout_seconds": 8.0,
          }
          if any(info.get(key) != value for key, value in expected.items()) or not info.get("model_allowed") or not info.get("key_configured"):
              raise SystemExit("QA2_OPENAI_STT_CONFIGURATION_NOT_READY")
          '
          python3 - "$qa_root/.env" <<'PY'
          from pathlib import Path
          import sys
          values = {}
          for raw in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              key, sep, value = raw.partition("=")
              if sep:
                  values[key.strip()] = value.strip()
          required = {
              "TRANSCRIBE_PROVIDER": "openai",
              "TRANSCRIBE_MODEL": "gpt-4o-mini-transcribe",
              "TRANSCRIBE_FALLBACK_PROVIDER": "local_ai",
              "QA2_OPENAI_STT_TIMEOUT_SECONDS": "8",
              "TRANSLATE_PROVIDER": "local_ai",
          }
          if any(values.get(key) != value for key, value in required.items()) or not values.get("OPENAI_API_KEY"):
              raise SystemExit("QA2_OPENAI_STT_SETTINGS_NOT_READY")
          if values.get("LOCAL_AI_URL") != "http://127.0.0.1:8003":
              raise SystemExit("QA2_LOCAL_AI_URL_NOT_READY")
          PY
          echo 'QA_STT_PROVIDER=openai-ready'
          echo 'QA_TRANSLATE_PROVIDER=local-nllb-ready'
          else
          python3 - "$ENV_BACKUP" "$qa_root/.env" "$BACKEND_ENV_BACKUP" "$qa_backend/.env" <<'PYENV'
          from pathlib import Path
          import sys
          def values(path):
              result = {}
              for line in Path(path).read_text().splitlines():
                  if '=' in line and not line.lstrip().startswith('#'):
                      key, value = line.split('=', 1)
                      result[key.strip()] = value
              return result
          allowed = {'EXTERNAL_FREIGHT_FEED_ENABLED', 'EXTERNAL_FREIGHT_IMPORTER_KEY'}
          keys = set()
          for before, after in ((sys.argv[1], sys.argv[2]), (sys.argv[3], sys.argv[4])):
              old, new = values(before), values(after)
              if {k: v for k, v in old.items() if k not in allowed} != {k: v for k, v in new.items() if k not in allowed}:
                  raise SystemExit('QA2_PROTECTED_SETTINGS_CHANGED')
              prior = old.get('EXTERNAL_FREIGHT_IMPORTER_KEY', '').strip()
              current = new.get('EXTERNAL_FREIGHT_IMPORTER_KEY', '').strip()
              if (prior and prior != current) or len(current) < 32 or new.get('EXTERNAL_FREIGHT_FEED_ENABLED') != 'true':
                  raise SystemExit('QA2_EXTERNAL_FEED_SETTINGS_INVALID')
              keys.add(current)
          if len(keys) != 1:
              raise SystemExit('QA2_EXTERNAL_FEED_IMPORTER_KEYS_MISMATCH')
          print('QA2_PROTECTED_SETTINGS=unchanged')
          PYENV
          fi
          test "$(cat .qa-source-sha)" = "$source_sha"
          db_path="$(python3 - "$qa_root" "$qa_root/.env" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1]).resolve()
          values = {}
          for raw in Path(sys.argv[2]).read_text(encoding='utf-8').splitlines():
              if '=' in raw and not raw.lstrip().startswith('#'):
                  key, value = raw.split('=', 1)
                  values[key.strip()] = value.strip().strip('"').strip("'")
          db = values.get('DB_PATH') or values.get('URTRUCK_DB_PATH') or ''
          if db.startswith('sqlite:///'): db = db[len('sqlite:///'):]
          p = Path(db)
          if not p.is_absolute(): p = root / p
          p = p.resolve()
          if root not in p.parents or 'urtruck-security' in str(p) or not p.is_file(): raise SystemExit(2)
          print(p)
          PY
          )"
          test "$(printf '%s' "$db_path" | sha256sum | awk '{print $1}')" = "$DB_PATH_HASH"
          test "$(stat -c '%d:%i' "$db_path")" = "$DB_INODE"
          test "$(stat -c '%d:%i' "$qa_root/storage")" = "$STORAGE_INODE"
          post_hash="$(find . -type f ! -path './venv/*' ! -path './storage/*' ! -path './backups/*' ! -path './__pycache__/*' ! -name '.env' ! -name '*.db' ! -name '*.sqlite*' ! -name '*.log' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          echo "QA_DEPLOYED_SOURCE_SHA=$source_sha"
          echo "QA_POSTDEPLOY_CODE_SHA256=$post_hash"
          echo 'QA_DB=preserved-same-file'
          echo 'QA_STORAGE=preserved-same-directory'
          echo 'QA_API_8002=healthy-restarted'
          REMOTE

      - name: Runtime QA2P isolation check through QA and production APIs
        if: ${{ !inputs.enable_external_freight_feed }}
        shell: bash
        run: |
          set -euo pipefail
          fixture_id="qa2p-runtime-$GITHUB_RUN_ID"
          fixture_marker="QA2P_RUNTIME_$GITHUB_RUN_ID"
          export FIXTURE_MARKER="$fixture_marker"
          export SSHPASS="$SERVER_PASS"

          qa_fixture() {
            mode="$1"
            sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
              bash -s -- "$mode" "$fixture_id" "$fixture_marker" <<'REMOTE_FIXTURE'
          set -euo pipefail
          mode="$1"
          fixture_id="$2"
          fixture_marker="$3"
          qa_root=/home/ubuntu/urtruck-qa2
          python3 - "$qa_root" "$qa_root/.env" "$mode" "$fixture_id" "$fixture_marker" <<'PYFIXTURE'
          from pathlib import Path
          from datetime import datetime
          import sqlite3
          import sys

          root = Path(sys.argv[1]).resolve()
          env_path = Path(sys.argv[2])
          mode = sys.argv[3]
          fixture_id = sys.argv[4]
          marker = sys.argv[5]
          values = {}
          for raw in env_path.read_text(encoding='utf-8').splitlines():
              if '=' in raw and not raw.lstrip().startswith('#'):
                  key, value = raw.split('=', 1)
                  values[key.strip()] = value.strip().strip('"').strip("'")
          db = values.get('DB_PATH') or values.get('URTRUCK_DB_PATH') or ''
          if db.startswith('sqlite:///'):
              db = db[len('sqlite:///'):]
          db_path = Path(db)
          if not db_path.is_absolute():
              db_path = root / db_path
          db_path = db_path.resolve()
          if root not in db_path.parents or 'urtruck-security' in str(db_path) or not db_path.is_file():
              raise SystemExit('::error::QA2P_RUNTIME_DB_NOT_ISOLATED')

          owner = 'qa-runtime-isolation'
          with sqlite3.connect(db_path) as conn:
              conn.row_factory = sqlite3.Row
              row = conn.execute(
                  'SELECT owner_id, cargo_desc FROM cargos WHERE id=?',
                  (fixture_id,),
              ).fetchone()
              if row and (row['owner_id'] != owner or row['cargo_desc'] != marker):
                  raise SystemExit('::error::QA2P_RUNTIME_FIXTURE_ID_COLLISION')

              if mode == 'seed':
                  if row:
                      conn.execute(
                          'DELETE FROM cargos WHERE id=? AND owner_id=? AND cargo_desc=?',
                          (fixture_id, owner, marker),
                      )
                  now = datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S')
                  conn.execute(
                      'INSERT INTO cargos '
                      '(id, owner_id, from_city, to_city, cargo_desc, cargo_type, '
                      'pickup_date, photos, status, created_at, updated_at, published_at) '
                      'VALUES (?,?,?,?,?,?,?,?,?,?,?,?)',
                      (fixture_id, owner, marker, 'QA Runtime Destination', marker, 'tent',
                       '2099-01-01', '[]', 'active', now, now, now),
                  )
                  conn.commit()
                  print('QA2P_RUNTIME_FIXTURE=seeded')
              elif mode == 'cleanup':
                  if row:
                      cur = conn.execute(
                          'DELETE FROM cargos WHERE id=? AND owner_id=? AND cargo_desc=?',
                          (fixture_id, owner, marker),
                      )
                      if cur.rowcount != 1:
                          raise SystemExit('::error::QA2P_RUNTIME_FIXTURE_CLEANUP_FAILED')
                      conn.commit()
                  print('QA2P_RUNTIME_FIXTURE=cleaned')
              else:
                  raise SystemExit('::error::QA2P_RUNTIME_FIXTURE_MODE_INVALID')
          PYFIXTURE
          REMOTE_FIXTURE
          }

          qa_fixture seed
          trap 'qa_fixture cleanup || true' EXIT

          set +e
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          marker = os.environ['FIXTURE_MARKER']
          query = urllib.parse.urlencode({
              'status': 'active',
              'from_city': marker,
              'limit': 20,
          })
          qa = os.environ['QA_API_URL'].rstrip('/') + '/api/v1/market/cargos?' + query
          prod = 'https://urtruck.kz/api/v1/market/cargos?' + query

          def fetch(url, label):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      if not 200 <= r.status < 300:
                          raise RuntimeError(label)
                      return json.loads(r.read().decode('utf-8'))
              except Exception:
                  raise SystemExit(f'::error::{label}_API_READ_FAILED')

          def has_marker(value):
              if isinstance(value, str):
                  return marker in value
              if isinstance(value, dict):
                  return any(has_marker(v) for v in value.values())
              if isinstance(value, list):
                  return any(has_marker(v) for v in value)
              return False

          qa_data = fetch(qa, 'QA')
          prod_data = fetch(prod, 'PRODUCTION')
          if not has_marker(qa_data):
              raise SystemExit('::error::QA2P_RUNTIME_FIXTURE_NOT_VISIBLE_IN_QA')
          if has_marker(prod_data):
              raise SystemExit('::error::QA2P_RUNTIME_LEAKED_TO_PRODUCTION')
          print('QA2P_RUNTIME_QA=visible')
          print('QA2P_RUNTIME_PRODUCTION=hidden')
          PY
          runtime_rc=$?
          set -e

          qa_fixture cleanup
          trap - EXIT
          exit "$runtime_rc"

      - name: Verify production fingerprint unchanged
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://urtruck.kz/api/version)"
          after="$(printf '%s' "$body" | sha256sum | awk '{print $1}')"
          test "$after" = "$PROD_VERSION_HASH_BEFORE" || {
            echo "::error::Production version fingerprint changed during QA-only deploy"
            exit 1
          }
          echo "PRODUCTION_AFTER=healthy-unchanged"

      - name: Remove temporary QA deploy state after success
        if: success()
        shell: bash
        run: |
          export SSHPASS="$SERVER_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'rm -f /tmp/urtruck-qa2-deploy.state'

      - name: Roll back QA2 code and settings if deploy validation fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          qa_root=/home/ubuntu/urtruck-qa2
          qa_backend="$qa_root/backend"
          state=/tmp/urtruck-qa2-deploy.state
          test -f "$state" || { echo 'QA_ROLLBACK=state-missing-no-action'; exit 0; }
          . "$state"
          backup_dir="$qa_root/backups/$BACKUP_ID"
          test -d "$backup_dir"
          pid="$(ss -ltnpH 'sport = :8002' 2>/dev/null | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)"
          case "$RESTART_MODE" in
            system) sudo -n /usr/bin/systemctl stop urtruck-qa2.service ;;
            user) export XDG_RUNTIME_DIR="/run/user/$(id -u)"; systemctl --user stop urtruck-qa2.service ;;
            direct) if test -n "$pid"; then
                cmd="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
                printf '%s' "$cmd" | grep -Eq 'uvicorn|gunicorn'
                printf '%s' "$cmd" | grep -Fq 'main:app'
                test "$(ps -o user= -p "$pid" | xargs)" = "$(id -un)"
                kill -TERM "$pid" || true
                sleep 2
                kill -0 "$pid" 2>/dev/null && kill -KILL "$pid" || true
              fi ;;
            *) echo '::error::QA2_RESTART_MODE_INVALID'; exit 1 ;;
          esac
          rsync -a --delete \
            --exclude='venv/' --exclude='storage/' --exclude='backups/' \
            --exclude='.env' --exclude='qa2.env' --exclude='backend-env.snapshot' --exclude='*.db' --exclude='*.sqlite*' \
            --exclude='*.db-journal' --exclude='*.db-wal' --exclude='*.db-shm' \
            --exclude='__pycache__/' --exclude='*.pyc' --exclude='*.log' \
            "$backup_dir/" "$qa_backend/"
          cp -- "$ENV_BACKUP" "$qa_root/.env"
          chmod 600 "$qa_root/.env"
          cp -- "$BACKEND_ENV_BACKUP" "$qa_backend/.env"
          chmod 600 "$qa_backend/.env"
          cmp -s -- "$BACKEND_ENV_BACKUP" "$qa_backend/.env" || { echo '::error::QA_ROLLBACK_RUNTIME_SETTINGS_NOT_RESTORED'; exit 1; }
          cmp -s -- "$ENV_BACKUP" "$qa_root/.env" || { echo '::error::QA_ROLLBACK_SETTINGS_NOT_RESTORED'; exit 1; }
          cd "$qa_backend"
          PY=venv/bin/python
          test -x "$PY"
          case "$RESTART_MODE" in
            system) sudo -n /usr/bin/systemctl start urtruck-qa2.service ;;
            user) export XDG_RUNTIME_DIR="/run/user/$(id -u)"; systemctl --user start urtruck-qa2.service ;;
            direct) nohup "$PY" -m uvicorn main:app --host 0.0.0.0 --port 8002 > uvicorn.log 2>&1 </dev/null & wait_pid=$!; test -n "$wait_pid" ;;
            *) echo '::error::QA2_RESTART_MODE_INVALID'; exit 1 ;;
          esac
          rollback_healthy=no
          for _ in {1..40}; do
            if curl -fsS --max-time 2 http://127.0.0.1:8002/api/version >/dev/null 2>&1; then rollback_healthy=yes; break; fi
            sleep 1
          done
          test "$rollback_healthy" = yes || { echo '::error::QA_ROLLBACK_HEALTH_TIMEOUT'; exit 1; }
          db_path="$(python3 - "$qa_root" "$qa_root/.env" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1]).resolve(); values = {}
          for raw in Path(sys.argv[2]).read_text(encoding='utf-8').splitlines():
              if '=' in raw and not raw.lstrip().startswith('#'):
                  k, v = raw.split('=', 1); values[k.strip()] = v.strip().strip('"').strip("'")
          db = values.get('DB_PATH') or values.get('URTRUCK_DB_PATH') or ''
          if db.startswith('sqlite:///'): db = db[len('sqlite:///'):]
          p = Path(db); p = p if p.is_absolute() else root / p; print(p.resolve())
          PY
          )"
          test "$(printf '%s' "$db_path" | sha256sum | awk '{print $1}')" = "$DB_PATH_HASH"
          test "$(stat -c '%d:%i' "$db_path")" = "$DB_INODE"
          test "$(stat -c '%d:%i' "$qa_root/storage")" = "$STORAGE_INODE"
          rm -f "$state"
          echo "QA_ROLLBACK=restored-$BACKUP_ID"
          REMOTE
