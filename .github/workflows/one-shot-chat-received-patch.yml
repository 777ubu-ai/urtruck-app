name: One-shot received chat patch

on:
  push:
    branches:
      - fix/deal-chat-received-fsm-20260824

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deal-chat-received-fsm-20260824
      - name: Patch canonical chat status gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/api/chat.py')
          src = path.read_text(encoding='utf-8')
          old = '_DEAL_CHAT_STATUSES = ("accepted", "in_progress", "at_border", "awaiting_confirmation", "delivered", "completed")'
          new = '_DEAL_CHAT_STATUSES = ("accepted", "in_progress", "at_border", "awaiting_confirmation", "delivered", "received", "completed")'
          if src.count(old) != 1:
              raise SystemExit(f'expected exactly one old chat-status gate, found {src.count(old)}')
          path.write_text(src.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/one-shot-chat-received-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/api/chat.py .github/workflows/one-shot-chat-received-patch.yml
          git diff --cached --check
          git commit -m 'fix(chat): allow receipt-confirmed deal conversations'
          git push origin HEAD:fix/deal-chat-received-fsm-20260824
