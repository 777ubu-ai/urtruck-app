name: Submit verified corrected AAB to public Google Play

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Введите SUBMIT_PRODUCTION_1_0_13: отправить исправленный кандидат в основной Google Play на проверку"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: google-play-${{ github.repository }}
  cancel-in-progress: false

jobs:
  upload-draft:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'SUBMIT_PRODUCTION_1_0_13' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout protected exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download and verify existing immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 777ubu-ai/urtruck-app
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          gh api repos/777ubu-ai/urtruck-app/actions/runs/40776684461 > "$RUNNER_TEMP/aab-run.json"
          gh api repos/777ubu-ai/urtruck-app/actions/artifacts/12857270270/zip > "$RUNNER_TEMP/aab.zip"
          python3 scripts/ops/upload_existing_play_draft.py verify --root "$RUNNER_TEMP"
      - name: Submit exact corrected bundle to production
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 scripts/ops/upload_existing_play_draft.py submit-production --root "$RUNNER_TEMP" | tee "$RUNNER_TEMP/play-production-result.json"
      - name: Save verified production submission receipt
        uses: actions/upload-artifact@v4
        with:
          name: play-production-submission-result
          path: ${{ runner.temp }}/play-production-result.json
          retention-days: 14
          if-no-files-found: error
