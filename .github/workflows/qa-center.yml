name: UrTruck QA Center

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_qa2:
        description: Deploy exact Golden backend source to isolated QA2 after all gates
        required: false
        default: false
        type: boolean
      qa2_confirmation:
        description: Type DEPLOY_QA2 only when deploy_qa2 is enabled
        required: false
        default: ''
        type: string
      recover_qa2:
        description: Recover the isolated QA2 runtime when the API is down
        required: false
        default: false
        type: boolean
      qa2_recovery_confirmation:
        description: Type RECOVER_QA2 only when recover_qa2 is enabled
        required: false
        default: ''
        type: string
      pilot_qa2_openai_stt:
        description: Run synthetic RU/ZH OpenAI STT pilot without changing QA2 runtime
        required: false
        default: false
        type: boolean
      qa2_stt_confirmation:
        description: Type PILOT_QA2_STT to approve synthetic API calls
        required: false
        default: ''
        type: string

concurrency:
  group: qa-center-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa2-environment-contract:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.recover_qa2 != true }}
    uses: ./.github/workflows/qa-environment-contract.yml
    secrets:
      API_URL: ${{ secrets.QA2_API_URL }}

  qa-staging-preflight:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.recover_qa2 != true }}
    uses: ./.github/workflows/qa-staging-preflight.yml
    secrets:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASS: ${{ secrets.SERVER_PASS }}

  routing-provider-forensic:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.recover_qa2 != true }}
    name: Routing provider forensic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact backend ORS contract
        run: |
          set -euo pipefail
          test -n "${OPENROUTESERVICE_API_KEY:-}"
          python3 scripts/routing_provider_forensic.py

  quick-gate:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.recover_qa2 != true }}
    name: QA Center quick gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run static, UX and production-build checks
        run: npm run qa:center:quick
      - name: Upload web build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-center-web-build-${{ github.sha }}
          path: dist
          if-no-files-found: warn
          retention-days: 7

  maestro-contract:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.recover_qa2 != true }}
    name: Maestro flow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Maestro YAML syntax and referenced flows
        shell: bash
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            Dir["qa/maestro/**/*.{yml,yaml}"].sort.each do |path|
              YAML.load_stream(File.read(path))
              puts "YAML OK #{path}"
            end
          '
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('qa/maestro')
          suite = root / 'smoke-suite.yaml'
          text = suite.read_text(encoding='utf-8')
          refs = re.findall(r'runFlow:\s*([^\s#]+)', text)
          if not refs:
              raise SystemExit('smoke-suite.yaml has no runFlow entries')
          missing = [ref for ref in refs if not (root / ref).is_file()]
          if missing:
              raise SystemExit(f'Missing Maestro flows: {missing}')
          print('Maestro smoke suite references:', ', '.join(refs))
          PY
          node qa/utils/maestroContractSmoke.js
      - name: Archive Maestro contracts
        uses: actions/upload-artifact@v4
        with:
          name: maestro-contracts-${{ github.sha }}
          path: |
            qa/maestro/**/*.yaml
            qa/maestro/**/*.yml
            qa/maestro/README.md
            qa/README.md
          if-no-files-found: error
          retention-days: 14

  qa2-backend-deploy:
    name: QA2 backend deploy after full gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_qa2 == true && inputs.recover_qa2 != true }}
    needs:
      - qa2-environment-contract
      - qa-staging-preflight
      - routing-provider-forensic
      - quick-gate
      - maestro-contract
    uses: ./.github/workflows/qa-staging-deploy.yml
    with:
      confirmation: ${{ inputs.qa2_confirmation }}
    secrets: inherit

  qa2-openai-stt-pilot:
    name: Protected QA2 OpenAI speech pilot
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot_qa2_openai_stt == true && inputs.deploy_qa2 != true && inputs.recover_qa2 != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: qa2
    env:
      QA2_OPENAI_API_KEY: ${{ secrets.QA2_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact working branch and confirmation
        env:
          QA2_STT_CONFIRMATION: ${{ inputs.qa2_stt_confirmation }}
        run: |
          set -euo pipefail
          test "$QA2_STT_CONFIRMATION" = PILOT_QA2_STT
          test "$GITHUB_REF_NAME" = fix/voice-stt-translation-20260925
          echo "PILOT_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Install synthetic audio generator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
      - name: Run six non-personal RU/ZH voice checks
        run: python3 scripts/qa2_openai_stt_pilot.py

  qa2-runtime-recovery:
    name: QA2 runtime recovery
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_qa2 == true }}
    uses: ./.github/workflows/qa-staging-recovery.yml
    with:
      confirmation: ${{ inputs.qa2_recovery_confirmation }}
    secrets: inherit
