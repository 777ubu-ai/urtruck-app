name: Existing Play release preparation
on:
  workflow_dispatch:
    inputs:
      store_action:
        description: Existing candidate action
        type: choice
        required: true
        default: inspect
        options: [inspect, prepare_draft]
permissions:
  contents: read
concurrency:
  group: google-play-${{ github.repository }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official authentication dependencies
        run: python -m pip install google-auth requests
      - name: Inspect existing tracks without publication
        env:
          STORE_ACTION: ${{ inputs.store_action }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python scripts/ops/inspect_play_store.py
      - uses: actions/upload-artifact@v4
        with:
          name: play-store-inspection
          path: play-store-inspection.json
          retention-days: 7
          if-no-files-found: error
