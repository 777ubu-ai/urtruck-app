name: Read Play service account email

on:
  push:
    branches: [pro/urtruck-paid-test]
    paths:
      - ".github/workflows/read-play-service-account-email.yml"

permissions:
  contents: read

jobs:
  read-email:
    runs-on: ubuntu-latest
    steps:
      - name: Extract client_email only
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node -e 'const fs=require("fs"); const j=JSON.parse(process.env.PLAY_SERVICE_ACCOUNT_JSON); if(!j.client_email) process.exit(2); fs.writeFileSync("/tmp/play-sa-email.txt", j.client_email+"\n", {mode:0o600})'
      - name: Upload email artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-service-account-email
          path: /tmp/play-sa-email.txt
          retention-days: 1
