name: Deploy Biz Chat backend (universal code)

# Разворачивает обновлённый backend Biz Chat (с универсальным кодом входа
# для тестов) и прописывает UNIVERSAL_LOGIN_CODE в .env.production.
#
# ВНИМАНИЕ: универсальный код 000000 — ТЕСТОВЫЙ, подходит к любому номеру.
# Для продакшена этот код нужно убрать и включить реальные SMS.
#
# Запуск: по push этого файла (контролируемо).

on:
  workflow_dispatch:
  push:
    branches: [claude/biz-chat-inquiry-6v7qi2]
    paths:
      - 'bizchat/backend/**'
      - '.github/workflows/deploy-bizchat-universal.yml'

concurrency:
  group: deploy-bizchat
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Одно место истины для кода: и запись в .env, и проверка после деплоя.
    # Раньше они разъехались (в env писали 000000, а проверяли 112233).
    env:
      UNIVERSAL_CODE: "000000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload backend sources
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          tar czf backend-src.tar.gz -C bizchat/backend \
            src package.json package-lock.json tsconfig.json tsconfig.build.json nest-cli.json
          sshpass -p "$SERVER_PASS" scp -o StrictHostKeyChecking=no \
            backend-src.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/backend-src.tar.gz"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" '
            set -e
            cd /home/ubuntu/bizchat/backend
            rm -rf src
            tar xzf /tmp/backend-src.tar.gz
            rm -f /tmp/backend-src.tar.gz
            echo "Исходники обновлены."
          '

      - name: Set UNIVERSAL_LOGIN_CODE and rebuild backend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            "UNIVERSAL_CODE='$UNIVERSAL_CODE' bash -s" <<'EOS'
          set -e
          ENV=/home/ubuntu/bizchat/infra/.env.production
          cp "$ENV" "$ENV.bak.$(date +%Y%m%d-%H%M%S)"
          # Прописываем универсальный тестовый код (idempotent)
          sed -i '/^UNIVERSAL_LOGIN_CODE=/d' "$ENV"
          echo "UNIVERSAL_LOGIN_CODE=$UNIVERSAL_CODE" >> "$ENV"
          echo "UNIVERSAL_LOGIN_CODE прописан."

          cd /home/ubuntu/bizchat/infra
          COMPOSE="docker compose -f docker-compose.production.yml -f docker-compose.staging.yml --env-file .env.production"
          echo "== Сборка backend (с новым кодом) =="
          $COMPOSE build backend
          echo "== Перезапуск =="
          $COMPOSE up -d backend
          echo "== Ждём healthy =="
          for i in $(seq 1 40); do
            S=$(docker inspect -f '{{.State.Health.Status}}' bizchat-backend-prod 2>/dev/null || echo starting)
            [ "$S" = "healthy" ] && { echo "healthy"; break; }
            sleep 3
          done
          docker inspect -f 'backend: {{.State.Health.Status}}' bizchat-backend-prod

          echo "== Миграции БД =="
          # ВАЖНО: в production-образе нет ts-node, поэтому `npm run migration:run`
          # (через typeorm-ts-node-commonjs) там не работает — раньше он падал молча
          # и схема расходилась с сущностями (лента и каталог легли на 500 из-за
          # отсутствующей колонки factories.website).
          # Используем скомпилированный data-source и CLI из prod-зависимостей.
          # Ошибка миграций = провал деплоя, а не предупреждение.
          docker exec bizchat-backend-prod npm run migration:run:prod
          docker exec bizchat-backend-prod npm run migration:show:prod || true

          echo "== Режим synchronize (риск авто-правки схемы) =="
          docker exec bizchat-backend-prod printenv DB_SYNCHRONIZE || echo "DB_SYNCHRONIZE не задан (по умолчанию выключен)"
          EOS

      - name: Verify universal code works
        run: |
          set -e
          # Лента — главный экран приложения. Раньше проверка её не трогала,
          # поэтому деплой со сломанной схемой БД считался успешным.
          echo "== лента (главный экран) =="
          feed_body=$(curl -fsS -m 20 "https://biz-chat.net/api/v1/posts/feed?limit=1" || true)
          echo "$feed_body" | head -c 200; echo
          case "$feed_body" in
            *'"data"'*) echo "✅ Лента отвечает";;
            *) echo "::error::Лента не вернула data — деплой сломал главный экран"; exit 1;;
          esac
          echo "== каталог заводов =="
          cat_body=$(curl -fsS -m 20 "https://biz-chat.net/api/v1/factories?limit=3" || true)
          echo "$cat_body" | head -c 200; echo
          case "$cat_body" in
            *'"items"'*) echo "✅ Каталог заводов отвечает";;
            *) echo "::error::Каталог заводов не вернул items"; exit 1;;
          esac
          T="+77000000123"
          echo "== sms/send (stub) =="
          curl -sS -m 15 -o /dev/null -w "send: %{http_code}\n" -X POST \
            https://biz-chat.net/api/v1/auth/sms/send -H "Content-Type: application/json" -d "{\"phone\":\"$T\"}"
          echo "== verify универсальным кодом $UNIVERSAL_CODE =="
          body=$(curl -sS -m 15 -X POST https://biz-chat.net/api/v1/auth/sms/verify \
            -H "Content-Type: application/json" -d "{\"phone\":\"$T\",\"code\":\"$UNIVERSAL_CODE\",\"type\":\"buyer\"}")
          echo "$body" | head -c 200
          echo
          case "$body" in
            *'"accessToken"'*) echo "✅ Универсальный код работает — вход выдал токены";;
            *) echo "::error::Универсальный код не сработал"; exit 1;;
          esac
