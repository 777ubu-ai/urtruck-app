name: Build Android QA2 (debug lineage)

# Каноническая QA2-сборка для обновления существующих установок.
# QA2 намеренно подписывается android/app/debug.keystore. Этот workflow
# никогда не использует production upload keystore и не предназначен для Play.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to build (defaults to checked out SHA)
        required: false
        type: string
  push:
    branches:
      - fix/qa2-standalone-bundle-20260906

permissions:
  contents: read

env:
  QA2_APPLICATION_ID: com.urtruck.app.qa2

jobs:
  build:
    name: Build exact QA2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Resolve exact standalone source on push lane
        if: github.event_name == 'push'
        env:
          EXACT_SOURCE_SHA: 7dabb3925a6667081a0875bc83f9252349853a29
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$EXACT_SOURCE_SHA"
          git checkout --detach "$EXACT_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_SHA"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36 / build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preinstall Expo-compatible NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.1.10909125"

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts || npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Apply patches
        run: |
          if [ -d patches ] && [ "$(ls -A patches 2>/dev/null)" ]; then
            npx patch-package
          fi

      - name: Materialize QA2 Firebase config
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" || {
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is required for QA2"; exit 1;
          }
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          python3 scripts/verify_android_firebase_config.py --check-source android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          packages = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          if "com.urtruck.app.qa2" not in packages:
              raise SystemExit(f"QA2 Firebase client missing; found {sorted(p for p in packages if p)}")
          print("QA2 Firebase client present")
          PY

      - name: Configure target SDK and monotonic QA2 version
        run: |
          printf '\nandroid.compileSdkVersion=36\nandroid.targetSdkVersion=36\nandroid.buildToolsVersion=36.0.0\n' >> android/gradle.properties
          echo "URTRUCK_VERSION_CODE=$(( $(date -u +%s) - 1577836800 ))" >> "$GITHUB_ENV"
          echo "URTRUCK_VERSION_NAME=1.0.8" >> "$GITHUB_ENV"

      - name: Assert QA2 debug signing lineage
        run: |
          set -euo pipefail
          test -f android/app/debug.keystore
          keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey \
            | tee "$RUNNER_TEMP/qa2-signing.txt"
          grep -q 'Android Debug' "$RUNNER_TEMP/qa2-signing.txt"

      - name: Configure standalone QA2 release variant
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          source = path.read_text()
          marker = "react {\n"
          if source.count(marker) != 1:
              raise SystemExit("unexpected React Gradle configuration")
          source = source.replace(
              marker,
              marker + "    // QA2 standalone artifact must carry JS and launch without Metro.\n"
                      + "    debuggableVariants = []\n",
              1,
          )
          source = source.replace(
              "signingConfig signingConfigs.release",
              "signingConfig (configuredApplicationId == qa2ApplicationId ? signingConfigs.debug : signingConfigs.release)",
              1,
          )
          source = source.replace(
              "if (configuredApplicationId == qa2ApplicationId) {\n                throw new GradleException('QA2 cannot be assembled as a release artifact')\n            }",
              "if (configuredApplicationId == qa2ApplicationId && project.findProperty('ALLOW_QA2_STANDALONE_RELEASE') != 'true') {\n                throw new GradleException('QA2 cannot be assembled as a release artifact without the standalone CI contract')\n            }",
              1,
          )
          source = source.replace(
              "if (!missingUploadSigning.isEmpty()) {\n                throw new GradleException(\"Release signing is not configured; missing: ${missingUploadSigning.join(', ')}\")\n            }",
              "if (configuredApplicationId != qa2ApplicationId && !missingUploadSigning.isEmpty()) {\n                throw new GradleException(\"Release signing is not configured; missing: ${missingUploadSigning.join(', ')}\")\n            }",
              1,
          )
          path.write_text(source)
          PY
          grep -q 'debuggableVariants = \[\]' android/app/build.gradle
          grep -q 'ALLOW_QA2_STANDALONE_RELEASE' android/app/build.gradle

      - name: Build standalone QA2 APK
        env:
          EXPO_PUBLIC_QA_HOOKS: '1'
          EXPO_PUBLIC_QA2_STANDALONE: '1'
          EXPO_PUBLIC_API_URL: ${{ secrets.QA2_API_URL }}
          ORG_GRADLE_PROJECT_URTRUCK_APPLICATION_ID: com.urtruck.app.qa2
          ORG_GRADLE_PROJECT_URTRUCK_VERSION_CODE: ${{ env.URTRUCK_VERSION_CODE }}
          ORG_GRADLE_PROJECT_URTRUCK_VERSION_NAME: ${{ env.URTRUCK_VERSION_NAME }}
        run: |
          set -euo pipefail
          test -n "${EXPO_PUBLIC_API_URL:-}" || {
            echo "::error::QA2_API_URL is required; QA2 must not fall back to production API"; exit 1;
          }
          case "$EXPO_PUBLIC_API_URL" in
            https://urtruck.kz/qa2|https://urtruck.kz/qa2/)
              : ;;
            https://urtruck.kz|https://urtruck.kz/|*185.22.65.11*)
              echo "::error::QA2_API_URL must point to a non-production QA backend"; exit 1 ;;
            *)
              : ;;
          esac
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PALLOW_QA2_STANDALONE_RELEASE=true --no-daemon --max-workers=2 --stacktrace --warning-mode=summary

      - name: Verify APK identity and signing before upload
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/qa2-apksigner.txt"
          grep -q 'Signer #1 certificate SHA-256 digest: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' "$RUNNER_TEMP/qa2-apksigner.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.urtruck.app.qa2'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "versionName='1.0.8'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "launchable-activity: name='com.urtruck.app.MainActivity'"
          unzip -l "$apk" | grep -Eq '(^|/)index\.android\.bundle$'
          ! "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q 'DevLauncherActivity'
          bundle=$(mktemp)
          trap 'rm -f "$bundle"' EXIT
          unzip -p "$apk" assets/index.android.bundle > "$bundle"
          grep -aFq "$EXPO_PUBLIC_API_URL" "$bundle" || {
            echo "::error::QA2 bundle does not contain the configured non-production API URL"; exit 1;
          }
          if grep -aFq 'https://urtruck.kz/api/v1' "$bundle"; then
            echo "::error::QA2 bundle contains the production API endpoint"; exit 1;
          fi

      - name: Write exact QA2 identity
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          out=android/app/build/outputs/qa2-metadata.txt
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "application_id=com.urtruck.app.qa2"
            echo "version_name=1.0.8"
            echo "version_code=${URTRUCK_VERSION_CODE}"
            echo "signing_cert_sha256=fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c"
            sha256sum "$apk"
          } | tee "$out"

      - name: Upload QA2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-qa2-exact
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/qa2-metadata.txt
          retention-days: 30
          if-no-files-found: error
