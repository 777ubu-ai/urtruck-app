name: Deploy Biz Chat backend

# Разворачивает обновлённый backend Biz Chat на сервер и (опционально)
# включает вход без SMS для владельца.
#
# ЗАПУСК: вручную — вкладка Actions → "Deploy Biz Chat backend" → Run workflow.
# (Автоматически по push НЕ запускается, чтобы не трогать прод случайно.)
#
# Вход без SMS и админ-доступ активируются, только если заданы секреты
# репозитория (Settings → Secrets and variables → Actions):
#   DEV_LOGIN_PHONE  — ваш номер, напр. +77479171118
#   DEV_LOGIN_CODE   — мастер-код, напр. 112233
#   ADMIN_PHONES     — номера админов через запятую (обычно тот же номер)
# Если секреты не заданы — деплой просто обновит код, вход останется по SMS.
#
# Репозиторий публичный, поэтому номер/код лежат ТОЛЬКО в секретах,
# не в коде и не в логах (значения маскируются).

on:
  workflow_dispatch:

concurrency:
  group: deploy-bizchat
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload backend sources to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          # Пакуем только то, что участвует в сборке backend-образа.
          tar czf backend-src.tar.gz -C bizchat/backend \
            src package.json package-lock.json tsconfig.json tsconfig.build.json nest-cli.json
          sshpass -p "$SERVER_PASS" scp -o StrictHostKeyChecking=no \
            backend-src.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/backend-src.tar.gz"
          # Распаковываем поверх исходников на сервере (src перезаписывается целиком).
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" '
            set -e
            cd /home/ubuntu/bizchat/backend
            rm -rf src
            tar xzf /tmp/backend-src.tar.gz
            rm -f /tmp/backend-src.tar.gz
            echo "Исходники обновлены: $(ls src | wc -l) элементов в src/"
          '

      - name: Configure env (dev-login / admin) if secrets provided
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          DEV_LOGIN_PHONE: ${{ secrets.DEV_LOGIN_PHONE }}
          DEV_LOGIN_CODE: ${{ secrets.DEV_LOGIN_CODE }}
          ADMIN_PHONES: ${{ secrets.ADMIN_PHONES }}
        run: |
          if [ -z "$DEV_LOGIN_PHONE" ] && [ -z "$ADMIN_PHONES" ]; then
            echo "Секреты DEV_LOGIN_*/ADMIN_PHONES не заданы — env не меняю (вход останется по SMS)."
            exit 0
          fi
          # Идемпотентно обновляем .env.production: удаляем старые ключи и дописываем новые.
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            DEV_LOGIN_PHONE="$DEV_LOGIN_PHONE" DEV_LOGIN_CODE="$DEV_LOGIN_CODE" ADMIN_PHONES="$ADMIN_PHONES" 'bash -s' <<'EOS'
            set -e
            ENV=/home/ubuntu/bizchat/infra/.env.production
            cp "$ENV" "$ENV.bak.$(date +%Y%m%d-%H%M%S)"
            # Удаляем прежние значения этих ключей (если были)
            sed -i '/^DEV_LOGIN_PHONE=/d;/^DEV_LOGIN_CODE=/d;/^ADMIN_PHONES=/d' "$ENV"
            # Дописываем актуальные (пустые — пропускаем)
            [ -n "$DEV_LOGIN_PHONE" ] && echo "DEV_LOGIN_PHONE=$DEV_LOGIN_PHONE" >> "$ENV"
            [ -n "$DEV_LOGIN_CODE" ]  && echo "DEV_LOGIN_CODE=$DEV_LOGIN_CODE"   >> "$ENV"
            [ -n "$ADMIN_PHONES" ]    && echo "ADMIN_PHONES=$ADMIN_PHONES"       >> "$ENV"
            echo "env.production обновлён (ключи DEV_LOGIN_*/ADMIN_PHONES)."
          EOS

      - name: Rebuild and restart backend container
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOS'
            set -e
            cd /home/ubuntu/bizchat/infra
            COMPOSE="docker compose -f docker-compose.production.yml -f docker-compose.staging.yml --env-file .env.production"
            echo "== Сборка backend =="
            $COMPOSE build backend
            echo "== Перезапуск backend =="
            $COMPOSE up -d backend
            echo "== Ждём healthy (до 120с) =="
            for i in $(seq 1 40); do
              S=$(docker inspect -f '{{.State.Health.Status}}' bizchat-backend-prod 2>/dev/null || echo starting)
              [ "$S" = "healthy" ] && { echo "backend healthy"; break; }
              sleep 3
            done
            docker inspect -f 'backend: {{.State.Health.Status}}' bizchat-backend-prod
          EOS

      - name: Verify public API
        run: |
          set -e
          for i in $(seq 1 12); do
            body=$(curl -fsS --max-time 10 "https://biz-chat.net/api/v1/posts/feed?limit=1" || true)
            case "$body" in
              *'"data"'*) echo "✅ API отвечает"; exit 0;;
            esac
            echo "проба $i — ещё не готово"; sleep 5
          done
          echo "::error::API не ответил ожидаемым JSON после деплоя"; exit 1
