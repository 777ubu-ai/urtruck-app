name: Graphify Onboarding Review

on:
  pull_request:
    paths:
      - '.github/workflows/graphify-onboarding-review.yml'
      - 'src/screens/onboarding/**'
      - 'src/utils/i18n.js'
      - 'backend/api/profile.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: python -m pip install --disable-pip-version-check graphifyy

      - name: Build AST-only graph
        shell: bash
        run: |
          set -euo pipefail
          echo "GRAPHIFY_HEAD=$(git rev-parse HEAD)"
          echo "GRAPHIFY_STATUS_BEFORE=$(git status --porcelain | wc -l | tr -d ' ')"
          if ! graphify update . --no-cluster; then
            echo 'Initial incremental update unavailable; building local AST graph first.'
            rm -rf graphify-out
            graphify extract . --code-only
            graphify update . --no-cluster
          fi
          test -s graphify-out/graph.json
          if [ -f graphify-out/GRAPH_REPORT.md ]; then
            sed -n '1,240p' graphify-out/GRAPH_REPORT.md > /tmp/graphify-report-preview.txt
          else
            : > /tmp/graphify-report-preview.txt
          fi
          echo '--- GRAPHIFY REPORT PREVIEW ---'
          cat /tmp/graphify-report-preview.txt
          echo '--- ONBOARDING REFERENCES ---'
          python - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('graphify-out/graph.json').read_text(encoding='utf-8'))
          needles = ('RoleScreenV2', 'ProfileV2Screen', 'useI18n', 'update_profile', 'UpdateProfileIn', 'useAuth')
          nodes = graph.get('nodes', [])
          edges = graph.get('edges', [])
          selected = []
          ids = set()
          for node in nodes:
              blob = json.dumps(node, ensure_ascii=False)
              if any(n in blob for n in needles):
                  selected.append(node)
                  nid = node.get('id') or node.get('key') or node.get('name')
                  if nid is not None:
                      ids.add(str(nid))
          print(json.dumps({'nodes': selected[:80]}, ensure_ascii=False, indent=2))
          related = []
          for edge in edges:
              blob = json.dumps(edge, ensure_ascii=False)
              if any(n in blob for n in needles) or any(i in blob for i in ids):
                  related.append(edge)
          print(json.dumps({'edges': related[:160]}, ensure_ascii=False, indent=2))
          PY

      - name: Upload Graphify artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphify-onboarding-${{ github.sha }}
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: error
          retention-days: 7
