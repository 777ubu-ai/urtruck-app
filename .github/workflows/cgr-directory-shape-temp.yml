name: TEMP CGR directory shape
on:
  push:
    branches: [agent/full-cgr-checkpoint-catalog-20260816]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CGR checkpoint cards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          curl -fsSL -A 'UrTruck/1.0 (+https://urtruck.kz; partner-integration)' 'https://cgr.qoldau.kz/ru/registry/checkpoint/list?p=2' -o /tmp/p2.html
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          import re
          s=BeautifulSoup(open('/tmp/p2.html',encoding='utf-8').read(),'html.parser')
          for a in s.find_all('a', href=True):
              if re.search(r'/registry/checkpoint/list/\d+/view', a.get('href','')) and ('Калжат' in a.get_text(' ',strip=True) or 'Кайрак' in a.get_text(' ',strip=True)):
                  print('ANCHOR',a.get_text(' ',strip=True),a['href'])
                  p=a
                  for i in range(1,7):
                      p=p.parent
                      if p is None: break
                      text=' | '.join(p.stripped_strings)
                      print('PARENT',i,p.name,p.get('class'),text[:900])
          PY
