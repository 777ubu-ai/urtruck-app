name: Upload verified existing AAB to Play library

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Введите UPLOAD_BUNDLE_LIBRARY: только библиотека, releases не меняются"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: google-play-${{ github.repository }}
  cancel-in-progress: false

jobs:
  upload-draft:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'UPLOAD_BUNDLE_LIBRARY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout protected exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download and verify existing immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 777ubu-ai/urtruck-app
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          gh api repos/777ubu-ai/urtruck-app/actions/runs/40731167085 > "$RUNNER_TEMP/aab-run.json"
          gh api repos/777ubu-ai/urtruck-app/actions/artifacts/12836194179/zip > "$RUNNER_TEMP/aab.zip"
          python3 scripts/ops/upload_existing_play_draft.py verify --root "$RUNNER_TEMP"
      - name: Save bundle in library without changing tracks
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/ops/upload_existing_play_draft.py upload --root "$RUNNER_TEMP"
