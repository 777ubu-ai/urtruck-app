name: Admin Web CI

on:
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  push:
    branches:
      - 'feature/urtruck-admin-control-center-20260915'
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
