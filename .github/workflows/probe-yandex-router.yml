name: Probe Yandex Router entitlement

on:
  push:
    branches: [fix/map-clean-route-yandex-runtime-20260817]

permissions:
  contents: write

jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[router-probed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-clean-route-yandex-runtime-20260817
          fetch-depth: 0
      - name: Probe existing Yandex key against Router API
        env:
          KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${KEY:-}" || { echo 'ROUTER_PROBE=no-key'; exit 1; }
          code=$(curl -sS -o /tmp/router.json -w '%{http_code}' \
            "https://api.routing.yandex.net/v2/route?waypoints=43.2220,76.8512%7C46.7500,82.7000&mode=truck&traffic=disabled&apikey=${KEY}")
          echo "ROUTER_HTTP=${code}"
          python3 - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/router.json'))
          except Exception:
              print('ROUTER_BODY=non-json')
              raise SystemExit(0)
          route=data.get('route') or {}
          legs=route.get('legs') or []
          ok=bool(legs) and any((x.get('status')=='OK') for x in legs if isinstance(x,dict))
          print('ROUTER_ROUTE_OK=' + ('yes' if ok else 'no'))
          if not ok:
              # Print only non-secret high-level API error fields.
              for k in ('error','message','status'):
                  if k in data: print(f'ROUTER_{k.upper()}={str(data[k])[:180]}')
          PY
      - name: Remove probe workflow and mark result
        run: |
          git config user.name "UrTruck Release Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/probe-yandex-router.yml
          git add .github/workflows/probe-yandex-router.yml
          git commit -m "chore(map): router entitlement probed [router-probed]"
          git push origin HEAD:fix/map-clean-route-yandex-runtime-20260817
