name: UrTruck Pro Test backend payments env

# Настройка env платежей только на отдельном UrTruck Pro Test backend:
# PREMIUM_CONTACT_LIMIT=30 + GOOGLE_PLAY_SERVICE_ACCOUNT_JSON (real-режим
# верификации покупок вместо MOCK). CONTACTS_MONETIZATION_ENABLED НЕ трогает —
# платный гейт включается только по решению владельца.
#
# Запуск: Actions → Backend payments env → Run workflow (ветка payments).
# Требует секреты PRO_TEST_SERVER_* / PLAY_SERVICE_ACCOUNT_JSON.

on:
  workflow_dispatch:
  push:
    branches: [pro/urtruck-paid-test]
    paths:
      - ".github/workflows/backend-payments-env.yml"

jobs:
  update-env:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Pro Test source
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Package isolated backend source
        run: |
          set -euo pipefail
          tar -czf /tmp/pro-test-backend.tgz \
            --exclude='backend/.env' \
            --exclude='backend/venv' \
            --exclude='backend/__pycache__' \
            --exclude='backend/database/*.db*' \
            backend
          test -s /tmp/pro-test-backend.tgz

      - name: Build env patch and merge script
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          sa = os.environ["SA_JSON"].strip()
          json.loads(sa)  # валидация: это корректный JSON
          assert "'" not in sa, "unexpected single quote in service account JSON"
          with open("/tmp/env_patch", "w", encoding="utf-8") as f:
              f.write("URTRUCK_ENV=production\n")
              f.write("DB_PATH=/home/ubuntu/urtruck-pro-test/backend/database/security.db\n")
              f.write("PREMIUM_CONTACT_LIMIT=30\n")
              f.write("CONTACTS_MONETIZATION_ENABLED=true\n")
              f.write("DEAL_ACCEPT_MONETIZATION_ENABLED=true\n")
              f.write("FREE_DEAL_ACCEPT_LIMIT=5\n")
              f.write("PRO_DEAL_ACCEPT_LIMIT=30\n")
              f.write("BETA_MODE=false\n")
              f.write("GOOGLE_PLAY_PACKAGE_NAME=com.urtruck.protest\n")
              f.write("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON='%s'\n" % sa)
          print("patch bytes:", os.path.getsize("/tmp/env_patch"))
          PY
          cat > /tmp/merge_env.py <<'PY'
          import sys
          patch_path, env_path = sys.argv[1], sys.argv[2]
          patch = {}
          with open(patch_path, encoding="utf-8") as f:
              for line in f:
                  line = line.rstrip("\n")
                  if not line or line.lstrip().startswith("#") or "=" not in line:
                      continue
                  k, v = line.split("=", 1)
                  patch[k.strip()] = v
          lines = open(env_path, encoding="utf-8").read().splitlines()
          seen, out = set(), []
          for line in lines:
              if "=" in line and not line.lstrip().startswith("#"):
                  k = line.split("=", 1)[0].strip()
                  if k in patch:
                      out.append("%s=%s" % (k, patch[k]))
                      seen.add(k)
                      continue
              out.append(line)
          for k, v in patch.items():
              if k not in seen:
                  out.append("%s=%s" % (k, v))
          with open(env_path, "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          print("patched keys:", ", ".join(sorted(patch)))
          PY

      - name: Copy patch to server
        env:
          SSH_USER: ${{ secrets.PRO_TEST_SERVER_USER || secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.PRO_TEST_SERVER_HOST || secrets.SERVER_HOST }}
          SSH_PASS: ${{ secrets.PRO_TEST_SERVER_PASS || secrets.SERVER_PASS }}
        run: |
          set -euo pipefail
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=accept-new \
            /tmp/pro-test-backend.tgz /tmp/env_patch /tmp/merge_env.py \
            "$SSH_USER@$SSH_HOST":/tmp/

      - name: Deploy isolated backend and apply env patch
        env:
          SSH_USER: ${{ secrets.PRO_TEST_SERVER_USER || secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.PRO_TEST_SERVER_HOST || secrets.SERVER_HOST }}
          SSH_PASS: ${{ secrets.PRO_TEST_SERVER_PASS || secrets.SERVER_PASS }}
        run: |
          set -euo pipefail
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" '
            set -euo pipefail
            TARGET=/home/ubuntu/urtruck-pro-test/backend
            mkdir -p "$TARGET/database"
            if [ ! -f "$TARGET/.env" ]; then
              for SOURCE_ENV in /home/ubuntu/urtruck-security/.env /home/ubuntu/urtruck/backend/.env; do
                if [ -f "$SOURCE_ENV" ]; then
                  cp "$SOURCE_ENV" "$TARGET/.env"
                  chmod 600 "$TARGET/.env"
                  break
                fi
              done
            fi
            test -f "$TARGET/.env"
            cp "$TARGET/.env" "$TARGET/.env.bak.payments-$(date +%Y%m%d_%H%M%S)"
            tar -xzf /tmp/pro-test-backend.tgz -C "$TARGET" --strip-components=1
            python3 /tmp/merge_env.py /tmp/env_patch "$TARGET/.env"
            cd "$TARGET"
            if [ ! -x venv/bin/python ]; then
              python3 -m venv venv
            fi
            venv/bin/python -m pip install --disable-pip-version-check -q -r requirements.txt
            rm -f /tmp/pro-test-backend.tgz /tmp/env_patch /tmp/merge_env.py
          '

      - name: Validate config parses, restart uvicorn, verify
        env:
          SSH_USER: ${{ secrets.PRO_TEST_SERVER_USER || secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.PRO_TEST_SERVER_HOST || secrets.SERVER_HOST }}
          SSH_PASS: ${{ secrets.PRO_TEST_SERVER_PASS || secrets.SERVER_PASS }}
        run: |
          set -euo pipefail
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" '
            set -euo pipefail
            cd /home/ubuntu/urtruck-pro-test/backend
            venv/bin/python -c "import config; assert config.GOOGLE_PLAY_PACKAGE_NAME == 'com.urtruck.protest'; assert config.FREE_DEAL_ACCEPT_LIMIT == 5; assert config.PRO_DEAL_ACCEPT_LIMIT == 30; assert config.CONTACTS_MONETIZATION_ENABLED; assert config.DEAL_ACCEPT_MONETIZATION_ENABLED; assert not config.BETA_MODE; assert config.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; print('UrTruck Pro Test payments config OK')"
            PIDS=$(pgrep -af "uvicorn.*main:app.*--port 8002" | awk "{print \$1}" || true)
            if [ -n "$PIDS" ]; then
              kill -TERM $PIDS || true
              sleep 3
              LEFT=$(pgrep -af "uvicorn.*main:app.*--port 8002" | awk "{print \$1}" || true)
              [ -z "$LEFT" ] || { kill -KILL $LEFT || true; sleep 1; }
            fi
            nohup venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8002 > uvicorn.log 2>&1 &
            disown || true
            sleep 5
            test "$(pgrep -cf "uvicorn.*main:app.*--port 8002")" -ge 1
            echo -n "version: "; curl -fsS http://127.0.0.1:8002/api/version
            echo
            echo -n "payments router (ожидаем 401/403 без авторизации): "
            curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8002/api/v1/payments/subscription/status
          '
