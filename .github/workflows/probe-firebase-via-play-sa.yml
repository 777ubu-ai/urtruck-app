name: Probe Firebase via Play service account

on:
  push:
    branches: [fix/android-push-fcm-20260816]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Probe Firebase Management API read-only
        run: |
          set -euo pipefail
          if [ -z "$PLAY_SA" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON=absent"
            exit 0
          fi
          echo "PLAY_SERVICE_ACCOUNT_JSON=present"
          python3 -m pip install -q google-auth requests
          python3 - <<'PY'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          raw = json.loads(os.environ['PLAY_SA'])
          project = raw.get('project_id')
          if not project:
              print('firebase_project_probe=no_project_id')
              raise SystemExit(0)
          creds = service_account.Credentials.from_service_account_info(
              raw, scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(Request())
          h = {'Authorization': f'Bearer {creds.token}'}
          base = 'https://firebase.googleapis.com/v1beta1'
          r = requests.get(f'{base}/projects/{project}', headers=h, timeout=20)
          print(f'firebase_project_probe=http_{r.status_code}')
          if r.status_code != 200:
              raise SystemExit(0)
          apps = requests.get(f'{base}/projects/{project}/androidApps', headers=h, timeout=20)
          print(f'firebase_android_apps_probe=http_{apps.status_code}')
          if apps.status_code != 200:
              raise SystemExit(0)
          items = apps.json().get('apps', [])
          matches = [a for a in items if a.get('packageName') == 'com.urtruck.app']
          print(f'urtruck_android_app_found={"yes" if matches else "no"}')
          if matches:
              app_name = matches[0].get('name')
              cfg = requests.get(f'{base}/{app_name}/config', headers=h, timeout=20)
              print(f'google_services_config_probe=http_{cfg.status_code}')
              if cfg.status_code == 200:
                  # Validate shape only. Do not print config.
                  data = cfg.json()
                  print(f'google_services_config_valid={"yes" if data.get("configFileContents") else "no"}')
          PY
