name: iOS TestFlight (Biz Chat)

# Собирает Biz Chat (Flutter) под iOS на macOS-раннере и заливает в TestFlight.
#
# ЗАПУСК: вручную — Actions → "iOS TestFlight (Biz Chat)" → Run workflow.
#
# ТРЕБУЕМЫЕ СЕКРЕТЫ (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       — Key ID ключа App Store Connect API
#   ASC_ISSUER_ID    — Issuer ID
#   ASC_KEY_CONTENT  — содержимое .p8 в base64 (cat AuthKey_XXXX.p8 | base64)
#   APPLE_TEAM_ID    — Team ID разработчика (App Store Connect → Membership)
#
# ПРЕДВАРИТЕЛЬНО в App Store Connect должно существовать приложение
# с bundle id app.bizchat (создаётся один раз вручную: My Apps → + → New App).

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight-bizchat
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bizchat/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter deps
        run: flutter pub get

      - name: Build iOS (Dart/Flutter, без подписи)
        # Компилирует Dart + генерирует Podfile + pod install + собирает Runner.app.
        # Подпись делает fastlane на следующем шаге.
        run: >
          flutter build ios --release --no-codesign
          --build-name=1.0.15
          --build-number=${{ github.run_number }}

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Upload to TestFlight
        working-directory: bizchat/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: fastlane beta

      - name: Upload .ipa as artifact (на случай ручной заливки)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BizChat-ipa
          path: bizchat/mobile/ios/build/BizChat.ipa
          if-no-files-found: ignore
          retention-days: 5
