name: Hotfix DB schema (factory bio/contacts)

# СРОЧНО: лента и каталог падают с 500 — «column factory.website does not exist».
# Сущность Factory получила поля website/whatsapp и description как text, но
# миграция на сервер не применилась: в production-образе backend нет ts-node и
# TypeORM CLI (там только собранный dist/ и prod-зависимости), поэтому
# `npm run migration:run` не отрабатывает.
#
# Применяем те же изменения напрямую через psql и отмечаем миграцию
# выполненной, чтобы состояние схемы и таблица migrations совпадали.

on:
  workflow_dispatch:
  push:
    branches: [claude/biz-chat-inquiry-6v7qi2]
    paths: ['.github/workflows/hotfix-db-schema.yml']

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply schema changes via psql
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOS'
          set -e
          PG=bizchat-postgres-prod
          DBU=$(docker exec bizchat-backend-prod printenv DB_USERNAME 2>/dev/null || echo bizchat)
          DBN=$(docker exec bizchat-backend-prod printenv DB_DATABASE 2>/dev/null || echo bizchat)
          echo "БД: $DBN, пользователь: $DBU"

          echo "== Применяем изменения схемы =="
          docker exec "$PG" psql -U "$DBU" -d "$DBN" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE factories ALTER COLUMN description TYPE text;
          ALTER TABLE factories ADD COLUMN IF NOT EXISTS website varchar(256);
          ALTER TABLE factories ADD COLUMN IF NOT EXISTS whatsapp varchar(32);
          INSERT INTO migrations (timestamp, name)
          SELECT 1744450000000, 'FactoryBioAndContacts1744450000000'
          WHERE NOT EXISTS (
            SELECT 1 FROM migrations WHERE name = 'FactoryBioAndContacts1744450000000'
          );
          SQL

          echo "== Проверка колонок =="
          docker exec "$PG" psql -U "$DBU" -d "$DBN" -c "\d factories" | grep -E "description|website|whatsapp"

          echo "== Перезапуск backend (сброс кеша метаданных) =="
          cd /home/ubuntu/bizchat/infra
          docker compose -f docker-compose.production.yml -f docker-compose.staging.yml --env-file .env.production restart backend
          for i in $(seq 1 30); do
            S=$(docker inspect -f '{{.State.Health.Status}}' bizchat-backend-prod 2>/dev/null || echo starting)
            [ "$S" = "healthy" ] && { echo "backend healthy"; break; }
            sleep 3
          done
          EOS

      - name: Verify feed and catalog recovered
        run: |
          set -e
          for i in $(seq 1 10); do
            feed=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" "https://biz-chat.net/api/v1/posts/feed?limit=1" || true)
            cat=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" "https://biz-chat.net/api/v1/factories?limit=1" || true)
            echo "проба $i — лента: $feed, каталог: $cat"
            if [ "$feed" = "200" ] && [ "$cat" = "200" ]; then
              echo "✅ Лента и каталог восстановлены"; exit 0
            fi
            sleep 6
          done
          echo "::error::Сервисы не восстановились"; exit 1
