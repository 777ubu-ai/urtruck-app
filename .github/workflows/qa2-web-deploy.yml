name: Deploy QA2 Web

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_QA2_WEB
        required: true
        type: string

concurrency:
  group: urtruck-qa2-web-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: qa2
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASS: ${{ secrets.SERVER_PASS }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      QA_WEB_ROOT: /home/ubuntu/urtruck-qa2-web
    steps:
      - name: Require isolated QA confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "DEPLOY_QA2_WEB"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build QA web with Yandex Maps
        env:
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
          EXPO_PUBLIC_WEB_URL: https://qa2.urtruck.kz
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY"
          npm ci
          npm run build:web
          node scripts/injectYandexMaps.mjs
          grep -q 'api-maps.yandex.ru/2.1/' dist/index.html
          grep -q 'lang=ru_RU' dist/index.html
          cp sw-template.js dist/sw.js

      - name: Pin configured SSH host key
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KNOWN_HOSTS" || { echo '::error::SERVER_SSH_KNOWN_HOSTS_REQUIRED'; exit 1; }
          known_hosts_file="$RUNNER_TEMP/urtruck-qa2-known-hosts"
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"
          echo "QA2_SSH_KNOWN_HOSTS_FILE=$known_hosts_file" >> "$GITHUB_ENV"

      - name: Upload immutable QA web release
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync
          export SSHPASS="$SERVER_PASS"
          release="$QA_WEB_ROOT/releases/${GITHUB_SHA}"
          sshpass -e ssh -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$QA_WEB_ROOT/releases' && mkdir '$release'"
          sshpass -e rsync -az -e "ssh -o UserKnownHostsFile=$QA2_SSH_KNOWN_HOSTS_FILE -o StrictHostKeyChecking=yes" \
            dist/ "$SERVER_USER@$SERVER_HOST:$release/"
          sshpass -e ssh -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "test -s '$release/index.html' && grep -q 'api-maps.yandex.ru/2.1/' '$release/index.html' && test -s '$release/build-info.json'"

      - name: Route only QA2 web root to the static release
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASS"
          sshpass -e ssh -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS_FILE" -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "QA_WEB_ROOT='$QA_WEB_ROOT' QA_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          site=/etc/nginx/sites-available/urtruck-qa2
          backup="$QA_WEB_ROOT/nginx.before-${QA_SHA}"
          test -f "$site" && test -L "$QA_WEB_ROOT/current"
          previous="$(readlink "$QA_WEB_ROOT/current")"
          test -n "$previous" && test -d "$QA_WEB_ROOT/current"
          test -f "$QA_WEB_ROOT/releases/$QA_SHA/index.html"
          grep -Fq 'server_name qa2.urtruck.kz;' "$site"
          grep -Fq 'root /home/ubuntu/urtruck-qa2-web/current;' "$site"
          grep -Fq 'proxy_pass http://127.0.0.1:8002;' "$site"
          python3 - "$site" <<'PY'
          import re, sys
          config = open(sys.argv[1], encoding='utf-8').read()
          for path, upstream in (('/qa2/storage/', '/storage/'), ('/storage/', '/storage/'), ('/security/storage/', '/security/storage/')):
              pattern = r'location\s+\^~\s+' + re.escape(path) + r'\s*\{([^{}]*)\}'
              matches = re.findall(pattern, config, flags=re.S)
              expected = 'proxy_pass http://127.0.0.1:8002' + upstream + ';'
              if len(matches) != 1 or expected not in matches[0]:
                  raise SystemExit('QA2_PRIVATE_STORAGE_ROUTING_INVALID')
          PY
          sudo cp -a "$site" "$backup"
          printf '%s\n' "$previous" > "$QA_WEB_ROOT/previous.before-${QA_SHA}"
          sudo nginx -t
          chmod -R a+rX "$QA_WEB_ROOT/releases/$QA_SHA"
          rollback() {
            rc=$?
            if test "$rc" -ne 0; then
              ln -sfn "$previous" "$QA_WEB_ROOT/current"
              echo 'QA2_WEB_ROLLBACK=previous-symlink' >&2
            fi
            exit "$rc"
          }
          trap rollback EXIT
          ln -sfn "$QA_WEB_ROOT/releases/$QA_SHA" "$QA_WEB_ROOT/current"
          sudo nginx -t
          actual="$(curl -fsS --max-time 20 --resolve qa2.urtruck.kz:443:127.0.0.1 https://qa2.urtruck.kz/build-info.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["commit"])')"
          test "$actual" = "$QA_SHA"
          curl -fsS --max-time 20 --resolve qa2.urtruck.kz:443:127.0.0.1 https://qa2.urtruck.kz/api/version >/dev/null
          trap - EXIT
          REMOTE

      - name: Verify QA web and API without touching production
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 20 https://qa2.urtruck.kz/)"
          printf '%s' "$html" | grep -q 'api-maps.yandex.ru/2.1/'
          curl -fsS --max-time 20 https://qa2.urtruck.kz/api/version >/dev/null
          curl -fsS --max-time 20 https://qa2.urtruck.kz/health >/dev/null
          prod="$(curl -fsS --max-time 20 https://urtruck.kz/api/version)"
          test -n "$prod"
          echo "QA2_WEB_DEPLOY=ok"
