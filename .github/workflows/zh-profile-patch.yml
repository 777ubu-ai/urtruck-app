name: ZH Profile Patch
on:
  push:
    branches: [fix/zh-localization-10of10-20260816]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[zh-profile-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zh-localization-10of10-20260816
          fetch-depth: 0
      - name: Patch profile localization
        run: |
          python3 <<'PY'
          from pathlib import Path
          def rep(path, old, new, n=1):
              p=Path(path); s=p.read_text(); c=s.count(old)
              if c != n: raise SystemExit(f'{path}: expected {n}, got {c}: {old[:80]}')
              p.write_text(s.replace(old,new))

          p='src/screens/ProfileScreen.js'
          rep(p, "import { IS_BETA } from '../config/supabase';", "import { IS_BETA } from '../config/supabase';\nimport AppConfirmModal from '../components/ui/AppConfirmModal';\nimport { localizePlace } from '../utils/places';")
          s=Path(p).read_text()
          a=s.index('// Stage 26: confirm()')
          b=s.index('export default function ProfileScreen', a)
          s=s[:a]+s[b:]
          Path(p).write_text(s)
          rep(p, "const [lang, setLang] = useState(getLanguage());", """const [lang, setLang] = useState(getLanguage());\n  const [confirmDialog, setConfirmDialog] = useState(null);\n  const askConfirm = useCallback((title, message = '', confirmLabel = t('confirm')) => new Promise((resolve) => setConfirmDialog({ title, message, confirmLabel, resolve })), [t]);\n  const settleConfirm = useCallback((answer) => { setConfirmDialog((current) => { current?.resolve?.(answer); return null; }); }, []);""")
          rep(p, "        profile.city,", "        localizePlace(profile.city, uiLang),")
          s=Path(p).read_text()
          start=s.index("          onPress={() => confirm(\n            t('logout_title')")
          end=s.index("          testID=\"profile-logout\"", start)
          replacement="""          onPress={async () => {\n            const ok = await askConfirm(t('logout_title') || t('logout'), t('logout_message'), t('logout_confirm') || t('logout'));\n            if (!ok) return;\n            try { await signOut(); } catch {}\n          }}\n"""
          s=s[:start]+replacement+s[end:]
          Path(p).write_text(s)
          rep(p, """      </ScrollView>\n    </SafeAreaView>""", """      </ScrollView>\n      <AppConfirmModal visible={!!confirmDialog} title={confirmDialog?.title} message={confirmDialog?.message} cancelLabel={t('cancel')} confirmLabel={confirmDialog?.confirmLabel || t('confirm')} onCancel={() => settleConfirm(false)} onConfirm={() => settleConfirm(true)} testID=\"profile-confirm-modal\" />\n    </SafeAreaView>""")

          p='src/screens/EditProfileScreen.js'
          rep(p, "import {v1Colors, useV1Colors, v1Spacing, v1Typography, v1AccentFor, v1Radius} from '../theme/designV1';", "import {v1Colors, useV1Colors, v1Spacing, v1Typography, v1AccentFor, v1Radius} from '../theme/designV1';\nimport AppConfirmModal from '../components/ui/AppConfirmModal';\nimport { localizePlace } from '../utils/places';")
          rep(p, "const { t } = useI18n();", "const { t, lang } = useI18n();")
          rep(p, "const [deleting, setDeleting] = useState(false);", """const [deleting, setDeleting] = useState(false);\n  const [confirmDialog, setConfirmDialog] = useState(null);\n  const askConfirm = (title, message = '', confirmLabel = t('confirm'), destructive = false) => new Promise((resolve) => setConfirmDialog({ title, message, confirmLabel, destructive, resolve }));\n  const settleConfirm = (answer) => { setConfirmDialog((current) => { current?.resolve?.(answer); return null; }); };""")
          s=Path(p).read_text()
          start=s.index('  const confirmDeleteAccount = () => {')
          end=s.index('\n\n  return (', start)
          s=s[:start]+"""  const confirmDeleteAccount = async () => {\n    const ok = await askConfirm(t('delete_account_title'), t('delete_account_confirm'), t('delete_account_btn'), true);\n    if (ok) doDeleteAccount();\n  };"""+s[end:]
          Path(p).write_text(s)
          rep(p, "{b}</Text>", "{localizePlace(b, lang)}</Text>")
          rep(p, """      </TouchableOpacity>\n    </Screen>""", """      </TouchableOpacity>\n      <AppConfirmModal visible={!!confirmDialog} title={confirmDialog?.title} message={confirmDialog?.message} cancelLabel={t('cancel')} confirmLabel={confirmDialog?.confirmLabel || t('confirm')} destructive={!!confirmDialog?.destructive} onCancel={() => settleConfirm(false)} onConfirm={() => settleConfirm(true)} testID=\"edit-profile-confirm-modal\" />\n    </Screen>""")

          for f in ['src/screens/ProfileScreen.js','src/screens/EditProfileScreen.js']:
              s=Path(f).read_text()
              if 'window.confirm(' in s: raise SystemExit(f'{f}: window.confirm call remains')
          PY
      - name: Commit
        run: |
          git config user.name "UrTruck QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/ProfileScreen.js src/screens/EditProfileScreen.js
          git commit -m "fix(i18n): localize profile cities and confirms [zh-profile-patch]"
          git push origin HEAD:fix/zh-localization-10of10-20260816
