name: ZH Profile Patch

on:
  push:
    branches: [fix/zh-localization-10of10-20260816]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[zh-profile-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zh-localization-10of10-20260816
          fetch-depth: 0
      - name: Patch profile localization
        run: |
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new, n=1):
              p=Path(path); s=p.read_text(); c=s.count(old)
              if c != n: raise SystemExit(f'{path}: expected {n}, got {c}: {old[:90]}')
              p.write_text(s.replace(old,new))

          # ProfileScreen: logout confirm must use app locale, client city localized.
          p='src/screens/ProfileScreen.js'
          rep(p, "import { IS_BETA } from '../config/supabase';", "import { IS_BETA } from '../config/supabase';\nimport AppConfirmModal from '../components/ui/AppConfirmModal';\nimport { localizePlace } from '../utils/places';")
          start="""// Stage 26: confirm() теперь принимает локализованные кнопки и\n// нормальный message (раньше message был жёстко \"?\", а cancel был\n// \"✕\"). Все три параметра title/msg/labels должны проходить через\n// i18n, помойте, без литералов.\nconst confirm = (title, msg, onOk, cancelLabel = 'Отмена', confirmLabel = 'OK') => {\n  if (Platform.OS === 'web') {\n    if (typeof window === 'undefined' || !window.confirm) { onOk(); return; }\n    if (window.confirm(title + (msg ? '\\n\\n' + msg : ''))) onOk();\n  } else {\n    Alert.alert(title, msg || '', [\n      { text: cancelLabel, style: 'cancel' },\n      { text: confirmLabel, onPress: onOk },\n    ]);\n  }\n};\n\n"""
          rep(p, start, '')
          rep(p, "const [lang, setLang] = useState(getLanguage());", """const [lang, setLang] = useState(getLanguage());\n  const [confirmDialog, setConfirmDialog] = useState(null);\n  const askConfirm = useCallback((title, message = '', confirmLabel = t('confirm')) => (\n    new Promise((resolve) => setConfirmDialog({ title, message, confirmLabel, resolve }))\n  ), [t]);\n  const settleConfirm = useCallback((answer) => {\n    setConfirmDialog((current) => { current?.resolve?.(answer); return null; });\n  }, []);""")
          rep(p, "        profile.city,", "        localizePlace(profile.city, uiLang),")
          old="""          onPress={() => confirm(\n            t('logout_title') || t('logout'),\n            t('logout_message'),\n            async () => {\n              // signOut() (async) чистит session+hasToken → AppNavigator\n              // реактивно переключает на неавторизованный стек. Прежний\n              // navigation.reset({OnboardingV2}) бил в маршрут, которого нет в\n              // authenticated-стеке → красный тост «RESET not handled». Убран.\n              try { await signOut(); } catch {}\n            },\n            t('cancel') || 'Отмена',\n            t('logout_confirm') || t('logout'),\n          )}"""
          new="""          onPress={async () => {\n            const ok = await askConfirm(t('logout_title') || t('logout'), t('logout_message'), t('logout_confirm') || t('logout'));\n            if (!ok) return;\n            try { await signOut(); } catch {}\n          }}"""
          rep(p, old, new)
          rep(p, """      </ScrollView>\n    </SafeAreaView>""", """      </ScrollView>\n      <AppConfirmModal\n        visible={!!confirmDialog}\n        title={confirmDialog?.title}\n        message={confirmDialog?.message}\n        cancelLabel={t('cancel')}\n        confirmLabel={confirmDialog?.confirmLabel || t('confirm')}\n        onCancel={() => settleConfirm(false)}\n        onConfirm={() => settleConfirm(true)}\n        testID=\"profile-confirm-modal\"\n      />\n    </SafeAreaView>""")

          # EditProfileScreen: delete-account dialog and border names localized.
          p='src/screens/EditProfileScreen.js'
          rep(p, "import {v1Colors, useV1Colors, v1Spacing, v1Typography, v1AccentFor, v1Radius} from '../theme/designV1';", "import {v1Colors, useV1Colors, v1Spacing, v1Typography, v1AccentFor, v1Radius} from '../theme/designV1';\nimport AppConfirmModal from '../components/ui/AppConfirmModal';\nimport { localizePlace } from '../utils/places';")
          rep(p, "const { t } = useI18n();", "const { t, lang } = useI18n();")
          rep(p, "const [deleting, setDeleting] = useState(false);", """const [deleting, setDeleting] = useState(false);\n  const [confirmDialog, setConfirmDialog] = useState(null);\n  const askConfirm = (title, message = '', confirmLabel = t('confirm'), destructive = false) => (\n    new Promise((resolve) => setConfirmDialog({ title, message, confirmLabel, destructive, resolve }))\n  );\n  const settleConfirm = (answer) => {\n    setConfirmDialog((current) => { current?.resolve?.(answer); return null; });\n  };""")
          old="""  const confirmDeleteAccount = () => {\n    const title = t('delete_account_title') || 'Удалить аккаунт?';\n    const msg = t('delete_account_confirm') ||\n      'Все ваши данные будут удалены безвозвратно. Это действие нельзя отменить.';\n    if (Platform.OS === 'web') {\n      if (typeof window !== 'undefined' && window.confirm(`${title}\\n\\n${msg}`)) {\n        doDeleteAccount();\n      }\n      return;\n    }\n    Alert.alert(title, msg, [\n      { text: t('cancel') || 'Отмена', style: 'cancel' },\n      { text: t('delete_account_btn') || 'Удалить', style: 'destructive', onPress: doDeleteAccount },\n    ]);\n  };"""
          new="""  const confirmDeleteAccount = async () => {\n    const ok = await askConfirm(t('delete_account_title'), t('delete_account_confirm'), t('delete_account_btn'), true);\n    if (ok) doDeleteAccount();\n  };"""
          rep(p, old, new)
          rep(p, "{b}</Text>", "{localizePlace(b, lang)}</Text>", n=1)
          rep(p, """      </TouchableOpacity>\n    </Screen>""", """      </TouchableOpacity>\n      <AppConfirmModal\n        visible={!!confirmDialog}\n        title={confirmDialog?.title}\n        message={confirmDialog?.message}\n        cancelLabel={t('cancel')}\n        confirmLabel={confirmDialog?.confirmLabel || t('confirm')}\n        destructive={!!confirmDialog?.destructive}\n        onCancel={() => settleConfirm(false)}\n        onConfirm={() => settleConfirm(true)}\n        testID=\"edit-profile-confirm-modal\"\n      />\n    </Screen>""")

          for f in ['src/screens/ProfileScreen.js','src/screens/EditProfileScreen.js']:
              s=Path(f).read_text()
              if 'window.confirm' in s: raise SystemExit(f'{f}: window.confirm remains')
          PY
      - name: Commit
        run: |
          git config user.name "UrTruck QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/ProfileScreen.js src/screens/EditProfileScreen.js
          git commit -m "fix(i18n): localize profile cities and confirms [zh-profile-patch]"
          git push origin HEAD:fix/zh-localization-10of10-20260816
