name: Probe Yandex loader HTTP

on:
  push:
    branches: [fix/map-clean-route-yandex-runtime-20260817]

permissions:
  contents: write

jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[loader-http-probed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-clean-route-yandex-runtime-20260817
          fetch-depth: 0
      - name: Probe Yandex Maps v3 loader without exposing key
        env:
          KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${KEY:-}" || { echo 'LOADER_KEY=missing'; exit 1; }
          URL="https://api-maps.yandex.ru/v3/?apikey=${KEY}&lang=ru_RU"
          for mode in none referer origin; do
            hdr=()
            if [ "$mode" = referer ]; then hdr=(-H 'Referer: https://urtruck.kz/'); fi
            if [ "$mode" = origin ]; then hdr=(-H 'Origin: https://urtruck.kz'); fi
            code=$(curl -L -sS --max-time 20 -o "/tmp/yandex-${mode}.txt" -w '%{http_code}' "${hdr[@]}" "$URL" || true)
            size=$(wc -c < "/tmp/yandex-${mode}.txt" 2>/dev/null || echo 0)
            ctype=$(curl -L -sS -I --max-time 20 "${hdr[@]}" "$URL" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2; exit}')
            echo "YANDEX_LOADER_${mode^^}_HTTP=$code SIZE=$size TYPE=${ctype:-unknown}"
            python3 - "$mode" <<'PY'
          import sys,re
          mode=sys.argv[1]
          p=f'/tmp/yandex-{mode}.txt'
          try: s=open(p,encoding='utf-8',errors='ignore').read(500)
          except Exception: s=''
          # print only safe diagnostics, never the page body or API key
          low=s.lower()
          tags=[]
          for x in ('forbidden','unauthorized','referer','apikey','error','ymaps3'):
              if x in low: tags.append(x)
          print('YANDEX_LOADER_'+mode.upper()+'_TAGS=' + ','.join(tags))
          PY
          done
      - name: Remove probe workflow
        if: always()
        run: |
          git config user.name "UrTruck Release Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/probe-yandex-loader-http.yml
          git add .github/workflows/probe-yandex-loader-http.yml
          git commit -m "chore(map): loader HTTP probed [loader-http-probed]" || true
          git push origin HEAD:fix/map-clean-route-yandex-runtime-20260817
