name: Deploy UrTruck external feed components to QA2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSTALL_URTRUCK_FEED_QA2
        required: true
        type: string
      source_sha:
        description: Exact SHA already promoted to qa2/integration-candidate
        required: true
        type: string

concurrency:
  group: urtruck-qa2-external-feed-components
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  feed-preflight:
    name: Verify exact source and feed regressions
    if: github.ref_name == 'qa2/integration-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Require exact promoted QA2 source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = qa2/integration-candidate
          [[ "$QA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$QA_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          git fetch --no-tags origin qa2/integration-candidate
          git merge-base --is-ancestor "$QA_SOURCE_SHA" origin/qa2/integration-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-test.txt
      - name: Run external-feed backend regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          APP_ENV: test
          CGR_IIN_SALT: ci-feed-deploy-not-a-secret
        run: >-
          python -m pytest -q
          backend/tests/test_telegram_feed_health.py
          backend/tests/test_telegram_feed_health_snapshot.py
          backend/tests/test_external_freight_parser.py
          backend/tests/test_external_freight_recall_formats.py
          backend/tests/test_external_freight_recall_expansion.py
          backend/tests/test_external_freight_feed.py
          backend/tests/test_external_freight_queue_bridge.py
          backend/tests/test_external_freight_continuous.py
          backend/tests/test_external_freight_vehicle_supply.py
          backend/tests/test_external_freight_production_target.py
          backend/tests/test_external_freight_promotion_guard.py
          backend/tests/test_external_freight_review_regressions.py
          backend/tests/test_scheduler_and_backup.py
      - name: Validate scoped deployment script and runtime modules
        run: |
          set -euo pipefail
          bash -n scripts/qa/deploy_external_feed_candidate.sh
          python -m py_compile backend/scheduler/jobs.py \
            backend/services/external_freight_classifier.py \
            backend/services/external_freight_import_adapter.py \
            backend/services/external_freight_queue_bridge.py
      - name: Verify deployment safety contract
        run: node --test tests/frontend/test_qa2_external_feed_deploy_workflow.mjs

  required-quality-gate:
    name: Required repository Quality Gate
    uses: ./.github/workflows/quality-gate-reusable.yml

  deploy:
    name: Back up and install only external-feed components on QA2
    needs: [feed-preflight, required-quality-gate]
    if: github.ref_name == 'qa2/integration-candidate' && inputs.confirmation == 'INSTALL_URTRUCK_FEED_QA2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: qa2
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASS: ${{ secrets.SERVER_PASS }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      QA2_API_URL: ${{ secrets.QA2_API_URL }}
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Revalidate exact source and deployment intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = INSTALL_URTRUCK_FEED_QA2
          test "$GITHUB_REF_NAME" = qa2/integration-candidate
          test "$GITHUB_SHA" = "$QA_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          git fetch --no-tags origin qa2/integration-candidate
          git merge-base --is-ancestor "$QA_SOURCE_SHA" origin/qa2/integration-candidate
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SERVER_PASS"
          test -n "$SERVER_SSH_KNOWN_HOSTS" && test "$QA2_API_URL" = https://qa2.urtruck.kz
      - name: Install pinned SSH transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Install, verify and preserve rollback on QA2
        run: bash scripts/qa/deploy_external_feed_candidate.sh
