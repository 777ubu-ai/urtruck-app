name: UrTruck Production TestFlight 1.0.15 (2)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD_PRODUCTION_TESTFLIGHT
        required: true
        type: string
      source_sha:
        description: Exact source SHA of merged PR696; client changes require a new review
        required: true
        type: string
      merged_pr_number:
        description: Merged QA2 source PR; must be 696 for this candidate
        required: true
        type: string
      last_verified_ios_build:
        description: Последний подтверждённый номер именно в версии 1.0.15; 0 для пустой серии
        required: true
        type: string
      ios_build_number:
        description: Номер новой сборки 1–100 внутри версии 1.0.15 (001 соответствует 1)
        required: true
        default: '2'
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: urtruck-ios-production-push-inbox
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 180
    # Боевые credentials остаются за штатным environment gate.
    environment: production
    env:
      APP_SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PRODUCTION_API_URL: https://urtruck.kz
      EXPO_PUBLIC_API_URL: https://urtruck.kz
      URTRUCK_BUILD_FLAVOR: production
      URTRUCK_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPO_PUBLIC_EXTERNAL_FREIGHT_FEED_ENABLED: 'true'
      # Только версия1.0.15: build2; общий EAS counter не сбрасываем.
      URTRUCK_VERSION_NAME: 1.0.15
      URTRUCK_MIN_IOS_BUILD: ${{ inputs.last_verified_ios_build }}
      URTRUCK_IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
      EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
      EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
      YANDEX_ROUTER_API_KEY: ${{ secrets.YANDEX_ROUTER_API_KEY }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}

    steps:
      - name: Checkout exact reviewed application source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify protected production TestFlight intent
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MERGED_PR_NUMBER: ${{ inputs.merged_pr_number }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = release/testflight-production-1.0.15-2-20261108
          test "$CONFIRMATION" = BUILD_PRODUCTION_TESTFLIGHT
          [[ "$APP_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGED_PR_NUMBER" =~ ^[1-9][0-9]{0,7}$ ]]
          test "$(git rev-parse HEAD)" = "$APP_SOURCE_SHA"
          test "$APP_SOURCE_SHA" = ec27f12539f9306b270be348193cc45fa380829e
          test "$MERGED_PR_NUMBER" = 696
          test "$URTRUCK_IOS_BUILD_NUMBER" = 2
          test "$URTRUCK_MIN_IOS_BUILD" = 1
          # Сборка приложения берётся из reviewed merge696; release workflow имеет отдельный SHA.
          RELEASE_PR="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=777ubu-ai:$GITHUB_REF_NAME&state=open")"
          test "$(jq 'length' <<<"$RELEASE_PR")" = 1
          test "$(jq -r '.[0].head.sha' <<<"$RELEASE_PR")" = "$GITHUB_SHA"
          test "$(jq -r '.[0].base.ref' <<<"$RELEASE_PR")" = qa2/integration-candidate
          git fetch origin "$GITHUB_SHA" --depth=1
          git diff --name-only "$APP_SOURCE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/release-diff.txt"
          python3 - "$RUNNER_TEMP/release-diff.txt" <<'PYDIFF'
          from pathlib import Path
          import sys
          allowed = {'.github/workflows/testflight-production-115-2.yml',
                     'docs/release/testflight-production-1.0.15-2.md',
                     'docs/release/testflight-production-1.0.15-2-preflight.json',
                     'tests/ops/test_production_testflight_115_2.py'}
          changed = set(Path(sys.argv[1]).read_text().splitlines())
          assert changed and changed <= allowed, changed
          PYDIFF
          RELEASE_CHECKS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
          for name in 'quality-gate / Backend tests' 'quality-gate / Frontend tests, lint, and build' 'quality-gate / Mandatory web E2E subset'; do
            test "$(jq -r --arg name "$name" '[.check_runs[]|select(.name==$name)]|sort_by(.id)|last|.conclusion // "missing"' <<<"$RELEASE_CHECKS")" = success
          done
          BACKEND_PR="$(gh api "repos/$GITHUB_REPOSITORY/pulls/695")"
          test "$(jq -r '.merged' <<<"$BACKEND_PR")" = true
          EXPECTED_BACKEND="$(jq -r '.merge_commit_sha' <<<"$BACKEND_PR")"
          export EXPECTED_BACKEND
          curl -fsS --max-time 20 https://urtruck.kz/api/version > "$RUNNER_TEMP/production-version.json"
          python3 - "$RUNNER_TEMP/production-version.json" <<'PYBACKEND'
          import json, os, sys
          value = json.load(open(sys.argv[1]))
          # Отсутствие точного runtime SHA не является PASS; формат проверяется до сборки.
          actual = value.get('source_sha') or value.get('commit_sha') or value.get('git_sha')
          assert actual == os.environ['EXPECTED_BACKEND'], 'production runtime is not verified PR695'
          PYBACKEND
          test "$GITHUB_REPOSITORY" = 777ubu-ai/urtruck-app
          [[ "$URTRUCK_MIN_IOS_BUILD" =~ ^(0|[1-9][0-9]{0,2})$ ]]
          [[ "$URTRUCK_IOS_BUILD_NUMBER" =~ ^[1-9][0-9]{0,2}$ ]]
          test "$URTRUCK_MIN_IOS_BUILD" -le 100
          test "$URTRUCK_IOS_BUILD_NUMBER" -le 100
          test "$URTRUCK_IOS_BUILD_NUMBER" -gt "$URTRUCK_MIN_IOS_BUILD"
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$MERGED_PR_NUMBER")"
          test "$(jq -r '.head.repo.full_name' <<<"$PR_JSON")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.base.ref' <<<"$PR_JSON")" = qa2/integration-candidate
          test "$(jq -r '.state' <<<"$PR_JSON")" = closed
          test "$(jq -r '.merged' <<<"$PR_JSON")" = true
          test "$(jq -r '.merge_commit_sha' <<<"$PR_JSON")" = "$APP_SOURCE_SHA"
          PR_HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          BASE_PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/605")"
          BASE_PR_SHA="$(jq -r '.merge_commit_sha' <<<"$BASE_PR_JSON")"
          test "$(jq -r '.merged' <<<"$BASE_PR_JSON")" = true
          git fetch origin "$BASE_PR_SHA" --depth=1
          git merge-base --is-ancestor "$BASE_PR_SHA" "$APP_SOURCE_SHA"
          git fetch origin "$PR_HEAD_SHA" --depth=1
          git diff --quiet "$PR_HEAD_SHA" "$APP_SOURCE_SHA" -- || {
            echo '::error::Merged candidate tree differs from the reviewed PR head'
            exit 1
          }
          # Сверяем обязательные проверки PR, merge которого и есть точный source_sha.
          CHECKS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs?per_page=100")"
          for CHECK_NAME in \
            'quality-gate / Backend tests' \
            'quality-gate / Frontend tests, lint, and build' \
            'quality-gate / Mandatory web E2E subset'; do
            CHECK_CONCLUSION="$(printf '%s' "$CHECKS_JSON" | jq -r --arg name "$CHECK_NAME" '[.check_runs[] | select(.name == $name)] | sort_by(.id) | last | .conclusion // "missing"')"
            test "$CHECK_CONCLUSION" = success || {
              echo "::error::Required check '$CHECK_NAME' is '$CHECK_CONCLUSION' for $APP_SOURCE_SHA"
              exit 1
            }
          done
          test -n "${EXPO_TOKEN:-}"
          test -n "${EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY:-}"
          test -n "${EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY:-}"
          test -n "${PRODUCTION_API_URL:-}"
          PRODUCTION_HOST="$(python3 - <<'PY'
          from urllib.parse import urlparse
          import os
          print(urlparse(os.environ['PRODUCTION_API_URL']).hostname or '')
          PY
          )"
          test "$PRODUCTION_HOST" = urtruck.kz || {
            echo "::error::production TestFlight must target exactly urtruck.kz"
            exit 1
          }
          test "${PRODUCTION_API_URL%/}" = https://urtruck.kz
          curl -fsS --max-time 20 "${PRODUCTION_API_URL%/}/health" >/dev/null
          echo "SOURCE_SHA=$APP_SOURCE_SHA"
          echo "production_API_HOST=$PRODUCTION_HOST"
          npx eas-cli@latest whoami

      - name: Install dependencies
        run: npm ci

      - name: Prepare runner-only candidate version without native regeneration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_store_candidate_version.py --platform ios \
            --version "$URTRUCK_VERSION_NAME" --source-sha "$APP_SOURCE_SHA" \
            --build-number "$URTRUCK_IOS_BUILD_NUMBER"

      - name: Verify resolved Expo production configuration
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public --json > "$RUNNER_TEMP/expo-public.json"
          node - "$RUNNER_TEMP/expo-public.json" "$PRODUCTION_API_URL" <<'NODE'
          const fs = require('fs');
          const [configPath, expectedApi] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          if (config.ios?.bundleIdentifier !== 'com.urtruck.app') {
            throw new Error(`Unexpected iOS bundle: ${config.ios?.bundleIdentifier}`);
          }
          if (config.version !== process.env.URTRUCK_VERSION_NAME) {
            throw new Error(`Unexpected version: ${config.version}`);
          }
          if (config.ios?.buildNumber !== process.env.URTRUCK_IOS_BUILD_NUMBER) {
            throw new Error('Номер сборки Expo не совпадает с выбранным номером серии');
          }
          if (config.extra?.urtruckBuildFlavor !== 'production') {
            throw new Error(`Unexpected build flavor: ${config.extra?.urtruckBuildFlavor}`);
          }
          if ((config.extra?.urtruckApiUrl || '').replace(/\/+$/, '') !== expectedApi.replace(/\/+$/, '')) {
            throw new Error('Resolved Expo config does not contain the exact production API URL');
          }
          if (config.extra?.urtruckSourceSha !== process.env.APP_SOURCE_SHA || config.extra?.urtruckExternalFreightFeedEnabled !== true) throw new Error('Source/feed identity missing');
          console.log('production_EXPO_CONFIG=pass');
          NODE

      - name: Inject production runtime configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          // Только runner production: глобальный production-счётчик EAS не сбрасываем.
          eas.cli.appVersionSource = 'local';
          eas.build.production.ios.autoIncrement = false;
          eas.build.production.env = {
            ...(eas.build.production.env || {}),
            URTRUCK_BUILD_FLAVOR: process.env.URTRUCK_BUILD_FLAVOR,
            URTRUCK_VERSION_NAME: process.env.URTRUCK_VERSION_NAME,
            URTRUCK_SOURCE_SHA: process.env.APP_SOURCE_SHA,
            EXPO_PUBLIC_EXTERNAL_FREIGHT_FEED_ENABLED: 'true',
            EXPO_PUBLIC_API_URL: process.env.PRODUCTION_API_URL,
            EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: process.env.EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY,
            EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: process.env.EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY
          };
          if (process.env.YANDEX_ROUTER_API_KEY) {
            eas.build.production.env.YANDEX_ROUTER_API_KEY = process.env.YANDEX_ROUTER_API_KEY;
          }
          if (process.env.OPENROUTESERVICE_API_KEY) {
            eas.build.production.env.OPENROUTESERVICE_API_KEY = process.env.OPENROUTESERVICE_API_KEY;
          }
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
          NODE

      - name: Verify version-local iOS counter without changing remote state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          if (eas.cli.appVersionSource !== 'local' || eas.build.production.ios.autoIncrement !== false
              || app.ios.buildNumber !== process.env.URTRUCK_IOS_BUILD_NUMBER) {
            throw new Error('Номер серии должен задаваться локально без изменения remote counter');
          }
          NODE

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build signed production IPA locally
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/UrTruck-production.ipa"
          test -s "$RUNNER_TEMP/UrTruck-production.ipa"
          shasum -a 256 "$RUNNER_TEMP/UrTruck-production.ipa" | tee "$RUNNER_TEMP/UrTruck-production.ipa.sha256"

      - name: Verify signed production IPA identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-unpacked"
          unzip -q "$RUNNER_TEMP/UrTruck-production.ipa" -d "$RUNNER_TEMP/ipa-unpacked"
          APP_DIR="$(find "$RUNNER_TEMP/ipa-unpacked/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_DIR"
          INFO="$APP_DIR/Info.plist"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$INFO")"
          VERSION_NAME="$(plutil -extract CFBundleShortVersionString raw -o - "$INFO")"
          BUILD_NUMBER="$(plutil -extract CFBundleVersion raw -o - "$INFO")"
          test "$BUNDLE_ID" = com.urtruck.app
          test "$VERSION_NAME" = "$URTRUCK_VERSION_NAME"
          case "$BUILD_NUMBER" in (*[!0-9]*|'') echo "::error::Non-numeric iOS build number"; exit 1;; esac
          test "$BUILD_NUMBER" -gt "$URTRUCK_MIN_IOS_BUILD"
          test "$BUILD_NUMBER" = "$URTRUCK_IOS_BUILD_NUMBER"
          codesign --verify --deep --strict "$APP_DIR"
          codesign -d --entitlements :- "$APP_DIR" > "$RUNNER_TEMP/production-entitlements.plist" 2>/dev/null
          python3 - "$APP_DIR" "$RUNNER_TEMP/production-entitlements.plist" <<'PYVERIFY'
          import json, os, plistlib, sys
          from pathlib import Path
          app = Path(sys.argv[1])
          config = json.loads((app/'EXConstants.bundle/app.config').read_text())
          extra = config['extra']
          assert extra['urtruckApiUrl'].rstrip('/') == 'https://urtruck.kz'
          assert extra['urtruckBuildFlavor'] == 'production'
          assert extra['urtruckSourceSha'] == os.environ['APP_SOURCE_SHA']
          assert extra['urtruckExternalFreightFeedEnabled'] is True
          entitlements = plistlib.loads(Path(sys.argv[2]).read_bytes())
          assert entitlements['aps-environment'] == 'production'
          assert entitlements['application-identifier'].endswith('.com.urtruck.app')
          info = plistlib.loads((app/'Info.plist').read_bytes())
          assert 'NSLocationAlwaysAndWhenInUseUsageDescription' not in info
          assert 'location' not in info.get('UIBackgroundModes', [])
          PYVERIFY
          grep -R -a -F -q "${PRODUCTION_API_URL%/}" "$APP_DIR"
          {
            echo "sourceSHA=$APP_SOURCE_SHA"
            echo "bundleIdentifier=$BUNDLE_ID"
            echo "versionName=$VERSION_NAME"
            echo "buildNumber=$BUILD_NUMBER"
            echo "apiHost=urtruck.kz"
            echo "ipaSHA256=$(shasum -a 256 "$RUNNER_TEMP/UrTruck-production.ipa" | awk '{print $1}')"
          } | tee "$RUNNER_TEMP/UrTruck-production-manifest.txt"

      - name: Upload private production IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-production-TestFlight-IPA
          path: |
            ${{ runner.temp }}/UrTruck-production.ipa
            ${{ runner.temp }}/UrTruck-production.ipa.sha256
            ${{ runner.temp }}/UrTruck-production-manifest.txt
          retention-days: 14

      - name: Submit production IPA to TestFlight
        shell: bash
        run: npx eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/UrTruck-production.ipa" --non-interactive --wait
