name: Copy Pro Test server secrets

on:
  push:
    branches: [pro/urtruck-paid-test]
    paths:
      - ".github/workflows/copy-pro-test-server-secrets.yml"

permissions:
  actions: read
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    env:
      SOURCE_HOST: ${{ secrets.SERVER_HOST }}
      SOURCE_USER: ${{ secrets.SERVER_USER }}
      SOURCE_PASS: ${{ secrets.SERVER_PASS }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Install sealed-box library
        run: python3 -m pip install --quiet pynacl
      - name: Encrypt values for this repository
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from nacl import encoding, public
          url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/secrets/public-key"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          })
          with urllib.request.urlopen(req) as response:
              key = json.load(response)
          box = public.SealedBox(public.PublicKey(key["key"], encoding.Base64Encoder()))
          values = {}
          for target, source in {
              "PRO_TEST_SERVER_HOST": "SOURCE_HOST",
              "PRO_TEST_SERVER_USER": "SOURCE_USER",
              "PRO_TEST_SERVER_PASS": "SOURCE_PASS",
          }.items():
              raw = os.environ[source]
              if not raw:
                  raise SystemExit(f"{source} is empty")
              values[target] = base64.b64encode(box.encrypt(raw.encode())).decode()
          with open("/tmp/pro-test-secrets.json", "w") as f:
              json.dump({"key_id": key["key_id"], "values": values}, f)
          PY
      - name: Upload encrypted values
        uses: actions/upload-artifact@v4
        with:
          name: pro-test-server-secrets-encrypted
          path: /tmp/pro-test-secrets.json
          retention-days: 1
