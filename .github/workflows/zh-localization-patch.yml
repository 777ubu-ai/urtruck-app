name: ZH Localization Patch

on:
  push:
    branches: [fix/zh-localization-10of10-20260816]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[zh-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zh-localization-10of10-20260816
          fetch-depth: 0

      - name: Apply deterministic ZH patches
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}')
              p.write_text(text.replace(old, new))

          # ZH must never silently fall back to Russian in global helpers.
          replace_exact(
              'src/utils/i18n.js',
              """export const t = (key) => {\n  const lang = translations[currentLang];\n  if (lang && lang[key]) return lang[key];\n  return translations.RU[key] || key;\n};""",
              """export const t = (key) => {\n  const lang = translations[currentLang];\n  if (lang && lang[key]) return lang[key];\n  if (currentLang === 'ZH') return translations.EN[key] || key;\n  return translations.RU[key] || translations.EN[key] || key;\n};""",
          )

          replace_exact(
              'src/utils/i18n.js',
              """export const formatTruckType = (type) => {\n  if (!type) return t('cargo_type_unknown');\n  const val = t(type);\n  return val !== type ? val : type;\n};""",
              """const LEGACY_ZH_TRUCK_TYPES = {\n  'Тент': '篷布车',\n  'Фура': '大型货车',\n  'Рефрижератор': '冷藏车',\n  'Изотерм': '保温车',\n  'Бортовой': '栏板车',\n  'Площадка': '平板车',\n  'Автовоз': '汽车运输车',\n  'Цистерна': '罐车',\n  \"Контейнер 20'\": '20尺集装箱',\n  \"Контейнер 40'\": '40尺集装箱',\n  'Контейнер 20′': '20尺集装箱',\n  'Контейнер 40′': '40尺集装箱',\n};\n\nexport const formatTruckType = (type) => {\n  if (!type) return t('cargo_type_unknown');\n  const val = t(type);\n  if (val !== type) return val;\n  if (currentLang === 'ZH') return LEGACY_ZH_TRUCK_TYPES[String(type).trim()] || translations.EN[type] || t('cargo_type_unknown');\n  return type;\n};""",
          )
          replace_exact('src/utils/i18n.js', "tent: '帆布'", "tent: '篷布车'", expected=1)

          # Location picker finds Chinese/English aliases in addition to legacy values.
          replace_exact(
              'src/components/LocationPickerModal.js',
              "const hits = query.trim().length >= 1 ? searchPoints(query, {}) : null;",
              """const hits = useMemo(() => {\n    const q = query.trim().toLocaleLowerCase();\n    if (!q) return null;\n    const primary = searchPoints(query, {});\n    const localized = POINTS.filter((p) => {\n      const zh = String(localizePlace(p.name, 'ZH') || '').toLocaleLowerCase();\n      const en = String(localizePlace(p.name, 'EN') || '').toLocaleLowerCase();\n      return zh.includes(q) || en.includes(q);\n    });\n    const unique = new Map();\n    [...primary, ...localized].forEach((p) => unique.set(pointKey(p), p));\n    return [...unique.values()].slice(0, 60);\n  }, [query]);""",
          )

          # CargoDetail: app-controlled dialog, not browser/system-localized confirm.
          replace_exact(
              'src/screens/CargoDetail.js',
              "import PriceSavingsBadge from '../components/deal/PriceSavingsBadge';",
              "import PriceSavingsBadge from '../components/deal/PriceSavingsBadge';\nimport AppConfirmModal from '../components/ui/AppConfirmModal';",
          )
          replace_exact(
              'src/screens/CargoDetail.js',
              "const [shareModal, setShareModal] = useState(false);",
              "const [shareModal, setShareModal] = useState(false);\n  const [confirmDialog, setConfirmDialog] = useState(null);",
          )
          replace_exact(
              'src/screens/CargoDetail.js',
              "const [acceptedDriverId, setAcceptedDriverId] = useState(null);",
              """const [acceptedDriverId, setAcceptedDriverId] = useState(null);\n  const askConfirm = useCallback((title, message = '', confirmLabel = t('confirm'), destructive = false) => (\n    new Promise((resolve) => setConfirmDialog({ title, message, confirmLabel, destructive, resolve }))\n  ), [t]);\n  const settleConfirm = useCallback((answer) => {\n    setConfirmDialog((current) => {\n      current?.resolve?.(answer);\n      return null;\n    });\n  }, []);""",
          )
          replace_exact(
              'src/screens/CargoDetail.js',
              """    if (Platform.OS === 'web') {\n      if (window.confirm(t('delete_cargo_q'))) doDel();\n    } else {\n      Alert.alert(t('delete_cargo_q'), '', [{ text: t('cancel') }, { text: t('delete'), style: 'destructive', onPress: doDel }]);\n    }""",
              """    askConfirm(t('delete_cargo_q'), '', t('delete'), true).then((ok) => {\n      if (ok) doDel();\n    });""",
          )

          p = Path('src/screens/CargoDetail.js')
          text = p.read_text()
          start_marker = "const ok = Platform.OS === 'web'"
          end_marker = "if (!ok) return;"
          cursor = 0
          accept_count = 0
          cancel_count = 0
          while True:
              start = text.find(start_marker, cursor)
              if start < 0:
                  break
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit('CargoDetail: confirm block missing end marker')
              block = text[start:end]
              indent_start = text.rfind('\n', 0, start) + 1
              indent = text[indent_start:start]
              if "window.confirm(msg)" in block and "accept_bid_confirm_title" in block:
                  repl = "const ok = await askConfirm(t('accept_bid_confirm_title'), msg, t('accept_bid_btn'));\n" + indent
                  accept_count += 1
              elif "cancel_bid_confirm" in block:
                  repl = "const ok = await askConfirm(t('cancel_bid_confirm'), '', t('withdraw_bid_link'), true);\n" + indent
                  cancel_count += 1
              else:
                  cursor = end + len(end_marker)
                  continue
              text = text[:start] + repl + text[end:]
              cursor = start + len(repl) + len(end_marker)
          if accept_count != 2 or cancel_count != 2:
              raise SystemExit(f'CargoDetail confirm blocks: accept={accept_count}, cancel={cancel_count}')
          p.write_text(text)

          replace_exact('src/screens/CargoDetail.js', "case 'countered': return t('my_bid_status_countered') || 'Клиент предложил встречную цену';", "case 'countered': return t('my_bid_status_countered');")
          replace_exact('src/screens/CargoDetail.js', "default:          return t('my_bid_status_pending')   || 'Ожидает ответа клиента';", "default:          return t('my_bid_status_pending');")
          replace_exact('src/screens/CargoDetail.js', "{t('my_bid_label') || 'Моя ставка'}", "{t('my_bid_label')}")
          replace_exact('src/screens/CargoDetail.js', "label={t('edit_bid') || 'Изменить'}", "label={t('edit_bid')}")
          replace_exact(
              'src/screens/CargoDetail.js',
              """      <ShareModal\n        visible={shareModal}\n        onClose={() => setShareModal(false)}\n        shareText={buildCargoShareText(c, `${WEB_URL || 'https://urtruck.kz'}/cargo/${c.id}`, lang)}\n        url={`${WEB_URL || 'https://urtruck.kz'}/cargo/${c.id}`}\n      />\n      {Gate}""",
              """      <ShareModal\n        visible={shareModal}\n        onClose={() => setShareModal(false)}\n        shareText={buildCargoShareText(c, `${WEB_URL || 'https://urtruck.kz'}/cargo/${c.id}`, lang)}\n        url={`${WEB_URL || 'https://urtruck.kz'}/cargo/${c.id}`}\n      />\n      <AppConfirmModal\n        visible={!!confirmDialog}\n        title={confirmDialog?.title}\n        message={confirmDialog?.message}\n        cancelLabel={t('cancel')}\n        confirmLabel={confirmDialog?.confirmLabel || t('confirm')}\n        destructive={!!confirmDialog?.destructive}\n        onCancel={() => settleConfirm(false)}\n        onConfirm={() => settleConfirm(true)}\n        testID=\"cargo-confirm-modal\"\n      />\n      {Gate}""",
          )
          PY

      - name: Validate patch
        run: |
          grep -q "currentLang === 'ZH'" src/utils/i18n.js
          grep -q "AppConfirmModal" src/screens/CargoDetail.js
          grep -q "localizePlace(p.name, 'ZH')" src/components/LocationPickerModal.js
          ! grep -q "window.confirm(t('cancel_bid_confirm'))" src/screens/CargoDetail.js
          ! grep -q "window.confirm(msg)" src/screens/CargoDetail.js

      - name: Commit patch
        run: |
          git config user.name "UrTruck QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/utils/i18n.js src/components/LocationPickerModal.js src/screens/CargoDetail.js
          git commit -m "fix(i18n): close ZH route and dialog leaks [zh-patch]"
          git push origin HEAD:fix/zh-localization-10of10-20260816
