name: PR Quality Gate

# Release hardening track A (2026-09-10): the actual job definitions moved
# to quality-gate-reusable.yml so deploy.yml's release gate can call the
# exact same checks (see that file's header comment). This file is now a
# thin PR-triggered caller — no behavior change for pull requests.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate-reusable.yml
