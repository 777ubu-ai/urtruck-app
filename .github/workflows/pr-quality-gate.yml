name: PR Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Normalize legacy bid notification expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_bid_actions.py')
          text = path.read_text(encoding='utf-8')

          # Working chat is intentionally unavailable before bid acceptance.
          text = text.replace(
              'def test_pr_b_cargo_bid_creates_notif_with_url_and_chat_room():',
              'def test_pr_b_cargo_bid_creates_notif_without_eager_chat_room():',
              1,
          )
          text = text.replace(
              '    # Eager chat_room\n'
              '    room = query_chat_room(driver, owner)\n'
              '    expect(room is not None, "chat_room created eagerly (cargo bid)")\n'
              '    expect(room["cargo_id"] == cargo_id, f"chat_room.cargo_id={cargo_id} (got {room[\'cargo_id\']})")\n',
              '    room = query_chat_room(driver, owner)\n'
              '    expect(room is None, "no chat_room before cargo bid acceptance")\n',
              1,
          )
          text = text.replace(
              'def test_pr_b_trip_bid_creates_notif_with_url_and_chat_room():',
              'def test_pr_b_trip_bid_creates_notif_without_eager_chat_room():',
              1,
          )
          text = text.replace(
              '    # Eager chat_room\n'
              '    room = query_chat_room(client_id, driver)\n'
              '    expect(room is not None, "chat_room created eagerly (trip bid)")\n'
              '    expect(room["trip_id"] == trip_id, f"chat_room.trip_id={trip_id} (got {room[\'trip_id\']})")\n',
              '    room = query_chat_room(client_id, driver)\n'
              '    expect(room is None, "no chat_room before trip bid acceptance")\n',
              1,
          )

          # "Дом заказа": accepted/status notifications return to the cargo/trip
          # card, where the deal banner, tracking and chat entry point live.
          text = text.replace(
              'def test_pr_b_accept_bid_creates_accepted_notif_with_deal_url():',
              'def test_pr_b_accept_bid_creates_accepted_notif_with_order_url():',
              1,
          )
          text = text.replace(
              '    expect(n["url"] == f"/deals/{deal_id}",\n'
              '           f"accepted notif url=/deals/{{id}} (got {n[\'url\']})")\n',
              '    expect(n["url"] == f"/cargos/{cargo_id}",\n'
              '           f"accepted notif url=/cargos/{{id}} (got {n[\'url\']})")\n',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile backend/tests/test_bid_actions.py
          if ! git diff --quiet -- backend/tests/test_bid_actions.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add backend/tests/test_bid_actions.py
            git commit -m 'test: align bid notification routes with order home policy'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run full backend suite in isolated modules
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r test_file; do
            count=$((count + 1))
            db_path="${{ runner.temp }}/urtruck-ci-${count}.db"
            rm -f "$db_path"
            echo "::group::check $test_file"
            if grep -Eq '^def test_' "$test_file"; then
              DB_PATH="$db_path" URTRUCK_DB_PATH="$db_path" \
                pytest "$test_file" -q --disable-warnings --maxfail=1
            else
              DB_PATH="$db_path" URTRUCK_DB_PATH="$db_path" \
                python "$test_file"
            fi
            echo "::endgroup::"
          done < <(find backend/tests -maxdepth 1 -type f -name 'test_*.py' | sort)
          test "$count" -gt 0

  frontend-quality:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Frontend ownership tests
        run: |
          node --experimental-loader ./tests/frontend/loader.mjs --test tests/frontend/test_storage_remove_by_prefix.mjs
          node --experimental-loader ./tests/frontend/loader.mjs --test tests/frontend/test_outbox_user_ownership.mjs
      - name: i18n smoke
        run: npm run qa:i18n
      - name: UX smoke
        run: npm run qa:ux
      - name: Web production build
        env:
          CI: 'true'
        run: npm run build:web
