name: PR Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile backend and tests
        run: |
          python -m compileall -q backend
      - name: Run full backend suite in isolated modules
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          APP_ENV: test
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r test_file; do
            count=$((count + 1))
            db_path="${{ runner.temp }}/urtruck-ci-${count}.db"
            rm -f "$db_path" "$db_path-wal" "$db_path-shm"
            echo "::group::check $test_file"
            if grep -Eq '^def test_' "$test_file"; then
              DB_PATH="$db_path" URTRUCK_DB_PATH="$db_path" \
                pytest "$test_file" -q --disable-warnings --maxfail=1
            else
              DB_PATH="$db_path" URTRUCK_DB_PATH="$db_path" \
                python "$test_file"
            fi
            echo "::endgroup::"
          done < <(find backend/tests -maxdepth 1 -type f -name 'test_*.py' | sort)
          test "$count" -gt 0

  frontend-quality:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Frontend ownership and currency tests
        run: |
          node --experimental-loader ./tests/frontend/loader.mjs --test tests/frontend/test_storage_remove_by_prefix.mjs
          node --experimental-loader ./tests/frontend/loader.mjs --test tests/frontend/test_outbox_user_ownership.mjs
          node --experimental-loader ./tests/frontend/loader.mjs --test tests/frontend/test_currency_normalization.mjs
      - name: i18n smoke
        run: npm run qa:i18n
      - name: UX smoke
        run: npm run qa:ux
      - name: Web production build
        env:
          CI: 'true'
        run: npm run build:web
