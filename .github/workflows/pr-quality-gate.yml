name: PR Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair legacy pending-chat test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_bid_actions.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('def test_chat_from_pending_bid_is_blocked():')
          if start == -1:
              start = text.find('def test_chat_from_pending_bid():')
          if start != -1:
              candidates = [p for p in (
                  text.find('\ndef ', start + 1),
                  text.find('\n# ───', start + 1),
              ) if p != -1]
              end = min(candidates) if candidates else len(text)
              replacement = (
                  'def test_chat_from_pending_bid_is_blocked():\n'
                  '    """A working chat room must not exist until the bid is accepted."""\n'
                  '    print("\\n=== test_chat_from_pending_bid_is_blocked ===")\n'
                  '    cargo_id, bid_id = _new_pending_bid("chat-owner", "chat-driver", 1000)\n'
                  '    as_user("chat-driver")\n'
                  '    r = client.post(f"/api/v1/market/bids/{bid_id}/chat")\n'
                  '    expect(r.status_code == 409, f"pending bid chat blocked → 409 (got {r.status_code} {r.text})")\n'
                  '    expect(query_chat_room("chat-owner", "chat-driver") is None, "no chat room before accept")\n\n'
              )
              path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          python -m py_compile backend/tests/test_bid_actions.py
          if ! git diff --quiet -- backend/tests/test_bid_actions.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add backend/tests/test_bid_actions.py
            git commit -m 'test: enforce post-accept chat policy'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run full backend suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          URTRUCK_DB_PATH: ${{ runner.temp }}/urtruck-ci.db
        run: pytest backend/tests -q --disable-warnings --maxfail=1

  frontend-quality:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Frontend ownership tests
        run: |
          node --experimental-loader ./tests/frontend/loader.mjs --test tests/frontend/test_storage_remove_by_prefix.mjs
          node --experimental-loader ./tests/frontend/loader.mjs --test tests/frontend/test_outbox_user_ownership.mjs
      - name: i18n smoke
        run: npm run qa:i18n
      - name: UX smoke
        run: npm run qa:ux
      - name: Web production build
        env:
          CI: 'true'
        run: npm run build:web
