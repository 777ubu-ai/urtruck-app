name: Configure QA2 Google Auth Redirect

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect or apply QA2 redirect (apply changes only uri_allow_list)
        required: true
        type: choice
        options: [inspect, apply]
        default: inspect

permissions:
  contents: read

concurrency:
  group: urtruck-qa2-social-auth-redirect
  cancel-in-progress: false

jobs:
  configure:
    name: Inspect or add QA2 OAuth redirect without removing existing entries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: pymddxenwtjcbmrafvnc
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      QA2_AUTH_MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Materialize public Supabase key without logging it
        shell: bash
        run: |
          set -euo pipefail
          set +x
          anon_key="$(node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/config/supabase.js', 'utf8');
          const m = src.match(/SUPABASE_ANON_KEY\s*=\s*'([^']+)'/);
          if (!m) process.exit(2);
          process.stdout.write(m[1]);
          NODE
          )"
          echo "SUPABASE_ANON_KEY=${anon_key}" >> "$GITHUB_ENV"
      - name: Inspect or add QA2 redirect
        shell: bash
        run: bash scripts/configure_qa2_social_auth_redirect.sh
