name: QA Staging Preflight

on:
  workflow_call:
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SERVER_PASS:
        required: true

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect isolated QA host without changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASS: ${{ secrets.SERVER_PASS }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify dedicated QA process, directory and database targets are free
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SERVER_PASS"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          qa_root=/home/ubuntu/urtruck-qa2
          if test "$(id -u)" -eq 0; then echo '::error::QA_PREFLIGHT_REMOTE_ROOT'; exit 1; fi
          if ! df -Pk /home/ubuntu | awk 'NR==2 { exit !($4 >= 2097152) }'; then echo '::error::QA_PREFLIGHT_DISK_TOO_LOW'; exit 1; fi
          if command -v pm2 >/dev/null; then
            supervisor=pm2
          elif command -v systemctl >/dev/null; then
            supervisor=systemd
          else
            echo '::error::QA_PREFLIGHT_SUPERVISOR_MISSING'
            exit 1
          fi
          if test -e "$qa_root"; then
            test -f "$qa_root/.env" || { echo '::error::QA_PREFLIGHT_EXISTING_ENV_MISSING'; exit 1; }
            qa_backend="$qa_root/backend"
            if ! test -d "$qa_backend/database"; then
              echo '::error::QA_PREFLIGHT_BACKEND_DATABASE_DIRECTORY_MISSING'
              exit 1
            fi
            db_file="$(find "$qa_backend/database" -maxdepth 1 -type f -name '*.db' -print -quit)"
            test -n "$db_file" || { echo '::error::QA_PREFLIGHT_EXISTING_DB_MISSING'; exit 1; }
            test -d "$qa_root/storage" || { echo '::error::QA_PREFLIGHT_EXISTING_STORAGE_MISSING'; exit 1; }
            if [ "$supervisor" = pm2 ]; then
              pm2 jlist | grep -q 'urtruck-qa2' || { echo '::error::QA_PREFLIGHT_EXISTING_PM2_MISSING'; exit 1; }
            else
              pgrep -f 'uvicorn|gunicorn' >/dev/null || { echo '::error::QA_PREFLIGHT_EXISTING_API_PROCESS_MISSING'; exit 1; }
            fi
            ss -ltnH | awk '{print $4}' | grep -Eq '(^|:)8002$' || { echo '::error::QA_PREFLIGHT_EXISTING_PORT_MISSING'; exit 1; }
            echo "QA_PREFLIGHT_SUPERVISOR=$supervisor"
            python3 - "$qa_root/.env" <<'PY'
          from pathlib import Path
          import sys
          values = {}
          for raw in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              if '=' in raw and not raw.lstrip().startswith('#'):
                  key, value = raw.split('=', 1)
                  values[key.strip()] = value.strip()
          db = values.get('DB_PATH') or values.get('URTRUCK_DB_PATH') or ''
          if not db or 'urtruck-qa2' not in db or 'urtruck-security' in db:
              raise SystemExit('::error::QA_PREFLIGHT_EXISTING_DB_NOT_ISOLATED')
          print('QA_STAGING_PREFLIGHT=existing-isolated-target-ready')
          PY
          else
            ! ss -ltnH | awk '{print $4}' | grep -Eq '(^|:)8002$' || { echo '::error::QA_PREFLIGHT_PORT_8002_OCCUPIED'; exit 1; }
            echo 'QA_STAGING_PREFLIGHT=new-isolated-target-available'
          fi
          REMOTE