name: QA Staging Preflight

on:
  workflow_call:
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SERVER_PASS:
        required: true

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect isolated QA host without changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASS: ${{ secrets.SERVER_PASS }}
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify dedicated QA process, directory and database targets are free
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SERVER_PASS"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if test "$(id -u)" -eq 0; then echo '::error::QA_PREFLIGHT_REMOTE_ROOT'; exit 1; fi
          if test -e /home/ubuntu/urtruck-qa2; then echo '::error::QA_PREFLIGHT_DIRECTORY_OCCUPIED'; exit 1; fi
          if ss -ltnH | awk '{print $4}' | grep -Eq '(^|:)8002$'; then echo '::error::QA_PREFLIGHT_PORT_8002_OCCUPIED'; exit 1; fi
          if test -e /home/ubuntu/urtruck-qa2/database/qa2.db; then echo '::error::QA_PREFLIGHT_DATABASE_OCCUPIED'; exit 1; fi
          if test -e /home/ubuntu/urtruck-qa2/storage; then echo '::error::QA_PREFLIGHT_STORAGE_OCCUPIED'; exit 1; fi
          if ! df -Pk /home/ubuntu | awk 'NR==2 { exit !($4 >= 2097152) }'; then echo '::error::QA_PREFLIGHT_DISK_TOO_LOW'; exit 1; fi
          if ! command -v pm2 >/dev/null; then echo '::error::QA_PREFLIGHT_PM2_MISSING'; exit 1; fi
          echo 'QA_STAGING_PREFLIGHT=isolated-target-available'
          REMOTE