name: Fix Biz Chat web base href

# Приложение на /app/, но в index.html стоит <base href="/"> — из-за этого
# Flutter грузит движок с корня (404) и получается белый экран.
# Меняем base href на /app/. Правка статики /var/www/bizchat-web/index.html.
# Безопасно: бэкап + точечная замена + проверка результата.

on:
  workflow_dispatch:
  push:
    branches: [claude/biz-chat-inquiry-6v7qi2]
    paths: ['.github/workflows/fix-app-basehref.yml']

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fix base href in web index.html
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOS'
          set -e
          IDX=/var/www/bizchat-web/index.html

          echo "== Текущий base href =="
          grep -o '<base href="[^"]*">' "$IDX" || echo "(base href не найден)"

          if grep -q '<base href="/app/">' "$IDX"; then
            echo "base href уже /app/ — ничего не делаю."
            exit 0
          fi

          echo "== Бэкап =="
          sudo cp "$IDX" "$IDX.bak.$(date +%Y%m%d-%H%M%S)"

          echo "== Замена <base href=\"/\"> на <base href=\"/app/\"> =="
          sudo sed -i 's|<base href="/">|<base href="/app/">|' "$IDX"

          echo "== Результат =="
          grep -o '<base href="[^"]*">' "$IDX"
          EOS

      - name: Verify app assets resolve under /app/
        run: |
          CA_OK=1
          echo "== base href теперь /app/? =="
          curl -sS -m 15 "https://biz-chat.net/app/index.html" | grep -o '<base href="[^"]*">' || echo "(не нашёл)"
          echo "== ключевые файлы =="
          for f in main.dart.js flutter.js canvaskit/canvaskit.js; do
            code=$(curl -sS -m 15 -o /dev/null -w "%{http_code}" "https://biz-chat.net/app/$f" || echo ERR)
            echo "/app/$f → $code"
          done
