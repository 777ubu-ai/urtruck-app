name: Patch clean Yandex map runtime

on:
  push:
    branches: [fix/map-clean-route-yandex-runtime-20260817]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[map-clean-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-clean-route-yandex-runtime-20260817
          fetch-depth: 0

      - name: Patch TruckMap and TrackTruck screen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/TruckMap.web.js')
          s = p.read_text()
          s = s.replace(
              "const host = findNodeHandle(hostRef.current) || hostRef.current;",
              "const directHost = hostRef.current;\n      let legacyHost = null;\n      try { legacyHost = findNodeHandle(hostRef.current); } catch { /* no-op */ }\n      const host = directHost && typeof directHost === 'object' && directHost.nodeType === 1\n        ? directHost\n        : (legacyHost && typeof legacyHost === 'object' && legacyHost.nodeType === 1 ? legacyHost : null);"
          )
          s = s.replace('if (attempts >= 80) {', 'if (attempts >= 200) {')
          s = s.replace(
              "showScaleInCopyrights: true,\n          theme: 'light',\n        }, [new YMapDefaultSchemeLayer({}), new YMapDefaultFeaturesLayer({})]);",
              "showScaleInCopyrights: true,\n          mode: 'vector',\n        }, [new YMapDefaultSchemeLayer({ theme: 'light' }), new YMapDefaultFeaturesLayer({})]);"
          )
          s = s.replace(
              "function OpenStreetMapFallback({ livePoint, plannedPoints, title }) {\n  const hostRef = React.useRef(null);\n  const mapRef = React.useRef(null);\n  const objectsRef = React.useRef([]);",
              "function OpenStreetMapFallback({ livePoint, plannedPoints, title }) {\n  const hostRef = React.useRef(null);\n  const mapRef = React.useRef(null);\n  const objectsRef = React.useRef([]);\n  const [ready, setReady] = React.useState(false);"
          )
          s = s.replace(
              "mapRef.current = map;\n      if (window.ResizeObserver)",
              "mapRef.current = map;\n      setReady(true);\n      if (window.ResizeObserver)"
          )
          s = s.replace(
              "if (!map || !L) return;",
              "if (!ready || !map || !L) return;",
              1
          )
          s = s.replace(
              "}, [latKey(livePoint), JSON.stringify(plannedPoints), title]);\n\n  return <View ref={hostRef} style={s.map} testID=\"truck-map-osm-fallback\" />;",
              "}, [ready, latKey(livePoint), JSON.stringify(plannedPoints), title]);\n\n  return <View ref={hostRef} style={s.map} testID=\"truck-map-osm-fallback\" />;"
          )
          s = s.replace(
              "liveTitle = 'Машина на маршруте',\n}) {",
              "liveTitle = 'Машина на маршруте',\n  showBadge = true,\n}) {"
          )
          s = s.replace(
              "      <View pointerEvents=\"none\" style={s.badge}>\n        <Text style={s.badgeTitle}>{showPlanned ? plannedTitle : liveTitle}</Text>\n        <Text style={s.badgeText}>{showPlanned ? plannedHint : (title || liveTitle)}</Text>\n      </View>",
              "      {showBadge ? (\n        <View pointerEvents=\"none\" style={s.badge}>\n          <Text style={s.badgeTitle}>{showPlanned ? plannedTitle : liveTitle}</Text>\n          <Text style={s.badgeText}>{showPlanned ? plannedHint : (title || liveTitle)}</Text>\n        </View>\n      ) : null}"
          )
          p.write_text(s)

          p = Path('src/screens/TrackTruckScreen.js')
          s = p.read_text()
          start = s.index('      {loading ? (')
          end = s.index('\n      <View style={[s.driverCard', start)
          clean = '''      {loading ? (\n        <ActivityIndicator style={{ marginTop: 48 }} color={theme.text} />\n      ) : (\n        <View style={s.cleanMapWrap} testID={loc ? \"track-live-map\" : \"track-planned-map\"}>\n          <TruckMap\n            lat={loc ? lat : undefined}\n            lng={loc ? lng : undefined}\n            title={loc ? (driverName || t('track_truck_marker')) : undefined}\n            routePoints={routePoints}\n            planned={!loc}\n            plannedTitle={t('planned_route_title')}\n            plannedHint={t('tracking_starts_after_start')}\n            liveTitle={t('live_route_title')}\n            showBadge={false}\n          />\n          {loc ? (\n            <View style={[s.liveMini, { backgroundColor: theme.card, borderColor: theme.border }]} pointerEvents=\"none\">\n              <View style={s.liveMiniDot} />\n              <Text style={[s.liveMiniText, { color: theme.text }]} numberOfLines={1}>\n                {fmtAgo(agoMin) || t('track_updated_now')}\n              </Text>\n            </View>\n          ) : null}\n        </View>\n      )}\n'''
          # Drop the old plan banner/stats and bottom counterparty card entirely.
          tail_start = s.index('\n      </View>\n    </SafeAreaView>', end)
          s = s[:start] + clean + s[tail_start:]
          s = s.replace(
              "  plannedWrap: { flex: 1, paddingHorizontal: 12, paddingBottom: 4 },",
              "  cleanMapWrap: { flex: 1, marginHorizontal: 12, marginBottom: 12, borderRadius: 18, overflow: 'hidden', position: 'relative' },\n  liveMini: { position: 'absolute', left: 12, bottom: 12, flexDirection: 'row', alignItems: 'center', gap: 7, maxWidth: '72%', paddingHorizontal: 10, paddingVertical: 8, borderWidth: 1, borderRadius: 999 },\n  liveMiniDot: { width: 8, height: 8, borderRadius: 4, backgroundColor: '#168759' },\n  liveMiniText: { fontSize: 11.5, fontWeight: '800' },"
          )
          p.write_text(s)

          t = Path('tests/frontend/test_clean_map_screen.mjs')
          t.write_text("""import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nconst screen = readFileSync('src/screens/TrackTruckScreen.js', 'utf8');\nconst map = readFileSync('src/components/TruckMap.web.js', 'utf8');\nassert.match(screen, /showBadge=\\{false\\}/, 'full map screen must hide duplicate map badge');\nassert.match(screen, /lat=\\{loc \\? lat : undefined\\}/, 'planned route must not fake a live vehicle coordinate');\nassert.doesNotMatch(screen, /<View style=\\{\\[s\\.planBanner/, 'full map screen must not show duplicate planned-route banner');\nassert.doesNotMatch(screen, /<View style=\\{\\[s\\.driverCard/, 'full map screen must not duplicate counterparty card');\nassert.match(map, /const \\[ready, setReady\\] = React\\.useState\\(false\\);[\\s\\S]*function OpenStreetMapFallback/, 'map module keeps readiness state');\nassert.match(map, /setReady\\(true\\);[\\s\\S]*if \\(!ready \\|\\| !map \\|\\| !L\\) return;/, 'OSM fallback must redraw route after async map init');\nassert.match(map, /mode: 'vector'/, 'Yandex must use vector mode');\nconsole.log('clean Yandex map screen contract: PASS');\n""")
          PY

      - name: Run map regression tests
        run: |
          node tests/frontend/test_yandex_map_primary.mjs
          node tests/frontend/test_deal_room_auto_map.mjs
          node tests/frontend/test_shipper_inprogress_auto_map.mjs
          node tests/frontend/test_clean_map_screen.mjs

      - name: Commit product patch and remove temporary workflow
        run: |
          git config user.name "UrTruck Release Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/patch-map-clean-yandex.yml
          git add src/components/TruckMap.web.js src/screens/TrackTruckScreen.js tests/frontend/test_clean_map_screen.mjs .github/workflows/patch-map-clean-yandex.yml
          git commit -m "fix(map): clean full-screen map and restore route [map-clean-patched]"
          git push origin HEAD:fix/map-clean-route-yandex-runtime-20260817
