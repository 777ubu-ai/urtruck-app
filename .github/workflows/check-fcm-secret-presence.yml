name: Check FCM secret presence

on:
  push:
    branches: [fix/android-push-fcm-20260816]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      A: ${{ secrets.GOOGLE_SERVICES_JSON }}
      B: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      C: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      D: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
      E: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
      F: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      G: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Print presence only
        run: |
          test -n "$A" && echo "GOOGLE_SERVICES_JSON=present" || echo "GOOGLE_SERVICES_JSON=absent"
          test -n "$B" && echo "GOOGLE_SERVICES_JSON_BASE64=present" || echo "GOOGLE_SERVICES_JSON_BASE64=absent"
          test -n "$C" && echo "FIREBASE_GOOGLE_SERVICES_JSON=present" || echo "FIREBASE_GOOGLE_SERVICES_JSON=absent"
          test -n "$D" && echo "FIREBASE_ANDROID_GOOGLE_SERVICES_JSON=present" || echo "FIREBASE_ANDROID_GOOGLE_SERVICES_JSON=absent"
          test -n "$E" && echo "FCM_SERVICE_ACCOUNT_JSON=present" || echo "FCM_SERVICE_ACCOUNT_JSON=absent"
          test -n "$F" && echo "FIREBASE_SERVICE_ACCOUNT_JSON=present" || echo "FIREBASE_SERVICE_ACCOUNT_JSON=absent"
          test -n "$G" && echo "EXPO_TOKEN=present" || echo "EXPO_TOKEN=absent"
