name: Deploy QA2 vehicle visibility window

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: VERIFY_QA2_VEHICLE_WINDOW или DEPLOY_QA2_VEHICLE_WINDOW
        required: true
        type: string
      source_sha:
        description: Точный SHA объединённого кандидата QA2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: urtruck-qa2-vehicle-window
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: qa2
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
    steps:
      - name: Проверить исходник и режим
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = qa2/integration-candidate
          [[ "$QA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$QA_SOURCE_SHA" = "$GITHUB_SHA"
          case "$CONFIRMATION" in
            VERIFY_QA2_VEHICLE_WINDOW) echo 'QA_DEPLOY_MODE=verify' >> "$GITHUB_ENV" ;;
            DEPLOY_QA2_VEHICLE_WINDOW) echo 'QA_DEPLOY_MODE=deploy' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Проверить точное объединение QA2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          git fetch --no-tags origin qa2/integration-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$QA_SOURCE_SHA"
      - name: Настроить закреплённый SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SERVER_SSH_KEY" && test -n "$SERVER_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/qa2_vehicle_key
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/qa2_vehicle_known_hosts
          chmod 600 ~/.ssh/qa2_vehicle_key ~/.ssh/qa2_vehicle_known_hosts
          cat >> ~/.ssh/config <<CONFIG
          Host qa2-final
            HostName $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/qa2_vehicle_key
            UserKnownHostsFile ~/.ssh/qa2_vehicle_known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
          CONFIG
      - name: Сохранить снимки и проверить или установить только два файла QA2
        run: python3 scripts/qa/deploy_qa2_vehicle_window.py
