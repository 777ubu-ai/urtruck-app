name: TEMP CGR filter discovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CGR current HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          UA='UrTruck/1.0 (+https://urtruck.kz; partner-integration)'
          curl -fsSL -A "$UA" 'https://cgr.qoldau.kz/ru/registry/public-list?flStatus=Pending' -o /tmp/pub.html
          curl -fsSL -A "$UA" 'https://cgr.qoldau.kz/ru/registry/wa-history/list?flStatus=Active' -o /tmp/wa.html
          curl -fsSL -A "$UA" 'https://cgr.qoldau.kz/ru/registry/checkpoint/list/222979531669000000/view' -o /tmp/det.html
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          import re
          for fn in ['pub','wa']:
              s=BeautifulSoup(open('/tmp/'+fn+'.html',encoding='utf-8').read(),'html.parser')
              print('\n---',fn,'selects ---')
              for sel in s.find_all('select'):
                  opts=[(o.get('value'),o.get_text(' ',strip=True)) for o in sel.find_all('option')]
                  print('select',sel.get('name'),sel.get('id'),'options',opts[:20])
              print('record text:', [x.strip() for x in s.stripped_strings if 'Всего записей' in x][:3])
          s=BeautifulSoup(open('/tmp/det.html',encoding='utf-8').read(),'html.parser')
          print('\n--- chart-ish elements ---')
          for el in s.find_all(True):
              attrs=' '.join(f'{k}={v}' for k,v in el.attrs.items())
              hay=(str(el.get('class',''))+' '+attrs).lower()
              if any(k in hay for k in ['chart','apex','series','statistic','loading']):
                  print(el.name,attrs[:1000])
          print('\n--- data attrs ---')
          for el in s.find_all(True):
              data={k:v for k,v in el.attrs.items() if k.startswith('data-')}
              if data and any(k in str(data).lower() for k in ['chart','stat','load','series','url','ajax']):
                  print(el.name,data)
          PY
