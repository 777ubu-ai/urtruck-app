name: TEMP CGR filter discovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CGR checkpoint charts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          UA='UrTruck/1.0 (+https://urtruck.kz; partner-integration)'
          curl -fsSL -A "$UA" 'https://cgr.qoldau.kz/ru/registry/checkpoint/list/222979531669000000/view' -o /tmp/det.html
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          import json, datetime, re
          raw=open('/tmp/det.html',encoding='utf-8').read()
          s=BeautifulSoup(raw,'html.parser')
          charts=s.find_all(attrs={'data-chart-options':True})
          print('charts=',len(charts))
          for i,el in enumerate(charts):
              try: o=json.loads(el['data-chart-options'])
              except Exception as e: print('chart',i,'jsonerr',e); continue
              ser=o.get('series') or []
              print('\nCHART',i,'series=',[x.get('name') for x in ser])
              xs=[]
              for x in ser:
                  pts=x.get('data') or []
                  for p in pts:
                      if isinstance(p,dict) and isinstance(p.get('x'),(int,float)): xs.append(p['x'])
                  print(' ',x.get('name'),'sample=',pts[:4], 'last=',pts[-2:] if pts else [])
              if xs:
                  print(' range=',datetime.datetime.fromtimestamp(min(xs)/1000,datetime.UTC),datetime.datetime.fromtimestamp(max(xs)/1000,datetime.UTC))
              parent=el.parent
              print(' parent text=', ' '.join(parent.get_text(' ',strip=True).split())[:500] if parent else '')
          print('\n--- all date/capacity text around headings ---')
          for h in s.find_all(['h1','h2','h3','h4','h5','h6']):
              txt=h.get_text(' ',strip=True)
              if txt: print(h.name,txt)
          PY
