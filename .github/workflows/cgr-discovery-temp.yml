name: TEMP CGR filter discovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CGR current HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          UA='UrTruck/1.0 (+https://urtruck.kz; partner-integration)'
          PUB='https://cgr.qoldau.kz/ru/registry/public-list?flStatus=Pending'
          CP='https://cgr.qoldau.kz/ru/registry/checkpoint/list'
          DET='https://cgr.qoldau.kz/ru/registry/checkpoint/list/222979531669000000/view'
          WA='https://cgr.qoldau.kz/ru/registry/wa-history/list?flStatus=Active'
          curl -fsSL -A "$UA" "$PUB" -o /tmp/pub.html
          curl -fsSL -A "$UA" "$CP" -o /tmp/cp.html
          curl -fsSL -A "$UA" "$DET" -o /tmp/det.html
          curl -fsSL -A "$UA" "$WA" -o /tmp/wa.html
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          import re
          for fn in ['pub','wa']:
              s=BeautifulSoup(open('/tmp/'+fn+'.html',encoding='utf-8').read(),'html.parser')
              print('\n---',fn,'tables',len(s.find_all('table')),'---')
              for i,t in enumerate(s.find_all('table')):
                  heads=[x.get_text(' ',strip=True) for x in t.find_all('th')]
                  rows=t.find_all('tr')
                  print(i,'heads=',heads[:10],'rows=',len(rows))
          s=BeautifulSoup(open('/tmp/cp.html',encoding='utf-8').read(),'html.parser')
          print('\n--- checkpoint links ---')
          for a in s.find_all('a',href=True):
              txt=a.get_text(' ',strip=True)
              if ' - ' in txt and '/registry/checkpoint/list/' in a['href']:
                  print(txt,'=>',a['href'])
          s=BeautifulSoup(open('/tmp/det.html',encoding='utf-8').read(),'html.parser')
          print('\n--- detail inputs around booking ---')
          for inp in s.find_all(['input','select']):
              name=inp.get('name'); val=inp.get('value'); ident=inp.get('id')
              if any(k in str(name).lower()+str(ident).lower() for k in ['available','booking','time','start','end','limit']):
                  print(inp.name,'name=',name,'id=',ident,'value=',val)
          print('\n--- detail script src ---')
          for sc in s.find_all('script',src=True): print(sc['src'])
          print('\n--- inline clues ---')
          html=open('/tmp/det.html',encoding='utf-8').read()
          for line in html.splitlines():
              low=line.lower()
              if any(k in low for k in ['chart','series','limit','booking','available','statistic']) and len(line)<900:
                  print(' '.join(line.split())[:850])
          PY
