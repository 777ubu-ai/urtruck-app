name: TEMP CGR filter discovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CGR export and filters
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          UA='UrTruck/1.0 (+https://urtruck.kz; partner-integration)'
          for spec in \
            'pub|https://cgr.qoldau.kz/ru/registry/public-list?flStatus=Pending' \
            'pubexcel|https://cgr.qoldau.kz/ru/registry/public-list?flStatus=Pending&presentation=excel' \
            'wa|https://cgr.qoldau.kz/ru/registry/wa-history/list?flStatus=Active' \
            'waexcel|https://cgr.qoldau.kz/ru/registry/wa-history/list?flStatus=Active&presentation=excel'; do
            name=${spec%%|*}; url=${spec#*|}
            echo "=== $name ==="
            curl -fsSL -A "$UA" -D "/tmp/$name.h" "$url" -o "/tmp/$name.dat"
            grep -Ei 'content-type|content-length|content-disposition' "/tmp/$name.h" | tail -5 || true
            wc -c "/tmp/$name.dat"
            grep -ao '<tr' "/tmp/$name.dat" | wc -l || true
          done
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          import re
          for fn in ['pub','wa']:
              raw=open('/tmp/'+fn+'.dat','rb').read().decode('utf-8','ignore')
              s=BeautifulSoup(raw,'html.parser')
              print('\n---',fn,'filter inputs ---')
              for inp in s.find_all('input'):
                  name=inp.get('name') or ''
                  ident=inp.get('id') or ''
                  if name.startswith('fl') or ident.startswith('fl'):
                      print(inp.name,'name=',name,'id=',ident,'value=',inp.get('value'),'data-ref=',inp.get('data-ref-name'))
              text=s.get_text(' ',strip=True)
              m=re.search(r'Всего записей\s*([0-9\s\u00a0]+)',text)
              print('TOTAL=',m.group(1).strip() if m else 'NONE')
          PY
