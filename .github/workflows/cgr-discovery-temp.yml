name: TEMP CGR filter discovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Verify waiting-area filter and capacity parser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import subprocess,re,datetime
          from bs4 import BeautifulSoup
          cps={
            'Бахты - Покиту':'224749863825000000',
            'Достык - Алашанькоу':'215778822067000000',
            'Калжат - Дулаты':'222979531669000000',
            'Нур Жолы - Хоргос':'222978891854000000',
          }
          ua='UrTruck/1.0 (+https://urtruck.kz; partner-integration)'
          def total(html):
              text=BeautifulSoup(html,'html.parser').get_text(' ',strip=True)
              m=re.search(r'Всего записей\s*([0-9\s\u00a0]+)',text)
              return int(re.sub(r'\D','',m.group(1))) if m else None
          def capacity(html):
              text=' '.join(BeautifulSoup(html,'html.parser').stripped_strings)
              pairs=[]
              for ds,n in re.findall(r'C\s*(\d{2}\.\d{2}\.\d{4})\s*([0-9\s\u00a0]+)\s*ТС/сутки',text):
                  d=datetime.datetime.strptime(ds,'%d.%m.%Y').date(); pairs.append((d,int(re.sub(r'\D','',n))))
              today=datetime.date(2026,8,16)
              valid=[x for x in pairs if x[0]<=today]
              return max(valid,key=lambda x:x[0]) if valid else None
          for name,cid in cps.items():
              wa=subprocess.check_output(['curl','-fsSL','-A',ua,f'https://cgr.qoldau.kz/ru/registry/wa-history/list?flCheckpoint={cid}&flStatus=Active']).decode('utf-8','ignore')
              det=subprocess.check_output(['curl','-fsSL','-A',ua,f'https://cgr.qoldau.kz/ru/registry/checkpoint/list/{cid}/view']).decode('utf-8','ignore')
              s=BeautifulSoup(wa,'html.parser'); rows=[]
              t=s.find('table')
              if t:
                  for tr in t.find_all('tr')[1:]:
                      cells=[td.get_text(' ',strip=True) for td in tr.find_all('td')]
                      if cells: rows.append(cells)
              print(name,'waiting=',total(wa),'first_cp=',rows[0][1] if rows and len(rows[0])>1 else None,'capacity=',capacity(det))
          PY
