name: UrTruck Secure Production Deploy

# Release hardening track A (2026-09-10): this workflow used to also accept
# `workflow_dispatch` directly — meaning anyone with repo write access could
# trigger a full production deploy of an ARBITRARY ref, entirely bypassing
# "UrTruck Deploy" (the release gate: quality-gate + map checks), with no
# distinguishing name, no required justification, and no audit trail beyond
# "someone ran a workflow". That bypass is removed. This workflow now has
# EXACTLY ONE trigger: automatically, after "UrTruck Deploy" succeeds on
# main. The actual deploy steps live in production-deploy-execute.yml
# (a reusable workflow) so there is one implementation shared with the
# separate, explicitly-named break-glass-production-deploy.yml — see that
# file for the emergency path (typed confirmation + written reason,
# recorded in the run log as the audit trail).
on:
  workflow_run:
    workflows: ["UrTruck Deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  resolve-mode:
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      automatic: ${{ steps.mode.outputs.automatic }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: mode
        name: Не запускать полный deploy подготовительного overlay commit
        run: |
          set -euo pipefail
          if [ -f .production-deploy-mode ]; then
            test "$(cat .production-deploy-mode)" = manual_external_feed_overlay
            echo 'automatic=false' >> "$GITHUB_OUTPUT"
            echo 'Production ожидает явного запуска узкого режима через существующий caller.'
          else
            echo 'automatic=true' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [resolve-mode]
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && needs.resolve-mode.outputs.automatic == 'true' }}
    uses: ./.github/workflows/production-deploy-execute.yml
    with:
      deploy_sha: ${{ github.event.workflow_run.head_sha }}
      break_glass: false
    secrets: inherit
