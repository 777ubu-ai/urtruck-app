name: Apply Android FCM readiness

on:
  push:
    branches: [fix/android-push-fcm-20260816]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[auto-applied-fcm]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-push-fcm-20260816
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 scripts/apply_android_fcm_readiness.py
      - name: Commit
        run: |
          git config user.name "urtruck-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.json android/build.gradle android/app/build.gradle .github/workflows/build-android-apk.yml .github/workflows/deploy-play.yml tests/frontend/android_push_config_static.test.mjs
          git commit -m "fix(push): enforce Firebase FCM config for Android [auto-applied-fcm]"
          git push origin HEAD:fix/android-push-fcm-20260816
