name: UrTruck RC Store Test Release

# One-shot RC workflow: build the exact release branch for both stores.
# Android goes only to Google Play Internal Testing.
# iOS goes only to App Store Connect / TestFlight.
# No public production rollout is performed by this workflow.
on:
  push:
    branches:
      - release/store-rc-20260901
    paths:
      - .github/workflows/store-test-release-rc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urtruck-store-test-release-rc
  cancel-in-progress: false

env:
  EXPO_PUBLIC_API_URL: https://urtruck.kz

jobs:
  preflight:
    name: Exact RC preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact RC
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show source identity
        run: |
          set -euo pipefail
          echo "BRANCH=${GITHUB_REF_NAME}"
          echo "SHA=${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "release/store-rc-20260901"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Run release quick QA and web build
        env:
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
        run: npm run qa:center:quick

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies and pytest
        run: python -m pip install -r backend/requirements.txt pytest

      - name: Deal access security matrix
        working-directory: backend
        run: python -m pytest -q tests/test_deal_access_matrix.py

  android-internal:
    name: Android AAB -> Google Play Internal
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact RC
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact SHA
        run: |
          set -euo pipefail
          echo "ANDROID_SOURCE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36 / build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          df -h

      - name: Install JS dependencies
        run: |
          npm ci --legacy-peer-deps --ignore-scripts \
            || npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          if [ -d patches ] && [ "$(ls -A patches 2>/dev/null)" ]; then
            npx patch-package
          fi

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}" || { echo "::error::ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/urtruck-upload-key.jks"

      - name: Materialize production Firebase config
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" || { echo "::error::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is missing"; exit 1; }
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          python3 scripts/verify_android_firebase_config.py --check-source android/app/google-services.json
          python3 scripts/verify_android_firebase_config.py --check-plugin android

      - name: Compute unique Google Play versionCode
        run: |
          set -euo pipefail
          base_epoch=1577836800
          now_epoch=$(date -u +%s)
          version_code=$((now_epoch - base_epoch))
          test "$version_code" -gt 0
          test "$version_code" -lt 2100000000
          echo "URTRUCK_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=${version_code}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed release AAB
        env:
          EXPO_PUBLIC_API_URL: https://urtruck.kz
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_STORE_FILE: ${{ format('{0}/urtruck-upload-key.jks', runner.temp) }}
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_URTRUCK_VERSION_CODE: ${{ env.URTRUCK_VERSION_CODE }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace --warning-mode=summary

      - name: Verify Firebase runtime resources
        run: python3 scripts/verify_android_firebase_config.py --check-resources android/app/build

      - name: Record AAB checksum
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$aab"
          sha256sum "$aab" | tee aab.sha256
          echo "ANDROID_AAB_SHA256=$(cut -d' ' -f1 aab.sha256)" >> "$GITHUB_STEP_SUMMARY"
          echo "ANDROID_SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-store-rc-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.urtruck.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          inAppUpdatePriority: 2

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/urtruck-upload-key.jks"

  ios-testflight:
    name: iOS production -> TestFlight
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: https://urtruck.kz
      EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
      YANDEX_ROUTER_API_KEY: ${{ secrets.YANDEX_ROUTER_API_KEY }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
    steps:
      - name: Checkout exact RC
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Verify Expo auth and exact source
        run: |
          set -euo pipefail
          echo "IOS_SOURCE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -n "${EXPO_TOKEN:-}" || { echo "::error::EXPO_TOKEN is missing"; exit 1; }
          test -n "${EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY:-}" || { echo "::error::YANDEX_MAPS_JS_API_KEY is missing"; exit 1; }
          npx eas-cli@latest whoami

      - name: Inject production map/API env into EAS profile
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'eas.json';
          const eas = JSON.parse(fs.readFileSync(path, 'utf8'));
          eas.build = eas.build || {};
          eas.build.production = eas.build.production || {};
          eas.build.production.env = {
            ...(eas.build.production.env || {}),
            EXPO_PUBLIC_API_URL: process.env.EXPO_PUBLIC_API_URL,
            EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: process.env.EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY,
          };
          if (process.env.YANDEX_ROUTER_API_KEY) eas.build.production.env.YANDEX_ROUTER_API_KEY = process.env.YANDEX_ROUTER_API_KEY;
          if (process.env.OPENROUTESERVICE_API_KEY) eas.build.production.env.OPENROUTESERVICE_API_KEY = process.env.OPENROUTESERVICE_API_KEY;
          fs.writeFileSync(path, `${JSON.stringify(eas, null, 2)}\n`);
          NODE

      - name: Show recent iOS EAS builds
        run: npx eas-cli@latest build:list --platform ios --limit 10 --non-interactive

      - name: Build exact production iOS candidate
        id: eas_build
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform ios --profile production --clear-cache --non-interactive --wait --json > eas-build.json
          cat eas-build.json
          BUILD_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eas-build.json','utf8'))[0].id)")
          BUILD_COMMIT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eas-build.json','utf8'))[0].gitCommitHash)")
          HEAD_SHA=$(git rev-parse HEAD)
          test "$BUILD_COMMIT" = "$HEAD_SHA" || { echo "::error::EAS build SHA $BUILD_COMMIT does not match $HEAD_SHA"; exit 1; }
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "IOS_EAS_BUILD_ID=${BUILD_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "IOS_SOURCE_SHA=${HEAD_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Submit exact verified build to TestFlight
        id: eas_submit
        shell: bash
        run: |
          set -o pipefail
          npx eas-cli@latest submit --platform ios --profile production --id "${{ steps.eas_build.outputs.build_id }}" --non-interactive --wait 2>&1 | tee submit.log
