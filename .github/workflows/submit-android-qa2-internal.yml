name: UrTruck Android QA2 Google Play Internal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SUBMIT_QA2_PLAY_INTERNAL
        required: true
        type: string
      source_sha:
        description: Exact 40-character head SHA of open PR 561
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: urtruck-qa2-play-internal
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
      QA2_API_URL: ${{ secrets.QA2_API_URL }}
      EXPO_PUBLIC_API_URL: ${{ secrets.QA2_API_URL }}
      EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.YANDEX_MAPS_JS_API_KEY }}
      EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}

    steps:
      - name: Checkout exact QA2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform 36 / build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Verify protected QA2 Internal release intent
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = main
          test "$CONFIRMATION" = SUBMIT_QA2_PLAY_INTERNAL
          [[ "$QA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/561" --jq '.state')" = open
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/561" --jq '.head.sha')" = "$QA_SOURCE_SHA"
          CHECKS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/commits/$QA_SOURCE_SHA/check-runs?per_page=100")"
          for CHECK_NAME in \
            'quality-gate / Backend tests' \
            'quality-gate / Frontend tests, lint, and build' \
            'quality-gate / Mandatory web E2E subset'; do
            CHECK_CONCLUSION="$(printf '%s' "$CHECKS_JSON" | jq -r --arg name "$CHECK_NAME" '[.check_runs[] | select(.name == $name)] | last | .conclusion // "missing"')"
            test "$CHECK_CONCLUSION" = success || {
              echo "::error::Required check '$CHECK_NAME' is '$CHECK_CONCLUSION' for $QA_SOURCE_SHA"
              exit 1
            }
          done
          test -n "${QA2_API_URL:-}"
          QA_HOST="$(python3 - <<'PY'
          from urllib.parse import urlparse
          import os
          print(urlparse(os.environ['QA2_API_URL']).hostname or '')
          PY
          )"
          test "$QA_HOST" = qa2.urtruck.kz || {
            echo "::error::Android Internal QA build must target exactly qa2.urtruck.kz"
            exit 1
          }
          test "${QA2_API_URL%/}" != https://urtruck.kz
          curl -fsS --max-time 20 "${QA2_API_URL%/}/health" >/dev/null
          curl -fsS --max-time 20 "${QA2_API_URL%/}/api/version" >/dev/null
          test -n "${EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY:-}"
          test -n "${EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY:-}"
          echo "SOURCE_SHA=$QA_SOURCE_SHA"
          echo "QA2_API_HOST=$QA_HOST"

      - name: Apply reviewed native dependency patches
        run: |
          set -euo pipefail
          test -s patches/react-native-yamap+4.8.3.patch
          ./node_modules/.bin/patch-package --error-on-fail

      - name: Materialize Firebase config for the production Android package
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}"
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          python3 scripts/verify_android_firebase_config.py --check-source android/app/google-services.json
          python3 scripts/verify_android_firebase_config.py --check-plugin android

      - name: Materialize upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/urtruck-upload-key.jks"

      - name: Select QA2 version code
        run: |
          set -euo pipefail
          base_epoch=1577836800
          version_code=$(($(date -u +%s) - base_epoch))
          installed_baseline=213720253
          if [ "$version_code" -le "$installed_baseline" ] || [ "$version_code" -ge 2100000000 ]; then
            echo "::error::versionCode $version_code must exceed $installed_baseline and stay in Google Play range"
            exit 1
          fi
          echo "URTRUCK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "versionCode=$version_code"

      - name: Build and test signed QA2 AAB
        env:
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_STORE_FILE: ${{ runner.temp }}/urtruck-upload-key.jks
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_URTRUCK_VERSION_CODE: ${{ env.URTRUCK_VERSION_CODE }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest bundleRelease --no-daemon --stacktrace --warning-mode=summary
          python3 ../scripts/verify_android_firebase_config.py --check-resources app/build
          python3 ../scripts/verify_android_fcm_handler.py app/build/intermediates
          python3 ../scripts/verify_android_16kb.py app/build/outputs/bundle/release/app-release.aab

      - name: Verify exact QA2 AAB identity and API target
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$aab"
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle "$aab" | grep -q PAGE_ALIGNMENT_16K
          manifest=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$aab" --module base)
          printf '%s\n' "$manifest" | grep -q 'package="com.urtruck.app"'
          printf '%s\n' "$manifest" | grep -q "android:versionCode=\"$URTRUCK_VERSION_CODE\""
          if printf '%s\n' "$manifest" | grep -E 'android\.permission\.(ACCESS_BACKGROUND_LOCATION|FOREGROUND_SERVICE_LOCATION)'; then
            echo "::error::QA2 AAB unexpectedly declares background location permissions"
            exit 1
          fi
          unzip -p "$aab" base/assets/index.android.bundle | grep -aFq "${QA2_API_URL%/}"
          cert=$(keytool -list -v -keystore "$RUNNER_TEMP/urtruck-upload-key.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          test -n "$cert"
          aab_sha=$(shasum -a 256 "$aab" | awk '{print $1}')
          {
            echo "AAB_SHA256=$aab_sha" >> "$GITHUB_ENV"
            echo "UPLOAD_CERT_SHA256=$cert" >> "$GITHUB_ENV"
            echo "API_HOST=qa2.urtruck.kz" >> "$GITHUB_ENV"
            echo "AAB_SHA256=$aab_sha"
            echo "UPLOAD_CERT_SHA256=$cert"
            echo "SOURCE_SHA=$QA_SOURCE_SHA"
            echo "TRACK=internal"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove upload key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/urtruck-upload-key.jks"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-QA2-Play-Internal-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload QA2 build to Google Play Internal
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.urtruck.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
