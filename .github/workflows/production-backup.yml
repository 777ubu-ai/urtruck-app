name: Production Backup

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional backup note
        required: false
        default: manual
      preserve_existing:
        description: Create a new copy without pruning previous backups
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: urtruck-production-maintenance
  cancel-in-progress: false

jobs:
  backup:
    name: Backup DB, storage, env and server config
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - uses: actions/checkout@v4

      - name: Export Supabase Storage objects
        id: supabase_export
        env:
          SUPABASE_URL: https://pymddxenwtjcbmrafvnc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OUTPUT_DIR: ${{ runner.temp }}/urtruck-supabase-storage-export
        run: |
          set -euo pipefail
          python3 .github/scripts/export_supabase_storage.py
          summary="$OUTPUT_DIR/summary.json"
          echo "archive_path=$(jq -r .archive_path "$summary")" >> "$GITHUB_OUTPUT"
          echo "archive_bytes=$(jq -r .archive_bytes "$summary")" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$(jq -r .archive_sha256 "$summary")" >> "$GITHUB_OUTPUT"
          echo "bucket_count=$(jq -r .bucket_count "$summary")" >> "$GITHUB_OUTPUT"
          echo "object_count=$(jq -r .object_count "$summary")" >> "$GITHUB_OUTPUT"
          echo "total_bytes=$(jq -r .total_bytes "$summary")" >> "$GITHUB_OUTPUT"

      - name: Create and verify production backup
        id: create_backup
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR || '/home/ubuntu/urtruck-app' }}
          BACKEND_DIR: ${{ secrets.BACKEND_DIR || '/home/ubuntu/urtruck-security' }}
          BACKUP_NOTE: ${{ inputs.note }}
          PRESERVE_EXISTING: ${{ inputs.preserve_existing }}
          SUPABASE_BUNDLE_BYTES: ${{ steps.supabase_export.outputs.archive_bytes }}
          SUPABASE_BUCKET_COUNT: ${{ steps.supabase_export.outputs.bucket_count }}
          SUPABASE_OBJECT_COUNT: ${{ steps.supabase_export.outputs.object_count }}
          SUPABASE_TOTAL_BYTES: ${{ steps.supabase_export.outputs.total_bytes }}
          SUPABASE_BUNDLE_SHA256: ${{ steps.supabase_export.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          BACKUP_STAMP="$(date -u +%Y%m%d-%H%M%S)"
          echo "stamp=$BACKUP_STAMP" >> "$GITHUB_OUTPUT"
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_PASS"
          if [[ ! "$BACKUP_NOTE" =~ ^[A-Za-z0-9._\ -]{0,80}$ ]]; then
            echo "ERROR: backup note contains unsupported characters" >&2
            exit 1
          fi
          if [[ ! "$REMOTE_DIR" =~ ^/[A-Za-z0-9._/-]+$ || ! "$BACKEND_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "ERROR: configured backup paths contain unsupported characters" >&2
            exit 1
          fi

          export SSHPASS="$SERVER_PASS"
          unset SERVER_PASS
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=20 \
            "$SERVER_USER@$SERVER_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' BACKEND_DIR='$BACKEND_DIR' BACKUP_NOTE='$BACKUP_NOTE' PRESERVE_EXISTING='$PRESERVE_EXISTING' BACKUP_STAMP='$BACKUP_STAMP' SUPABASE_BUNDLE_BYTES='$SUPABASE_BUNDLE_BYTES' SUPABASE_BUCKET_COUNT='$SUPABASE_BUCKET_COUNT' SUPABASE_OBJECT_COUNT='$SUPABASE_OBJECT_COUNT' SUPABASE_TOTAL_BYTES='$SUPABASE_TOTAL_BYTES' SUPABASE_BUNDLE_SHA256='$SUPABASE_BUNDLE_SHA256' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077

          [[ "$SUPABASE_BUNDLE_BYTES" =~ ^[0-9]+$ ]]
          [[ "$SUPABASE_BUCKET_COUNT" =~ ^[0-9]+$ && "$SUPABASE_OBJECT_COUNT" =~ ^[0-9]+$ && "$SUPABASE_TOTAL_BYTES" =~ ^[0-9]+$ ]]
          [[ "$SUPABASE_BUNDLE_SHA256" =~ ^[a-f0-9]{64}$ ]]

          STAMP="$BACKUP_STAMP"
          ROOT="$HOME/urtruck-backups"
          DEST="$ROOT/$STAMP"
          mkdir -p "$ROOT"

          # Resolve DB path before creating any backup files.
          DB_PATH=""
          if [ -f "$BACKEND_DIR/.env" ]; then
            DB_PATH=$(sed -nE 's/^(URTRUCK_DB_PATH|DB_PATH)=(.*)$/\2/p' "$BACKEND_DIR/.env" | tail -1 | tr -d "'\"" || true)
            case "$DB_PATH" in
              "") ;;
              /*) ;;
              *) DB_PATH="$BACKEND_DIR/$DB_PATH" ;;
            esac
          fi
          if [ -z "$DB_PATH" ] || [ ! -f "$DB_PATH" ]; then
            for candidate in \
              "$BACKEND_DIR/urtruck.db" \
              "$BACKEND_DIR/database.db" \
              "$BACKEND_DIR/database/urtruck.db" \
              "$BACKEND_DIR/database/urtruck-security.db"; do
              if [ -f "$candidate" ]; then DB_PATH="$candidate"; break; fi
            done
          fi
          if [ -z "$DB_PATH" ] || [ ! -f "$DB_PATH" ]; then
            echo "ERROR: production SQLite database was not found" >&2
            exit 1
          fi

          # Conservative capacity check before copying: source trees are counted
          # separately, even where the DB is also inside BACKEND_DIR.
          ESTIMATED_BYTES=0
          add_size() {
            local path="$1" bytes
            if [ -e "$path" ]; then
              bytes=$(du -sb -- "$path" | awk 'NR==1 {print $1}')
              ESTIMATED_BYTES=$((ESTIMATED_BYTES + bytes))
            fi
          }
          add_size "$DB_PATH"
          add_size "$REMOTE_DIR"
          add_size "$BACKEND_DIR"
          add_size "$BACKEND_DIR/.env"
          add_size "$REMOTE_DIR/.env"
          ESTIMATED_BYTES=$((ESTIMATED_BYTES + SUPABASE_BUNDLE_BYTES))
          STORAGE_SOURCE=""
          for storage_dir in \
            "$BACKEND_DIR/storage" \
            "$BACKEND_DIR/backend/storage" \
            "$HOME/urtruck-security/storage"; do
            if [ -d "$storage_dir" ]; then STORAGE_SOURCE="$storage_dir"; add_size "$storage_dir"; break; fi
          done
          AVAILABLE_BYTES=$(df -PB1 "$ROOT" | awk 'NR==2 {print $4}')
          REQUIRED_BYTES=$((ESTIMATED_BYTES + ESTIMATED_BYTES / 5 + 104857600))
          printf 'Backup preflight: source_bytes=%s required_with_20pct_margin=%s available_bytes=%s\n' \
            "$ESTIMATED_BYTES" "$REQUIRED_BYTES" "$AVAILABLE_BYTES"
          if [ "$AVAILABLE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "ERROR: insufficient free space; no backup copy created" >&2
            exit 1
          fi

          mkdir -m 700 "$DEST"

          echo "Backup destination: $DEST"
          echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$DEST/manifest.txt"
          echo "host: $(hostname)" >> "$DEST/manifest.txt"
          echo "note: ${BACKUP_NOTE:-manual}" >> "$DEST/manifest.txt"
          echo "remote_dir: $REMOTE_DIR" >> "$DEST/manifest.txt"
          echo "backend_dir: $BACKEND_DIR" >> "$DEST/manifest.txt"
          echo "supabase_storage_project: pymddxenwtjcbmrafvnc" >> "$DEST/manifest.txt"
          echo "supabase_bucket_count: $SUPABASE_BUCKET_COUNT" >> "$DEST/manifest.txt"
          echo "supabase_object_count: $SUPABASE_OBJECT_COUNT" >> "$DEST/manifest.txt"
          echo "supabase_object_bytes: $SUPABASE_TOTAL_BYTES" >> "$DEST/manifest.txt"
          echo "supabase_archive_sha256: $SUPABASE_BUNDLE_SHA256" >> "$DEST/manifest.txt"

          mkdir -p "$DEST/database"
          python3 - "$DB_PATH" "$DEST/database/production.db" <<'PY'
          import sqlite3, sys
          source = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=10)
          target = sqlite3.connect(sys.argv[2])
          try:
              source.backup(target)
              result = target.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise SystemExit(f"SQLite integrity_check failed: {result}")
              with open(sys.argv[2] + ".integrity.txt", "w", encoding="utf-8") as report:
                  report.write(result + "\n")
          finally:
              target.close()
              source.close()
          PY
          grep -qx ok "$DEST/database/production.db.integrity.txt"
          echo "database_source: $DB_PATH" >> "$DEST/manifest.txt"

          # Environment files: stored only inside private backup directory.
          mkdir -p "$DEST/env"
          found_env=0
          for env_file in "$BACKEND_DIR/.env" "$REMOTE_DIR/.env"; do
            if [ -f "$env_file" ]; then
              cp -a "$env_file" "$DEST/env/$(basename "$(dirname "$env_file")")-env"
              found_env=1
            fi
          done
          if [ "$found_env" -ne 1 ]; then
            echo "ERROR: no .env file found" >&2
            exit 1
          fi

          # Archive any server-local storage directory. The separate verified
          # Supabase export step adds external bucket bytes and object metadata.
          mkdir -p "$DEST/storage"
          storage_found=0
          if [ -n "$STORAGE_SOURCE" ]; then
            tar -C "$(dirname "$STORAGE_SOURCE")" -czf "$DEST/storage/$(basename "$STORAGE_SOURCE").tar.gz" "$(basename "$STORAGE_SOURCE")"
            echo "storage_source: $STORAGE_SOURCE" >> "$DEST/manifest.txt"
            storage_found=1
          fi
          if [ "$storage_found" -ne 1 ]; then
            STORAGE_PROVIDER=$(sed -nE 's/^STORAGE_PROVIDER=(.*)$/\1/p' "$BACKEND_DIR/.env" | tail -1 | tr -d "'\"[:space:]" || true)
            case "$STORAGE_PROVIDER" in
              supabase|s3) echo "storage: external-provider-$STORAGE_PROVIDER; external bucket data is not part of this server snapshot" >> "$DEST/manifest.txt" ;;
              local) echo "ERROR: STORAGE_PROVIDER=local but no local storage directory was found" >&2; exit 1 ;;
              *) echo "ERROR: storage provider/local storage completeness could not be confirmed" >&2; exit 1 ;;
            esac
          fi

          # Server configuration and process definitions.
          mkdir -p "$DEST/config"
          if command -v nginx >/dev/null 2>&1; then
            (sudo -n nginx -T 2>&1 || nginx -T 2>&1 || true) > "$DEST/config/nginx-T.txt"
          fi
          if command -v pm2 >/dev/null 2>&1; then
            pm2 jlist > "$DEST/config/pm2-jlist.json" 2>/dev/null || true
            pm2 save --force >/dev/null 2>&1 || true
            [ -f "$HOME/.pm2/dump.pm2" ] && cp -a "$HOME/.pm2/dump.pm2" "$DEST/config/" || true
          fi
          if command -v systemctl >/dev/null 2>&1; then
            systemctl list-unit-files --type=service > "$DEST/config/systemd-services.txt" 2>/dev/null || true
          fi
          [ -d /etc/nginx ] && (sudo -n tar -czf "$DEST/config/nginx.tar.gz" /etc/nginx 2>/dev/null || true)

          # Lightweight code snapshots for immediate rollback.
          mkdir -p "$DEST/code"
          [ -d "$REMOTE_DIR" ] && tar --exclude='.git' -C "$(dirname "$REMOTE_DIR")" -czf "$DEST/code/frontend.tar.gz" "$(basename "$REMOTE_DIR")"
          [ -d "$BACKEND_DIR" ] && tar --exclude='.git' --exclude='storage' -C "$(dirname "$BACKEND_DIR")" -czf "$DEST/code/backend.tar.gz" "$(basename "$BACKEND_DIR")"

          test -s "$DEST/database/production.db"
          test -s "$DEST/code/frontend.tar.gz"
          test -s "$DEST/code/backend.tar.gz"
          test -n "$(find "$DEST/env" -maxdepth 1 -type f -name '*-env' -print -quit)"
          test "$(stat -c '%a' "$DEST")" = 700
          find "$DEST/env" -type f -exec chmod 600 {} +
          du -sh "$DEST" | tee "$DEST/size.txt"
          find "$DEST" -maxdepth 3 -type f -printf '%s %p\n' | sort -n >> "$DEST/manifest.txt"
          find "$DEST" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$DEST/SHA256SUMS"
          test -s "$DEST/SHA256SUMS"
          sha256sum -c "$DEST/SHA256SUMS"

          # Keep the latest ten complete backup sets.
          if [ "$PRESERVE_EXISTING" = "true" ]; then
            echo "Retention cleanup skipped by request; existing backups preserved."
          else
            find "$ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn | tail -n +11 | cut -d' ' -f2- | xargs -r rm -rf
          fi

          echo "BACKUP_OK=$STAMP"
          echo "Backup verified: $DEST"
          REMOTE

      - name: Attach and verify Supabase Storage backup
        id: attach_storage
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          BACKUP_STAMP: ${{ steps.create_backup.outputs.stamp }}
          BUNDLE_PATH: ${{ steps.supabase_export.outputs.archive_path }}
          BUNDLE_SHA256: ${{ steps.supabase_export.outputs.archive_sha256 }}
          BUNDLE_BYTES: ${{ steps.supabase_export.outputs.archive_bytes }}
          BUCKET_COUNT: ${{ steps.supabase_export.outputs.bucket_count }}
          OBJECT_COUNT: ${{ steps.supabase_export.outputs.object_count }}
          TOTAL_BYTES: ${{ steps.supabase_export.outputs.total_bytes }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_STAMP" =~ ^[0-9]{8}-[0-9]{6}$ ]]
          [[ "$BUNDLE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$BUNDLE_BYTES" =~ ^[0-9]+$ && "$OBJECT_COUNT" =~ ^[0-9]+$ && "$TOTAL_BYTES" =~ ^[0-9]+$ ]]
          export SSHPASS="$SERVER_PASS"
          unset SERVER_PASS
          REMOTE_HOME=$(sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'printf %s "$HOME"')
          [[ "$REMOTE_HOME" =~ ^/[A-Za-z0-9._/-]+$ ]]
          DEST="$REMOTE_HOME/urtruck-backups/$BACKUP_STAMP"
          sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            "DEST='$DEST' BUNDLE_BYTES='$BUNDLE_BYTES' bash -s" <<'REMOTE_PREFLIGHT'
          set -euo pipefail
          test -d "$DEST"
          test -s "$DEST/SHA256SUMS"
          sha256sum -c "$DEST/SHA256SUMS" >/dev/null
          test ! -e "$DEST/storage/supabase-storage-backup.tar.gz"
          AVAILABLE_BYTES=$(df -PB1 "$DEST" | awk 'NR==2 {print $4}')
          REQUIRED_BYTES=$((BUNDLE_BYTES + BUNDLE_BYTES / 5 + 10485760))
          printf 'Supabase backup preflight: bundle_bytes=%s required_with_margin=%s available_bytes=%s\n' \
            "$BUNDLE_BYTES" "$REQUIRED_BYTES" "$AVAILABLE_BYTES"
          if [ "$AVAILABLE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "ERROR: insufficient free space for Supabase Storage snapshot" >&2
            exit 1
          fi
          REMOTE_PREFLIGHT
          sshpass -e scp -o StrictHostKeyChecking=no "$BUNDLE_PATH" \
            "$SERVER_USER@$SERVER_HOST:$DEST/storage/supabase-storage-backup.tar.gz"
          sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            "DEST='$DEST' BUNDLE_SHA256='$BUNDLE_SHA256' BUCKET_COUNT='$BUCKET_COUNT' OBJECT_COUNT='$OBJECT_COUNT' TOTAL_BYTES='$TOTAL_BYTES' bash -s" <<'REMOTE_VERIFY'
          set -euo pipefail
          ARCHIVE="$DEST/storage/supabase-storage-backup.tar.gz"
          test -s "$ARCHIVE"
          chmod 600 "$ARCHIVE"
          test "$(stat -c '%a' "$DEST")" = 700
          test "$(stat -c '%a' "$ARCHIVE")" = 600
          tar -tzf "$ARCHIVE" >/dev/null
          ACTUAL_SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          test "$ACTUAL_SHA256" = "$BUNDLE_SHA256"
          echo "supabase_storage_archive: storage/supabase-storage-backup.tar.gz" >> "$DEST/manifest.txt"
          echo "supabase_bucket_count: $BUCKET_COUNT" >> "$DEST/manifest.txt"
          echo "supabase_object_count: $OBJECT_COUNT" >> "$DEST/manifest.txt"
          echo "supabase_object_bytes: $TOTAL_BYTES" >> "$DEST/manifest.txt"
          du -sh "$DEST" > "$DEST/size.txt"
          find "$DEST" -type f ! -name SHA256SUMS ! -name SHA256SUMS.new -print0 | sort -z | xargs -0 sha256sum > "$DEST/SHA256SUMS.new"
          mv "$DEST/SHA256SUMS.new" "$DEST/SHA256SUMS"
          sha256sum -c "$DEST/SHA256SUMS"
          echo "Supabase Storage backup verified: buckets=$BUCKET_COUNT objects=$OBJECT_COUNT bytes=$TOTAL_BYTES sha256=$ACTUAL_SHA256"
          REMOTE_VERIFY
