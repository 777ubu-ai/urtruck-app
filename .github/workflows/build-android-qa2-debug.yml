name: Build Android QA2 Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build QA2 debug APK on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36 / build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125"

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Materialize and validate QA2 Firebase config
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}"
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          python3 scripts/verify_android_firebase_config.py --check-source android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          ]
          if "com.urtruck.app.qa2" not in packages:
              raise SystemExit(f"QA2 Firebase client missing; found {packages}")
          print("QA2 Firebase client present")
          PY
          python3 scripts/verify_android_firebase_config.py --check-plugin android

      - name: Target API 36
        run: |
          printf '\nandroid.compileSdkVersion=36\nandroid.targetSdkVersion=36\nandroid.buildToolsVersion=36.0.0\n' >> android/gradle.properties

      - name: Build exact-SHA QA2 debug APK
        env:
          ORG_GRADLE_PROJECT_URTRUCK_APPLICATION_ID: com.urtruck.app.qa2
          ORG_GRADLE_PROJECT_URTRUCK_VERSION_CODE: 210793000
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace --warning-mode=summary

      - name: Verify Firebase runtime resources
        run: python3 scripts/verify_android_firebase_config.py --check-resources android/app/build

      - name: Write exact QA2 identity
        run: |
          set -euo pipefail
          mkdir -p android/app/build/outputs/qa2
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" android/app/build/outputs/qa2/UrTruck-QA2-debug.apk
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "application_id=com.urtruck.app.qa2"
            echo "version_name=1.0.7"
            echo "version_code=210793000"
            sha256sum android/app/build/outputs/qa2/UrTruck-QA2-debug.apk
          } | tee android/app/build/outputs/qa2/qa2-metadata.txt

      - name: Upload QA2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-android-qa2-debug
          path: android/app/build/outputs/qa2/
          retention-days: 14
          if-no-files-found: error
