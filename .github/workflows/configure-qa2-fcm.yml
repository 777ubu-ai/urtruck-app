name: Configure QA2 FCM

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CONFIGURE_QA2_FCM to update only QA2 native FCM
        required: true
        type: string

concurrency:
  group: urtruck-qa2-fcm-configuration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure:
    name: Validate and configure isolated QA2 FCM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: qa2
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      QA2_API_URL: ${{ secrets.QA2_API_URL }}
      QA2_FCM_PROJECT_ID: ${{ secrets.QA2_FCM_PROJECT_ID }}
      QA2_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.QA2_FCM_SERVICE_ACCOUNT_JSON }}
      QA2_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.QA2_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Require explicit QA2-only confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "CONFIGURE_QA2_FCM"

      - name: Validate Firebase secrets without printing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QA2_FCM_PROJECT_ID"
          test -n "$QA2_FCM_SERVICE_ACCOUNT_JSON"
          test -n "$QA2_ANDROID_GOOGLE_SERVICES_JSON_BASE64"
          python3 - "$RUNNER_TEMP/qa2-fcm-service-account.json" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          expected_package = "com.urtruck.app.qa2"
          project_id = os.environ["QA2_FCM_PROJECT_ID"].strip()
          try:
              service = json.loads(os.environ["QA2_FCM_SERVICE_ACCOUNT_JSON"])
              android = json.loads(base64.b64decode(
                  os.environ["QA2_ANDROID_GOOGLE_SERVICES_JSON_BASE64"], validate=True
              ))
          except Exception as exc:
              raise SystemExit(f"QA2_FCM_SECRET_INVALID: {type(exc).__name__}")
          service_project = str(service.get("project_id") or "")
          android_project = str(android.get("project_info", {}).get("project_id") or "")
          packages = {
              str(c.get("client_info", {}).get("android_client_info", {}).get("package_name") or "")
              for c in android.get("client", [])
          }
          if service.get("type") != "service_account":
              raise SystemExit("QA2_FCM_SERVICE_ACCOUNT_TYPE_INVALID")
          if not project_id or project_id != service_project or project_id != android_project:
              raise SystemExit("Firebase project IDs differ")
          if packages != {expected_package}:
              raise SystemExit("QA2_FCM_ANDROID_PACKAGE_MISMATCH")
          target = Path(sys.argv[1])
          target.write_text(json.dumps(service, separators=(",", ":")), encoding="utf-8")
          target.chmod(0o600)
          print("QA2_FCM_PROJECT_AND_ANDROID_PACKAGE=validated")
          PY

      - name: Prepare pinned SSH transport
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_SSH_KNOWN_HOSTS"
          key="$RUNNER_TEMP/qa2-fcm-key"
          known="$RUNNER_TEMP/qa2-fcm-known-hosts"
          umask 077
          printf '%s\n' "$SERVER_SSH_KEY" > "$key"
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > "$known"
          chmod 600 "$key" "$known"
          test -s "$known"
          {
            echo "QA2_SSH_KEY=$key"
            echo "QA2_SSH_KNOWN_HOSTS=$known"
          } >> "$GITHUB_ENV"

      - name: Fingerprint production before QA2 configuration
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://urtruck.kz/api/version)"
          test -n "$body"
          printf '%s' "$body" | sha256sum | awk '{print "PROD_VERSION_HASH_BEFORE=" $1}' >> "$GITHUB_ENV"
          echo "PRODUCTION_BEFORE=healthy-fingerprinted"

      - name: Verify existing QA2 systemd supervision
        shell: bash
        run: |
          set -euo pipefail
          ssh_cmd=(ssh -i "$QA2_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS")
          "${ssh_cmd[@]}" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          unit=/etc/systemd/system/urtruck-qa2.service
          test -f "$unit"
          grep -Fq '/home/ubuntu/urtruck-qa2/backend' "$unit"
          grep -Eq '(^|[[:space:]])(--port[= ]8002|8002)([[:space:]]|$)' "$unit"
          test "$(systemctl is-active urtruck-qa2.service)" = active
          main_pid="$(systemctl show -p MainPID --value urtruck-qa2.service)"
          test "$main_pid" -gt 0
          listener_pid="$(ss -ltnpH 'sport = :8002' | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)"
          test -n "$listener_pid" && test "$listener_pid" = "$main_pid"
          echo "QA2_SUPERVISION=active_and_pid_matched"
          REMOTE

      - name: Upload validated service account over pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          scp -q -i "$QA2_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS"             "$RUNNER_TEMP/qa2-fcm-service-account.json" "$SERVER_USER@$SERVER_HOST:/tmp/urtruck-qa2-fcm-service-account.json"

      - name: Back up and update only QA2 backend env, then restart systemd unit
        shell: bash
        run: |
          set -euo pipefail
          ssh_cmd=(ssh -i "$QA2_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS")
          "${ssh_cmd[@]}" "$SERVER_USER@$SERVER_HOST" "QA2_FCM_PROJECT_ID=$QA2_FCM_PROJECT_ID" 'bash -s' <<'REMOTE'
          set -euo pipefail
          qa_env=/home/ubuntu/urtruck-qa2/backend/.env
          payload=/tmp/urtruck-qa2-fcm-service-account.json
          test -f "$qa_env" && test -f "$payload"
          backup="/home/ubuntu/urtruck-qa2/backend/.env.fcm-backup.$(date -u +%Y%m%dT%H%M%SZ)"
          cp -- "$qa_env" "$backup"
          chmod 600 "$backup"
          printf 'BACKUP=%s\n' "$backup" > /tmp/urtruck-qa2-fcm.state
          chmod 600 /tmp/urtruck-qa2-fcm.state
          python3 - "$qa_env" "$payload" "$QA2_FCM_PROJECT_ID" <<'PY'
          from pathlib import Path
          import json, os, sys
          env_path = Path(sys.argv[1])
          payload_path = Path(sys.argv[2])
          expected_project = sys.argv[3]
          service = json.loads(payload_path.read_text(encoding="utf-8"))
          if service.get("type") != "service_account" or service.get("project_id") != expected_project:
              raise SystemExit("QA2_FCM_REMOTE_VALIDATION_FAILED")
          replacement = {
              "PUSH_PROVIDER_MODE": "native",
              "FCM_PROJECT_ID": expected_project,
              "FCM_SERVICE_ACCOUNT_JSON": json.dumps(service, separators=(",", ":")),
          }
          kept = [
              line for line in env_path.read_text(encoding="utf-8").splitlines()
              if "=" not in line or line.split("=", 1)[0].strip() not in replacement
          ]
          kept.extend(f"{key}={value}" for key, value in replacement.items())
          temp = env_path.with_name(env_path.name + ".fcm.tmp")
          temp.write_text("\n".join(kept) + "\n", encoding="utf-8")
          os.chmod(temp, 0o600)
          temp.replace(env_path)
          payload_path.unlink(missing_ok=True)
          PY
          test "$(stat -c '%a' "$qa_env")" = 600
          systemctl restart urtruck-qa2.service
          test "$(systemctl is-active urtruck-qa2.service)" = active
          main_pid="$(systemctl show -p MainPID --value urtruck-qa2.service)"
          listener_pid="$(ss -ltnpH 'sport = :8002' | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)"
          test "$main_pid" -gt 0 && test "$listener_pid" = "$main_pid"
          REMOTE

      - name: Verify QA2 native FCM readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$QA2_API_URL/health" >/dev/null
          curl -fsS --max-time 20 "$QA2_API_URL/api/version" >/dev/null
          curl -fsS --max-time 20 "$QA2_API_URL/api/v1/push/info" -o "$RUNNER_TEMP/qa2-push-info.json"
          python3 - "$RUNNER_TEMP/qa2-push-info.json" <<'PY'
          import json, sys
          root = json.load(open(sys.argv[1], encoding="utf-8"))
          gateway = root.get("native", {}).get("gateway", {})
          if gateway.get("mode") != "native" or gateway.get("ready") is not True:
              raise SystemExit("QA2_FCM_GATEWAY_NOT_READY")
          if gateway.get("fcm", {}).get("configured") is not True:
              raise SystemExit("QA2_FCM_NOT_CONFIGURED")
          if gateway.get("config_errors"):
              raise SystemExit("QA2_FCM_GATEWAY_HAS_CONFIG_ERRORS")
          if "expo" in json.dumps(gateway, ensure_ascii=False).lower():
              raise SystemExit("QA2_EXPO_PROVIDER_PRESENT")
          print("QA2_FCM_GATEWAY=ready")
          PY

      - name: Verify production fingerprint unchanged
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://urtruck.kz/api/version)"
          after="$(printf '%s' "$body" | sha256sum | awk '{print $1}')"
          test "$after" = "$PROD_VERSION_HASH_BEFORE"
          echo "PRODUCTION_AFTER=healthy-unchanged"

      - name: Remove temporary QA2 state after success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$QA2_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS"             "$SERVER_USER@$SERVER_HOST" 'rm -f /tmp/urtruck-qa2-fcm.state /tmp/urtruck-qa2-fcm-service-account.json'

      - name: Roll back only QA2 env after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$QA2_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS"             "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          state=/tmp/urtruck-qa2-fcm.state
          test -f "$state" || exit 0
          . "$state"
          qa_env=/home/ubuntu/urtruck-qa2/backend/.env
          cp -- "$BACKUP" "$qa_env"
          chmod 600 "$qa_env"
          rm -f /tmp/urtruck-qa2-fcm.state /tmp/urtruck-qa2-fcm-service-account.json
          systemctl restart urtruck-qa2.service
          test "$(systemctl is-active urtruck-qa2.service)" = active
          curl -fsS http://127.0.0.1:8002/health >/dev/null
          echo "QA2_FCM_ROLLBACK=restored"
          REMOTE
