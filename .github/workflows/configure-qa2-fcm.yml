name: Configure QA2 FCM

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CONFIGURE_QA2_FCM to update only QA2 native FCM
        required: true
        type: string
  workflow_call:
    inputs:
      confirmation:
        required: true
        type: string
      source_sha:
        required: true
        type: string
  push:
    tags:
      - 'qa2-final-fcm-*'
    branches:
      - 'qa2-final-fcm-*'

concurrency:
  group: urtruck-qa2-fcm-configuration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure:
    name: Validate and configure isolated QA2 FCM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: qa2
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      QA2_API_URL: ${{ secrets.QA2_API_URL }}
      QA2_FCM_PROJECT_ID: ${{ secrets.QA2_FCM_PROJECT_ID }}
      QA2_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.QA2_FCM_SERVICE_ACCOUNT_JSON }}
      QA2_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.QA2_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Require explicit QA2-only confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if test -n "$CONFIRMATION"; then
            test "$CONFIRMATION" = "CONFIGURE_QA2_FCM"
            test "$GITHUB_REF_NAME" = qa2/integration-candidate
          else
            test "$GITHUB_REF_TYPE" = tag -o "$GITHUB_REF_TYPE" = branch
            test "$GITHUB_REF_NAME" = "qa2-final-fcm-$QA_SOURCE_SHA"
            test "$QA_SOURCE_SHA" = "$GITHUB_SHA"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact merged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          git fetch --no-tags origin qa2/integration-candidate:refs/remotes/origin/qa2/integration-candidate
          git merge-base --is-ancestor "$QA_SOURCE_SHA" origin/qa2/integration-candidate

      - name: Validate Firebase secrets without printing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QA2_FCM_PROJECT_ID"
          [[ "$QA2_FCM_PROJECT_ID" =~ ^[a-z0-9][a-z0-9-]{4,29}$ ]]
          test -n "$QA2_FCM_SERVICE_ACCOUNT_JSON"
          test -n "$QA2_ANDROID_GOOGLE_SERVICES_JSON_BASE64"
          python3 - "$RUNNER_TEMP/qa2-fcm-service-account.json" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          expected_package = "com.urtruck.app.qa2"
          project_id = os.environ["QA2_FCM_PROJECT_ID"].strip()
          try:
              service = json.loads(os.environ["QA2_FCM_SERVICE_ACCOUNT_JSON"])
              android = json.loads(base64.b64decode(
                  os.environ["QA2_ANDROID_GOOGLE_SERVICES_JSON_BASE64"], validate=True
              ))
          except Exception as exc:
              raise SystemExit(f"QA2_FCM_SECRET_INVALID: {type(exc).__name__}")
          service_project = str(service.get("project_id") or "")
          android_project = str(android.get("project_info", {}).get("project_id") or "")
          packages = {
              str(c.get("client_info", {}).get("android_client_info", {}).get("package_name") or "")
              for c in android.get("client", [])
          }
          if service.get("type") != "service_account":
              raise SystemExit("QA2_FCM_SERVICE_ACCOUNT_TYPE_INVALID")
          try:
              load_pem_private_key(str(service.get("private_key") or "").encode("utf-8"), password=None)
          except Exception as exc:
              raise SystemExit(f"QA2_FCM_SERVICE_ACCOUNT_PRIVATE_KEY_INVALID: {type(exc).__name__}")
          if not project_id or project_id != service_project or project_id != android_project:
              raise SystemExit("Firebase project IDs differ")
          if expected_package not in packages:
              raise SystemExit("QA2_FCM_ANDROID_PACKAGE_MISMATCH")
          target = Path(sys.argv[1])
          target.write_text(json.dumps(service, separators=(",", ":")), encoding="utf-8")
          target.chmod(0o600)
          print("QA2_FCM_PROJECT_AND_ANDROID_PACKAGE=validated")
          PY

      - name: Prepare pinned SSH transport
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_SSH_KNOWN_HOSTS"
          key="$RUNNER_TEMP/qa2-fcm-key"
          known="$RUNNER_TEMP/qa2-fcm-known-hosts"
          umask 077
          printf '%s\n' "$SERVER_SSH_KEY" > "$key"
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > "$known"
          chmod 600 "$key" "$known"
          test -s "$known"
          {
            echo "QA2_SSH_KEY=$key"
            echo "QA2_SSH_KNOWN_HOSTS=$known"
          } >> "$GITHUB_ENV"

      - name: Fingerprint production before QA2 configuration
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://urtruck.kz/api/version)"
          test -n "$body"
          printf '%s' "$body" | sha256sum | awk '{print "PROD_VERSION_HASH_BEFORE=" $1}' >> "$GITHUB_ENV"
          echo "PRODUCTION_BEFORE=healthy-fingerprinted"

      - name: Verify existing QA2 systemd supervision
        shell: bash
        run: |
          set -euo pipefail
          ssh_cmd=(ssh -i "$QA2_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS")
          "${ssh_cmd[@]}" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          unit=/etc/systemd/system/urtruck-qa2.service
          test -f "$unit"
          grep -Fq '/home/ubuntu/urtruck-qa2/backend' "$unit"
          grep -Eq '(^|[[:space:]])(--port[= ]8002|8002)([[:space:]]|$)' "$unit"
          test "$(systemctl is-active urtruck-qa2.service)" = active
          main_pid="$(systemctl show -p MainPID --value urtruck-qa2.service)"
          test "$main_pid" -gt 0
          listener_pid="$(sudo -n ss -ltnpH 'sport = :8002' | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)"
          service_cgroup="$(systemctl show -p ControlGroup --value urtruck-qa2.service)"
          test -n "$listener_pid" && test -n "$service_cgroup"
          grep -Fq "$service_cgroup" "/proc/$listener_pid/cgroup"
          echo "QA2_SUPERVISION=active_listener_in_service_cgroup"
          REMOTE

      - name: Upload validated service account over pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          scp -q -i "$QA2_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS"             "$RUNNER_TEMP/qa2-fcm-service-account.json" "$SERVER_USER@$SERVER_HOST:/tmp/urtruck-qa2-fcm-service-account.json"

      - name: Back up and update only QA2 backend env, then restart systemd unit
        shell: bash
        run: |
          set -euo pipefail
          ssh_cmd=(ssh -i "$QA2_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS")
          "${ssh_cmd[@]}" "$SERVER_USER@$SERVER_HOST" bash -s -- "$QA2_FCM_PROJECT_ID" <<'REMOTE'
          set -euo pipefail
          expected_project="$1"
          qa_env=/home/ubuntu/urtruck-qa2/.env
          payload=/tmp/urtruck-qa2-fcm-service-account.json
          test -f "$qa_env" && test -f "$payload"
          cutoff="$(python3 - "$qa_env" <<'PY'
          # This command is not started by systemd, so it must never fall
          # back to config.py's production-default DB_PATH.  Read only the
          # isolated QA2 DB selector from the already-validated QA2 env and
          # open it read-only before placing the cutoff above legacy rows.
          import os, sqlite3, sys
          from pathlib import Path

          env_path = Path(sys.argv[1])
          selected = None
          for raw in env_path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              if key.strip() in {"DB_PATH", "URTRUCK_DB_PATH"}:
                  selected = value.strip().strip("'\\\"")
          if not selected:
              raise SystemExit("QA2_RUNTIME_DB_PATH_MISSING")
          if selected.startswith("sqlite:///"):
              selected = selected.removeprefix("sqlite:///")
              if not selected.startswith("/"):
                  selected = "/" + selected
          db_path = Path(selected)
          if not db_path.is_absolute() or not db_path.is_file():
              raise SystemExit("QA2_RUNTIME_DB_PATH_INVALID")
          with sqlite3.connect(f"file:{db_path}?mode=ro", uri=True) as conn:
              row = conn.execute("SELECT COALESCE(MAX(id), 0) FROM push_outbox").fetchone()
          print(int(row[0] or 0))
          PY
          )"
          [[ "$cutoff" =~ ^[0-9]+$ ]]
          backup="/home/ubuntu/urtruck-qa2/.env.fcm-backup.$(date -u +%Y%m%dT%H%M%SZ)"
          cp -- "$qa_env" "$backup"
          chmod 600 "$backup"
          printf 'BACKUP=%s\n' "$backup" > /tmp/urtruck-qa2-fcm.state
          chmod 600 /tmp/urtruck-qa2-fcm.state
          python3 - "$qa_env" "$payload" "$expected_project" "$cutoff" <<'PY'
          from pathlib import Path
          import base64, json, os, sys
          env_path = Path(sys.argv[1])
          payload_path = Path(sys.argv[2])
          expected_project = sys.argv[3]
          cutoff = sys.argv[4]
          service = json.loads(payload_path.read_text(encoding="utf-8"))
          if service.get("type") != "service_account" or service.get("project_id") != expected_project:
              raise SystemExit("QA2_FCM_REMOTE_VALIDATION_FAILED")
          replacement = {
              "PUSH_PROVIDER_MODE": "native",
              "FCM_PROJECT_ID": expected_project,
              # systemd EnvironmentFile consumes backslash escapes.  Base64
              # preserves PEM newlines without placing secret material in a
              # separate file or exposing it in workflow output.
              "FCM_SERVICE_ACCOUNT_JSON_BASE64": base64.b64encode(
                  json.dumps(service, separators=(",", ":")).encode("utf-8")
              ).decode("ascii"),
              "PUSH_OUTBOX_CUTOFF_ID": cutoff,
          }
          kept = [
              line for line in env_path.read_text(encoding="utf-8").splitlines()
              if "=" not in line or line.split("=", 1)[0].strip() not in {
                  *replacement, "FCM_SERVICE_ACCOUNT_JSON"
              }
          ]
          kept.extend(f"{key}={value}" for key, value in replacement.items())
          temp = env_path.with_name(env_path.name + ".fcm.tmp")
          temp.write_text("\n".join(kept) + "\n", encoding="utf-8")
          os.chmod(temp, 0o600)
          temp.replace(env_path)
          payload_path.unlink(missing_ok=True)
          PY
          test "$(stat -c '%a' "$qa_env")" = 600
          echo "QA2_PUSH_OUTBOX_CUTOFF_ID=$cutoff"
          sudo -n systemctl restart urtruck-qa2.service
          for attempt in $(seq 1 30); do
            if test "$(systemctl is-active urtruck-qa2.service)" = active && curl -fsS --max-time 5 http://127.0.0.1:8002/health >/dev/null; then
              break
            fi
            sleep 2
          done
          test "$(systemctl is-active urtruck-qa2.service)" = active
          curl -fsS --max-time 5 http://127.0.0.1:8002/health >/dev/null
          main_pid="$(systemctl show -p MainPID --value urtruck-qa2.service)"
          listener_pid="$(sudo -n ss -ltnpH 'sport = :8002' | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)"
          service_cgroup="$(systemctl show -p ControlGroup --value urtruck-qa2.service)"
          test "$main_pid" -gt 0 && test -n "$listener_pid" && test -n "$service_cgroup"
          grep -Fq "$service_cgroup" "/proc/$listener_pid/cgroup"
          REMOTE

      - name: Verify QA2 native FCM readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$QA2_API_URL/health" >/dev/null
          curl -fsS --max-time 20 "$QA2_API_URL/api/version" >/dev/null
          curl -fsS --max-time 20 "$QA2_API_URL/api/v1/push/info" -o "$RUNNER_TEMP/qa2-push-info.json"
          python3 - "$RUNNER_TEMP/qa2-push-info.json" <<'PY'
          import json, sys
          root = json.load(open(sys.argv[1], encoding="utf-8"))
          def find_gateway(value):
              if isinstance(value, dict):
                  if {"mode", "fcm", "config_errors"}.issubset(value):
                      return value
                  for child in value.values():
                      found = find_gateway(child)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_gateway(child)
                      if found is not None:
                          return found
              return None
          gateway = find_gateway(root)
          if gateway is None:
              safe_keys = sorted(root) if isinstance(root, dict) else [type(root).__name__]
              raise SystemExit(f"QA2_PUSH_GATEWAY_NOT_FOUND keys={safe_keys}")
          fcm = gateway.get("fcm", {})
          if gateway.get("mode") != "native":
              raise SystemExit("QA2_PUSH_MODE_NOT_NATIVE")
          if fcm.get("configured") is not True:
              raise SystemExit("QA2_FCM_NOT_CONFIGURED")
          if fcm.get("errors"):
              raise SystemExit("QA2_FCM_HAS_ERRORS")
          errors = gateway.get("config_errors") or []
          if any(error != "apns_not_configured" for error in errors):
              raise SystemExit("QA2_FCM_GATEWAY_HAS_UNEXPECTED_ERRORS")
          if "expo" in json.dumps(gateway, ensure_ascii=False).lower():
              raise SystemExit("QA2_EXPO_PROVIDER_PRESENT")
          print("ANDROID_FCM=READY")
          print("IPHONE_APNS=READY" if "apns_not_configured" not in errors else "IPHONE_APNS=BLOCKED")
          print("NATIVE_GATEWAY=READY" if not errors else "NATIVE_GATEWAY=PARTIAL")
          PY

      - name: Verify production fingerprint unchanged
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://urtruck.kz/api/version)"
          after="$(printf '%s' "$body" | sha256sum | awk '{print $1}')"
          test "$after" = "$PROD_VERSION_HASH_BEFORE"
          echo "PRODUCTION_AFTER=healthy-unchanged"

      - name: Roll back only QA2 env after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QA2_SSH_KEY:-}" ]; then
            echo "QA2_FCM_ROLLBACK=not_required_before_remote_change"
            exit 0
          fi
          ssh -i "$QA2_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS"             "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          state=/tmp/urtruck-qa2-fcm.state
          test -f "$state" || exit 0
          . "$state"
          case "$BACKUP" in
            /home/ubuntu/urtruck-qa2/.env.fcm-backup.*) ;;
            *) echo QA2_FCM_BACKUP_PATH_INVALID >&2; exit 1 ;;
          esac
          qa_env=/home/ubuntu/urtruck-qa2/.env
          cp -- "$BACKUP" "$qa_env"
          chmod 600 "$qa_env"
          rm -f -- "$BACKUP" /tmp/urtruck-qa2-fcm.state /tmp/urtruck-qa2-fcm-service-account.json
          sudo -n systemctl restart urtruck-qa2.service
          for attempt in $(seq 1 30); do
            if test "$(systemctl is-active urtruck-qa2.service)" = active && curl -fsS --max-time 5 http://127.0.0.1:8002/health >/dev/null; then
              break
            fi
            sleep 2
          done
          test "$(systemctl is-active urtruck-qa2.service)" = active
          curl -fsS --max-time 5 http://127.0.0.1:8002/health >/dev/null
          echo "QA2_FCM_ROLLBACK=restored"
          REMOTE

      - name: Always remove temporary QA2 credentials and backup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QA2_SSH_KEY:-}" ]; then exit 0; fi
          ssh -i "$QA2_SSH_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$QA2_SSH_KNOWN_HOSTS" \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          state=/tmp/urtruck-qa2-fcm.state
          if test -f "$state"; then
            backup="$(sed -n 's/^BACKUP=//p' "$state")"
            case "$backup" in
              /home/ubuntu/urtruck-qa2/.env.fcm-backup.*) rm -f -- "$backup" ;;
              *) echo QA2_FCM_BACKUP_PATH_INVALID >&2; exit 1 ;;
            esac
            rm -f -- "$state"
          fi
          rm -f -- /tmp/urtruck-qa2-fcm-service-account.json
          REMOTE
