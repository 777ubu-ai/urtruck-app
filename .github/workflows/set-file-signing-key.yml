name: Set FILE_SIGNING_KEY (one-shot, prod)

# ⚠️ ОДНОРАЗОВЫЙ workflow для закрытия главного merge-blocker (FILE_SIGNING_KEY).
# Запускается ТОЛЬКО вручную (workflow_dispatch) — никакого авто-триггера.
#
# Threat model (безопасность подхода):
#   * Секрет ГЕНЕРИРУЕТСЯ НА СЕРВЕРЕ внутри SSH-сессии — значение НЕ транзитит
#     через runner, не попадает в logs/stdout/artifacts/GitHub Secrets.
#   * Идемпотентно БЕЗ перезаписи: если FILE_SIGNING_KEY уже задан и непуст —
#     не трогаем (перезапись инвалидировала бы существующие signed-URL).
#   * .env НЕ печатается (никакого cat), бэкап перед изменением, атомарная
#     дозапись через temp+mv.
#   * Использует общий scripts/deploy-ssh.sh (key-режим при SERVER_SSH_KEY,
#     иначе sshpass) — тот же контур доступа, что и обычный деплой; новой
#     поверхности доступа не создаётся.
#   * Значение секрета нигде не выводится и не сохраняется вне сервера.
#
# ВАЖНО про порядок: запускать ДО деплоя PR #169 (fail-closed код), чтобы к
# моменту выкладки ключ уже был на сервере и document-эндпоинты не отдали 500.
# workflow_dispatch доступен только когда файл на default-ветке (main).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urtruck-production-maintenance
  cancel-in-progress: false

jobs:
  set-signing-key:
    runs-on: ubuntu-latest
    # production environment: если в репозитории на нём настроены required
    # reviewers/protection — job будет ждать approval перед prod-мутацией.
    # Если environment не сконфигурирован, ссылка безвредна (no-op).
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set FILE_SIGNING_KEY on server (generated remotely, never printed)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          BACKEND_DIR: ${{ secrets.BACKEND_DIR || '/home/ubuntu/urtruck-security' }}
        run: |
          sudo apt-get install -y sshpass
          # Remote-скрипт: генерирует ключ НА СЕРВЕРЕ, не печатает значение.
          bash scripts/deploy-ssh.sh ssh "
            set -e
            ENVF='$BACKEND_DIR/.env'
            mkdir -p \"\$(dirname \"\$ENVF\")\"; touch \"\$ENVF\"
            if grep -qE '^FILE_SIGNING_KEY=.+' \"\$ENVF\"; then
              echo 'FILE_SIGNING_KEY уже задан — пропускаю (не перезаписываю, чтобы не инвалидировать signed-URL)'
            else
              KEY=\$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')
              cp \"\$ENVF\" \"\$ENVF.bak.\$(date +%s)\"
              tmp=\$(mktemp)
              cat \"\$ENVF\" > \"\$tmp\"
              printf 'FILE_SIGNING_KEY=%s\n' \"\$KEY\" >> \"\$tmp\"
              mv \"\$tmp\" \"\$ENVF\"
              unset KEY
              echo 'FILE_SIGNING_KEY установлен (значение не выводится)'
            fi
          "

      - name: Controlled restart + health (no secret output)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          sudo apt-get install -y sshpass
          bash scripts/deploy-ssh.sh ssh "
            set -e
            source ~/.nvm/nvm.sh 2>/dev/null || true
            pm2 restart urtruck-security-api
            sleep 4
            echo '--- system/info (env only, без секретов) ---'
            curl -s http://127.0.0.1:8001/api/v1/system/info | head -c 120 || echo 'health curl failed'
          "

      - name: Verify signing readiness on server (NO secret output)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          BACKEND_DIR: ${{ secrets.BACKEND_DIR || '/home/ubuntu/urtruck-security' }}
        run: |
          sudo apt-get install -y sshpass
          # Smoke-скрипт лежит в репо (scripts/signing_smoke.py) — копируем на
          # сервер и запускаем там. Печатает только FILE_SIGNING_KEY_PRESENT=yes
          # и результаты sign/verify/tamper/expired; значение НЕ выводится
          # (ключ экспортируется в env только внутри серверной сессии).
          bash scripts/deploy-ssh.sh scp scripts/signing_smoke.py "$SERVER_USER@$SERVER_HOST:/tmp/urtruck_signing_smoke.py"
          bash scripts/deploy-ssh.sh ssh "set -e; ENVF='$BACKEND_DIR/.env'; grep -qE '^FILE_SIGNING_KEY=.+' \"\$ENVF\" && echo FILE_SIGNING_KEY_PRESENT=yes || { echo FILE_SIGNING_KEY_PRESENT=no; exit 1; }; export FILE_SIGNING_KEY=\"\$(grep -E '^FILE_SIGNING_KEY=' \"\$ENVF\" | head -1 | cut -d= -f2-)\"; cd '$BACKEND_DIR'; python3 /tmp/urtruck_signing_smoke.py; rm -f /tmp/urtruck_signing_smoke.py"

      - name: Public signed-document readiness note
        run: |
          echo "GREEN этого workflow = FILE_SIGNING_KEY_PRESENT=yes + SIGNING_SMOKE=ok на сервере."
          echo "Значение секрета нигде не выводилось. Дополнительно можно открыть"
          echo "документ водителя в приложении — ссылка подписывается (?exp&sig)."
