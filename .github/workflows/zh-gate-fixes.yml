name: ZH Gate Fixes
on:
  push:
    branches:
      - fix/zh-localization-10of10-20260816
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zh-localization-10of10-20260816
          fetch-depth: 0
      - name: Apply strict ZH gate fixes
        run: python3 scripts/zh_gate_fix.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No ZH gate changes required"
            exit 0
          fi
          git config user.name "UrTruck QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/utils/places.js src/screens/TripDetail.js qa/utils/zhLocalizationSmoke.js
          git commit -m "fix(i18n): close remaining ZH geography leaks [zh-gate-fix]"
          git push origin HEAD:fix/zh-localization-10of10-20260816
