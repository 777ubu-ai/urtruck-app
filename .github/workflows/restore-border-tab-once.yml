name: Restore Border bottom tab once

on:
  push:
    branches:
      - fix/restore-border-tab-20260820
    paths:
      - scripts/restore_border_bottom_tab.py
      - .github/workflows/restore-border-tab-once.yml

permissions:
  contents: write

concurrency:
  group: restore-border-tab-once
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-border-tab-20260820
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply guarded navigation patch
        run: |
          set -euo pipefail
          python scripts/restore_border_bottom_tab.py
          rm scripts/restore_border_bottom_tab.py
          rm .github/workflows/restore-border-tab-once.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Navigation and border regressions
        run: |
          set -euo pipefail
          node --test tests/frontend/test_navigation_tabs.mjs
          node --test tests/frontend/task2_driver_unified.test.mjs
          node qa/utils/borderDashboardSmoke.js
          npm run qa:nav
          npm run qa:i18n

      - name: Production web build
        run: npm run build:web

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(nav): restore Border tab and remove Profile duplicate"
          git push origin HEAD:refs/heads/fix/restore-border-tab-20260820
