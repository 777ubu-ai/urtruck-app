name: Temporary UI hotfix

on:
  push:
    branches: [fix/remove-profile-notifications-call-20260830]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-profile-notifications-call-20260830
          fetch-depth: 0
      - name: Patch duplicate notification UI
        run: |
          sed -i "/useUnreadNotifications/d" src/screens/ProfileScreen.js
          sed -i "/profile-notifications/d" src/screens/ProfileScreen.js
          ! grep -q "menu_notifications" src/screens/ProfileScreen.js
          ! grep -Eqi "deal-order-call|wa\.me|whatsapp|telegram|tg://|tel:" src/screens/CargoDetail.js
          ! test -e src/utils/contactPartner.js
          grep -q 'testID="deal-order-chat"' src/screens/CargoDetail.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-hotfix-profile-notifications-call.yml
          git add src/screens/ProfileScreen.js
          git commit -m "fix(ui): remove duplicate profile notifications"
          git push origin HEAD:fix/remove-profile-notifications-call-20260830
