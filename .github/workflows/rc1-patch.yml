name: RC1 patch

on:
  push:
    branches: [fix/rc1-deal-fsm-profile-ui]
    paths: [scripts/rc1_patch.py]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc1-deal-fsm-profile-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply RC1 FSM patch
        run: python3 scripts/rc1_patch.py
      - name: Run focused regressions
        run: |
          node --test tests/frontend/rc1_deal_fsm_static.test.mjs
          npm ci
          node --experimental-loader ./tests/frontend/loader.mjs --test tests/frontend/*.mjs
      - name: Commit patch
        run: |
          rm -f scripts/rc1_patch.py .github/workflows/rc1-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce role-safe deal delivery FSM"
          git push origin HEAD:fix/rc1-deal-fsm-profile-ui
