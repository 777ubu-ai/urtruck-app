name: QA2 Local AI

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSTALL_QA2_LOCAL_AI or SOURCE_TESTS
        required: true
        type: string
      source_sha:
        description: Exact branch SHA for the AI-only QA2 deployment
        required: true
        type: string

concurrency:
  group: ${{ inputs.confirmation == 'SOURCE_TESTS' && 'urtruck-qa2-local-ai-source-tests' || 'urtruck-qa2-local-ai' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source_tests:
    if: inputs.confirmation == 'SOURCE_TESTS'
    name: Non-mutating local-AI source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
      - name: Require the exact requested source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/voice-stt-translation-20260925"
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -r requirements-test.txt
      - name: Run QA2 AI quality tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          APP_ENV: test
          CGR_IIN_SALT: ci-test-salt-not-a-secret
        run: python -m pytest -q backend/tests/test_qa2_ai_quality_gate.py backend/tests/test_qa2_ai_quality_failure_reasons.py
      - name: Compile changed Python sources
        run: python -m py_compile backend/qa_ai_service/quality.py backend/qa_ai_service/main.py scripts/qa2_ai_readonly_diagnostic.py scripts/replay_qa2_ai_diagnostic.py
      - name: Replay the pinned 60-row synthetic translation fixture
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python scripts/replay_qa2_ai_diagnostic.py --input tests/fixtures/qa2_local_ai_readonly_36409260200.jsonl --sha256-file tests/fixtures/qa2_local_ai_readonly_36409260200.sha256 --expect-pass 58 --expect-fail-case 28
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run QA2 AI runner and workflow tests
        run: node --test tests/frontend/test_qa2_ai_readonly_diagnostic.mjs tests/frontend/test_qa_staging_recovery_workflow.mjs tests/frontend/test_qa2_local_ai_workflow.mjs tests/frontend/test_qa2_server_readonly_audit_workflow.mjs
      - name: Verify whitespace-only diff safety
        run: git diff --check HEAD^

  deploy:
    if: inputs.confirmation == 'INSTALL_QA2_LOCAL_AI'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: qa2
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASS: ${{ secrets.SERVER_PASS }}
      QA_API_URL: ${{ secrets.QA2_API_URL }}
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Validate local AI contracts
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/voice-stt-translation-20260925"
          test "$QA_SOURCE_SHA" != "3678612761b793d42c66a99214640b28e81b81bd"
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          git fetch --no-tags origin "refs/heads/fix/voice-stt-translation-20260925:refs/remotes/origin/fix/voice-stt-translation-20260925"
          git merge-base --is-ancestor "$QA_SOURCE_SHA" "origin/fix/voice-stt-translation-20260925"
          bash -n scripts/deploy-qa2-local-ai.sh
          python3 -m py_compile backend/services/local_ai_client.py backend/qa_ai_service/main.py
          node --test tests/frontend/test_qa2_local_ai_workflow.mjs
      - name: Install deployment and voice-fixture tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync espeak-ng
      - name: Install and verify private QA2 AI
        shell: bash
        run: bash scripts/deploy-qa2-local-ai.sh
