name: Build & Deploy Biz Chat web

# Собирает Flutter Web (на Linux-раннере — Mac не нужен) и выкладывает
# на сервер в /var/www/bizchat-web/, откуда его отдаёт nginx по /app/.
#
# Запуск: по push изменений в мобильном коде или вручную.
#
# ВАЖНО: --base-href=/app/ — приложение живёт в подпапке, без этого флага
# Flutter ищет свои файлы в корне и получается белый экран.

on:
  workflow_dispatch:
  push:
    branches: [claude/biz-chat-inquiry-6v7qi2]
    paths:
      - 'bizchat/mobile/**'
      - '.github/workflows/build-deploy-web.yml'

concurrency:
  group: deploy-bizchat-web
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter deps
        working-directory: bizchat/mobile
        run: flutter pub get

      # Явная генерация локализаций из lib/l10n/*.arb. Полагаться на неявный
      # запуск при pub get нельзя: если новые ключи не сгенерируются, сборка
      # упадёт на «getter не определён» уже после долгой компиляции.
      - name: Generate localizations
        working-directory: bizchat/mobile
        run: flutter gen-l10n

      # Analyze БЛОКИРУЕТ деплой при ошибках компиляции.
      # Раньше здесь стоял continue-on-error, и три сборки подряд падали
      # на одной и той же ошибке уже в dart2js — а на сервере продолжала
      # жить старая версия, хотя коммиты уходили как «выложено».
      # Info и warning по-прежнему не блокируют — только errors.
      - name: Analyze (ошибки блокируют деплой)
        working-directory: bizchat/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web
        working-directory: bizchat/mobile
        run: |
          flutter build web --release \
            --base-href=/app/ \
            --dart-define=APP_API_URL=https://biz-chat.net \
            --build-name=1.0.16 \
            --build-number=${{ github.run_number }}
          echo "== размер сборки =="
          du -sh build/web
          grep -o '<base href="[^"]*">' build/web/index.html || true

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1
          cd bizchat/mobile/build
          tar czf /tmp/web.tar.gz -C web .
          sshpass -p "$SERVER_PASS" scp -o StrictHostKeyChecking=no \
            /tmp/web.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/web.tar.gz"
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOS'
          set -e
          DIR=/var/www/bizchat-web
          # Бэкап предыдущей сборки (последние 3 храним)
          sudo mkdir -p /var/www/bizchat-web-backups
          TS=$(date +%Y%m%d-%H%M%S)
          sudo tar czf "/var/www/bizchat-web-backups/web-$TS.tar.gz" -C "$DIR" . 2>/dev/null || true
          sudo ls -t /var/www/bizchat-web-backups/*.tar.gz 2>/dev/null | tail -n +4 | sudo xargs -r rm -f

          # Раскатываем новую сборку
          sudo rm -rf "$DIR"/*
          sudo tar xzf /tmp/web.tar.gz -C "$DIR"
          sudo chown -R www-data:www-data "$DIR"
          rm -f /tmp/web.tar.gz
          echo "== выложено =="
          grep -o '<base href="[^"]*">' "$DIR/index.html" || true
          ls "$DIR" | head -10
          EOS

      - name: Verify live
        run: |
          set -e
          echo "== index.html и base href =="
          curl -sS -m 20 https://biz-chat.net/app/ | grep -o '<base href="[^"]*">' || echo "(base href не найден)"
          echo "== ключевые файлы =="
          for f in main.dart.js flutter.js; do
            code=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" "https://biz-chat.net/app/$f")
            echo "/app/$f → $code"
            [ "$code" = "200" ] || { echo "::error::$f недоступен"; exit 1; }
          done
          echo "✅ Новая сборка выложена"
