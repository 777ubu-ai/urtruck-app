name: Price Fallback Compatibility Patch
on:
  push:
    branches: [fix/zh-localization-10of10-20260816]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[price-fallback]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zh-localization-10of10-20260816
          fetch-depth: 0
      - name: Restore established pure-helper default
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/utils/normalizers.js')
          s=p.read_text()
          old="return t ? t('payment_negotiable') : 'Negotiable';"
          new="return t ? t('payment_negotiable') : 'По договорённости';"
          if s.count(old)!=1: raise SystemExit(f'expected one fallback, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name "UrTruck QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/utils/normalizers.js
          git commit -m "fix(qa): restore formatPrice default contract [price-fallback]"
          git push origin HEAD:fix/zh-localization-10of10-20260816
