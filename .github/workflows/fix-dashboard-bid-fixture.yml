name: One-shot dashboard bid fixture fix

on:
  push:
    branches:
      - audit/release-blockers-2026-08-06

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/release-blockers-2026-08-06
          fetch-depth: 0
      - name: Fix dashboard bid lifecycle fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_bid_actions.py')
          text = path.read_text(encoding='utf-8')
          old = '''    cargo_id = seed_cargo(owner_id="dash2-owner")
              as_user("dash2-driver")
              bid_pending   = client.post("/api/v1/market/bids", json={"cargo_id": cargo_id, "amount": 1000}).json()["id"]
              bid_cancelled = client.post("/api/v1/market/bids", json={"cargo_id": cargo_id, "amount": 1100}).json()["id"]
              bid_rejected  = client.post("/api/v1/market/bids", json={"cargo_id": cargo_id, "amount": 1200}).json()["id"]
              client.post(f"/api/v1/market/bids/{bid_cancelled}/cancel")
              as_user("dash2-owner")
              client.post(f"/api/v1/market/bids/{bid_rejected}/reject")
          '''.replace('              ', '')
          new = '''    cargo_id = seed_cargo(owner_id="dash2-owner")
              as_user("dash2-driver")
              bid_cancelled = client.post("/api/v1/market/bids", json={"cargo_id": cargo_id, "amount": 1100}).json()["id"]
              client.post(f"/api/v1/market/bids/{bid_cancelled}/cancel")

              bid_rejected = client.post("/api/v1/market/bids", json={"cargo_id": cargo_id, "amount": 1200}).json()["id"]
              as_user("dash2-owner")
              client.post(f"/api/v1/market/bids/{bid_rejected}/reject")

              as_user("dash2-driver")
              bid_pending = client.post("/api/v1/market/bids", json={"cargo_id": cargo_id, "amount": 1000}).json()["id"]
          '''.replace('              ', '')
          if old not in text:
              raise SystemExit('expected dashboard fixture block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit source fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-dashboard-bid-fixture.yml
          git add backend/tests/test_bid_actions.py
          git commit -m 'test: model sequential bid lifecycle in dashboard fixture'
          git push origin HEAD:audit/release-blockers-2026-08-06
