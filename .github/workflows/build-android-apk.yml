name: Build Android APK

# Триггеры:
#   - workflow_dispatch — ручной запуск из GitHub UI ("Run workflow") → публикует CI artifacts
#   - push в main или claude/** — автоматическая сборка на любое изменение веток разработки

on:
  workflow_dispatch:
    inputs:
      application_id:
        description: Android applicationId to build
        required: false
        default: com.urtruck.app
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

jobs:
  build:
    name: Build APK on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36 / build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          df -h

      - name: Preinstall Expo-compatible NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.1.10909125"

      - name: Install npm dependencies (skip postinstall scripts)
        run: |
          # --ignore-scripts отключает patch-package postinstall (он падает если patches/ нет)
          # --legacy-peer-deps для конфликтов expo SDK 52 / RN 0.76 / react 18.3
          # Fallback на npm install если ci падает (lock-несинхронизация)
          npm ci --legacy-peer-deps --ignore-scripts \
            || npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Apply patches (if patches/ exists)
        run: |
          if [ -d patches ] && [ "$(ls -A patches 2>/dev/null)" ]; then
            echo "Applying patches from patches/ ..."
            npx patch-package
          else
            echo "No patches to apply — skipping patch-package."
          fi

      - name: Materialize Android Firebase config (google-services.json)
        # P1 fix (26.08.2026): без реального google-services.json Android push
        # никогда не получит FCM runtime config, даже если весь остальной код
        # правильный (см. docs/release/android-firebase-config.md). expo
        # prebuild подхватывает файл через app.json → expo.android.googleServicesFile
        # и сам копирует его в android/app/, поэтому здесь файл кладётся в
        # корень репо — ДО prebuild.
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          URTRUCK_APPLICATION_ID: ${{ github.event.inputs.application_id || 'com.urtruck.app' }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::Секрет ANDROID_GOOGLE_SERVICES_JSON_BASE64 не задан — Android push (FCM) не будет работать в этой сборке. См. docs/release/android-firebase-config.md."
            exit 1
          fi
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          python3 scripts/verify_android_firebase_config.py --check-source google-services.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
          const expected = process.env.URTRUCK_APPLICATION_ID || 'com.urtruck.app';
          const packages = (config.client || [])
            .map((client) => client.client_info?.android_client_info?.package_name)
            .filter(Boolean);
          if (!packages.includes(expected)) {
            console.error(`::error::google-services.json не содержит Android client package '${expected}'. Найдены: ${packages.join(', ') || '(none)'}`);
            process.exit(1);
          }
          console.log(`[firebase] package '${expected}' найден в google-services.json`);
          NODE

      - name: Verify Google Services Gradle plugin wired
        run: python3 scripts/verify_android_firebase_config.py --check-plugin android

      - name: Decode release upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/urtruck-upload-key.jks"

      - name: Compute monotonic release versionCode
        run: |
          set -euo pipefail
          base_epoch=1577836800
          now_epoch=$(date -u +%s)
          version_code=$((now_epoch - base_epoch))
          test "$version_code" -gt 0
          test "$version_code" -lt 2100000000
          echo "URTRUCK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Android versionCode=$version_code"

      - name: Target API 36 (Google Play требование с 31.08.2026)
        run: |
          printf '\nandroid.compileSdkVersion=36\nandroid.targetSdkVersion=36\nandroid.buildToolsVersion=36.0.0\n' >> android/gradle.properties

      - name: Show generated android/ structure (debug)
        run: |
          ls -la android/ android/app/ 2>/dev/null || echo "no android/"
          echo "---gradle wrapper---"
          ls -la android/gradle/wrapper/ 2>/dev/null || true

      - name: Build Release APK with Gradle
        env:
          ORG_GRADLE_PROJECT_URTRUCK_APPLICATION_ID: ${{ github.event.inputs.application_id || 'com.urtruck.app' }}
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_STORE_FILE: ${{ format('{0}/urtruck-upload-key.jks', runner.temp) }}
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_URTRUCK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_URTRUCK_VERSION_CODE: ${{ env.URTRUCK_VERSION_CODE }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --max-workers=2 --stacktrace --warning-mode=summary

      - name: Verify Firebase runtime resources in build output
        run: python3 scripts/verify_android_firebase_config.py --check-resources android/app/build

      - name: Rename APK to UrTruck.apk
        run: |
          cd android/app/build/outputs/apk/release
          ls -la
          mv app-release.apk UrTruck.apk
          ls -la UrTruck.apk

      - name: Write exact RC identity
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/UrTruck.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "application_id=${{ github.event.inputs.application_id || 'com.urtruck.app' }}"
            echo "version_name=1.0.7"
            echo "version_code=${URTRUCK_VERSION_CODE}"
            sha256sum "$apk" "$aab"
          } | tee android/app/build/outputs/rc-metadata.txt

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-android-rc
          path: |
            android/app/build/outputs/apk/release/UrTruck.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/rc-metadata.txt
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/urtruck-upload-key.jks"
