name: Build Android APK

# Триггеры:
#   - workflow_dispatch — ручной запуск из GitHub UI ("Run workflow") → создаёт GitHub Release с APK
#   - push в main или claude/** — автоматическая сборка на любое изменение веток разработки

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  build:
    name: Build APK on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          df -h

      - name: Install npm dependencies (skip postinstall scripts)
        run: |
          # --ignore-scripts отключает patch-package postinstall (он падает если patches/ нет)
          # --legacy-peer-deps для конфликтов expo SDK 52 / RN 0.76 / react 18.3
          # Fallback на npm install если ci падает (lock-несинхронизация)
          npm ci --legacy-peer-deps --ignore-scripts \
            || npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Apply patches (if patches/ exists)
        run: |
          if [ -d patches ] && [ "$(ls -A patches 2>/dev/null)" ]; then
            echo "Applying patches from patches/ ..."
            npx patch-package
          else
            echo "No patches to apply — skipping patch-package."
          fi

      - name: Expo prebuild (Android, non-interactive)
        run: npx expo prebuild --platform android --clean --no-install --non-interactive
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Show generated android/ structure (debug)
        run: |
          ls -la android/ android/app/ 2>/dev/null || echo "no android/"
          echo "---gradle wrapper---"
          ls -la android/gradle/wrapper/ 2>/dev/null || true

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode=summary

      - name: Rename APK to UrTruck.apk
        run: |
          cd android/app/build/outputs/apk/release
          ls -la
          mv app-release.apk UrTruck.apk
          ls -la UrTruck.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-apk
          path: android/app/build/outputs/apk/release/UrTruck.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release with APK (public direct link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: UrTruck Android APK · build #${{ github.run_number }}
          body: |
            Android APK сборка из ветки `${{ github.ref_name }}` (commit `${{ github.sha }}`).

            Скачать: см. `UrTruck.apk` ниже в Assets.
          files: android/app/build/outputs/apk/release/UrTruck.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
