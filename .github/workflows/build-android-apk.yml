name: Build Android APK

# Триггеры:
#   - workflow_dispatch — ручной запуск из GitHub UI ("Run workflow") → создаёт GitHub Release с APK
#   - push в main или claude/** — автоматическая сборка на любое изменение веток разработки

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  build:
    name: Build APK on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36 / build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          df -h

      - name: Install npm dependencies (skip postinstall scripts)
        run: |
          # --ignore-scripts отключает patch-package postinstall (он падает если patches/ нет)
          # --legacy-peer-deps для конфликтов expo SDK 52 / RN 0.76 / react 18.3
          # Fallback на npm install если ci падает (lock-несинхронизация)
          npm ci --legacy-peer-deps --ignore-scripts \
            || npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Apply patches (if patches/ exists)
        run: |
          if [ -d patches ] && [ "$(ls -A patches 2>/dev/null)" ]; then
            echo "Applying patches from patches/ ..."
            npx patch-package
          else
            echo "No patches to apply — skipping patch-package."
          fi

      - name: Materialize Android Firebase config (google-services.json)
        # P1 fix (26.08.2026): без реального google-services.json Android push
        # никогда не получит FCM runtime config, даже если весь остальной код
        # правильный (см. docs/release/android-firebase-config.md). expo
        # prebuild подхватывает файл через app.json → expo.android.googleServicesFile
        # и сам копирует его в android/app/, поэтому здесь файл кладётся в
        # корень репо — ДО prebuild.
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::Секрет ANDROID_GOOGLE_SERVICES_JSON_BASE64 не задан — Android push (FCM) не будет работать в этой сборке. См. docs/release/android-firebase-config.md."
            exit 1
          fi
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          python3 scripts/verify_android_firebase_config.py --check-source google-services.json

      - name: Expo prebuild (Android, non-interactive)
        run: npx expo prebuild --platform android --clean --no-install --non-interactive
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Verify Google Services Gradle plugin wired after prebuild
        run: python3 scripts/verify_android_firebase_config.py --check-plugin android

      - name: Target API 36 (Google Play требование с 31.08.2026)
        run: |
          printf '\nandroid.compileSdkVersion=36\nandroid.targetSdkVersion=36\nandroid.buildToolsVersion=36.0.0\n' >> android/gradle.properties

      - name: Show generated android/ structure (debug)
        run: |
          ls -la android/ android/app/ 2>/dev/null || echo "no android/"
          echo "---gradle wrapper---"
          ls -la android/gradle/wrapper/ 2>/dev/null || true

      - name: Build Debug APK with Gradle
        # P1-D (аудит 2026-09-05): этот workflow собирает ЯВНО debug-вариант.
        # Раньше здесь был assembleRelease БЕЗ URTRUCK_UPLOAD_* — а поскольку
        # `expo prebuild --clean` регенерирует android/ из шаблона Expo
        # (кастомный signing-конфиг из закоммиченного build.gradle теряется),
        # такой «release» молча подписывался debug-ключом и публиковался в
        # GitHub Releases как релиз: установившие его не могли обновиться на
        # Play-версию. Передавать сюда upload-keystore бессмысленно (шаблонный
        # gradle его не читает) и вредно (лишняя точка обращения к ключу) —
        # прод-подпись живёт ТОЛЬКО в deploy-play.yml, который собирает из
        # закоммиченного android/ с fail-closed guard'ом. Здесь — честный
        # debug-APK для ручного тестирования, и назван он debug.
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode=summary

      - name: Verify Firebase runtime resources in build output
        run: python3 scripts/verify_android_firebase_config.py --check-resources android/app/build

      - name: Rename APK to UrTruck-debug.apk
        run: |
          cd android/app/build/outputs/apk/debug
          ls -la
          mv app-debug.apk UrTruck-debug.apk
          ls -la UrTruck-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-debug-apk
          path: android/app/build/outputs/apk/debug/UrTruck-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release with APK (public direct link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: UrTruck Android DEBUG APK · build #${{ github.run_number }}
          body: |
            DEBUG-сборка Android APK из ветки `${{ github.ref_name }}` (commit `${{ github.sha }}`).

            ВНИМАНИЕ: APK подписан debug-ключом и предназначен ТОЛЬКО для
            ручного тестирования. С него НЕЛЬЗЯ обновиться на версию из
            Google Play (другая подпись) — перед установкой Play-версии
            debug-сборку нужно удалить. Прод-сборка (.aab, upload-ключ)
            собирается в deploy-play.yml.

            Скачать: см. `UrTruck-debug.apk` ниже в Assets.
          files: android/app/build/outputs/apk/debug/UrTruck-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
