name: Build Android APK

# Триггеры:
#   - workflow_dispatch — ручной запуск QA2 artifact

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit SHA to build
        required: true
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

jobs:
  build:
    name: Build APK on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set QA2 build contract
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          QA_API_URL: ${{ secrets.PRO_TEST_API_URL }}
        run: |
          set -euo pipefail
          RESOLVED_SOURCE_SHA="$(git rev-parse HEAD)"
          test "$RESOLVED_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA" || {
            echo "::error::Expected exact source SHA $EXPECTED_SOURCE_SHA, resolved $RESOLVED_SOURCE_SHA"
            exit 1
          }
          test -n "${QA_API_URL:-}" || {
            echo "::error::PRO_TEST_API_URL is required for QA2 Android builds"
            exit 1
          }
          QA_HOST="$(python3 - <<'PY'
          from urllib.parse import urlparse
          import os
          print(urlparse(os.environ['QA_API_URL']).hostname or '')
          PY
          )"
          test -n "$QA_HOST" || { echo "::error::QA2 API URL has no host"; exit 1; }
          case "$QA_HOST" in
            urtruck.kz|www.urtruck.kz|185.22.65.11)
              echo "::error::QA2 Android build must not target production"
              exit 1
              ;;
          esac
          qa_ok=no
          for path in /health /api/version; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${QA_API_URL%/}${path}" || true)"
            [[ "$code" =~ ^2 ]] && qa_ok=yes && break
          done
          test "$qa_ok" = yes || {
            echo "::error::QA2 Android build target is not healthy"
            exit 1
          }
          echo "URTRUCK_SOURCE_SHA=$RESOLVED_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "URTRUCK_BUILD_FLAVOR=qa2" >> "$GITHUB_ENV"
          echo "URTRUCK_VERSION_NAME=1.0.9" >> "$GITHUB_ENV"
          echo "URTRUCK_VERSION_CODE=211040081" >> "$GITHUB_ENV"
          echo "URTRUCK_EXPECTED_ANDROID_PACKAGE=com.urtruck.app.qa2" >> "$GITHUB_ENV"
          printf 'EXPO_PUBLIC_API_URL=%s\n' "$QA_API_URL" >> "$GITHUB_ENV"
          echo "QA2_API_TARGET=healthy-nonproduction"

      - name: Verify QA2 build regression contract
        run: node --test tests/frontend/test_qa2_live_build_contract.mjs

      - name: Materialize QA2 native MapKit build contract
        # Keep the native key out of source and separate from the web JS key.
        env:
          EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY:-}" || {
            echo "::error::YANDEX_MAPKIT_API_KEY is required for QA2 Android builds; native deal maps would be unavailable without it."
            exit 1
          }
          printf 'EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY=%s\n' "$EXPO_PUBLIC_YANDEX_MAPKIT_API_KEY" >> "$GITHUB_ENV"
          echo "QA2_YANDEX_MAPKIT_CONFIG=present"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform 36 / build-tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk || true
          df -h

      - name: Install npm dependencies (skip postinstall scripts)
        run: |
          # --ignore-scripts отключает patch-package postinstall (он падает если patches/ нет)
          # --legacy-peer-deps для конфликтов expo SDK 52 / RN 0.76 / react 18.3
          # Fallback на npm install если ci падает (lock-несинхронизация)
          npm ci --legacy-peer-deps --ignore-scripts \
            || npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Apply patches (if patches/ exists)
        run: |
          if [ -d patches ] && [ "$(ls -A patches 2>/dev/null)" ]; then
            echo "Applying patches from patches/ ..."
            npx patch-package
          else
            echo "No patches to apply — skipping patch-package."
          fi

      - name: Materialize Android Firebase config (google-services.json)
        # P1 fix (26.08.2026): без реального google-services.json Android push
        # никогда не получит FCM runtime config, даже если весь остальной код
        # правильный (см. docs/release/android-firebase-config.md). expo
        # prebuild подхватывает файл через app.json → expo.android.googleServicesFile
        # и сам копирует его в android/app/, поэтому здесь файл кладётся в
        # корень репо — ДО prebuild.
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::Секрет ANDROID_GOOGLE_SERVICES_JSON_BASE64 не задан — Android push (FCM) не будет работать в этой сборке. См. docs/release/android-firebase-config.md."
            exit 1
          fi
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          URTRUCK_EXPECTED_ANDROID_PACKAGE=com.urtruck.app.qa2 \
            python3 scripts/verify_android_firebase_config.py --check-source google-services.json

      - name: Expo prebuild (Android, non-interactive)
        # The tracked Android tree contains the approved full-screen splash and
        # its native launch wiring. --clean deletes those native files before
        # the build and silently restores Expo's tiny centered icon splash.
        run: npx expo prebuild --platform android --no-install --non-interactive
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Verify Google Services Gradle plugin wired after prebuild
        run: python3 scripts/verify_android_firebase_config.py --check-plugin android

      - name: Verify canonical Android splash survived prebuild
        run: |
          test -f android/app/src/main/res/drawable-nodpi/urtruck_splash_fullscreen.png
          test -f android/app/src/main/res/drawable/urtruck_splash_window_background.xml
          grep -F 'android:windowBackground">@drawable/urtruck_splash_window_background' android/app/src/main/res/values/styles.xml
          grep -F 'windowSplashScreenAnimatedIcon">@android:color/transparent' android/app/src/main/res/values/styles.xml

      - name: Preserve MapKit native dependency resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/build.gradle')
          text = path.read_text()
          marker = 'allprojects {\n'
          pin = """allprojects {
              configurations.configureEach {
                  resolutionStrategy.force 'com.google.android.gms:play-services-location:21.3.0'
              }
          """
          if "play-services-location:21.3.0" not in text:
              if marker not in text:
                  raise SystemExit('allprojects block not found in generated android/build.gradle')
              text = text.replace(marker, pin, 1)
              path.write_text(text)
          print('MapKit dependency pin: play-services-location=21.3.0')
          PY

      - name: Target API 36 (Google Play требование с 31.08.2026)
        run: |
          printf '\nandroid.minSdkVersion=26\nandroid.compileSdkVersion=36\nandroid.targetSdkVersion=36\nandroid.buildToolsVersion=36.0.0\n' >> android/gradle.properties

      - name: Show generated android/ structure (debug)
        run: |
          ls -la android/ android/app/ 2>/dev/null || echo "no android/"
          echo "---gradle wrapper---"
          ls -la android/gradle/wrapper/ 2>/dev/null || true

      - name: Build Release APK with Gradle
        # Release-hardening track 2, item 2: android/app/build.gradle's
        # `release` buildType now fails closed without real Play upload-key
        # properties (never silently falls back to debug signing). This
        # QA2-flavor APK intentionally has no such key (it's never uploaded
        # to Play) — the explicit opt-in flag below is the one sanctioned
        # exception to that fail-closed default.
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode=summary \
            -PURTRUCK_VERSION_CODE="$URTRUCK_VERSION_CODE" \
            -PURTRUCK_QA2=true \
            -PURTRUCK_ALLOW_DEBUG_SIGNED_RELEASE=true

      - name: Verify Firebase runtime resources in build output
        run: python3 scripts/verify_android_firebase_config.py --check-resources android/app/build

      - name: Rename APK to UrTruck.apk
        run: |
          cd android/app/build/outputs/apk/release
          ls -la
          mv app-release.apk UrTruck.apk
          ls -la UrTruck.apk

      - name: Verify QA2 artifact manifest
        env:
          EXPECTED_CERT_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/UrTruck.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.urtruck.app.qa2' versionCode='${URTRUCK_VERSION_CODE}' versionName='${URTRUCK_VERSION_NAME}'"
          echo "$BADGING" | grep -F "targetSdkVersion:'36'"
          CERT="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -n 1)"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          SHA256=$(shasum -a 256 "$APK" | awk '{print $1}')
          echo "package=com.urtruck.app.qa2"
          echo "versionName=$URTRUCK_VERSION_NAME"
          echo "versionCode=$URTRUCK_VERSION_CODE"
          echo "targetSdk=36"
          echo "sourceSHA=${URTRUCK_SOURCE_SHA}"
          echo "apkSHA256=$SHA256"
          echo "certificateSHA256=$CERT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrTruck-apk
          path: android/app/build/outputs/apk/release/UrTruck.apk
          retention-days: 30
          if-no-files-found: error