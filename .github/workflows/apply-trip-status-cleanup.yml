name: Apply Trip Status Cleanup

on:
  push:
    branches: [audit/release-blockers-2026-08-06]
    paths:
      - '.github/qa-patches/remove-trip-mark.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/release-blockers-2026-08-06
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python scripts/qa/remove_trip_mark.py
      - name: Verify cleanup
        run: |
          ! grep -q "trip_mark" src/screens/TripDetail.js
          ! grep -q "advanceTripState" src/screens/TripDetail.js
          grep -q "paddingBottom: 96 + insets.bottom" src/screens/TripDetail.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/TripDetail.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove broken trip mark action"
          git push origin HEAD:audit/release-blockers-2026-08-06
