apply plugin: 'com.android.library'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

// MapKit 4.42 declares WorkManager 2.11.1, which is built with Kotlin 2.1.
// Expo SDK 52/RN 0.76 uses Kotlin 1.9; pin the transitive runtime for this
// module so adding MapKit does not force a project-wide Kotlin upgrade.
configurations.configureEach {
  resolutionStrategy.force(
    'androidx.work:work-runtime:2.7.1',
    'org.jetbrains.kotlin:kotlin-stdlib:1.9.25',
    'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25',
    'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25'
  )
}

group = 'expo.modules.urtruckyandexmap'
version = '0.1.0'

android {
  namespace "expo.modules.urtruckyandexmap"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'com.yandex.android:maps.mobile:4.42.0-lite'
}
