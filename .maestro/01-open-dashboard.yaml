appId: host.exp.Exponent
name: pr104-01-client-profile-no-driver-cta
tags:
  - smoke
  - pr104
  - foundation
env:
  MAESTRO_ACTOR: boris
---
# PR#104 обновлён (2026-07): кнопка «Стать водителем» намеренно убрана из
# клиентского профиля (решение владельца 2026-06-13, ProfileScreen.js:312).
# Прежний happy-path «profile → become-driver → VerificationDashboard» больше
# неактуален для клиента. Смоук теперь охраняет это состояние: клиентский
# профиль открывается штатно и driver-CTA в нём отсутствует.
- runFlow: ../qa/maestro/_lib/qa-login.yaml
- tapOn:
    id: "bottom-nav-profile"
- waitForAnimationToEnd
- assertVisible:
    id: "profile-logout"
- takeScreenshot: 00_client_profile
# driver-CTA удалён — его не должно быть в клиентском профиле
- assertNotVisible:
    id: "profile-become-driver-cta"
