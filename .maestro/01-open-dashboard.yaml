appId: host.exp.Exponent
name: pr104-01-open-dashboard
tags:
  - smoke
  - pr104
  - foundation
env:
  MAESTRO_ACTOR: boris
---
# PR #104 L1 — happy path #1: client → Profile → tap «Стать водителем» →
# VerificationDashboard либо auto-redirect на approved/pending screen.
- runFlow: ../qa/maestro/_lib/qa-login.yaml
- tapOn:
    id: "bottom-nav-profile"
- waitForAnimationToEnd
- takeScreenshot: 00_profile
- scrollUntilVisible:
    element:
      id: "profile-become-driver-cta"
    direction: DOWN
    timeout: 6000
- assertVisible:
    id: "profile-become-driver-cta"
- tapOn:
    id: "profile-become-driver-cta"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 01_after_cta_tap
# Approved actor (boris=level3) → auto-redirect на ApprovedScreen.
# Fresh actor (level<2) → остаётся на VerificationDashboard.
- runFlow:
    when:
      visible:
        id: "verification-approved-screen"
    commands:
      - assertVisible:
          id: "verification-approved-screen"
      - assertVisible:
          id: "verification-approved-done-btn"
- runFlow:
    when:
      visible:
        id: "verification-dashboard"
    commands:
      - assertVisible:
          id: "verification-dashboard"
