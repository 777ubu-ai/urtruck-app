appId: host.exp.Exponent
name: pr104-02-profile-back-nav
tags:
  - smoke
  - pr104
  - foundation
env:
  MAESTRO_ACTOR: boris
---
# PR#104 обновлён (2026-07): путь «профиль → become-driver → dashboard → назад»
# удалён вместе с CTA (см. 01). Смоук теперь проверяет базовую back-навигацию
# таб-бара клиента: Profile → Chats → Profile, состояние профиля сохраняется
# (после чистки навигатора / удаления 23 файлов не должно быть регресса).
- runFlow: ../qa/maestro/_lib/qa-login.yaml
- tapOn:
    id: "bottom-nav-profile"
- waitForAnimationToEnd
- assertVisible:
    id: "profile-logout"
- tapOn:
    id: "bottom-nav-chats"
- waitForAnimationToEnd
- tapOn:
    id: "bottom-nav-profile"
- waitForAnimationToEnd
- takeScreenshot: 00_after_back
- assertVisible:
    id: "profile-logout"
- assertVisible:
    id: "bottom-nav-profile"
