// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // buildToolsVersion/minSdk/compileSdk/targetSdk/kotlinVersion/ndkVersion
        // НЕ переопределяются здесь (в отличие от pre-Expo-57 версии этого
        // файла) — expo-root-project plugin (apply ниже) сам подставляет
        // корректные дефолты под Expo SDK 57 / RN 0.86, включая Kotlin
        // >= 2.1.20. Явный pin kotlinVersion=1.9.25 из старой версии ломал
        // сборку ("Kotlin 1.9.25 is not supported by Expo modules").

        // react-native-iap 13.x по умолчанию тянет Play Billing Library 7.0.0,
        // которую Google Play с августа 2026 не принимает (нужна >= 8.0.0).
        // Библиотека читает rootProject.ext.playBillingSdkVersion в первую
        // очередь (getExtOrDefault), так что этот override перекрывает
        // дефолт модуля (RNIap_playBillingSdkVersion=7.0.0).
        playBillingSdkVersion = "8.0.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
        // P1 fix (26.08.2026): Android FCM push requires this plugin to turn
        // app/google-services.json into real Firebase runtime config
        // (google_app_id, gcm_defaultSenderId, ...). See
        // docs/release/android-firebase-config.md. Applied conditionally in
        // app/build.gradle — the classpath itself is always available so
        // that conditional `apply plugin` doesn't fail to resolve.
        classpath('com.google.gms:google-services:4.4.4')
    }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
