# client-myworkhunt — MyWork: публикации, архив и правка груза (F10);
# Deals: активная сделка и трекинг (F7/F8/F9)
appId: host.exp.Exponent
name: client-myworkhunt
tags: [client, buttonhunt]
env:
  MAESTRO_ACTOR: boris
---
- runFlow: _lib/qa-login.yaml
- tapOn: { id: "bottom-nav-mywork" }
- waitForAnimationToEnd
- takeScreenshot: 50_mywork_open
# Текущий «Мои»: активные публикации и архив
- assertVisible: { id: "my-work-screen" }
- assertVisible: { id: "my-cargo-card" }
- takeScreenshot: 51_my_cargo_publications
# Тогл архива
- runFlow:
    when:
      visible: { id: "my-work-archive-toggle" }
    commands:
      - tapOn: { id: "my-work-archive-toggle" }
      - waitForAnimationToEnd
      - takeScreenshot: 52_archive_toggled
      - tapOn: { id: "my-work-archive-toggle" }
      - waitForAnimationToEnd
# F10: правка груза не обнуляет цену
- runFlow:
    when:
      visible: { id: "my-cargo-edit-btn" }
    commands:
      - tapOn:
          id: "my-cargo-edit-btn"
          index: 0
      - waitForAnimationToEnd
      - takeScreenshot: 53_edit_cargo
      # Очистить поле цены и сохранить — цена НЕ должна обнулиться
      - runFlow:
          when:
            visible: { id: "edit-cargo-price" }
          commands:
            - tapOn: { id: "edit-cargo-price" }
            - eraseText
            - scrollUntilVisible:
                element: { id: "edit-cargo-save" }
                direction: DOWN
                timeout: 6000
            - tapOn: { id: "edit-cargo-save" }
            - waitForAnimationToEnd
            - takeScreenshot: 54_after_price_clear_save
      - back
- waitForAnimationToEnd
# Активные и завершённые сделки теперь живут в «Сделки»
- tapOn: { id: "bottom-nav-deals" }
- waitForAnimationToEnd
- tapOn: { id: "deals-tab-active" }
- waitForAnimationToEnd
- takeScreenshot: 55_deals_active
- runFlow:
    when:
      visible: { id: "deals-deal-card" }
    commands:
      - takeScreenshot: 56_deal_card_filled
      - tapOn: { id: "deals-deal-card", index: 0 }
      - waitForAnimationToEnd
      - takeScreenshot: 57_deal_workspace
      - runFlow:
          when:
            visible: { id: "deal-header-map" }
          commands:
            - tapOn: { id: "deal-header-map" }
            - waitForAnimationToEnd
            - takeScreenshot: 58_deal_tracking
            - tapOn: { id: "deal-map-back" }
      - tapOn: { id: "deal-workspace-back" }
      - waitForAnimationToEnd
- tapOn: { id: "bottom-nav-deals" }
- tapOn: { id: "deals-tab-archive" }
- waitForAnimationToEnd
- takeScreenshot: 59_deals_archive
