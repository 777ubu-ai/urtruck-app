# Shared sub-flow: bring Expo Go to UrTruck → onboarding → QA login.
#
# Caller exports MAESTRO_ACTOR (serik|boris|auditor) and MAESTRO_QA_AGENT_TOKEN
# in env before `maestro test ...`. After this sub-flow returns, the app is
# on Main with the actor's role from /qa/ensure-actor (driver/client).
#
# Idempotent: if a previous flow already logged in the same actor and Expo Go
# came back to Main, we skip the QA login and let the caller proceed with the
# already-loaded session. The caller's per-flow assertions (driver-only tabs,
# client-only Publish, etc.) will surface actor mismatches if any.
appId: com.urtruck.app
---
- launchApp
- extendedWaitUntil:
    visible: "UrTruck"
    timeout: 15000
- tapOn:
    text: "UrTruck"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Смотреть грузы|Continue|Профиль|Грузы"
    timeout: 60000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd
# Флоу намеренно требует чистый Keychain перед запуском. После входа в Main
# нет отдельной вкладки Profile, поэтому прежний dev-only logout нельзя
# считать надёжным способом вернуть форму QA-входа. Рецепт чистого прогона:
#     xcrun simctl terminate booted host.exp.Exponent
#     xcrun simctl keychain booted reset
- extendedWaitUntil:
    visible:
      id: "qa-debug-submit"
    timeout: 10000
- runScript: ensure-actor.js
- tapOn:
    id: "qa-debug-token"
- inputText: ${output.token}
# hideKeyboard флейкует на Maestro 2.6 + iOS 26 («Couldn't hide the keyboard»).
# Детерминированно сбрасываем клавиатуру тапом по верхней нейтральной зоне
# (шапка онбординга, не интерактивная), затем сабмитим токен.
- tapOn:
    point: "50%,12%"
- waitForAnimationToEnd
- tapOn:
    id: "qa-debug-submit"
# Водитель (serik): после входа приложение запрашивает ФОНОВУЮ локацию, и Expo Go
# показывает свой JS-диалог «Experience needs permissions for locationBackground»
# поверх Main (RN Modal → перекрывает bottom-nav в accessibility-дереве). Диалог
# всплывает с задержкой (после загрузки Main), поэтому одноразового ожидания мало.
# Цикл: закрыть Deny если виден → короткое optional-ожидание bottom-nav. Для
# клиента (boris) диалога нет — bottom-nav появляется сразу и последующие
# итерации мгновенно проходят (быстро); у водителя — ловим поздний диалог.
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible: "Deny"
          commands:
            - tapOn: "Deny"
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "bottom-nav-deals"
          timeout: 4000
          optional: true
- extendedWaitUntil:
    visible:
      id: "bottom-nav-deals"
    timeout: 15000
