# Shared sub-flow: bring Expo Go to UrTruck → onboarding → QA login.
#
# Caller exports MAESTRO_ACTOR (serik|boris|auditor) and MAESTRO_QA_AGENT_TOKEN
# in env before `maestro test ...`. After this sub-flow returns, the app is
# on Main with the actor's role from /qa/ensure-actor (driver/client).
#
# Idempotent: if a previous flow already logged in the same actor and Expo Go
# came back to Main, we skip the QA login and let the caller proceed with the
# already-loaded session. The caller's per-flow assertions (driver-only tabs,
# client-only Publish, etc.) will surface actor mismatches if any.
appId: host.exp.Exponent
---
- launchApp
- extendedWaitUntil:
    visible: "UrTruck"
    timeout: 15000
- tapOn:
    text: "UrTruck"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Смотреть грузы|Continue|Профиль|Грузы"
    timeout: 60000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd
# If a previous flow left an active session on Main, force-logout through the
# dev-only QA logout button (skips the iOS Alert dialog). This guarantees
# qa-debug-submit is reachable for the actor we are about to log in as.
#
# ⚠️ НАДЁЖНОСТЬ (проверено на прогоне 2026-07): эта logout-ветка хрупкая в
# Expo Go — кнопка qa-debug-logout внизу Profile перекрывается нижней
# навигацией, и tap по её центру иногда попадает в средний таб (Queue),
# из-за чего сессия не сбрасывается. Токен теперь в SecureStore (Keychain),
# поэтому очистка AsyncStorage сессию НЕ убирает. Надёжный рецепт чистого
# прогона — сбросить Keychain перед запуском, чтобы вход шёл по простому пути
# (эта ветка вообще не срабатывает):
#     xcrun simctl terminate booted host.exp.Exponent
#     xcrun simctl keychain booted reset
# TODO: приподнять qa-debug-logout над таб-баром (paddingBottom в ProfileScreen
# dev-блоке) — тогда ветка станет стабильной без внешнего reset.
- runFlow:
    when:
      visible:
        id: "bottom-nav-profile"
    commands:
      - tapOn:
          id: "bottom-nav-profile"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "qa-debug-logout"
          direction: DOWN
          timeout: 8000
      - tapOn:
          id: "qa-debug-logout"
      - extendedWaitUntil:
          visible:
            id: "qa-debug-submit"
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: "qa-debug-submit"
    timeout: 10000
- runScript: ensure-actor.js
- tapOn:
    id: "qa-debug-token"
- inputText: ${output.token}
# hideKeyboard флейкует на Maestro 2.6 + iOS 26 («Couldn't hide the keyboard»).
# Детерминированно сбрасываем клавиатуру тапом по верхней нейтральной зоне
# (шапка онбординга, не интерактивная), затем сабмитим токен.
- tapOn:
    point: "50%,12%"
- waitForAnimationToEnd
- tapOn:
    id: "qa-debug-submit"
# Водитель (serik): после входа приложение запрашивает ФОНОВУЮ локацию, и Expo Go
# показывает свой JS-диалог «Experience needs permissions for locationBackground»
# поверх Main (RN Modal → перекрывает bottom-nav в accessibility-дереве). Диалог
# всплывает с задержкой (после загрузки Main), поэтому одноразового ожидания мало.
# Цикл: закрыть Deny если виден → короткое optional-ожидание bottom-nav. Для
# клиента (boris) диалога нет — bottom-nav появляется сразу и последующие
# итерации мгновенно проходят (быстро); у водителя — ловим поздний диалог.
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible: "Deny"
          commands:
            - tapOn: "Deny"
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "bottom-nav-profile"
          timeout: 4000
          optional: true
- extendedWaitUntil:
    visible:
      id: "bottom-nav-profile"
    timeout: 15000
