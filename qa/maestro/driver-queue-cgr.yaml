# driver-queue-cgr — новый operational dashboard «Граница».
# Проверяет: вкладка → dashboard → поиск госномера → страна CN → КПП → детали.
appId: host.exp.Exponent
name: driver-border-cgr
tags: [driver, cgr, border]
env:
  MAESTRO_ACTOR: serik
---
- runFlow: _lib/qa-login.yaml
- assertVisible: { id: "bottom-nav-queue" }
- tapOn: { id: "bottom-nav-queue" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "queue-title" }
    timeout: 12000
- takeScreenshot: D0_border_dashboard
# Главная ценность — страны и честные live/no-data состояния.
- assertVisible: { id: "border-country-CN" }
# Поиск своей машины по публичному CGR-реестру.
- tapOn: { id: "border-plate-input" }
- inputText: "777ABC01"
- tapOn: { id: "border-plate-check" }
- waitForAnimationToEnd
- takeScreenshot: D1_border_plate_lookup
# Китай → список КПП.
- tapOn: { id: "border-country-CN" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "border-crossing-card" }
    timeout: 8000
- takeScreenshot: D2_border_crossings_CN
- tapOn: { id: "border-crossing-card", index: 0 }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "border-crossing-detail" }
    timeout: 8000
- takeScreenshot: D3_border_crossing_detail
