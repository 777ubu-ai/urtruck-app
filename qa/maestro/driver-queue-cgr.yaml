# Canonical driver Border flow: private vehicle context, secondary public
# plate lookup, and lazy loading for exactly one selected checkpoint.
appId: host.exp.Exponent
name: driver-border-cgr
tags: [driver, cgr, border]
env:
  MAESTRO_ACTOR: serik
---
- runFlow: _lib/qa-login.yaml
- assertVisible: { id: "bottom-nav-queue" }
- tapOn: { id: "bottom-nav-queue" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "border-screen-v2" }
    timeout: 12000
- assertVisible: { id: "border-driver-vehicle-card" }
- assertVisible: { id: "border-country-CN" }
- takeScreenshot: D0_border_dashboard
# Manual lookup stays collapsed until the driver explicitly requests it.
- runFlow:
    when:
      visible: { id: "border-driver-manual-toggle" }
    commands:
      - tapOn: { id: "border-driver-manual-toggle" }
      - assertVisible: { id: "border-plate-search" }
      - tapOn: { id: "border-plate-input" }
      - inputText: "777ABC01"
      - tapOn: { id: "border-plate-check" }
      - waitForAnimationToEnd
      - takeScreenshot: D1_border_plate_lookup
# CGR detail is lazy: one card tap produces one selected-checkpoint panel.
- tapOn: { id: "border-country-CN" }
- extendedWaitUntil:
    visible: { id: "border-checkpoint-chip" }
    timeout: 8000
- takeScreenshot: D2_border_crossings_CN
- tapOn: { id: "border-checkpoint-chip", index: 0 }
- extendedWaitUntil:
    visible: { id: "border-selected-card" }
    timeout: 15000
- takeScreenshot: D3_border_crossing_detail
