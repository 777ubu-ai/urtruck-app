# client-deals-verify2 — F9 (трекинг с именем водителя) + F10 (цена не обнуляется)
# deal-track-truck живёт на карточке списка «Везут», тапаем его НА СПИСКЕ.
appId: host.exp.Exponent
name: client-deals-verify2
tags: [client, buttonhunt, deals]
env:
  MAESTRO_ACTOR: boris
---
- runFlow: _lib/qa-login.yaml
- tapOn: { id: "bottom-nav-mywork" }
- waitForAnimationToEnd
- tapOn: { id: "my-work-tab-enroute" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "deal-track-truck" }
    timeout: 8000
- takeScreenshot: A0_enroute_with_track
# F9: тап «Где машина» → TrackTruck, имя водителя видно
- tapOn:
    id: "deal-track-truck"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: A1_tracking_screen_F9
- back
- waitForAnimationToEnd
# F10: правка груза → очистить цену → сохранить → цена сохраняется
- tapOn: { id: "bottom-nav-mywork" }
- waitForAnimationToEnd
- tapOn: { id: "my-work-tab-searching" }
- waitForAnimationToEnd
- tapOn:
    id: "my-cargo-edit-btn"
    index: 0
- extendedWaitUntil:
    visible: { id: "edit-cargo-price" }
    timeout: 8000
- takeScreenshot: A2_edit_modal_price2500
- tapOn: { id: "edit-cargo-price" }
- eraseText
- takeScreenshot: A3_price_cleared
- tapOn: { id: "edit-cargo-save" }
- waitForAnimationToEnd
- takeScreenshot: A4_after_save
- tapOn:
    id: "my-cargo-card"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: A5_price_preserved_F10
