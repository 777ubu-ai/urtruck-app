appId: com.urtruck.app
name: client-tabs
tags:
  - smoke
  - client
  - guest
---
# В Expo Go без OTP «Смотреть грузы» открывает клиентский гостевой набор:
# Грузы (MyWork) / Машины (Feed) / Сделки. Это соответствует канону
# AppNavigator: размещение находится внутри «Грузов», а профиль — в ☰,
# поэтому ни Publish, ни Profile отдельными вкладками больше не являются.
- launchApp
- extendedWaitUntil:
    visible: "UrTruck"
    timeout: 15000
- tapOn:
    text: "UrTruck"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Смотреть грузы|Continue"
    timeout: 60000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "onb-v2-cta-guest"
    timeout: 10000
- takeScreenshot: 01_onboarding
- assertVisible:
    id: "onb-v2-cta-phone"
- assertVisible:
    id: "onb-v2-cta-guest"
- tapOn:
    id: "onb-v2-cta-guest"
- extendedWaitUntil:
    visible:
      id: "bottom-nav-deals"
    timeout: 30000
- takeScreenshot: 02_after_guest_main
- assertVisible:
    id: "bottom-nav-feed"
- assertVisible:
    id: "bottom-nav-mywork"
- assertVisible:
    id: "bottom-nav-deals"
- assertNotVisible:
    id: "bottom-nav-publish"
- assertNotVisible:
    id: "bottom-nav-chats"
- assertNotVisible:
    id: "bottom-nav-profile"
