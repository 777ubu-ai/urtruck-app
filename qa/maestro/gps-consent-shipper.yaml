# Active-trip GPS, device A — after the driver starts the trip, the shipper
# immediately gets the live-map action without requesting GPS separately.
appId: host.exp.Exponent
name: gps-consent-shipper
tags: [gps, consent, shipper, release]
env:
  MAESTRO_ACTOR: boris
---
- runFlow: _lib/qa-login.yaml
- tapOn: { id: "bottom-nav-mywork" }
- waitForAnimationToEnd
- tapOn: { id: "my-work-tab-enroute" }
- extendedWaitUntil:
    visible: { id: "my-order-card" }
    timeout: 15000
- tapOn: { id: "my-order-card", index: 0 }
- extendedWaitUntil:
    visible: { id: "deal-track-truck" }
    timeout: 15000
- takeScreenshot: GPS_05_shipper_tracking_available
- tapOn: { id: "deal-track-truck" }
- takeScreenshot: GPS_06_shipper_live_map
