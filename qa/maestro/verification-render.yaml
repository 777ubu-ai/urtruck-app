appId: host.exp.Exponent
name: verification-render
tags:
  - smoke
  - registration
---
# Identity/DOB/Help — за auth-барьером. Без реального Google/Apple/Email OTP
# доходим до canonical auth entry и проверяем, что доступны Google, Apple,
# Email и отсутствует удалённый телефонный login-tab.
- launchApp
- extendedWaitUntil:
    visible: "UrTruck"
    timeout: 15000
- tapOn:
    text: "UrTruck"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Вход или регистрация|Sign in|Continue"
    timeout: 60000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "onb-v2-cta-phone"
    timeout: 10000
- tapOn:
    id: "onb-v2-cta-phone"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 01_auth_social_email_screen
- assertVisible:
    id: "auth-google"
- assertVisible:
    id: "auth-apple"
- assertVisible:
    id: "email-v2-input"
- assertVisible:
    id: "phone-v2-cta"
- assertVisible:
    id: "auth-legal-consent"

# Опциональная ветка: если в текущей сессии Identity-step уже виден
# (например, после ручного auth), проверяем форму. Иначе тихо пропускаем.
- runFlow:
    when:
      visible:
        id: "identity-step-screen"
    commands:
      - takeScreenshot: 02_identity_screen
      - assertVisible:
          id: "identity-first-name"
      - assertVisible:
          id: "identity-last-name"
      - assertVisible:
          id: "identity-birth"
      - assertVisible:
          id: "identity-iin"
      - assertVisible:
          id: "identity-help"
      - tapOn:
          id: "identity-help"
      - waitForAnimationToEnd
      - takeScreenshot: 03_help_panel
