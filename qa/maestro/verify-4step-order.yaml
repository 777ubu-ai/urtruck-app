# verify-4step-order — build 39: новый порядок верификации водителя
#   Шаг 1/4 Гражданство → 2/4 Удостоверение (лицевая+оборотная) →
#   3/4 Документы авто → 4/4 Параметры. СЕЛФИ и ФОТО-ФУРЫ УБРАНЫ.
#
# Входим с driver-актёра serik. Открываем цепочку из профиля (profile-pro-cta).
# Проверяем: экран гражданства → удостоверение с ДВУМя фото (id-front/id-back),
# отсутствие селфи-шага, счётчик «Шаг N из 4».
# ⚠️ ЗАПУСК: EXPO_PUBLIC_API_URL=http://127.0.0.1:8001 (см. _lib/README.md)
appId: host.exp.Exponent
name: verify-4step-order
tags: [driver, verification, build39]
env:
  MAESTRO_ACTOR: serik
---
- runFlow: _lib/qa-login.yaml
- tapOn: { id: "bottom-nav-profile" }
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { id: "profile-pro-cta" }
    direction: DOWN
    timeout: 8000
- tapOn: { id: "profile-pro-cta" }
- waitForAnimationToEnd
# Шаг 1/4 — Гражданство.
- extendedWaitUntil:
    visible: { id: "citizenship-continue" }
    timeout: 10000
- takeScreenshot: V4_step1_citizenship
- tapOn: { id: "citizenship-continue" }
- waitForAnimationToEnd
# Шаг 2/4 — Удостоверение: ДВЕ стороны (лицевая + оборотная), ИИН, ФИО.
- extendedWaitUntil:
    visible: { id: "identity-step-screen" }
    timeout: 10000
- assertVisible: { id: "identity-id-front" }
- assertVisible: { id: "identity-id-back" }
- assertVisible: { id: "identity-iin" }
- takeScreenshot: V4_step2_identity_two_sides
# Селфи-шага в цепочке быть НЕ должно.
- assertNotVisible: "Селфи"
- assertNotVisible: "селфи"
# Дальше шаги 3/4 (Документы авто) и 4/4 (Параметры) — навигация по identity-next
# после заполнения; полный проход с фото требует мока камеры (📱 устройство).
