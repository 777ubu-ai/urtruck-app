# Active-trip GPS, device B — the driver sees only «Начать рейс».
# Location permission must be pre-granted on the QA device; a clean-device run
# separately verifies that the OS sheet opens from this same tap.
appId: host.exp.Exponent
name: gps-consent-driver
tags: [gps, consent, driver, release]
env:
  MAESTRO_ACTOR: serik
---
- runFlow: _lib/qa-login.yaml
- tapOn: { id: "bottom-nav-deals" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "deal-room-list-card" }
    timeout: 15000
- tapOn: { id: "deal-room-list-card", index: 0 }
- extendedWaitUntil:
    visible: { id: "deal-action-start-delivery" }
    timeout: 15000
- takeScreenshot: GPS_03_driver_start_trip
- tapOn: { id: "deal-action-start-delivery" }
- extendedWaitUntil:
    visible: { id: "deal-action-mark-at-border" }
    timeout: 15000
- takeScreenshot: GPS_04_driver_tracking_in_transit
