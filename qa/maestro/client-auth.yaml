appId: host.exp.Exponent
name: client-auth
tags:
  - smoke
  - client
  - auth
env:
  MAESTRO_ACTOR: boris
---
- runFlow: _lib/qa-login.yaml
- takeScreenshot: 01_after_qa_login_client
# Канон обеих ролей: четыре вкладки. Профиль открывается через ☰,
# публикация груза — CTA внутри MyWork.
- assertVisible:
    id: "bottom-nav-mywork"
- assertVisible:
    id: "bottom-nav-feed"
- assertVisible:
    id: "bottom-nav-deals"
- assertVisible:
    id: "bottom-nav-queue"
- tapOn:
    id: "bottom-nav-feed"
- waitForAnimationToEnd
- takeScreenshot: 02_client_feed
- tapOn:
    id: "bottom-nav-mywork"
- waitForAnimationToEnd
- takeScreenshot: 03_client_mywork
- tapOn:
    id: "mytrips-place-cargo"
- waitForAnimationToEnd
- takeScreenshot: 04_client_publish_opens
# CreateCargo testID'ы из #98 каталога. cargo-from-input/cargo-to-input
# рендерятся только после раскрытия RoutePointPicker; для smoke
# достаточно `cargo-desc-input` (видим сразу) и submit-кнопки
# (приходится прокрутить вниз).
- extendedWaitUntil:
    visible:
      id: "cargo-desc-input"
    timeout: 10000
- assertVisible:
    id: "cargo-desc-input"
- scrollUntilVisible:
    element:
      id: "cargo-submit-button"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "cargo-submit-button"
- takeScreenshot: 05_client_publish_form_bottom
# Profile-проверки для client-actor — отдельный smoke flow.
# Здесь доказываем канонические четыре вкладки и открытие CreateCargo
# через CTA внутри MyWork.
