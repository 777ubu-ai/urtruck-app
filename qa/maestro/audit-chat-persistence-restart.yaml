appId: host.exp.Exponent
name: audit-chat-persistence-restart
tags:
  - audit
  - chat
  - persistence
  - p0
env:
  MAESTRO_ACTOR: serik
---
# QA-аудит, флоу 3: персистентность чата + реальное имя собеседника.
# 1) Открываем комнату, шлём уникальное сообщение.
# 2) Убиваем приложение, перезапускаем, возвращаемся в ту же комнату.
# 3) Сообщение обязано быть на месте (persisted server-side),
#    заголовок — НЕ плейсхолдер «Собеседник».
# Регресс P0 этого аудита: send-пути под if(partner?.id) молча теряли
# сообщение при входе по roomId.
- runFlow: _lib/qa-login.yaml
- tapOn:
    id: "bottom-nav-chats"
- waitForAnimationToEnd
- takeScreenshot: audit_chat_01_rooms
- tapOn:
    id: "deal-room-list-card"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: audit_chat_02_room_open
- tapOn:
    id: "chat-input"
- inputText: "QA-audit-persist-20260611"
- tapOn:
    id: "chat-send-btn"
- waitForAnimationToEnd
- assertVisible:
    text: "QA-audit-persist-20260611"
- takeScreenshot: audit_chat_03_sent
# ── Рестарт (killed state) ──
- stopApp
- runFlow: _lib/qa-login.yaml
- tapOn:
    id: "bottom-nav-chats"
- waitForAnimationToEnd
- tapOn:
    id: "deal-room-list-card"
    index: 0
- waitForAnimationToEnd
# Сообщение пережило рестарт = дошло до сервера (не только optimistic).
- extendedWaitUntil:
    visible:
      text: "QA-audit-persist-20260611"
    timeout: 10000
- assertVisible:
    text: "QA-audit-persist-20260611"
# Заголовок — реальное имя (дотянуто из /chat/rooms), не плейсхолдер.
- assertNotVisible:
    text: "Собеседник"
- takeScreenshot: audit_chat_04_after_restart
