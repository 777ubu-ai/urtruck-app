appId: com.urtruck.app
name: wait-trip-map
---
- extendedWaitUntil:
    visible:
      id: "deal-header-map"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "deal-header-map"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "deal-header-map"
- extendedWaitUntil:
    visible:
      id: "deal-map-fullscreen"
    timeout: 30000
