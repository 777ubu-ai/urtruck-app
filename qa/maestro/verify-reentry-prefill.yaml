# verify-reentry-prefill — build 39: повторный вход НЕ гонит по регистрации
# Уже верифицированный водитель (serik = approved level 3 через ensure-actor):
#   • в профиле виден статус/данные, а не онбординг-регистрация;
#   • открытие pro-CTA ведёт в редактирование pro-данных (EditProfile), а НЕ
#     заново в цепочку «Гражданство/Шаг 1» (fix «не гонять заново»).
# ⚠️ ЗАПУСК: EXPO_PUBLIC_API_URL=http://127.0.0.1:8001 (см. _lib/README.md)
appId: host.exp.Exponent
name: verify-reentry-prefill
tags: [driver, verification, reentry, build39]
env:
  MAESTRO_ACTOR: serik
---
- runFlow: _lib/qa-login.yaml
- tapOn: { id: "bottom-nav-profile" }
- waitForAnimationToEnd
# Верифицированный водитель НЕ на онбординге: виден «Мой статус», не «Шаг 1».
- scrollUntilVisible:
    element: { id: "profile-my-status" }
    direction: DOWN
    timeout: 8000
- assertVisible: { id: "profile-my-status" }
- assertNotVisible: { id: "citizenship-continue" }
- takeScreenshot: VR_profile_no_reonboard
# Открываем pro-CTA — для approved это редактирование pro-данных, НЕ повторная
# верификация с нуля (citizenship-continue не должен появиться).
- tapOn: { id: "profile-pro-cta" }
- waitForAnimationToEnd
- assertNotVisible: { id: "citizenship-continue" }
- takeScreenshot: VR_reentry_no_fresh_verify
