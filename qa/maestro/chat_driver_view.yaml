# chat_driver_view — driver видит ответ owner + историю в той же канон-комнате
appId: host.exp.Exponent
name: chat_driver_view
tags: [chat, notifications, e2e]
env:
  MAESTRO_ACTOR: serik
---
- runFlow: _lib/qa-login.yaml
- assertVisible: { id: "bottom-nav-deals" }
- tapOn: { id: "bottom-nav-deals" }
- waitForAnimationToEnd
- tapOn: { id: "deals-tab-active" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "deals-minimal-header" }
    timeout: 12000
- assertVisible: { id: "deal-room-list" }
- takeScreenshot: CD1_driver_chats_list
- tapOn: { id: "deals-deal-card", index: 0 }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "deal-compact-header" }
    timeout: 10000
- assertNotVisible: "Собеседник"
# История обеих реплик в одной комнате
- assertVisible: "QA driver msg MAESTRO"
- assertVisible: "QA owner reply MAESTRO"
- takeScreenshot: CD2_driver_sees_owner_reply
