# client-deal-chat — 2.1: деталь сделки, «Чат по заказу» оранжевый (client)
appId: host.exp.Exponent
name: client-deal-chat
tags: [client, p2]
env:
  MAESTRO_ACTOR: boris
---
- runFlow: _lib/qa-login.yaml
- tapOn: { id: "bottom-nav-deals" }
- waitForAnimationToEnd
- tapOn: { id: "deals-tab-active" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "deals-deal-card" }
    timeout: 8000
- tapOn: { id: "deals-deal-card", index: 0 }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "deal-chat-input" }
    timeout: 8000
- takeScreenshot: P73_deal_detail_chat_orange
- assertVisible: { id: "deal-chat-input" }
