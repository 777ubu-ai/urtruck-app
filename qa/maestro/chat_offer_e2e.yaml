# chat_offer_e2e — Часть 2 (базар-UX: живой торг прямо в чате).
# Доказывает in-app wiring торга у BIDDER (serik) в комнате чата сделки:
#   1. карточка живого торга (bargain-card) рендерит активную ставку с суммой
#      (bargain-amount) — источник истины статус ставки на сервере;
#   2. кнопка 💰 (chat-bid-btn) в инпут-баре открывает BidModal (bid-modal)
#      «Предложить цену».
# Сам сабмит ставки/контр-предложения покрыт API-E2E и bid-флоу (driver-bid-
# actions, client-offers-actions); здесь фокус — что торг доступен ИЗ ЧАТА.
#
# Предусловие (засев через API): груз boris + каноническая комната пары
# boris↔serik с активной ставкой serik (pending). cargoId приходит в
# ChatScreen из комнаты, поэтому карточка торга и 💰 привязаны к этому грузу.
#
# ⚠️ Запуск ТОЛЬКО после зелёного полного регресса и с готовым API-засевом.
appId: host.exp.Exponent
name: chat_offer_e2e
tags: [chat, bargain, offer, market, e2e]
env:
  MAESTRO_ACTOR: serik
---
- runFlow: _lib/qa-login.yaml

# Открываем комнату чата с владельцем груза (верхняя — самая свежая).
- assertVisible: { id: "bottom-nav-chats" }
- tapOn: { id: "bottom-nav-chats" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "deal-room-list-card" }
    timeout: 12000
- tapOn: { id: "deal-room-list-card", index: 0 }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "chat-input" }
    timeout: 12000

# Карточка живого торга рендерит активную ставку с суммой.
- extendedWaitUntil:
    visible: { id: "bargain-card" }
    timeout: 12000
- assertVisible: { id: "bargain-amount" }
- takeScreenshot: CO1_bargain_card_in_chat

# 💰 в инпут-баре открывает BidModal «Предложить цену».
- assertVisible: { id: "chat-bid-btn" }
- tapOn: { id: "chat-bid-btn" }
- extendedWaitUntil:
    visible: { id: "bid-modal" }
    timeout: 8000
- waitForAnimationToEnd
# Модалка «Предложить цену» открыта — видно заголовок и кнопку отправки.
- assertVisible:
    text: ".*Отправить предложение.*"
- takeScreenshot: CO2_bid_modal_open
