# chat_offer_e2e — Часть 2 (базар-UX: живой торг прямо в чате).
# Доказывает, что BIDDER (serik) внутри чата сделки: (1) видит кнопку 💰
# (chat-bid-btn) в инпут-баре; (2) по тапу открывается BidModal (bid-modal);
# (3) после отправки предложения в чате появляется карточка торга
# (bargain-card) с суммой (bargain-amount). Действия идут через существующие
# эндпоинты /market/bids — правила торга не меняются.
#
# Предусловие (засев через API): груз boris + каноническая комната чата пары
# boris↔serik (deal_key), доступная serik'у во вкладке «Чаты». cargoId/tripId
# приходят в ChatScreen из комнаты, поэтому 💰 создаёт ставку по этому грузу.
#
# ⚠️ Запуск ТОЛЬКО после зелёного полного регресса и с готовым API-засевом.
appId: host.exp.Exponent
name: chat_offer_e2e
tags: [chat, bargain, offer, market, e2e]
env:
  MAESTRO_ACTOR: serik
---
- runFlow: _lib/qa-login.yaml

# Открываем комнату чата с владельцем груза (верхняя — самая свежая).
- assertVisible: { id: "bottom-nav-chats" }
- tapOn: { id: "bottom-nav-chats" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "deal-room-list-card" }
    timeout: 12000
- tapOn: { id: "deal-room-list-card", index: 0 }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "chat-input" }
    timeout: 12000
- takeScreenshot: CO1_chat_open

# 💰 в инпут-баре открывает BidModal.
- assertVisible: { id: "chat-bid-btn" }
- tapOn: { id: "chat-bid-btn" }
- extendedWaitUntil:
    visible: { id: "bid-modal" }
    timeout: 8000
- takeScreenshot: CO2_bid_modal_open

# Вводим сумму предложения и отправляем.
- tapOn: { id: "bid-amount-input" }
- inputText: "5200"
# Сброс клавиатуры детерминированным тапом по нейтральной зоне (hideKeyboard
# флейкует на Maestro 2.6 + iOS 26), затем submit.
- tapOn: { point: "50%,8%" }
- waitForAnimationToEnd
- tapOn: { id: "bid-submit" }
- waitForAnimationToEnd

# После отправки в чате появляется карточка живого торга с суммой.
- extendedWaitUntil:
    visible: { id: "bargain-card" }
    timeout: 15000
- assertVisible: { id: "bargain-amount" }
- takeScreenshot: CO3_bargain_card_visible
