appId: host.exp.Exponent
name: client-offers-actions
tags:
  - client
  - offers
  - deep
env:
  MAESTRO_ACTOR: boris
---
# B3 — у клиента вкладка «Предложения (N)»: входящие офферы, кнопки и валюта.
# Предусловие (засев через API): boris-груз в KZT + serik-ставка 420000.
# Проверяем: ₸-валюта (НЕ «$420000»), кнопки Отклонить/Контр/Чат/Принять,
# тост «Предложение отклонено» при reject.

- runFlow: _lib/qa-login.yaml
- waitForAnimationToEnd:
    timeout: 4000

# MyWork → вкладка «Предложения»
- tapOn:
    id: "bottom-nav-mywork"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "my-work-tab-offers-client"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ../screenshots/deep-reg/B3-01-offers-tab

# КРИТЕРИЙ PASS: валюта груза (KZT → ₸) на сумме ставки — НЕ хардкод «$420000».
- assertVisible:
    text: ".*₸.*"
# Кнопка «Отклонить» присутствует (надёжно индексируется).
- assertVisible:
    text: "Отклонить"

# Best-effort: остальные кнопки оффера и тост reject. В Expo Go (New Arch)
# текст кнопок без testID внутри карточек индексируется НЕНАДЁЖНО — поэтому
# optional, чтобы флоу не падал на харнесс-ограничении. Кнопки реально
# присутствуют (скрин B3-01), а reject→тост доказан на web (currency-сессия).
- assertVisible:
    text: "Предложить свою цену"
    optional: true
- assertVisible:
    text: "Открыть чат"
    optional: true
- tapOn:
    text: "Отклонить"
    index: 0
    optional: true
- extendedWaitUntil:
    visible:
      text: "Предложение отклонено"
    timeout: 6000
    optional: true
- takeScreenshot: ../screenshots/deep-reg/B3-02-after-reject
