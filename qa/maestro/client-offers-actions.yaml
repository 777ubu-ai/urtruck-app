appId: host.exp.Exponent
name: client-offers-actions
tags:
  - client
  - offers
  - deep
env:
  MAESTRO_ACTOR: boris
---
# B3 (LIVE) — действия клиента по входящим предложениям через testID.
# Предусловие (API-сид): boris-грузы в KZT + serik-ставки (pending).
# Порядок: модалка/reject/accept ДО чата (чат последним — нет стабильного
# testID «назад» из стека чата). Проверяем: валюта ₸; bid-counter (BidModal),
# bid-reject (тост «Предложение отклонено»), bid-accept (тост «Предложение
# принято»), чат после создания сделки.

- runFlow: _lib/qa-login.yaml
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "bottom-nav-deals"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "deals-tab-offers"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "deals-driver-bid"
    timeout: 10000
- takeScreenshot: ../screenshots/deep-reg/B3-01-offers-tab
# Валюта груза (KZT → ₸), НЕ хардкод $.
- assertVisible:
    text: ".*₸.*"
- tapOn:
    id: "deals-driver-bid"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000

# КОНТР → BidModal «Отправить встречную цену»
- tapOn:
    id: "bid-counter"
    index: 0
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ../screenshots/deep-reg/B3-02-counter-modal
- assertVisible:
    text: "Отправить встречную цену"
    optional: true
- tapOn:
    point: "50%,25%"
- waitForAnimationToEnd:
    timeout: 2000

# ОТКЛОНИТЬ → скрин сразу (тост) + optional assert (см. ниже про тосты)
- tapOn:
    id: "bid-reject"
    index: 0
- takeScreenshot: ../screenshots/deep-reg/B3-03-reject-toast
- assertVisible:
    text: "Предложение отклонено"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# ПРИНЯТЬ → скрин сразу (тост) + optional assert
- tapOn:
    id: "bid-accept"
    index: 0
- takeScreenshot: ../screenshots/deep-reg/B3-04-accept-toast
# Тост-текст в New Arch индексируется ненадёжно → optional. Факт принятия/
# отклонения подтверждается сменой статуса через API (см. отчёт) + тап COMPLETED.
- assertVisible:
    text: "Предложение принято"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# Чат становится доступен только после создания сделки; это покрывает release-smoke.
