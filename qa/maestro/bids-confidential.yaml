# bids-confidential — Часть 1 (InDriver-модель конфиденциальности ставок).
# Доказывает, что НЕ-владелец в CargoDetail видит только счётчик предложений
# (cargo-bids-count) и подсказку о скрытых ставках (cargo-bids-confidential),
# но НЕ видит чужих сумм. Полный список — только владельцу (проверяется
# отдельно client-offers-actions.yaml на стороне boris).
#
# Предусловие (засев через API): груз boris с ≥1 активной ставкой от serik,
# видимый в ленте auditor'а (третья сторона — не владелец и не автор ставки).
# Именно у auditor'а бэкенд отдаёт count>0, my_bid=None, 0 видимых ставок,
# поэтому карточка показывает счётчик + подсказку, без сумм.
#
# ⚠️ Запуск ТОЛЬКО после зелёного полного регресса и с готовым API-засевом.
appId: host.exp.Exponent
name: bids-confidential
tags: [bids, confidential, market, e2e]
env:
  MAESTRO_ACTOR: auditor
---
- runFlow: _lib/qa-login.yaml

# Открываем первый груз из ленты (засев гарантирует груз с активной ставкой).
- assertVisible: { id: "bottom-nav-feed" }
- tapOn: { id: "bottom-nav-feed" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "cargo-card" }
    timeout: 12000
- tapOn: { id: "cargo-card", index: 0 }
- waitForAnimationToEnd

# Счётчик предложений виден (публичная агрегированная величина).
- extendedWaitUntil:
    visible: { id: "cargo-bids-count" }
    timeout: 15000
- assertVisible: { id: "cargo-bids-count" }
- takeScreenshot: BC1_cargo_bids_count

# Подсказка о скрытых ставках — ключевое доказательство конфиденциальности:
# не-владелец видит только свою ставку, чужие суммы скрыты.
- assertVisible: { id: "cargo-bids-confidential" }
- takeScreenshot: BC2_cargo_bids_confidential
