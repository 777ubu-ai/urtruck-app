appId: host.exp.Exponent
name: registration-guides-first
tags:
  - registration
  - driver
  - guides
env:
  MAESTRO_ACTOR: serik
---
# «Образец-вперёд» (guide-first) во ВСЕХ 6 шагах регистрации водителя.
#
# Правило: на каждом шаге, где грузится фото, ОБРАЗЕЦ (✅/❌) виден ДО контрола
# загрузки и по тапу открывается крупно (Modal photo-guide-zoom).
#
# Доступ к шагам:
#  - serik засеян в локальной QA-БД на verification_level=1 → Profile →
#    «profile-pro-cta» ведёт в стек регистрации (level>=2 уводит в EditProfile).
#  - переходы между шагами — через DEV/QA-only кнопку «qa-skip-step»
#    (см. src/components/dev/QaStepSkip.js): она обходит нативный iOS фото-пикер
#    и серверные гейты (face_verified / OCR / ИИН-госреестр), недоступные на
#    симуляторе. Сами экраны и образцы рендерятся НАСТОЯЩИЕ.
#
# 6 образцов: identity-photo-guide · selfie-guide · vd-license-guide ·
# vd-license-selfie-guide · vp-exterior-guide · vp-interior-guide.

- runFlow: _lib/qa-login.yaml
- waitForAnimationToEnd:
    timeout: 4000

# → Profile → PRO-CTA → Identity
- tapOn:
    id: "bottom-nav-profile"
- waitForAnimationToEnd:
    timeout: 4000
- scrollUntilVisible:
    element:
      id: "profile-pro-cta"
    direction: UP
    timeout: 6000
- tapOn:
    id: "profile-pro-cta"
- extendedWaitUntil:
    visible:
      id: "identity-step-screen"
    timeout: 12000

# ── ШАГ 1/6: Личное фото (IdentityStep) → identity-photo-guide ──
- assertVisible:
    id: "identity-photo-guide"     # образец виден
- assertVisible:
    id: "identity-photo"           # контрол загрузки фото ниже образца
- tapOn:
    id: "identity-photo-guide"
- assertVisible:
    id: "photo-guide-zoom"         # зум открылся
- takeScreenshot: ../screenshots/maestro-guides/step1-identity-photo-guide
- tapOn:
    id: "photo-guide-zoom"         # закрыть
- waitForAnimationToEnd:
    timeout: 1500

# → Selfie
- scrollUntilVisible:
    element:
      id: "qa-skip-step"
    direction: DOWN
    timeout: 12000
    optional: true
- tapOn:
    id: "qa-skip-step"
- extendedWaitUntil:
    visible:
      id: "selfie-step-screen"
    timeout: 10000

# ── ШАГ 2/6: Селфи (SelfieStep) → selfie-guide ──
- assertVisible:
    id: "selfie-guide"
- assertVisible:
    id: "selfie-slot"              # контрол съёмки ниже образца
- tapOn:
    id: "selfie-guide"
- assertVisible:
    id: "photo-guide-zoom"
- takeScreenshot: ../screenshots/maestro-guides/step2-selfie-guide
- tapOn:
    id: "photo-guide-zoom"
- waitForAnimationToEnd:
    timeout: 1500

# → VehicleDocs
- scrollUntilVisible:
    element:
      id: "qa-skip-step"
    direction: DOWN
    timeout: 12000
    optional: true
- tapOn:
    id: "qa-skip-step"
- extendedWaitUntil:
    visible:
      id: "vehicle-docs-screen"
    timeout: 10000

# ── ШАГ 3/6: Права лицевая (VehicleDocs) → vd-license-guide ──
- scrollUntilVisible:
    element:
      id: "vd-license-guide"
    direction: DOWN
    timeout: 6000
    visibilityPercentage: 20
    centerElement: true
- assertVisible:
    id: "vd-license-guide"
- tapOn:
    id: "vd-license-guide"
- assertVisible:
    id: "photo-guide-zoom"
- takeScreenshot: ../screenshots/maestro-guides/step3-vd-license-guide
- tapOn:
    id: "photo-guide-zoom"
- waitForAnimationToEnd:
    timeout: 1500

# ── ШАГ 4/6: Селфи с правами (VehicleDocs) → vd-license-selfie-guide ──
# Скроллим к нижнему якорю qa-skip-step: образец встаёт в середину экрана,
# ВЫШЕ фиксированного футера «Далее» (иначе тап уходит в кнопку под образцом).
- scrollUntilVisible:
    element:
      id: "qa-skip-step"
    direction: DOWN
    timeout: 12000
    optional: true
- assertVisible:
    id: "vd-license-selfie-guide"
- tapOn:
    id: "vd-license-selfie-guide"
- assertVisible:
    id: "photo-guide-zoom"
- takeScreenshot: ../screenshots/maestro-guides/step4-vd-license-selfie-guide
- tapOn:
    id: "photo-guide-zoom"
- waitForAnimationToEnd:
    timeout: 1500

# → VehiclePhotos
- scrollUntilVisible:
    element:
      id: "qa-skip-step"
    direction: DOWN
    timeout: 12000
    optional: true
- tapOn:
    id: "qa-skip-step"
- extendedWaitUntil:
    visible:
      id: "vehicle-photos-screen"
    timeout: 10000

# ── ШАГ 5/6: Авто снаружи (VehiclePhotos) → vp-exterior-guide ──
- scrollUntilVisible:
    element:
      id: "vp-exterior-guide"
    direction: DOWN
    timeout: 6000
    visibilityPercentage: 20
    centerElement: true
- assertVisible:
    id: "vp-exterior-guide"
- tapOn:
    id: "vp-exterior-guide"
- assertVisible:
    id: "photo-guide-zoom"
- takeScreenshot: ../screenshots/maestro-guides/step5-vp-exterior-guide
- tapOn:
    id: "photo-guide-zoom"
- waitForAnimationToEnd:
    timeout: 1500

# ── ШАГ 6/6: Авто салон (VehiclePhotos) → vp-interior-guide ──
# Скроллим к нижнему якорю qa-skip-step (образец встаёт над футером «Далее»).
- scrollUntilVisible:
    element:
      id: "qa-skip-step"
    direction: DOWN
    timeout: 12000
    optional: true
- assertVisible:
    id: "vp-interior-guide"
- tapOn:
    id: "vp-interior-guide"
- assertVisible:
    id: "photo-guide-zoom"
- takeScreenshot: ../screenshots/maestro-guides/step6-vp-interior-guide
- tapOn:
    id: "photo-guide-zoom"
- waitForAnimationToEnd:
    timeout: 1500
