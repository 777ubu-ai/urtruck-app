# GPS consent, device A — after driver approval, the shipper sees the live map.
appId: host.exp.Exponent
name: gps-consent-shipper-map
tags: [gps, consent, shipper, release]
env:
  MAESTRO_ACTOR: boris
---
- runFlow: _lib/qa-login.yaml
- tapOn: { id: "bottom-nav-mywork" }
- waitForAnimationToEnd
- tapOn: { id: "my-work-tab-enroute" }
- tapOn: { id: "my-order-card", index: 0 }
- extendedWaitUntil:
    visible: { id: "deal-track-truck" }
    timeout: 20000
- tapOn: { id: "deal-track-truck" }
- extendedWaitUntil:
    visible: { id: "track-message-driver" }
    timeout: 10000
- takeScreenshot: GPS_06_shipper_live_map_locked_route
- tapOn: { id: "track-message-driver" }
- extendedWaitUntil:
    visible: { id: "chat-partner-name" }
    timeout: 10000
- takeScreenshot: GPS_07_shipper_returned_to_driver_chat
