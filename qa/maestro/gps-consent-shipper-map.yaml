# GPS consent, device A — after driver approval, the shipper sees the live map.
appId: host.exp.Exponent
name: gps-consent-shipper-map
tags: [gps, consent, shipper, release]
env:
  MAESTRO_ACTOR: boris
---
- runFlow: _lib/qa-login.yaml
- tapOn: { id: "bottom-nav-deals" }
- waitForAnimationToEnd
- tapOn: { id: "deals-tab-active" }
- tapOn: { id: "deals-deal-card", index: 0 }
- extendedWaitUntil:
    visible: { id: "deal-header-map" }
    timeout: 20000
- tapOn: { id: "deal-header-map" }
- extendedWaitUntil:
    visible: { id: "deal-map-fullscreen" }
    timeout: 12000
- takeScreenshot: GPS_06_shipper_live_map_locked_route
- tapOn: { id: "deal-map-back" }
- extendedWaitUntil:
    visible: { id: "deal-chat-input" }
    timeout: 10000
- takeScreenshot: GPS_07_shipper_returned_to_driver_chat
