# =======================================================================
# Biz Chat — production reverse proxy (nginx)
# =======================================================================
#
# Этот конфиг подменяет /etc/nginx/nginx.conf внутри контейнера nginx-proxy
# из docker-compose.production.yml. Два virtual host:
#
#   1) bizchat.app        -> статика Flutter Web (сервис `web`, порт 80)
#   2) api.bizchat.app    -> NestJS backend (сервис `backend`, порт 3000)
#                            + WebSocket upgrade для Socket.io
#                            + /uploads/* прокси на тот же backend (отдаёт
#                              статические файлы через app.useStaticAssets)
#
# SSL ПЛАЦХОЛДЕРЫ:
#   Сейчас слушаем только 80. Чтобы включить HTTPS через Let's Encrypt:
#     1) На VPS:  certbot certonly --standalone -d bizchat.app -d api.bizchat.app
#        (перед запуском остановите nginx-proxy или используйте webroot mode)
#     2) Смонтируйте в docker-compose:
#          - /etc/letsencrypt:/etc/letsencrypt:ro
#     3) Раскомментируйте блоки `listen 443 ssl` ниже и блок redirect 80->443.
#     4) `docker compose restart nginx-proxy`
#   Автообновление сертификатов — через системный cron на хосте:
#     0 3 * * * certbot renew --quiet && docker compose -f infra/docker-compose.production.yml exec nginx-proxy nginx -s reload
# =======================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логи: пишем реальный IP клиента (после docker bridge)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Лимит размера загружаемого файла (фото/видео — Blueprint §медиа)
    client_max_body_size 100m;

    # Gzip для текстового контента (статика Flutter уже сжата на уровне web:80)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/wasm
        font/woff2
        image/svg+xml;

    # Map для WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream'ы — ходим по имени сервиса в docker network `bizchat-net`
    upstream bizchat_backend {
        server backend:3000;
        keepalive 32;
    }

    upstream bizchat_web {
        server web:80;
        keepalive 16;
    }

    # =================================================================
    # 1) bizchat.app  ->  Flutter Web (сервис web)
    # =================================================================
    server {
        listen       80;
        listen       [::]:80;
        server_name  bizchat.app www.bizchat.app;

        # --- SSL (раскомментируй после certbot) ---
        # listen 443 ssl http2;
        # listen [::]:443 ssl http2;
        # ssl_certificate     /etc/letsencrypt/live/bizchat.app/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/bizchat.app/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_prefer_server_ciphers on;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 1d;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # HTTP->HTTPS redirect (раскомментируй после включения SSL)
        # if ($scheme = http) { return 301 https://$host$request_uri; }

        # ACME challenge для certbot webroot (если используешь webroot-режим)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass         http://bizchat_web;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # =================================================================
    # 2) api.bizchat.app  ->  NestJS backend (сервис backend:3000)
    #    + WebSocket (Socket.io на /socket.io/)
    #    + /uploads/* (статика через NestJS useStaticAssets)
    # =================================================================
    server {
        listen       80;
        listen       [::]:80;
        server_name  api.bizchat.app;

        # --- SSL (раскомментируй после certbot) ---
        # listen 443 ssl http2;
        # listen [::]:443 ssl http2;
        # ssl_certificate     /etc/letsencrypt/live/api.bizchat.app/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/api.bizchat.app/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # if ($scheme = http) { return 301 https://$host$request_uri; }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Socket.io: обязательно Upgrade/Connection + long timeouts
        location /socket.io/ {
            proxy_pass         http://bizchat_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering    off;
        }

        # /uploads/* — статика от backend (useStaticAssets)
        location /uploads/ {
            proxy_pass         http://bizchat_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Кешируем — файлы неизменяемы (UUID в имени)
            proxy_cache_valid  200 7d;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Всё остальное — REST API /api/v1/*
        location / {
            proxy_pass         http://bizchat_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}
