# =======================================================================
# Biz Chat — STAGING override
# =======================================================================
# Применяется поверх docker-compose.production.yml для VPS staging-окружения,
# где порты 80/443 уже заняты СИСТЕМНЫМ nginx (например, у клиента уже
# крутятся другие сайты на этом VPS). Поэтому:
#
#   1. nginx-proxy контейнер не запускаем — системный nginx делает reverse
#      proxy на backend через 127.0.0.1:3000.
#   2. backend публикует свой 3000 только на 127.0.0.1 (наружу не выходит).
#   3. web (Flutter Web статика) пропускаем — на staging без домена он
#      не нужен, можно гонять только API.
#
# Запуск:
#   docker compose \
#     -f infra/docker-compose.production.yml \
#     -f infra/docker-compose.staging.yml \
#     --env-file infra/.env.production \
#     up -d --build postgres redis backend
# =======================================================================

services:
  backend:
    # Публикуем порт только на loopback хоста — снаружи закрыт, доступ
    # только через системный nginx (который проксирует на 127.0.0.1:3000).
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # На staging нужен dev SMS peek endpoint — поэтому НЕ production env.
      # `staging` как значение проходит проверку `env !== 'production'` и
      # включает SMS peek + снимает throttler по SMS (см. auth.controller.ts).
      NODE_ENV: staging
      # Системный CA bundle Linux — для FCM TLS handshake. На macOS нужен
      # NODE_EXTRA_CA_CERTS, на Ubuntu Node читает /etc/ssl/certs автоматически,
      # но на всякий случай явно указываем.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt

  # Web и nginx-proxy на staging не запускаем — explicit override `profiles`
  # делает их opt-in. По умолчанию они НЕ стартуют.
  web:
    profiles: ["full"]

  nginx-proxy:
    profiles: ["full"]
