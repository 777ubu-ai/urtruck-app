# =======================================================================
# Biz Chat — PRODUCTION docker-compose
# =======================================================================
# Используется на VPS (Ubuntu 22.04+, Docker 24+, docker compose v2).
# Локальная разработка — см. docker-compose.local.yml (рядом, не удалять).
#
# Запуск вручную (обычно — через ./deploy.sh):
#   docker compose -f infra/docker-compose.production.yml \
#     --env-file infra/.env.production up -d --build
#
# Сервисы:
#   postgres     — PostgreSQL 17 (persistent volume)
#   redis        — Redis 7  (persistent volume для appendonly)
#   backend      — NestJS API (build из backend/Dockerfile)
#   web          — Flutter Web статика (build из mobile/Dockerfile)
#   nginx-proxy  — reverse proxy на 80/443, терминация SSL
#
# Сеть: все сервисы внутри bizchat-net (bridge). Наружу выставлены только
# порты 80/443 контейнера nginx-proxy.
#
# Секреты:
#   - Все чувствительные значения — в infra/.env.production (gitignored).
#   - Firebase service account — файл infra/secrets/firebase-service-account.json,
#     монтируется read-only в backend контейнер.
# =======================================================================

name: bizchat-prod

services:
  # -----------------------------------------------------------------
  # PostgreSQL 17 — основная БД
  # -----------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: bizchat-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - bizchat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Порт НЕ публикуем наружу — доступ только из сети bizchat-net.

  # -----------------------------------------------------------------
  # Redis 7 — кеш, SMS коды, счётчики
  # -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bizchat-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - bizchat-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # -----------------------------------------------------------------
  # Backend — NestJS API
  # -----------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: bizchat-backend:latest
    container_name: bizchat-backend-prod
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      # Загруженные пользователями файлы (фото/видео) — персистентный volume
      - backend_uploads:/app/uploads
      # Firebase service account (монтируется только если файл существует)
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    networks:
      - bizchat-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/v1/posts/feed?limit=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # -----------------------------------------------------------------
  # Web — Flutter Web статика (nginx-alpine внутри)
  # -----------------------------------------------------------------
  web:
    build:
      context: ../mobile
      dockerfile: Dockerfile
      args:
        APP_ENV: production
        APP_API_URL: ${APP_API_URL}
        APP_WS_URL: ${APP_WS_URL}
    image: bizchat-web:latest
    container_name: bizchat-web-prod
    restart: unless-stopped
    networks:
      - bizchat-net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # -----------------------------------------------------------------
  # nginx-proxy — reverse proxy на 80/443, публикует наружу
  # -----------------------------------------------------------------
  nginx-proxy:
    image: nginx:alpine
    container_name: bizchat-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt сертификаты (заполняются certbot на хосте)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Для webroot acme challenge
      - certbot_www:/var/www/certbot
    networks:
      - bizchat-net
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# -----------------------------------------------------------------
# Networks & Volumes
# -----------------------------------------------------------------
networks:
  bizchat-net:
    name: bizchat-net
    driver: bridge

volumes:
  postgres_data:
    name: bizchat_postgres_data_prod
  redis_data:
    name: bizchat_redis_data_prod
  backend_uploads:
    name: bizchat_backend_uploads_prod
  certbot_www:
    name: bizchat_certbot_www
